      ownSettlements(f.id).forEach(s => { s.prosperity = clamp(s.prosperity + rf(8, 18), 0, 100); s.recruits = clamp(s.recruits + 15, 0, 120); });
      addLog(`🌻 ${f.name} topraklarında bereketli bir hasat oldu.`, 'peace', 2);
    } else if (kind === 'windfall') {
      const g = ri(25000, 70000);
      f.treasury += g;
      addLog(`🎁 ${f.name} hazinesine tüccarlardan ${fmt(g)} dinarlık bağış geldi.`, 'peace', 2);
    }
    uiDirty.kra = true; return true;
  }
  if (def.scope === 'lord') {
    const l = S_.lords[targetId] || pick(S_.order.lords.map(i => S_.lords[i]).filter(x => x.state === 'active'));
    if (!l) return false;
    if (kind === 'deathold') lordDies(l, 'ecel');
    else if (kind === 'assassin') {
      lordDies(l, 'suikast');
      const fac = S_.factions[l.faction];
      if (fac) {
        ownSettlements(fac.id).forEach(s => { s.unrest = clamp(s.unrest + 20, 0, 100); });
        S_.order.lords.map(i => S_.lords[i]).filter(x => x.faction === fac.id).forEach(x => { x.relKing -= ri(3, 10); });
      }
      addLog(`🗡 ${l.title} ${lordFullName(l)} suikaste kurban gitti — sarayda kargaşa.`, 'war', 2);
    } else if (kind === 'illness') {
      l.sick = S.day + ri(20, 60);
      l.health = clamp(l.health - ri(20, 45), 5, 100);
      if (l.partyId) { const p = S_.parties[l.partyId]; if (p) { const home = homeSettlement(l); if (home) setGoal(p, 'return', home); } }
      addLog(`🤒 ${l.title} ${lordFullName(l)} ağır hastalandı.`, '', 1);
    } else if (kind === 'defection') {
      l.relKing = -90;
      addLog(`🕯 ${l.title} ${lordFullName(l)} kralına küstü — saray entrikaları alevlendi.`, '', 2);
    }
    uiDirty.kra = uiDirty.sel = true; return true;
  }
  if (kind === 'invasion') {
    const edge = pick([[60, 400], [1140, 400], [600, 60], [600, 740]]);
    const id = uid('f');
    const nf = {
      id, name: 'İstilacı Ordu', short: 'İstilacı', color: '#8e2f2f', culture: 'kh',
      rulerTitle: 'Han', lordTitle: 'Noyan', capital: null, aggr: 1.5, kingId: null,
      treasury: 80000, rel: {}, warWeariness: {}, target: null, marshalId: null,
      alive: true, isBandit: false, succession: 'hereditary', prestige: 60,
      warPlan: null, stance: 'attack', buildId: null, founded: calendar(S.day).year
    };
    S.factions[id] = nf;
    Object.keys(S.factions).forEach(o => { if (o !== id) { nf.rel[o] = -60; S.factions[o].rel[id] = -60; } });
    for (let i = 0; i < 5; i++) {
      const l = createLord(id, { renown: ri(500, 900), tactics: ri(5, 9), lead: ri(7, 10) });
      if (i === 0) makeKing(l);
      const p = spawnLordParty(l);
      p.troops = makeStack('kh', ri(180, 320), 0.8);
      p.x = clamp(edge[0] + rf(-40, 40), 40, MAP_W - 40);
      p.y = clamp(edge[1] + rf(-60, 60), 40, MAP_H - 40);
      p.morale = 100;
    }
    Object.values(S.factions).forEach(f => { if (!f.isBandit && f.alive && f.id !== id) declareWar(id, f.id, true); });
    addLog(`🐎 YABANCI İSTİLA! Sınırlarda büyük bir istilacı ordu belirdi.`, 'war', 2);
    uiDirty.kra = true;
    return true;
  }
  return false;
}

function randomEventTick() {
  if (rnd() > 0.05 * S.opts.eventRate) return;
  const roll = rnd();
  if (roll < 0.22) fireEvent('harvest');
  else if (roll < 0.4) fireEvent('famine');
  else if (roll < 0.52) fireEvent('fire');
  else if (roll < 0.62) fireEvent('plague');
  else if (roll < 0.72) fireEvent('windfall');
  else if (roll < 0.82) fireEvent('goldmine');
  else if (roll < 0.9) fireEvent('illness');
  else if (roll < 0.97) fireEvent('revolt');
  else fireEvent('assassin');
}

/* =====================  YAŞ, SAĞLIK, İLİŞKİLER  ===================== */
function agingTick(day) {
  /* yılda bir yaşlan */
  if (day % 360 === 0) {
    S.order.lords.forEach(i => {
      const l = S.lords[i];
      if (l.state === 'dead') return;
      l.age++;
      (l.children || []).forEach(c => c.age++);
      if (l.spouse && l.age < 55 && rnd() < 0.16) {
        const male = rnd() < 0.55;
        l.children.push({
          name: male ? pick(LORD_NAMES[l.faction] || LORD_NAMES.swadia) : pick(FEMALE_NAMES[l.faction] || FEMALE_NAMES.swadia),
          male, age: 0
        });
      }
      if (!l.spouse && l.age > 20 && rnd() < 0.25) {
        l.spouse = pick(FEMALE_NAMES[l.faction] || FEMALE_NAMES.swadia);
        addLog(`💍 ${l.title} ${lordFullName(l)}, ${l.spouse} ile evlendi.`, 'peace', 1);
      }
    });
  }
  /* ölüm riski */
  if (day % 10 !== 0) return;
  S.order.lords.forEach(i => {
    const l = S.lords[i];
    if (l.state === 'dead' || l.state === 'exile') return;
    const age = l.age || 40;
    let risk = age > 70 ? 0.055 : age > 62 ? 0.028 : age > 54 ? 0.012 : age > 45 ? 0.005 : 0.0018;
    risk *= S.opts.mortality;
    risk *= (l.health < 60 ? 1.8 : 1);
    if (rnd() < risk) lordDies(l, age > 60 ? 'ecel' : rnd() < 0.5 ? 'hastalık' : 'yaralarından');
  });
}
function relationsTick() {
  const lords = S.order.lords.map(i => S.lords[i]).filter(l => l.state === 'active');
  for (let i = 0; i < 24; i++) {
    const a = pick(lords), b = pick(lords);
    if (!a || !b || a === b || a.faction !== b.faction) continue;
    const pa = PERSONALITIES.find(x => x.id === a.personality) || PERSONALITIES[0];
    const pb = PERSONALITIES.find(x => x.id === b.personality) || PERSONALITIES[0];
    let d = rf(-1.6, 1.8);
    if (pa.id === 'quarrelsome' || pb.id === 'quarrelsome') d -= 1.2;
    if (pa.id === 'upstanding' && pb.id === 'upstanding') d += 1.2;
    if (a.house === b.house) d += 1.5;
    addLordRel(a, b, d);
  }
}
/* şölen: kral hazineden harcar, lord ilişkileri düzelir */
function feastTick() {
  Object.values(S.factions).forEach(fac => {
    if (fac.isBandit || !fac.alive || !fac.kingId) return;
    if (fac.treasury < 20000 || enemyFactions(fac.id).length) return;
    if (rnd() > 0.05) return;
    const cap = capitalOf(fac.id); if (!cap) return;
    fac.treasury -= 8000;
    const lords = S.order.lords.map(i => S.lords[i]).filter(l => l.faction === fac.id && l.state === 'active');
    lords.forEach(l => {
      l.relKing = clamp(l.relKing + ri(4, 12), -100, 100);
      lords.forEach(o => { if (o !== l && rnd() < 0.3) addLordRel(l, o, ri(1, 6)); });
    });
    addLog(`🍷 ${cap.name} sarayında şölen verildi; lordların gönlü alındı.`, 'peace', 1);
  });
}

/* =====================  TARİH VE ZAMAN MAKİNESİ  ===================== */
function historyTick(day) {
  if (day % 30 !== 0) return;
  const rec = { d: day, f: {} };
  Object.values(S.factions).forEach(f => {
    if (f.isBandit) return;
    rec.f[f.id] = {
      s: ownSettlements(f.id).length,
      t: factionTroops(f.id),
      g: Math.round(f.treasury),
      p: Math.round(factionStrength(f.id))
    };
  });
  S.history.push(rec);
  if (S.history.length > 400) S.history.shift();
}
function takeSnapshot(label) {
  try {
    S.snapshots.push({ day: S.day, label: label || dateStr(S.day), data: snapshot() });
    if (S.snapshots.length > 10) S.snapshots.shift();
  } catch (e) { /* yer yoksa sessizce geç */ }
}
function rewindTo(index) {
  const snap = S.snapshots[index];
  if (!snap) return;
  const keep = S.snapshots.slice(0, index);
  restore(snap.data);
  S.snapshots = keep;
  addLog(`⏪ Zaman ${dateStr(S.day)} tarihine geri sarıldı.`, 'siege', 2);
  renderUI(true);
}

/* =====================  DİYALOG  ===================== */
function lordShort(l) { return l ? `${l.title} ${l.name}` : 'bilinmeyen'; }
function talk(tpl, ctx) {
  const t = DIALOGUES[tpl]; if (!t) return null;
  if (rnd() > 0.75 * S.opts.dialogueRate && !ctx.force) return null;
  const A = ctx.a, B = ctx.b, C = ctx.c;
  if (!A || !B) return null;
  const map = {
    A: A ? lordShort(A) : '', B: B ? lordShort(B) : '', C: C ? lordShort(C) : '',
    X: ctx.x || 'bu topraklar',
    F: ctx.f ? (S.factions[ctx.f] ? S.factions[ctx.f].name : ctx.f) : facName(A.faction),
    H: ctx.h ? (ctx.h.name || houseName(ctx.h)) : (houseOf(A) ? houseOf(A).name : 'hanedan')
  };
  const fill = s => s.replace(/\{(\w)\}/g, (m, k) => map[k] != null ? map[k] : m);
  const d = {
    id: uid('dlg'), day: S.day, tpl, title: t.title,
    a: A.id, b: B.id, aName: lordShort(A), bName: lordShort(B),
    aFaction: A.faction, bFaction: B.faction,
    aHouse: A.houseId, bHouse: B.houseId,
    lines: t.lines.map(ln => ({ who: ln[0] === 'A' ? A.id : (ln[0] === 'C' && C ? C.id : B.id), name: ln[0] === 'A' ? lordShort(A) : (ln[0] === 'C' && C ? lordShort(C) : lordShort(B)), text: fill(ln[1]) }))
  };
  S.dialogues.unshift(d);
  if (S.dialogues.length > 40) S.dialogues.length = 40;
  uiDirty.kra = true;
  return d;
}

/* =====================  HANEDAN DİNAMİKLERİ  ===================== */
function applyRulingHouseColor(fac) {
  if (!fac) return;
  const king = fac.kingId ? S.lords[fac.kingId] : null;
  const h = king ? houseOf(king) : null;
  const before = fac.color;
  if (S.opts.houseColors && h) {
    fac.rulingHouseId = h.id;
    fac.color = h.color;
  } else {
    fac.color = fac.baseColor || fac.color;
  }
  if (before !== fac.color) { territoryDirty = true; uiDirty.kra = true; }
}
function refreshAllColors() {
  Object.values(S.factions).forEach(f => { if (!f.isBandit) applyRulingHouseColor(f); });
  territoryDirty = true; requestDraw();
}

function houseTick(day) {
  refreshHouses();
  /* kan davaları zamanla soğur */
  Object.keys(S.feuds).forEach(k => {
    const f = S.feuds[k];
    f.level = clamp(f.level - 0.35, 0, 100);
    if (f.open && f.level < 25) {
      f.open = false;
      const [a, b] = k.split('|');
      addLog(`🕊 ${houseName(a)} ile ${houseName(b)} hanedanları barıştı.`, 'peace', 1);
    }
    if (f.level <= 0) delete S.feuds[k];
  });
  if (day % 30 !== 0) return;
  /* yeni hanedan kuruluşu: topraklı, şöhretli ama kendi hanesinde ikinci planda kalan lord */
  S.order.lords.map(i => S.lords[i]).forEach(l => {
    if (l.state !== 'active' || l.isKing) return;
    const h = houseOf(l);
    if (!h || h.headId === l.id) return;
    if (l.renown < 450 || l.fiefs.length < 2) return;
    if (rnd() > 0.05) return;
    const base = (LORD_NAMES[l.faction] || LORD_NAMES.swadia);
    const nm = `${l.name} ${pick(['Hanedanı', 'Evi', 'Ocağı'])}`.replace(' Hanedanı Hanedanı', ' Hanedanı');
    const nh = ensureHouse(l.faction, nm);
    nh.color = nextHouseColor();
    nh.arms = makeArms(nm + l.id);
    const old = h.id;
    l.houseId = nh.id; l.house = nh.name;
    (l.children || []).forEach(c => { c.house = nh.name; });
    addFeud(old, nh.id, 18, 'hanedandan kopuş');
    refreshHouses();
    addLog(`🏛 ${lordShort(l)}, ${h.name} hanedanından kopup kendi hanedanını kurdu: ${nh.name}.`, '', 2);
  });
  /* hanedan prestiji: toprak ve tahttan beslenir */
  S.order.houses.forEach(hid => {
    const h = S.houses[hid]; if (!h || h.extinct) return;
    const target = clamp(housePower(hid) * 4, 5, 100);
    h.prestige += (target - h.prestige) * 0.15;
  });
}

/* kan davası olan hanedanların orduları birbirine düşman */
function partiesFeuding(a, b) {
  if (!a || !b || a.faction !== b.faction) return false;
  const la = a.lordId ? S.lords[a.lordId] : null, lb = b.lordId ? S.lords[b.lordId] : null;
  if (!la || !lb || !la.houseId || !lb.houseId || la.houseId === lb.houseId) return false;
  return feudOpen(la.houseId, lb.houseId);
}

/* =====================  EVLİLİKLER  ===================== */
function marriageTick(day) {
  if (day % 20 !== 0) return;
  const houses = S.order.houses.map(i => S.houses[i]).filter(h => h && !h.extinct && h.headId);
  if (houses.length < 2) return;
  if (rnd() > 0.5) return;
  const a = pick(houses);
  const cands = houses.filter(h => h.id !== a.id && !feudOpen(a.id, h.id));
  if (!cands.length) return;
  /* aynı krallıktan ya da barış içindeki komşudan */
  const b = pick(cands.filter(h => h.faction === a.faction || !atWar(h.faction, a.faction)) || cands);
  if (!b) return;
  const ha = houseHead(a.id), hb = houseHead(b.id);
  if (!ha || !hb) return;
  const kidsA = (ha.children || []).filter(c => c.age >= 14);
  const kidsB = (hb.children || []).filter(c => c.age >= 14);
  if (!kidsA.length || !kidsB.length) return;
  const ka = pick(kidsA), kb = pick(kidsB);
  if (ka.male === kb.male) return;

  a.allies = a.allies || {}; b.allies = b.allies || {};
  a.allies[b.id] = S.day; b.allies[a.id] = S.day;
  delete S.feuds[feudKey(a.id, b.id)];
  houseMembers(a.id).forEach(m => houseMembers(b.id).forEach(n => addLordRel(m, n, ri(6, 16))));
  a.prestige = clamp(a.prestige + 4, 0, 100); b.prestige = clamp(b.prestige + 4, 0, 100);
  const place = (ha.fiefs.map(f => S.settlements[f]).find(Boolean) || {}).name || 'saray';
  talk('marriage', { a: ha, b: hb, x: place, force: true });
  addLog(`💍 ${a.name} ile ${b.name} hanedanları evlilikle akraba oldu (${ka.name} — ${kb.name}).`, 'peace', 2);
  /* krallıklar arası evlilik: yakınlaşma ve taht üzerinde hak */
  if (a.faction !== b.faction) {
    const fa = S.factions[a.faction], fb = S.factions[b.faction];
    if (fa && fb) {
      fa.rel[b.faction] = clamp((fa.rel[b.faction] || 0) + 22, -100, 100);
      fb.rel[a.faction] = clamp((fb.rel[a.faction] || 0) + 22, -100, 100);
      if (!hasPact(a.faction, b.faction) && rnd() < 0.5) makePact(a.faction, b.faction, 'nap');
      a.claims = a.claims || {}; a.claims[b.faction] = S.day;
      b.claims = b.claims || {}; b.claims[a.faction] = S.day;
    }
  }
  uiDirty.kra = true;
}
/* varissiz ölen kralın tahtı üzerinde yabancı hak iddiası */
function foreignClaimCheck(faction, deadKing) {
  const fac = S.factions[faction]; if (!fac) return;
  const claimants = S.order.houses.map(i => S.houses[i])
    .filter(h => h && !h.extinct && h.faction !== faction && h.claims && h.claims[faction]);
  if (!claimants.length) return;
  const h = claimants.sort((a, b) => housePower(b.id) - housePower(a.id))[0];
  const other = S.factions[h.faction];
  if (!other || !other.alive || atWar(faction, h.faction)) return;
  if (rnd() > 0.45) return;
  addLog(`⚔ ${other.name}, evlilik bağına dayanarak ${fac.name} tahtı üzerinde hak iddia etti!`, 'war', 2);
  const ka = houseHead(h.id), kb = fac.kingId ? S.lords[fac.kingId] : null;
  if (ka && kb) talk('warDeclare', { a: ka, b: kb, x: capitalOf(faction) ? capitalOf(faction).name : fac.name, f: h.faction, force: true });
  declareWar(h.faction, faction);
}

/* =====================  SEÇİMLER  ===================== */
function electionCandidates(fac, kind, settlement) {
  const lords = S.order.lords.map(i => S.lords[i])
    .filter(l => l.faction === fac.id && l.state !== 'dead' && l.state !== 'exile');
  if (kind === 'throne') {
    const pool = lords.filter(l => !l.isKing && (l.fiefs.length > 0 || l.renown > 250));
    return (pool.length >= 2 ? pool : lords.filter(l => !l.isKing)).slice(0, 8);
  }
  if (kind === 'marshal') {
    return lords.filter(l => l.state === 'active' && l.partyId)
      .sort((a, b) => b.renown - a.renown).slice(0, 5);
  }
  /* tımar */
  return lords.map(l => ({ l, sc: fiefClaimScore(l, settlement, null) }))
    .sort((a, b) => b.sc - a.sc).slice(0, 5).map(o => o.l);
}

function startElection(factionId, kind, opt) {
  opt = opt || {};
  const fac = S.factions[factionId];
  if (!fac || fac.isBandit || !fac.alive) return null;
  if (S.elections.some(e => e.faction === factionId && e.stage !== 'done')) return null;
  const settlement = opt.settlementId ? S.settlements[opt.settlementId] : null;
  const cands = electionCandidates(fac, kind, settlement);
  if (cands.length < 2) return null;
  const electors = S.order.lords.map(i => S.lords[i])
    .filter(l => l.faction === factionId && l.state !== 'dead' && l.state !== 'exile')
    .map(l => ({
      lordId: l.id,
      weight: Math.round((1 + l.fiefs.length * 0.6 + l.renown / 350 + (l.isKing ? 2 : 0)) * 10) / 10,
      votedFor: null, reason: null, pledged: null
    }));
  const el = {
    id: uid('el'), faction: factionId, kind, settlementId: settlement ? settlement.id : null,
    day: S.day, stage: 'campaign', endsAt: S.day + (opt.instant ? 0 : ri(6, 12)),
    candidates: cands.map(c => ({ lordId: c.id, houseId: c.houseId, votes: 0, backers: [] })),
    electors, winnerId: null, forcedWinner: opt.forcedWinner || null,
    forcedAftermath: opt.forcedAftermath || null, aftermath: null, tally: null
  };
  S.elections.unshift(el);
  if (S.elections.length > 12) S.elections.length = 12;
  const kn = ELECTION_KINDS[kind];
  addLog(`${kn.icon} ${fac.name}: ${kn.name} başladı${settlement ? ' — ' + settlement.name : ''}. ${cands.length} aday, ${electors.length} seçici.`, 'siege', 2);
  if (S.opts.pauseOnElection) setSpeed(0);
  uiDirty.kra = uiDirty.sel = true;
  if (opt.instant) resolveElection(el);
  return el;
}

/* kampanya: lordlar birbirini ikna eder */
function campaignStep(el) {
  const fac = S.factions[el.faction];
  const cands = el.candidates.map(c => S.lords[c.lordId]).filter(Boolean);
  if (!cands.length) return;
  for (let i = 0; i < 3; i++) {
    const c = pick(cands);
    const target = pick(el.electors);
    const voter = S.lords[target.lordId];
    if (!voter || voter.id === c.id) continue;
    const affinity = voteScore(voter, c, el).total;
    const rival = cands.find(x => x !== c && voteScore(voter, x, el).total > affinity);
    if (!rival && rnd() < 0.5) {
      target.pledged = c.id;
      addLordRel(voter, c, ri(2, 6));
      talk('campaign', { a: c, b: voter, x: (voter.fiefs.map(f => S.settlements[f]).find(Boolean) || {}).name || 'bir tımar', h: houseOf(c) });
    } else if (rival && rnd() < 0.35) {
      talk('campaignRefuse', { a: c, b: voter, c: rival, f: el.faction });
      addLordRel(voter, c, -ri(1, 4));
    }
  }
}

/* bir seçicinin bir adaya verdiği puan ve gerekçesi */
function voteScore(voter, cand, el) {
  const parts = [];
  let total = 0;
  const add = (v, why) => { if (Math.abs(v) > 0.01) { total += v; parts.push({ v, why }); } };
  add(cand.renown / 130, 'şöhret');
  add(cand.fiefs.length * 0.95, 'toprak gücü');
  add(lordRel(voter, cand) / 16, 'kişisel dostluk');
  if (cand.id === voter.id) add(1.25, 'kendi adaylığı');
  if (voter.houseId && voter.houseId === cand.houseId) add(3.1, 'hanedan bağı');
  const hh = houseOf(cand);
  if (hh) add(hh.prestige / 45, 'hanedan prestiji');
  const hv = houseOf(voter), hc = houseOf(cand);
  if (hv && hc && hv.allies && hv.allies[hc.id]) add(1.8, 'evlilik bağı');
  if (hv && hc && feudLevel(hv.id, hc.id) > 20) add(-feudLevel(hv.id, hc.id) / 22, 'kan davası');
  if (cand.isKing || (S.factions[el.faction] && S.factions[el.faction].kingId === cand.id)) add(voter.relKing / 24, 'krala sadakat');
  const pers = PERSONALITIES.find(p => p.id === voter.personality) || PERSONALITIES[0];
  if (pers.id === 'custodian' || pers.id === 'upstanding') add(cand.relKing / 30, 'meşruiyete saygı');
  if (pers.greed > 1.1) add(cand.gold / 9000, 'cömertlik beklentisi');
  if (el.kind === 'marshal') add((cand.skillTactics + cand.skillStrategy) / 3.2, 'komuta yeteneği');
  const elec = el.electors.find(e => e.lordId === voter.id);
  if (elec && elec.pledged === cand.id) add(2.2, 'verilmiş söz');
  parts.sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
  return { total, why: parts.length ? parts[0].why : 'kararsızlık', parts };
}

function resolveElection(el, forcedWinnerId) {
  const fac = S.factions[el.faction];
  if (!fac) { el.stage = 'done'; return; }
  const cands = el.candidates.filter(c => S.lords[c.lordId] && S.lords[c.lordId].state !== 'dead');
  if (!cands.length) { el.stage = 'done'; return; }
  cands.forEach(c => { c.votes = 0; c.backers = []; });
  el.electors.forEach(e => {
    const voter = S.lords[e.lordId];
    if (!voter || voter.state === 'dead') return;
    let best = null, bestSc = -1e9, bestWhy = '';
    cands.forEach(c => {
      const cl = S.lords[c.lordId];
      const s = voteScore(voter, cl, el);
      const jitter = rf(-0.9, 0.9);
      if (s.total + jitter > bestSc) { bestSc = s.total + jitter; best = c; bestWhy = s.why; }
    });
    if (!best) return;
    e.votedFor = best.lordId; e.reason = bestWhy;
    best.votes += e.weight; best.backers.push(e.lordId);
  });
  cands.sort((a, b) => b.votes - a.votes);
  const forced = forcedWinnerId || el.forcedWinner;
  let winner = cands[0];
  if (forced) {
    const f = cands.find(c => c.lordId === forced) || el.candidates.find(c => c.lordId === forced);
    if (f) { winner = f; el.rigged = true; }
  }
  const total = cands.reduce((a, c) => a + c.votes, 0) || 1;
  el.tally = cands.map(c => ({ lordId: c.lordId, votes: Math.round(c.votes * 10) / 10, pct: Math.round(c.votes / total * 100), backers: c.backers.slice() }));
  el.winnerId = winner.lordId;
  el.margin = cands.length > 1 ? Math.round((cands[0].votes - cands[1].votes) / total * 100) : 100;
  el.stage = 'done';
  S.stats.elections++;

  const wl = S.lords[winner.lordId];
  const kn = ELECTION_KINDS[el.kind];
  if (el.kind === 'throne') {
    const old = fac.kingId ? S.lords[fac.kingId] : null;
    makeKing(wl, true);
    applyRulingHouseColor(fac);
    addLog(`${kn.icon} ${fac.name} kurultayı: ${lordShort(wl)} (${houseName(wl.houseId)}) oyların %${el.tally[0].pct}'ini alarak tahta çıktı.${el.rigged ? ' (Sonuç dışarıdan değiştirildi.)' : ''}`, 'peace', 2);
    const runner = el.tally[1] ? S.lords[el.tally[1].lordId] : null;
    if (runner) talk('victory', { a: wl, b: runner, f: fac.id, h: houseOf(wl) });
  } else if (el.kind === 'marshal') {
    fac.marshalId = wl.id;
    addLog(`${kn.icon} ${fac.name} mareşalliğine ${lordShort(wl)} seçildi (%${el.tally[0].pct}).`, 'siege', 2);
  } else if (el.kind === 'fief') {
    const s = S.settlements[el.settlementId];
    if (s) {
      applyFiefGrant(s, wl, el.tally.slice(1).map(t => S.lords[t.lordId]).filter(Boolean));
      const king = fac.kingId ? S.lords[fac.kingId] : null;
      if (king) talk('reward', { a: king, b: wl, x: s.name });
    }
  }
  electionAftermath(el);
  uiDirty.kra = uiDirty.sel = true;
  return el;
}

function electionAftermath(el) {
  const fac = S.factions[el.faction];
  const winner = S.lords[el.winnerId];
  const runner = el.tally && el.tally[1] ? S.lords[el.tally[1].lordId] : null;
  let kind = el.forcedAftermath;
  if (!kind) {
    const closeRace = el.margin < 12;
    const loserHouse = runner ? houseOf(runner) : null;
    const loserPower = loserHouse ? housePower(loserHouse.id) : 0;
    const pers = runner ? (PERSONALITIES.find(p => p.id === runner.personality) || PERSONALITIES[0]) : PERSONALITIES[0];
    const anger = (closeRace ? 0.35 : 0.1) + (1 - pers.loyal) * 0.35 + (el.rigged ? 0.3 : 0) + loserPower / 60;
    const roll = rnd() * Math.max(0.5, anger);
    if (!runner) kind = 'none';
    else if (roll < 0.16) kind = 'none';
    else if (roll < 0.34) kind = 'grudge';
    else if (roll < 0.52) kind = 'feud';
    else if (roll < 0.70) kind = 'banner';
    else if (roll < 0.86) kind = 'exile';
    else kind = 'civil';
    if (el.kind !== 'throne' && (kind === 'civil' || kind === 'banner') && rnd() < 0.6) kind = 'feud';
  }
  el.aftermath = kind;
  if (!runner || kind === 'none') {
    if (winner && runner) talk('oath', { a: runner, b: winner, f: el.faction, h: houseOf(winner) });
    return;
  }
  const lh = houseOf(runner), wh = houseOf(winner);
  if (kind === 'grudge') {
    runner.relKing = clamp(runner.relKing - ri(18, 35), -100, 100);
    houseMembers(lh ? lh.id : '').forEach(m => { m.relKing = clamp(m.relKing - ri(5, 15), -100, 100); });
    addLog(`😠 ${lh ? lh.name : lordShort(runner)} hanedanı seçim sonucunu içine sindiremedi.`, '', 2);
  } else if (kind === 'feud') {
    if (lh && wh && lh.id !== wh.id) {
      addFeud(lh.id, wh.id, 45, 'seçim husumeti');
      addLog(`⚔ Seçim sonrası ${lh.name} ile ${wh.name} hanedanları arasında husumet alevlendi.`, 'war', 2);
    } else runner.relKing -= 20;
  } else if (kind === 'banner') {
    raiseBanner(lh, runner, el.faction);
  } else if (kind === 'exile') {
    const others = Object.values(S.factions).filter(f => !f.isBandit && f.alive && f.id !== el.faction);
    if (others.length) {
      const to = pick(others);
      addLog(`🚪 ${lordShort(runner)} seçimi kaybedince krallığı terk edip ${to.name} hizmetine girdi.`, '', 2);
      transferLord(runner, to.id);
    } else runner.relKing -= 30;
  } else if (kind === 'civil') {
    const backers = S.order.lords.map(i => S.lords[i]).filter(l =>
      l.faction === el.faction && l.state === 'active' && !l.isKing &&
      (l.id === runner.id || (lh && l.houseId === lh.id) || lordRel(l, runner) > 15));
    if (backers.length >= 2) {
      runner.relKing = -80;
      startCivilWar(fac, runner, backers);
    } else raiseBanner(lh, runner, el.faction);
  }
}

/* =====================  İSYAN BAYRAĞI  ===================== */
function raiseBanner(house, leader, factionId) {
  if (!leader) return;
  const parent = S.factions[factionId];
  const hs = house || houseOf(leader);
  const id = uid('f');
  const nf = {
    id, name: `${hs ? hs.name : leader.name} İsyanı`,
    short: (hs ? hs.name : leader.name).split(' ')[0].slice(0, 10),
    color: hs ? hs.color : '#b03030', baseColor: hs ? hs.color : '#b03030',
    culture: parent ? parent.culture : 'sw',
    rulerTitle: 'Bey', lordTitle: 'Ağa', capital: null, aggr: 1.2, kingId: null,
    treasury: ri(4000, 12000), rel: {}, warWeariness: {}, target: null, marshalId: null,
    alive: true, isBandit: false, isBanner: true, succession: 'hereditary',
    prestige: 20, warPlan: null, stance: 'attack', founded: calendar(S.day).year,
    rebelOf: factionId, rulingHouseId: hs ? hs.id : null
  };
  S.factions[id] = nf;
  Object.keys(S.factions).forEach(o => {
    if (o === id) return;
    nf.rel[o] = o === factionId ? -85 : -10;
    S.factions[o].rel[id] = o === factionId ? -85 : -10;
  });
  const joiners = S.order.lords.map(i => S.lords[i]).filter(l =>
    l.faction === factionId && l.state === 'active' && !l.isKing &&
    (l.id === leader.id || (hs && l.houseId === hs.id && rnd() < 0.7)));
  joiners.forEach(l => {
    l.faction = id; l.relKing = 70; l.title = nf.lordTitle;
    if (l.partyId && S.parties[l.partyId]) S.parties[l.partyId].faction = id;
    /* isyancılar tımarlarını bırakır: bayrak topraksızdır */
    l.fiefs.slice().forEach(f => {
      const s = S.settlements[f];
      if (s) { s.lordId = null; }
    });
    l.fiefs = [];
  });
  makeKing(leader, true);
  leader.title = nf.rulerTitle;
  declareWar(id, factionId, true);
  addLog(`🏴 ${nf.name}! ${lordShort(leader)} seçim sonucunu tanımayıp ${joiners.length} lordla isyan bayrağı açtı.`, 'war', 2);
  const king = parent && parent.kingId ? S.lords[parent.kingId] : null;
  if (king) talk('banner', { a: leader, b: king, x: (capitalOf(factionId) || {}).name || 'Kalradya', h: hs, force: true });
  /* tımarları kalan lordlara dağıt */
  S.order.settlements.forEach(i => {
    const s = S.settlements[i];
    if (s.faction === factionId && !s.lordId) grantConquest(s, null);
  });
  territoryDirty = true; uiDirty.kra = true;
  return nf;
}

/* bayrak bir şehir alırsa gerçek krallığa dönüşür, ordusu biterse dağılır */
function bannerTick() {
  Object.values(S.factions).forEach(f => {
    if (!f.isBanner || !f.alive) return;
    const own = ownSettlements(f.id);
    if (own.length) {
      f.isBanner = false;
      f.rulerTitle = 'Kral'; f.lordTitle = 'Lord';
      f.capital = own.find(s => s.type === 'town') ? own.find(s => s.type === 'town').id : own[0].id;
      addLog(`👑 ${f.name} bir yerleşim ele geçirdi ve gerçek bir krallığa dönüştü!`, 'war', 2);
      return;
    }
    const parties = S.order.parties.filter(i => S.parties[i] && S.parties[i].faction === f.id);
    if (!parties.length) {
      f.alive = false;
      const back = S.factions[f.rebelOf];
      S.order.lords.map(i => S.lords[i]).filter(l => l.faction === f.id).forEach(l => {
        if (back && back.alive && rnd() < 0.5) { transferLord(l, back.id); l.relKing = -20; }
        else { l.state = 'exile'; if (l.partyId) removeParty(l.partyId); l.partyId = null; }
      });
      addLog(`🏳 ${f.name} bastırıldı.`, 'war', 2);
      uiDirty.kra = true;
    }
  });
}

/* =====================  SEÇİM DÖNGÜSÜ  ===================== */
function electionTick(day) {
  /* süren seçimler */
  S.elections.forEach(el => {
    if (el.stage === 'done') return;
    if (el.stage === 'campaign') {
      campaignStep(el);
      if (S.day >= el.endsAt) { el.stage = 'vote'; }
    }
    if (el.stage === 'vote') resolveElection(el);
  });
  if (day % 10 !== 0) return;
  /* boşta kalan tımarlar için divan */
  Object.values(S.factions).forEach(fac => {
    if (fac.isBandit || fac.isBanner || !fac.alive) return;
    const vacant = ownSettlements(fac.id).filter(s => s.type !== 'village' && !s.lordId);
    if (!vacant.length) return;
    if (S.elections.some(e => e.faction === fac.id && e.stage !== 'done')) return;
    if (rnd() < 0.5) startElection(fac.id, 'fief', { settlementId: vacant[0].id });
  });
  /* mareşal seçimi: savaş varsa ve mareşal yoksa */
  Object.values(S.factions).forEach(fac => {
    if (fac.isBandit || fac.isBanner || !fac.alive) return;
    if (!enemyFactions(fac.id).length) return;
    if (fac.marshalId && S.lords[fac.marshalId] && S.lords[fac.marshalId].state === 'active') return;
    if (S.elections.some(e => e.faction === fac.id && e.stage !== 'done')) return;
    if (rnd() < 0.3) startElection(fac.id, 'marshal', {});
  });
}

/* =====================  KRALLIK İÇİ DİYALOGLAR  ===================== */
function courtTick(day) {
  if (day % 8 !== 0) return;
  Object.values(S.factions).forEach(fac => {
    if (fac.isBandit || !fac.alive || !fac.kingId) return;
    const king = S.lords[fac.kingId]; if (!king) return;
    const lords = S.order.lords.map(i => S.lords[i]).filter(l => l.faction === fac.id && l.id !== king.id && l.state === 'active');
    if (!lords.length) return;
    const l = pick(lords);
    if (l.relKing < -30 && rnd() < 0.4) {
      talk('reprimand', { a: king, b: l, x: (l.fiefs.map(f => S.settlements[f]).find(Boolean) || {}).name || 'sınır' });
    } else if (l.relKing > 55 && rnd() < 0.25) {
      talk('oath', { a: l, b: king, f: fac.id, h: houseOf(king) });
    }
  });
  /* krallar arası: barış ve savaş konuşmaları */
  const live = Object.values(S.factions).filter(f => !f.isBandit && f.alive && f.kingId);
  if (live.length > 1 && rnd() < 0.3) {
    const a = pick(live), b = pick(live.filter(x => x.id !== a.id));
    if (a && b) {
      const ka = S.lords[a.kingId], kb = S.lords[b.kingId];
      if (ka && kb) {
        if (atWar(a.id, b.id)) talk('peaceOffer', { a: ka, b: kb, f: a.id });
        else if ((a.rel[b.id] || 0) < -25) talk('warDeclare', { a: ka, b: kb, f: a.id, x: (capitalOf(b.id) || {}).name || b.name });
      }
    }
  }
}

/* =====================  YILLIK VAKAYİNAME  ===================== */
function chronicleTick(day) {
  if (day === 0 || day % 360 !== 0) return;
  const year = calendar(S.day).year - 1;
  const from = S.day - 360;
  const evs = S.log.filter(l => l.d >= from && l.d < S.day);
  const parts = [];
  const captures = evs.filter(l => l.m.includes('DÜŞTÜ'));
  const wars = evs.filter(l => l.m.includes('savaş ilan etti'));
  const peaces = evs.filter(l => l.m.includes('barış imzalandı'));
  const crowns = evs.filter(l => l.m.includes('tahta') || l.m.includes('kurultay'));
  const deaths = evs.filter(l => l.m.startsWith('⚰'));
  const houses = evs.filter(l => l.m.includes('hanedan'));
  const biggest = S.battles.filter(b => b.day >= from).sort((a, b) => (b.a.start + b.b.start) - (a.a.start + a.b.start))[0];

  const strongest = Object.values(S.factions).filter(f => !f.isBandit && f.alive)
    .map(f => ({ f, n: ownSettlements(f.id).length })).sort((a, b) => b.n - a.n)[0];

  if (wars.length) parts.push(`${year} yılı ${wars.length === 1 ? 'bir savaş ilanıyla' : wars.length + ' savaş ilanıyla'} sarsıldı.`);
  else if (peaces.length) parts.push(`${year} yılı görece sakin geçti; ${peaces.length} barış anlaşması imzalandı.`);
  else parts.push(`${year} yılında Kalradya kılıçları kınında bekledi.`);
  if (captures.length) {
    const names = captures.slice(0, 3).map(c => c.m.split(' ')[1]).join(', ');
    parts.push(`${captures.length} yerleşim el değiştirdi${names ? ' (' + names + ')' : ''}.`);
  }
  if (biggest) parts.push(`Yılın en büyük çarpışması ${biggest.place} önünde oldu: ${biggest.a.name} ${fmt(biggest.a.start)} kişiyle ${biggest.b.name} ordusunun ${fmt(biggest.b.start)} askerine karşı durdu; ${biggest.winner === 'a' ? biggest.a.name : biggest.b.name} galip geldi.`);
  if (crowns.length) parts.push(crowns[0].m.replace(/^[^\s]+\s/, ''));
  if (deaths.length) parts.push(`${deaths.length} lord toprağa verildi.`);
  if (houses.length) parts.push(houses[0].m.replace(/^[^\s]+\s/, ''));
  if (strongest) parts.push(`Yıl kapanırken en geniş topraklar ${strongest.f.name} elindeydi (${strongest.n} yerleşim).`);

  S.chronicle = S.chronicle || [];
  S.chronicle.unshift({ year, text: parts.join(' ') });
  if (S.chronicle.length > 120) S.chronicle.length = 120;
  uiDirty.his = true;
}
/* =====================================================================
   Bölüm 5: Arayüz — dört sekme, seçim ekranı, krallıklar, savaşlar
   ===================================================================== */

const ui = {
  tab: 'sel',
  open: { edit: false, dip: false, lords: true, stl: false },
  lordQuery: '', lordFac: '', stlQuery: '', stlFac: '', stlType: '',
  logFilter: 'all'
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
let booted = false;
let alertDirty = false;

function setTab(t) {
  ui.tab = t;
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $$('.pane').forEach(p => p.classList.toggle('on', p.dataset.pane === t));
  uiDirty[t] = true; renderUI(true);
  if (booted && window.innerWidth <= 900) $('#side').classList.add('open');
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- küçük parçalar ---------- */
function facDot(f) { const c = S.factions[f] ? S.factions[f].color : '#888'; return `<span class="dot" style="background:${c}"></span>`; }
function facName(f) { return S.factions[f] ? S.factions[f].name : '—'; }
function facShort(f) { return S.factions[f] ? S.factions[f].short : '—'; }
function facColor(f) { return S.factions[f] ? S.factions[f].color : '#888'; }
function bar(v, max, color) {
  const p = clamp(v / (max || 100) * 100, 0, 100);
  return `<div class="bar"><i style="width:${p}%;background:${color || 'var(--accent)'}"></i></div>`;
}
function stat(k, v, sub) {
  return `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${v}</div>${sub ? `<div class="k">${esc(sub)}</div>` : ''}</div>`;
}
function sect(id, title, body, defOpen) {
  const open = ui.open[id] != null ? ui.open[id] : !!defOpen;
  return `<details class="sect" data-sect="${id}" ${open ? 'open' : ''}><summary>${title}</summary><div class="body">${body}</div></details>`;
}
const TYPE_TR = { town: 'Şehir', castle: 'Kale', village: 'Köy' };
const TYPE_ICON = { town: '🏛', castle: '🏰', village: '🏘' };

function troopLines(st, limit) {
  const e = Object.entries(st).filter(x => x[1] > 0)
    .sort((a, b) => (TROOPS[b[0]] ? TROOPS[b[0]].tier : 0) - (TROOPS[a[0]] ? TROOPS[a[0]].tier : 0));
  if (!e.length) return '<div class="small muted">Asker yok</div>';
  const list = limit ? e.slice(0, limit) : e;
  const tot = stackCount(st);
  return `<table class="tbl">${list.map(([k, v]) => {
    const t = TROOPS[k];
    return `<tr><td>${esc(t ? t.name : k)}</td><td class="small muted">T${t ? t.tier : '?'}</td>
      <td class="n">${fmt(v)}</td><td style="width:34%">${bar(v, tot, facColorOfTroop(t))}</td></tr>`;
  }).join('')}${limit && e.length > limit ? `<tr><td colspan="4" class="small muted">+${e.length - limit} tür daha</td></tr>` : ''}</table>`;
}
function facColorOfTroop(t) {
  if (!t) return 'var(--accent)';
  return t.cls === 'cav' ? '#c98a3a' : t.cls === 'arch' ? '#6f9e5a' : '#7d90b8';
}
function stateLabel(l) {
  return { active:'Sahada', prisoner:'Esir', regroup:'Toparlanıyor', dead:'Ölü', exile:'Sürgün' }[l.state] || l.state;
}
function goalLabel(p) {
  if (p.besieging) { const s = S.settlements[p.besieging]; return `${s ? s.name : '?'} kuşatmasında`; }
  const t = p.targetId ? S.settlements[p.targetId] : null;
  if (p.goal === 'follow') {
    const lead = S.parties[p.targetId];
    return lead ? `${partyLabel(lead)} ordusuna katılıyor` : 'Orduya katılıyor';
  }
  const m = {
    patrol:'Devriyede', raid:'Yağmaya gidiyor', siege:'Kuşatmaya gidiyor', defend:'Savunmaya koşuyor',
    return:'Tımarına dönüyor', garrison:'Konaklıyor', flee:'Çekiliyor', roam:'Dolaşıyor', idle:'Bekliyor'
  };
  return (m[p.goal] || p.goal) + (t ? ` — ${t.name}` : '');
}

/* ---------- düzenleme alanları ---------- */
function fNum(label, kind, id, key, min, max, step) {
  const obj = getEnt(kind, id); if (!obj) return '';
  return `<label class="f"><span>${esc(label)}</span><input type="number" value="${Math.round((obj[key] ?? 0) * 100) / 100}" min="${min}" max="${max}" step="${step || 1}" data-edit="${kind}|${id}|${key}|num"></label>`;
}
function fText(label, kind, id, key) {
  const obj = getEnt(kind, id); if (!obj) return '';
  return `<label class="f"><span>${esc(label)}</span><input type="text" value="${esc(obj[key] ?? '')}" data-edit="${kind}|${id}|${key}|text"></label>`;
}
function fSel(label, kind, id, key, opts) {
  const obj = getEnt(kind, id); if (!obj) return '';
  const cur = obj[key];
  return `<label class="f"><span>${esc(label)}</span><select data-edit="${kind}|${id}|${key}|sel">${
    opts.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(cur) ? 'selected' : ''}>${esc(o.t)}</option>`).join('')
  }</select></label>`;
}
function getEnt(kind, id) {
  return kind === 'lord' ? S.lords[id] : kind === 'settlement' ? S.settlements[id]
    : kind === 'faction' ? S.factions[id] : kind === 'party' ? S.parties[id]
    : kind === 'house' ? S.houses[id] : null;
}
const facOpts = () => Object.values(S.factions).filter(f => !f.isBandit).map(f => ({ v: f.id, t: f.name }));

/* ---------- ana render ---------- */
let lastUiRender = 0;
function renderUI(force) {
  const now = performance.now();
  if (!force && now - lastUiRender < 300) return;
  lastUiRender = now;
  const act = document.activeElement;
  const inPane = act && act.closest && act.closest('.panes') && ['INPUT','SELECT','TEXTAREA'].includes(act.tagName);
  if (inPane && !force) { renderLog(); renderTop(); return; }
  const pane = ui.tab;
  if (pane === 'sel' && (uiDirty.sel || force)) { $('#paneSel').innerHTML = viewSel(); uiDirty.sel = false; }
  if (pane === 'kra' && (uiDirty.kra || force)) { $('#paneKra').innerHTML = viewKra(); bindKraInputs(); uiDirty.kra = false; }
  if (pane === 'war' && (uiDirty.war || force)) { $('#paneWar').innerHTML = viewWar(); uiDirty.war = false; }
  if (pane === 'his' && (uiDirty.his || force)) { $('#paneHis').innerHTML = viewHis(); uiDirty.his = false; }
  if (pane === 'box' && (uiDirty.box || force)) { renderBox(); uiDirty.box = false; }
  renderTop(); renderLog(); renderLegend(); renderAlert();
}

function renderTop() {
  const c = calendar(S.day);
  $('#tbDate').textContent = `${c.dayOfMonth} ${c.month} ${c.year}`;
  $('#tbSeason').textContent = `· ${c.season}`;
}

let lastLogKey = '';
function renderLog() {
  const key = S.log.length + '|' + (S.log[0] ? S.log[0].m : '') + '|' + ui.logFilter;
  if (!logDirty && key === lastLogKey) return;
  logDirty = false; lastLogKey = key;
  const imp = S.log.filter(l => l.i >= 1);
  $('#logLatest').textContent = imp[0] ? imp[0].m : (S.log[0] ? S.log[0].m : '—');
  $('#logList').innerHTML = logLines(imp.slice(0, 40));
}
function logLines(list) {
  return list.map(l =>
    `<div class="log-line ${l.k}" ${l.b ? `data-act="openBattle" data-id="${l.b}"` : ''}>
      <span class="d">${shortDate(l.d)}</span><span class="m">${esc(l.m)}${l.b ? ' <span class="tag gold">izle</span>' : ''}</span></div>`).join('');
}

function renderLegend() {
  const box = $('#legend');
  const facs = Object.values(S.factions).filter(f => !f.isBandit && f.alive)
    .map(f => ({ f, own: ownSettlements(f.id).length }))
    .filter(o => o.own > 0 || o.f.isBanner)
    .sort((a, b) => b.own - a.own);
  const shown = facs.slice(0, 9), rest = facs.slice(9);
  const rows = shown.map(o => `<div class="lrow ${S.hidden[o.f.id] ? 'off' : ''}" data-act="toggleFac" data-id="${o.f.id}">
      <span class="swatch" style="background:${o.f.color}${o.f.isBanner ? ';border-radius:50%' : ''}"></span>
      <span class="lname">${o.f.isBanner ? '🏴 ' : ''}${esc(o.f.short)}</span><span class="lval">${o.f.isBanner ? '⚔' : o.own}</span></div>`).join('')
    + (rest.length ? `<div class="lrow"><span class="swatch" style="background:transparent"></span>
      <span class="lname muted">+${rest.length} küçük devlet</span></div>` : '');
  const html = rows + `<div class="lrow ${S.hidden.bandit ? 'off' : ''}" data-act="toggleFac" data-id="bandit">
      <span class="swatch" style="background:${BANDIT_FACTION.color}"></span><span class="lname">Haydutlar</span>
      <span class="lval">${S.order.parties.filter(i => S.parties[i] && S.parties[i].type === 'bandit').length}</span></div>`;
  if (box.dataset.h !== html) { box.innerHTML = html; box.dataset.h = html; }
}

function renderAlert() {
  if (!alertDirty) return;
  alertDirty = false;
  const box = $('#alertBox');
  if (!S.alert) { box.classList.remove('on'); return; }
  $('#alertT').textContent = '⚔ ' + S.alert.title;
  $('#alertS').textContent = S.alert.sub;
  box.classList.add('on');
  clearTimeout(renderAlert._t);
  renderAlert._t = setTimeout(() => { S.alert = null; alertDirty = true; box.classList.remove('on'); }, 14000);
}

/* =====================  SEÇİM  ===================== */
function viewSel() {
  if (!S.sel) return viewDashboard();
  if (S.sel.type === 'lord') return viewLord(S.lords[S.sel.id]);
  if (S.sel.type === 'settlement') return viewSettlement(S.settlements[S.sel.id]);
  if (S.sel.type === 'faction') return viewFaction(S.factions[S.sel.id]);
  if (S.sel.type === 'party') return viewParty(S.parties[S.sel.id]);
  if (S.sel.type === 'house') return viewHouse(S.houses[S.sel.id]);
  return viewDashboard();
}

function viewDashboard() {
  const c = calendar(S.day);
  const live = Object.values(S.factions).filter(f => !f.isBandit);
  const rows = live.map(f => ({ f, own: ownSettlements(f.id), str: factionStrength(f.id), troops: factionTroops(f.id) }))
    .sort((a, b) => b.str - a.str);
  const maxStr = Math.max(1, ...rows.map(r => r.str));
  const sieges = S.order.settlements.map(i => S.settlements[i]).filter(s => s.besiegedBy);
  const wars = Object.keys(S.wars);
  return `
  <div class="hero">
    <div class="crest" style="background:var(--accent-bg);border-color:var(--accent-border)">🛡</div>
    <div class="grow"><h2>Kalradya</h2><div class="sub2">${c.dayOfMonth} ${c.month} ${c.year} · ${c.season}</div></div>
  </div>
  ${decisionCards()}
  ${S.elections.filter(e => e.stage !== 'done').map(e => electionCard(e)).join('')}
  <div class="statgrid">
    ${stat('Savaş', wars.length)}${stat('Kuşatma', sieges.length)}${stat('Ordu', S.order.parties.length)}
  </div>
  <div class="card">
    <h3>Güç dengesi</h3>
    <table class="tbl">
      ${rows.map(r => `<tr class="clk" data-act="selFac" data-id="${r.f.id}">
        <td>${facDot(r.f.id)} ${esc(r.f.short)}${r.f.alive ? '' : ' <span class="tag war">yıkıldı</span>'}</td>
        <td class="n small muted">${r.own.filter(s => s.type === 'town').length}🏛 ${r.own.filter(s => s.type === 'castle').length}🏰</td>
        <td class="n">${fmt(r.troops)}</td>
        <td style="width:30%">${bar(r.str, maxStr, r.f.color)}</td></tr>`).join('')}
    </table>
  </div>
  ${sieges.length ? `<div class="card"><h3>Süren kuşatmalar</h3><div class="list">
    ${sieges.map(s => { const p = S.parties[s.besiegedBy]; return `<div class="item" data-act="selStl" data-id="${s.id}">
      ${facDot(s.faction)}<div class="grow"><div class="t">${esc(s.name)}</div>
      <div class="s">${p ? esc(partyLabel(p)) + ' · ' + esc(facShort(p.faction)) : '?'} — %${Math.round(s.siegeProgress)}</div></div>
      <div class="num small">${fmt(settlementDefCount(s))} savunan</div></div>`; }).join('')}
  </div></div>` : ''}
  ${S.battles.length ? `<div class="card"><h3>Son savaşlar</h3><div class="list">
    ${S.battles.slice(0, 4).map(b => battleItem(b)).join('')}
  </div>
  <div class="btnrow" style="margin-top:8px"><button class="btn sm" data-act="tab" data-id="war">Tüm savaşlar</button></div></div>` : ''}
  <div class="card small muted">Haritadan bir şehir, kale, köy ya da orduya tıkla — burada bütün ayrıntıları görürsün.
    Yeni lord, yeni şehir ya da yeni krallık kurmak için <b>Sandbox</b> sekmesine bak.</div>`;
}

function battleItem(b) {
  const win = b.winner === 'a' ? b.a : b.b, lose = b.winner === 'a' ? b.b : b.a;
  return `<div class="item" data-act="openBattle" data-id="${b.id}">
    <span class="dot" style="background:${facColor(win.faction)}"></span>
    <div class="grow"><div class="t">${esc(b.title)}</div>
    <div class="s">${esc(win.name)} ${fmt(win.start)} ⨯ ${fmt(lose.start)} ${esc(lose.name)}</div></div>
    <div class="num small">${shortDate(b.day)}</div></div>`;
}

function viewLord(l) {
  if (!l) return '<div class="card">Lord bulunamadı.</div>';
  const fac = S.factions[l.faction];
  const p = l.partyId ? S.parties[l.partyId] : null;

  const cnt = p ? stackCount(p.troops) : 0;
  const isMarshal = fac && fac.marshalId === l.id;
  const myBattles = S.battles.filter(b => b.a.lordId === l.id || b.b.lordId === l.id).slice(0, 3);
  return `
  <div class="hero">
    <div style="flex:none;position:relative">${houseArms(houseOf(l), 42)}${l.isKing ? '<div style="position:absolute;top:-6px;right:-6px;font-size:15px">👑</div>' : ''}</div>
    <div class="grow">
      <h2>${esc(l.title)} ${esc(lordFullName(l))}</h2>
      <div class="sub2">${esc(facName(l.faction))} · ${esc(pers.name)} · ${esc(stateLabel(l))}${isMarshal ? ' · Mareşal' : ''}${l.age ? ' · ' + l.age + ' yaşında' : ''}</div>

    ${stat('Altın', fmt(l.gold))}
  </div>
  ${p ? `<div class="card">
    <h3>Ordusu <span class="sub">${esc(goalLabel(p))}</span></h3>
    <table class="tbl">
      <tr><td>Asker</td><td class="n">${fmt(cnt)} / ${cap}</td><td style="width:40%">${bar(cnt, cap, fac.color)}</td></tr>
      <tr><td>Moral</td><td class="n">${Math.round(p.morale)}</td><td>${bar(p.morale, 100, 'var(--success)')}</td></tr>
      <tr><td>Savaş gücü</td><td class="n">${fmt(partyPower(p))}</td><td class="small muted">${(() => { const m = stackMix(p.troops); return `${m.inf} piyade · ${m.arch} okçu · ${m.cav} süvari`; })()}</td></tr>
    </table>
    <div style="margin-top:8px">${troopLines(p.troops, 7)}</div>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm" data-act="focus">Haritada bul</button>
      <button class="btn sm" data-act="follow" data-id="${p.id}">🎥 Takip et</button>
      <button class="btn sm" data-act="orderParty" data-id="${p.id}">Emir ver</button>
      <button class="btn sm" data-act="troopEditor" data-kind="party" data-id="${p.id}">Askerler</button>
    </div>
  </div>` : `<div class="card"><div class="small muted">Bu lordun sahada ordusu yok.</div>
    <div class="btnrow" style="margin-top:6px"><button class="btn sm primary" data-act="lordSpawn" data-id="${l.id}">Ordu kur</button></div></div>`}

  <div class="card">
    <h3>Hanedan <span class="sub">${esc(l.house || '—')}</span>
      ${l.houseId ? `<button class="btn sm" data-act="selHouse" data-id="${l.houseId}" style="float:right">Hanedanı aç</button>` : ''}</h3>

      <tr><td>Yaş</td><td class="n">${l.age || '?'}</td><td class="small muted">${l.sick > S.day ? 'hasta' : 'sağlıklı'}</td></tr>
      <tr><td>Eşi</td><td colspan="2">${l.spouse ? esc(l.spouse) : '<span class="muted">bekâr</span>'}</td></tr>
      <tr><td>Çocukları</td><td colspan="2">${(l.children || []).length
        ? l.children.map(c => `<span class="tag">${c.male ? '♂' : '♀'} ${esc(c.name)} (${c.age})</span>`).join(' ')
        : '<span class="muted">yok</span>'}</td></tr>

    </table>
    ${(() => {
      const others = S.order.lords.map(i => S.lords[i])
        .filter(o => o.faction === l.faction && o.id !== l.id && o.state !== 'dead')
        .map(o => ({ o, r: lordRel(l, o) })).filter(x => Math.abs(x.r) > 12)
        .sort((a, b) => b.r - a.r);

        ${best.filter(x => x.r > 12).map(x => `<span class="tag peace">🤝 ${esc(x.o.name)} ${Math.round(x.r)}</span>`).join(' ')}

    })()}

  <div class="card">
    <h3>Tımarları <span class="sub">${l.fiefs.length} yerleşim</span></h3>
    <div class="list">
      ${l.fiefs.map(f => S.settlements[f]).filter(Boolean).map(s => `
        <div class="item" data-act="selStl" data-id="${s.id}">${facDot(s.faction)}
          <div class="grow"><div class="t">${TYPE_ICON[s.type]} ${esc(s.name)}</div>
          <div class="s">${TYPE_TR[s.type]} · refah ${Math.round(s.prosperity)}</div></div></div>`).join('')
        || '<div class="small muted">Tımarı yok.</div>'}

  </div>

  ${myBattles.length ? `<div class="card"><h3>Savaş geçmişi <span class="sub">${l.battlesWon}G / ${l.battlesLost}M</span></h3>

  <div class="card">
    <h3>Komutlar</h3>
    <div class="btnrow">
      <button class="btn sm" data-act="lordHeal" data-id="${l.id}">Orduyu tamamla</button>
      <button class="btn sm" data-act="lordElite" data-id="${l.id}">Seçkin birlik ver</button>
      <button class="btn sm" data-act="lordGold" data-id="${l.id}">+5.000 dinar</button>
      ${l.state === 'prisoner' ? `<button class="btn sm" data-act="lordFree" data-id="${l.id}">Serbest bırak</button>` : ''}
      ${!l.isKing ? `<button class="btn sm" data-act="makeKing" data-id="${l.id}">Kral yap</button>` : ''}
      <button class="btn sm" data-act="lordMove" data-id="${l.id}">Haritada taşı</button>
      <button class="btn sm danger" data-act="lordKill" data-id="${l.id}">Sil / öldür</button>
    </div>
  </div>

  ${sect('edit', '✎ Bütün özellikleri düzenle', `
    ${fText('İsim', 'lord', l.id, 'name')}
    ${fText('Unvan', 'lord', l.id, 'title')}
    ${fSel('Krallık', 'lord', l.id, 'faction', facOpts())}

    <div class="grid2">
      ${fNum('Şöhret', 'lord', l.id, 'renown', 0, 5000, 10)}
      ${fNum('Altın', 'lord', l.id, 'gold', 0, 9999999, 100)}
      ${fNum('Krala bağlılık', 'lord', l.id, 'relKing', -100, 100, 1)}
      ${fNum('Taktik', 'lord', l.id, 'skillTactics', 0, 10, 1)}
      ${fNum('Liderlik', 'lord', l.id, 'skillLeadership', 0, 10, 1)}

        { v:'active', t:'Sahada' }, { v:'regroup', t:'Toparlanıyor' }, { v:'prisoner', t:'Esir' },
        { v:'exile', t:'Sürgün' }, { v:'dead', t:'Ölü' }])}

}

function viewParty(p) {

  return `
  <div class="hero">
    <div class="crest" style="background:${hexRGBA(facColor(p.faction), .22)};border-color:${facColor(p.faction)}">🏴</div>
    <div class="grow"><h2>${esc(partyLabel(p))}</h2><div class="sub2">${esc(facName(p.faction))} · ${esc(goalLabel(p))}</div></div>
  </div>
  <div class="statgrid">${stat('Asker', fmt(stackCount(p.troops)))}${stat('Moral', Math.round(p.morale))}${stat('Güç', fmt(partyPower(p)))}</div>
  <div class="card"><h3>Birlikler</h3>${troopLines(p.troops)}
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm" data-act="focus">Haritada bul</button>
      <button class="btn sm" data-act="follow" data-id="${p.id}">🎥 Takip et</button>

    </div>

}

function viewSettlement(s) {
  if (!s) return '<div class="card">Yerleşim bulunamadı.</div>';
  const owner = s.lordId ? S.lords[s.lordId] : null;
  const kids = S.order.settlements.map(i => S.settlements[i]).filter(v => v.parentId === s.id);
  const nearby = S.order.parties.map(i => S.parties[i]).filter(p => p && dist2(p.x, p.y, s.x, s.y) < 50);
  const hist = S.battles.filter(b => b.placeId === s.id).slice(0, 3);
  const bp = s.besiegedBy ? S.parties[s.besiegedBy] : null;
  return `
  <div class="hero">
    <div class="crest" style="background:${hexRGBA(facColor(s.faction), .22)};border-color:${facColor(s.faction)}">${TYPE_ICON[s.type]}</div>
    <div class="grow"><h2>${esc(s.name)}</h2>
      <div class="sub2">${TYPE_TR[s.type]} · ${esc(facName(s.faction))}${owner ? ' · ' + esc(owner.title) + ' ' + esc(owner.name) : ' · sahipsiz'}</div></div>
  </div>
  ${s.besiegedBy ? `<div class="card" style="border-color:var(--danger)">
    <h3 style="color:var(--danger)">⚔ Kuşatma altında</h3>
    <table class="tbl">
      <tr><td>Kuşatan</td><td>${bp ? esc(partyLabel(bp)) + ' — ' + esc(facName(bp.faction)) : '?'}</td></tr>
      <tr><td>Saldıran gücü</td><td class="n">${fmt(S.order.parties.map(i => S.parties[i]).filter(q => q && q.besieging === s.id).reduce((a, q) => a + stackCount(q.troops), 0))} asker</td></tr>
      <tr><td>Savunan</td><td class="n">${fmt(settlementDefCount(s))} asker</td></tr>
      <tr><td>İlerleme</td><td>${bar(s.siegeProgress, 100, 'var(--danger)')}</td></tr>
      <tr><td>Erzak</td><td>${bar(s.food, 100, 'var(--accent)')}</td></tr>
    </table>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm" data-act="breakSiege" data-id="${s.id}">Kuşatmayı kaldır</button>
      <button class="btn sm danger" data-act="stormNow" data-id="${s.id}">Hemen saldırsınlar</button>
    </div>
  </div>` : ''}
  <div class="statgrid">
    ${stat('Refah', Math.round(s.prosperity))}
    ${s.type !== 'village' ? stat('Garnizon', fmt(stackCount(s.garrison))) : stat('Asker havuzu', Math.round(s.recruits))}
    ${stat('Gelir', fmt(settlementIncome(s) * S.opts.economy), 'dinar/gün')}
  </div>
  <div class="card">
    <table class="tbl">
      <tr><td>Refah</td><td class="n">${Math.round(s.prosperity)}</td><td style="width:45%">${bar(s.prosperity, 100, 'var(--success)')}</td></tr>
      ${s.type !== 'village' ? `<tr><td>Surlar</td><td class="n">${Math.round(s.walls)}</td><td>${bar(s.walls, 100, 'var(--info)')}</td></tr>
      <tr><td>Erzak</td><td class="n">${Math.round(s.food)}</td><td>${bar(s.food, 100, 'var(--accent)')}</td></tr>` : ''}
      <tr><td>Asker havuzu</td><td class="n">${Math.round(s.recruits)}</td><td class="small muted">huzursuzluk ${Math.round(s.unrest)}</td></tr>
      ${s.raidedUntil > S.day ? `<tr><td colspan="3"><span class="tag war">Yağmalandı — ${Math.ceil(s.raidedUntil - S.day)} gün toparlanacak</span></td></tr>` : ''}
    </table>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm" data-act="focus">Haritada bul</button>
      ${s.type !== 'village' ? `<button class="btn sm" data-act="troopEditor" data-kind="settlement" data-id="${s.id}">Garnizon</button>
      <button class="btn sm" data-act="reinforce" data-id="${s.id}">+60 asker</button>` : ''}

      <button class="btn sm" data-act="stlMove" data-id="${s.id}">Haritada taşı</button>
      <button class="btn sm danger" data-act="stlDelete" data-id="${s.id}">Sil</button>
    </div>
  </div>
  ${s.type === 'village' && s.produce ? `<div class="card"><h3>Üretim</h3>
    <div class="row" style="gap:8px"><span class="tag gold">${esc(GOOD_BY_ID[s.produce] ? GOOD_BY_ID[s.produce].name : s.produce)}</span>
    <span class="small muted">bu köy ${esc(GOOD_BY_ID[s.produce] ? GOOD_BY_ID[s.produce].name.toLocaleLowerCase('tr') : '')} üretir; yakın şehirlerde fiyatı düşürür</span></div></div>` : ''}
  ${s.type !== 'village' && s.prices ? `<div class="card"><h3>Pazar <span class="sub">fiyatlar</span></h3>
    <table class="tbl">${GOODS.map(g => ({ g, p: s.prices[g.id] || g.base }))
      .sort((a, b) => (b.p / b.g.base) - (a.p / a.g.base)).slice(0, 6)
      .map(o => `<tr><td>${esc(o.g.name)}</td><td class="n">${fmt(o.p)}</td>
        <td class="small ${o.p > o.g.base * 1.15 ? '' : 'muted'}" style="${o.p > o.g.base * 1.15 ? 'color:var(--danger)' : ''}">${o.p > o.g.base * 1.15 ? 'pahalı' : o.p < o.g.base * 0.85 ? 'ucuz' : 'normal'}</td></tr>`).join('')}
    </table></div>` : ''}
  ${s.type !== 'village' ? `<div class="card"><h3>Garnizon <span class="sub">${fmt(stackCount(s.garrison))} asker · savunma gücü ${fmt(settlementDefPower(s))}</span></h3>
    ${troopLines(s.garrison, 7)}
    ${stackCount(s.prisoners) ? `<div class="small muted" style="margin-top:6px">Zindanda ${fmt(stackCount(s.prisoners))} esir</div>` : ''}</div>` : ''}
  ${kids.length ? `<div class="card"><h3>Bağlı köyler</h3><div class="list">
    ${kids.map(v => `<div class="item" data-act="selStl" data-id="${v.id}">${facDot(v.faction)}
      <div class="grow"><div class="t">${esc(v.name)}</div><div class="s">refah ${Math.round(v.prosperity)}${v.raidedUntil > S.day ? ' · yağmalandı' : ''}</div></div>
      <div class="num small">${Math.round(v.recruits)} asker</div></div>`).join('')}</div></div>` : ''}
  ${nearby.length ? `<div class="card"><h3>Yakındaki ordular</h3><div class="list">
    ${nearby.slice(0, 6).map(p => `<div class="item" data-act="selParty" data-id="${p.id}">${facDot(p.faction)}
      <div class="grow"><div class="t">${esc(partyLabel(p))}</div><div class="s">${esc(goalLabel(p))}</div></div>
      <div class="num small">${fmt(stackCount(p.troops))}</div></div>`).join('')}</div></div>` : ''}
  ${hist.length ? `<div class="card"><h3>Burada olanlar</h3><div class="list">${hist.map(b => battleItem(b)).join('')}</div></div>` : ''}
  ${sect('edit', '✎ Bütün özellikleri düzenle', `
    ${fText('İsim', 'settlement', s.id, 'name')}
    ${fSel('Sahip krallık', 'settlement', s.id, 'faction', facOpts())}
    ${fSel('Tımar sahibi', 'settlement', s.id, 'lordId', [{ v:'', t:'— sahipsiz —' }].concat(
      S.order.lords.map(i => S.lords[i]).filter(l => l.faction === s.faction && l.state !== 'dead').map(l => ({ v: l.id, t: `${l.title} ${l.name}` }))))}
    ${fSel('Tür', 'settlement', s.id, 'type', [{ v:'town', t:'Şehir' }, { v:'castle', t:'Kale' }, { v:'village', t:'Köy' }])}
    <div class="grid2">
      ${fNum('Refah', 'settlement', s.id, 'prosperity', 0, 100, 1)}
      ${fNum('Surlar', 'settlement', s.id, 'walls', 0, 100, 1)}
      ${fNum('Erzak', 'settlement', s.id, 'food', 0, 100, 1)}
      ${fNum('Asker havuzu', 'settlement', s.id, 'recruits', 0, 300, 1)}
      ${fNum('Huzursuzluk', 'settlement', s.id, 'unrest', 0, 100, 1)}
      ${fNum('Kuşatma %', 'settlement', s.id, 'siegeProgress', 0, 100, 1)}
    </div>`)}`;
}

function viewFaction(f) {
  if (!f) return '<div class="card">Krallık bulunamadı.</div>';
  const king = f.kingId ? S.lords[f.kingId] : null;
  const own = ownSettlements(f.id);
  const lords = S.order.lords.map(i => S.lords[i]).filter(l => l.faction === f.id && l.state !== 'dead');
  const wars = Object.keys(S.factions).filter(o => atWar(f.id, o));
  const marshal = f.marshalId ? S.lords[f.marshalId] : null;
  const cap = capitalOf(f.id);
  return `
  <div class="hero">
    <div style="flex:none">${factionArms(f, 44)}</div>
    <div class="grow"><h2>${esc(f.name)}${f.isBanner ? ' <span class="tag war">isyan bayrağı</span>' : ''}</h2>
      <div class="sub2">${king ? esc(king.title) + ' ' + esc(king.name) : 'hükümdarsız'} · ${lords.length} lord${f.alive ? '' : ' · yıkıldı'}</div></div>
  </div>
  <div class="statgrid">
    ${stat('Toprak', own.length, `${own.filter(s => s.type === 'town').length} şehir / ${own.filter(s => s.type === 'castle').length} kale`)}
    ${stat('Asker', fmt(factionTroops(f.id)))}
    ${stat('Hazine', fmt(f.treasury))}
  </div>
  <div class="card">
    <table class="tbl">
      <tr><td>Askerî güç</td><td class="n">${fmt(factionStrength(f.id))}</td></tr>
      <tr><td>Başkent</td><td>${cap ? `<span class="tag gold" data-act="selStl" data-id="${cap.id}" style="cursor:pointer">${esc(cap.name)}</span>${cap.besiegedBy ? ' <span class="tag war">kuşatma altında!</span>' : ''}` : '—'}</td></tr>
      <tr><td>Veraset</td><td>${f.succession === 'elective' ? '<span class="tag">Seçimli (kurultay)</span>' : '<span class="tag">Babadan oğula</span>'}${f.interregnum ? ' <span class="tag war">fetret</span>' : ''}</td></tr>
      <tr><td>Hüküm süren hanedan</td><td>${f.rulingHouseId && S.houses[f.rulingHouseId]
        ? `<span class="tag" data-act="selHouse" data-id="${f.rulingHouseId}" style="cursor:pointer;border-color:${houseColor(f.rulingHouseId)};color:${houseColor(f.rulingHouseId)}">${esc(houseName(f.rulingHouseId))}</span>` : '—'}</td></tr>
      <tr><td>Prestij</td><td class="n">${Math.round(f.prestige || 0)}</td></tr>
      <tr><td>Mareşal</td><td>${marshal ? `<span class="tag" data-act="selLord" data-id="${marshal.id}" style="cursor:pointer">${esc(marshal.title)} ${esc(marshal.name)}</span>` : '—'}</td></tr>
      <tr><td>Savaş planı</td><td>${f.warPlan && S.settlements[f.warPlan.settlementId]
        ? `<span class="tag ${f.warPlan.kind === 'defend' ? 'war' : 'gold'}" data-act="selStl" data-id="${f.warPlan.settlementId}" style="cursor:pointer">${f.warPlan.kind === 'defend' ? '🛡 Savun' : '⚔ Al'}: ${esc(S.settlements[f.warPlan.settlementId].name)}</span>`
        : '<span class="muted">—</span>'}</td></tr>
      <tr><td>Durum</td><td>${wars.length ? wars.map(w => `<span class="tag war">⚔ ${esc(facShort(w))}</span>`).join(' ') : '<span class="tag peace">Barış</span>'}</td></tr>
      ${(() => { const pl = Object.keys(S.pacts).filter(k => k.split('|').includes(f.id));
        return pl.length ? `<tr><td>Anlaşmalar</td><td>${pl.map(k => { const o = k.split('|').find(x => x !== f.id); const t = S.pacts[k].type;
          return `<span class="tag peace">${PACT_TYPES[t].icon} ${esc(facShort(o))}</span>`; }).join(' ')}</td></tr>` : ''; })()}
      ${f.pretenderId && S.lords[f.pretenderId] ? `<tr><td>Taht iddiacısı</td><td><span class="tag war" data-act="selLord" data-id="${f.pretenderId}" style="cursor:pointer">${esc(S.lords[f.pretenderId].name)}</span></td></tr>` : ''}
    </table>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm" data-act="facFocus" data-id="${f.id}">Haritada göster</button>
      <button class="btn sm" data-act="facTreasury" data-id="${f.id}">+50.000 dinar</button>
      <button class="btn sm" data-act="gfArmyFor" data-id="${f.id}">Orduları tamamla</button>
    </div>
  </div>
  ${(() => { const els = S.elections.filter(e => e.faction === f.id).slice(0, 3);
    return els.length ? els.map(e => electionCard(e, true)).join('') : ''; })()}
  ${(() => { const hs = S.order.houses.map(i => S.houses[i]).filter(h => h && !h.extinct && h.faction === f.id)
      .sort((a, b) => housePower(b.id) - housePower(a.id));
    return hs.length ? `<div class="card"><h3>Hanedanlar <span class="sub">${hs.length}</span></h3><div class="list">
      ${hs.slice(0, 8).map(h => `<div class="item" data-act="selHouse" data-id="${h.id}">
        <span class="dot" style="background:${h.color}"></span>
        <div class="grow"><div class="t">${esc(h.name)}${f.rulingHouseId === h.id ? ' 👑' : ''}</div>
        <div class="s">${houseMembers(h.id).length} lord · ${houseMembers(h.id).reduce((a, m) => a + m.fiefs.length, 0)} tımar</div></div>
        <div class="num small">${Math.round(housePower(h.id))}</div></div>`).join('')}</div></div>` : ''; })()}
  ${(() => { const ds = S.dialogues.filter(d => d.aFaction === f.id || d.bFaction === f.id).slice(0, 5);
    return ds.length ? `<div class="card"><h3>Divan <span class="sub">son konuşmalar</span></h3><div class="list">${ds.map(dialogueItem).join('')}</div></div>` : ''; })()}
  <div class="card"><h3>Lordları</h3><div class="list">
    ${lords.sort((a, b) => (b.isKing ? 1e6 : 0) + b.renown - ((a.isKing ? 1e6 : 0) + a.renown)).slice(0, 20).map(l => lordItem(l)).join('')}
  </div></div>
  ${sect('fstl', `Toprakları (${own.length})`, `<div class="list">${own.slice(0, 60).map(s => `
    <div class="item" data-act="selStl" data-id="${s.id}">${facDot(s.faction)}
      <div class="grow"><div class="t">${TYPE_ICON[s.type]} ${esc(s.name)}</div><div class="s">${TYPE_TR[s.type]} · refah ${Math.round(s.prosperity)}</div></div></div>`).join('')}</div>`)}
  ${sect('edit', '✎ Krallığı düzenle', `
    ${fText('Krallık adı', 'faction', f.id, 'name')}
    ${fText('Kısa ad', 'faction', f.id, 'short')}
    ${fText('Hükümdar unvanı', 'faction', f.id, 'rulerTitle')}
    ${fText('Lord unvanı', 'faction', f.id, 'lordTitle')}
    ${fSel('Hükümdar', 'faction', f.id, 'kingId', lords.map(l => ({ v: l.id, t: `${l.title} ${l.name}` })))}
    ${fSel('Veraset düzeni', 'faction', f.id, 'succession', [
      { v:'hereditary', t:'Babadan oğula (hanedan)' }, { v:'elective', t:'Seçimli (kurultay)' }])}
    ${fSel('Başkent', 'faction', f.id, 'capital', own.filter(s => s.type !== 'village').map(s => ({ v: s.id, t: s.name })))}
    ${fSel('Kültür (birlik ağacı)', 'faction', f.id, 'culture', [
      { v:'sw', t:'Swadya' }, { v:'vg', t:'Vaegir' }, { v:'kh', t:'Kherjit' },
      { v:'nd', t:'Nord' }, { v:'rh', t:'Rodok' }, { v:'sr', t:'Sarranid' }])}
    <div class="grid2">
      ${fNum('Hazine', 'faction', f.id, 'treasury', 0, 99999999, 500)}
      ${fNum('Saldırganlık', 'faction', f.id, 'aggr', 0, 1.5, 0.05)}
    </div>
    <label class="f"><span>Renk</span><input type="color" value="${f.color}" data-edit="faction|${f.id}|color|color"></label>
    <div class="btnrow"><button class="btn sm danger" data-act="facDestroy" data-id="${f.id}">Krallığı yık</button></div>`)}`;
}

function lordItem(l) {
  const p = l.partyId ? S.parties[l.partyId] : null;
  return `<div class="item" data-act="selLord" data-id="${l.id}">${facDot(l.faction)}
    <div class="grow"><div class="t">${l.isKing ? '👑 ' : ''}${esc(l.title)} ${esc(l.name)}</div>
    <div class="s">${esc(stateLabel(l))} · ${l.fiefs.length} tımar · şöhret ${fmt(l.renown)}</div></div>
    <div class="num small">${p ? fmt(stackCount(p.troops)) : '—'}</div></div>`;
}

/* =====================  KRALLIKLAR  ===================== */
function viewKra() {
  const live = Object.values(S.factions).filter(f => !f.isBandit);
  const ranked = live.map(f => ({ f, own: ownSettlements(f.id), str: factionStrength(f.id) })).sort((a, b) => b.str - a.str);
  const maxStr = Math.max(1, ...ranked.map(r => r.str));
  const alive = live.filter(f => f.alive);
  const wars = Object.entries(S.wars).map(([k, v]) => { const [a, b] = k.split('|'); return { a, b, days: Math.floor(S.day - v.since) }; });

  let lords = S.order.lords.map(i => S.lords[i]);
  if (ui.lordFac) lords = lords.filter(l => l.faction === ui.lordFac);
  if (ui.lordQuery) { const q = ui.lordQuery.toLocaleLowerCase('tr'); lords = lords.filter(l => l.name.toLocaleLowerCase('tr').includes(q)); }
  lords.sort((a, b) => (b.isKing ? 1e6 : 0) + b.renown - ((a.isKing ? 1e6 : 0) + a.renown));

  const liveEls = S.elections.filter(e => e.stage !== 'done');
  const doneEls = S.elections.filter(e => e.stage === 'done').slice(0, 4);
  const topHouses = S.order.houses.map(i => S.houses[i]).filter(h => h && !h.extinct)
    .sort((a, b) => housePower(b.id) - housePower(a.id)).slice(0, 10);
  return `
  ${decisionCards()}
  ${liveEls.map(e => electionCard(e)).join('')}
  <div class="card">
    <h3>Krallıklar</h3>
    <div class="list">
      ${ranked.map(r => `<div class="item" data-act="selFac" data-id="${r.f.id}">
        <span class="dot" style="background:${r.f.color}"></span>
        <div class="grow"><div class="t">${esc(r.f.name)}${r.f.alive ? '' : ' <span class="tag war">yıkıldı</span>'}</div>
          <div class="s">${r.own.filter(s => s.type === 'town').length} şehir · ${r.own.filter(s => s.type === 'castle').length} kale · ${fmt(factionTroops(r.f.id))} asker</div>
          <div style="margin-top:4px">${bar(r.str, maxStr, r.f.color)}</div></div>
      </div>`).join('')}
    </div>
  </div>

  <div class="card">
    <h3>Savaş durumu <span class="sub">${wars.length} savaş</span></h3>
    ${wars.length ? `<div class="list" style="margin-bottom:8px">${wars.map(w => `<div class="item">
      ${facDot(w.a)}<div class="grow"><div class="t">${esc(facShort(w.a))} ⚔ ${esc(facShort(w.b))}</div><div class="s">${w.days} gündür sürüyor</div></div>
      <button class="btn sm" data-act="peace" data-a="${w.a}" data-b="${w.b}">Barıştır</button></div>`).join('')}</div>`
      : '<div class="small muted" style="margin-bottom:8px">Kalradya şu an barış içinde.</div>'}
    <div class="small muted" style="margin-bottom:4px">Tabloda bir hücreye tıkla — savaş açar ya da barıştırır.</div>
    <div style="overflow-x:auto"><table class="tbl">

/* =====================  TARİH SEKMESİ  ===================== */
function lineChart(series, opts) {
  opts = opts || {};
  const W = 320, H = 120, pad = { l: 30, r: 6, t: 8, b: 16 };
  if (!series.length || !series[0].pts.length) return '<div class="small muted">Henüz veri yok.</div>';
  const allY = series.reduce((a, s) => a.concat(s.pts.map(p => p[1])), []);
  const maxY = Math.max(1, ...allY);
  const minX = series[0].pts[0][0], maxX = series[0].pts[series[0].pts.length - 1][0] || minX + 1;
  const sx = x => pad.l + (x - minX) / Math.max(1, maxX - minX) * (W - pad.l - pad.r);
  const sy = y => H - pad.b - (y / maxY) * (H - pad.t - pad.b);
  const grid = [0, 0.5, 1].map(t => `<line x1="${pad.l}" y1="${sy(maxY * t)}" x2="${W - pad.r}" y2="${sy(maxY * t)}"
      stroke="var(--border-tertiary)" stroke-width="1"/>
    <text x="2" y="${sy(maxY * t) + 3}" font-size="8" fill="var(--text-tertiary)">${fmt(maxY * t)}</text>`).join('');
  const lines = series.map(s => `<polyline fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round"
      points="${s.pts.map(p => `${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' ')}"/>`).join('');
  const years = [];
  for (let d = Math.ceil(minX / 360) * 360; d <= maxX; d += 360) {
    years.push(`<text x="${sx(d)}" y="${H - 4}" font-size="8" text-anchor="middle" fill="var(--text-tertiary)">${1084 + d / 360}</text>`);
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${lines}${years.join('')}</svg>`;
}

/* =====================  ARMA ÇİZİMİ  ===================== */
let ARMS_UID = 0;
function armsSVG(arms, colA, colB, size) {
  arms = arms || { pattern: 'solid', charge: 'sword' };
  const id = 'ar' + (++ARMS_UID);
  const A = colA || '#8a6d3b', B = colB || '#efe3c4';
  const shield = 'M 6 6 L 94 6 L 94 56 Q 94 92 50 108 Q 6 92 6 56 Z';
  let field = `<rect x="0" y="0" width="100" height="112" fill="${A}"/>`;
  const p = arms.pattern;
  if (p === 'fess') field += `<rect x="0" y="40" width="100" height="26" fill="${B}"/>`;
  else if (p === 'pale') field += `<rect x="37" y="0" width="26" height="112" fill="${B}"/>`;
  else if (p === 'bend') field += `<path d="M 0 0 L 34 0 L 100 96 L 100 112 L 66 112 L 0 20 Z" fill="${B}"/>`;
  else if (p === 'chevron') field += `<path d="M 50 30 L 100 82 L 100 108 L 50 56 L 0 108 L 0 82 Z" fill="${B}"/>`;
  else if (p === 'saltire') field += `<path d="M 0 0 L 20 0 L 100 96 L 100 112 L 80 112 L 0 16 Z M 100 0 L 100 16 L 20 112 L 0 112 L 0 96 L 80 0 Z" fill="${B}"/>`;
  else if (p === 'quarterly') field += `<rect x="50" y="0" width="50" height="56" fill="${B}"/><rect x="0" y="56" width="50" height="56" fill="${B}"/>`;
  else if (p === 'bordure') field += `<path d="M 0 0 H 100 V 112 H 0 Z M 12 12 V 100 H 88 V 12 Z" fill="${B}" fill-rule="evenodd"/>`;
  else if (p === 'chief') field += `<rect x="0" y="0" width="100" height="30" fill="${B}"/>`;
  const chargeColor = (p === 'solid' || p === 'bordure') ? B : '#f6ecd2';
  const charge = ARMS_CHARGES[arms.charge] || ARMS_CHARGES.sword;
  const s = size || 34;
  return `<svg viewBox="0 0 100 112" width="${s}" height="${Math.round(s * 1.12)}" style="display:block;flex:none">
    <defs><clipPath id="${id}"><path d="${shield}"/></clipPath></defs>
    <g clip-path="url(#${id})">${field}
      <g transform="translate(50 58) scale(0.62) translate(-50 -50)">
        <path d="${charge}" fill="${chargeColor}" stroke="rgba(0,0,0,.45)" stroke-width="2"/></g>
    </g>
    <path d="${shield}" fill="none" stroke="rgba(0,0,0,.7)" stroke-width="4"/>
  </svg>`;
}
function houseArms(h, size) { return h ? armsSVG(h.arms, h.color, '#efe3c4', size) : ''; }
function factionArms(f, size) {
  const rh = f.rulingHouseId ? S.houses[f.rulingHouseId] : null;
  return rh ? houseArms(rh, size) : armsSVG(makeArms(f.id), f.color, '#efe3c4', size);
}

  if (el.stage !== 'done') {
    const pledges = {};
    el.electors.forEach(e => { if (e.pledged) pledges[e.pledged] = (pledges[e.pledged] || 0) + 1; });
    return `<div class="card" style="border-color:var(--accent)">
      <h3 style="color:var(--accent)">${kn.icon} ${esc(fac ? fac.name : '')} — ${esc(kn.name)}</h3>
      <div class="small muted" style="margin-bottom:8px">${stl ? esc(stl.name) + ' · ' : ''}Kampanya sürüyor, ${Math.max(0, Math.ceil(el.endsAt - S.day))} gün sonra oylama. ${el.electors.length} seçici.</div>
      <div class="list">
        ${el.candidates.map(c => { const l = S.lords[c.lordId]; if (!l) return '';
          const h = houseOf(l);
          return `<div class="item" data-act="selLord" data-id="${l.id}">

            <div class="s">${esc(h ? h.name : '')} · şöhret ${fmt(l.renown)} · ${l.fiefs.length} tımar</div></div>
            <div class="num small">${pledges[c.lordId] || 0} söz</div></div>`; }).join('')}
      </div>
      <div class="btnrow" style="margin-top:8px">
        <button class="btn sm primary" data-act="electionResolve" data-id="${el.id}">Oylamayı şimdi yap</button>
        <button class="btn sm" data-act="electionRig" data-id="${el.id}">Kazananı belirle</button>
        <button class="btn sm" data-act="electionAfter" data-id="${el.id}">Sonrasını belirle</button>

  return `<div class="card">
    <h3>${kn.icon} ${esc(fac ? fac.short : '')} ${esc(kn.name)} <span class="sub">${shortDate(el.day)}</span></h3>

      ${(el.tally || []).map(t => { const l = S.lords[t.lordId]; const h = l ? houseOf(l) : null;
        return `<tr class="clk" data-act="selLord" data-id="${t.lordId}">
          <td><span class="dot" style="background:${h ? h.color : '#888'}"></span> ${esc(l ? lordShort(l) : '?')}</td>
          <td class="n">%${t.pct}</td>
          <td style="width:38%">${bar(t.pct, 100, h ? h.color : 'var(--accent)')}</td></tr>`; }).join('')}
    </table>

function startReplay(b) {
  stopReplay();
  const cvs = $('#btCanvas'); if (!cvs) return;
  const dp = Math.min(2, window.devicePixelRatio || 1);
  const W = cvs.clientWidth, H = cvs.clientHeight;
  cvs.width = W * dp; cvs.height = H * dp;
  const g = cvs.getContext('2d');
  g.setTransform(dp, 0, 0, dp, 0, 0);

  const MAXDOTS = 90;
  const mk = (side, stack, total) => {
    const n = Math.max(1, Math.min(MAXDOTS, Math.round(total / Math.max(1, total / MAXDOTS))));
    const dots = [];
    const comp = [];
    Object.entries(stack || {}).forEach(([k, v]) => { const t = TROOPS[k]; if (t && v > 0) comp.push({ cls: t.cls, n: v, tier: t.tier }); });
    const tot = comp.reduce((a, c) => a + c.n, 0) || 1;
    const cols = 6, rows = Math.ceil(n / cols);
    for (let i = 0; i < n; i++) {
      const col = Math.floor(i / rows), row = i % rows;
      let r = rnd() * tot, cls = 'inf', tier = 2;
      for (const c of comp) { r -= c.n; if (r <= 0) { cls = c.cls; tier = c.tier; break; } }
      dots.push({
        row, col, cls, tier, alive: true, deadAt: 0,
        hx: side === 'a' ? -1 : 1, jitter: rf(-3, 3)
      });
    }
    return { dots, rows, cols };
  };
  const A = mk('a', b.a.stack, b.a.start), B = mk('b', b.b.stack, b.b.start);
  const rounds = b.rounds && b.rounds.length ? b.rounds : [{ a: b.a.start, b: b.b.start }];
  const dur = 1200 + Math.min(7000, rounds.length * 260);
  const t0 = performance.now();

  const colFor = (faction, cls, tier) => {
    const base = facColor(faction);
    const f = cls === 'cav' ? 1.15 : cls === 'arch' ? 0.75 : 0.95;
    return darken(base, clamp(f * (0.75 + tier * 0.06), 0.35, 1.25));
  };

  function drawSide(side, pack, faction, phase, aliveRatio) {
    const midY = H / 2;
    const spacing = Math.min(15, (H - 26) / Math.max(1, pack.rows));
    const clashX = side === 'a' ? W / 2 - 11 : W / 2 + 11;
    const startX = side === 'a' ? 22 : W - 22;
    const aliveCount = Math.round(pack.dots.length * aliveRatio);
    pack.dots.forEach((d, i) => {
      if (i >= aliveCount && d.alive) { d.alive = false; d.deadAt = phase; }
      const depth = d.col * (side === 'a' ? -1 : 1) * 11;
      const x = startX + (clashX - startX) * Math.min(1, phase * 3.2) + depth;
      const y = midY + (d.row - pack.rows / 2 + 0.5) * spacing + d.jitter * 0.35;
      if (!d.alive) {
        g.globalAlpha = clamp(0.35 - (phase - d.deadAt) * 0.5, 0, 0.35);
        g.strokeStyle = '#20140c'; g.lineWidth = 1.6;
        g.beginPath(); g.moveTo(x - 3, y - 3); g.lineTo(x + 3, y + 3); g.moveTo(x + 3, y - 3); g.lineTo(x - 3, y + 3); g.stroke();
        g.globalAlpha = 1;
        return;
      }
      const wob = Math.sin((performance.now() / 220) + i) * (phase > 0.3 ? 1.2 : 0);
      g.fillStyle = colFor(faction, d.cls, d.tier);
      g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 1;
      if (d.cls === 'cav') {
        g.beginPath(); g.ellipse(x + wob, y, 5.2, 3.4, 0, 0, Math.PI * 2); g.fill(); g.stroke();
      } else if (d.cls === 'arch') {
        g.beginPath(); g.moveTo(x + wob, y - 4.4); g.lineTo(x + wob + 3.8, y + 3.2); g.lineTo(x + wob - 3.8, y + 3.2); g.closePath(); g.fill(); g.stroke();
      } else {
        g.beginPath(); g.rect(x + wob - 3.4, y - 4, 6.8, 8); g.fill(); g.stroke();
      }
    });
  }

  function frame(now) {
    const t = clamp((now - t0) / dur, 0, 1);
    const ri2 = Math.min(rounds.length - 1, Math.floor(t * rounds.length));
    const ra = rounds[ri2].a / Math.max(1, b.a.start), rb = rounds[ri2].b / Math.max(1, b.b.start);
    g.clearRect(0, 0, W, H);
    /* zemin */
    const grd = g.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, 'rgba(255,255,255,.05)'); grd.addColorStop(1, 'rgba(0,0,0,.20)');
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    if (b.type === 'siege') {
      g.fillStyle = 'rgba(0,0,0,.22)';
      g.fillRect(W / 2 + 12, 8, W / 2 - 20, H - 16);
      g.strokeStyle = 'rgba(240,233,220,.35)'; g.lineWidth = 2;
      g.strokeRect(W / 2 + 12, 8, W / 2 - 20, H - 16);
    }
    /* çarpışma hattı */
    if (t > 0.28) {
      const pulse = 0.35 + Math.abs(Math.sin(now / 260)) * 0.4;
      const lg = g.createLinearGradient(W / 2 - 26, 0, W / 2 + 26, 0);
      lg.addColorStop(0, 'rgba(255,180,90,0)');
      lg.addColorStop(0.5, `rgba(255,190,110,${0.22 * pulse})`);
      lg.addColorStop(1, 'rgba(255,180,90,0)');
      g.fillStyle = lg; g.fillRect(W / 2 - 26, 6, 52, H - 12);
    }
    drawSide('a', A, b.a.faction, t, ra);
    drawSide('b', B, b.b.faction, t, rb);
    /* rakamlar */
    g.font = '600 12px system-ui, sans-serif';
    g.fillStyle = facColor(b.a.faction); g.textAlign = 'left';
    g.fillText(fmt(rounds[ri2].a), 10, 16);
    g.fillStyle = facColor(b.b.faction); g.textAlign = 'right';
    g.fillText(fmt(rounds[ri2].b), W - 10, 16);
    const pr = $('#btProg'), rd = $('#btRound');
    if (pr) pr.style.width = (t * 100) + '%';
    if (rd) rd.textContent = `tur ${ri2 + 1}/${rounds.length}`;
    if (t < 1 && dlg.open) replay.raf = requestAnimationFrame(frame);
    else replay = null;
  }
  replay = { raf: requestAnimationFrame(frame) };
}
