}

function selParty(p) {
  if (!p) return '<div class="card">Ordu bulunamadı.</div>';
  return `<div class="card">
    <h3>${facDot(p.faction)} ${esc(partyLabel(p))}</h3>
    <div class="small muted" style="margin-bottom:6px">${esc(goalLabel(p))} · ${fmt(stackCount(p.troops))} asker · Moral ${Math.round(p.morale)}</div>
    ${troopLines(p.troops)}
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm" data-act="focus">Haritada göster</button>
      <button class="btn sm" data-act="troopEditor" data-kind="party" data-id="${p.id}">Askerleri düzenle</button>
      <button class="btn sm" data-act="teleport" data-id="${p.id}">Işınla</button>
      <button class="btn sm danger" data-act="killParty" data-id="${p.id}">Dağıt</button>
    </div>
  </div>`;
}

function selSettlement(s) {
  if (!s) return '<div class="card">Yerleşim bulunamadı.</div>';
  const owner = s.lordId ? S.lords[s.lordId] : null;
  const kids = S.order.settlements.map(i => S.settlements[i]).filter(v => v.parentId === s.id);
  const typeName = s.type === 'town' ? 'Şehir' : s.type === 'castle' ? 'Kale' : 'Köy';
  const nearby = S.order.parties.map(i => S.parties[i]).filter(p => p && dist2(p.x, p.y, s.x, s.y) < 45);
  return `
  <div class="card">
    <h3>${facDot(s.faction)} ${esc(s.name)} <span class="sub">— ${typeName}</span></h3>
    <div class="row wrap" style="gap:6px;margin-bottom:8px">
      <span class="tag">${esc(facName(s.faction))}</span>
      ${owner ? `<span class="tag">${esc(owner.title)} ${esc(owner.name)}</span>` : '<span class="tag">Sahipsiz</span>'}
      ${s.besiegedBy ? `<span class="tag war">Kuşatma altında %${Math.round(s.siegeProgress)}</span>` : ''}
      ${s.raidedUntil > S.day ? '<span class="tag war">Yağmalanmış</span>' : ''}
    </div>
    <table class="tbl">
      <tr><td>Refah</td><td class="n">${Math.round(s.prosperity)}</td><td style="width:45%">${bar(s.prosperity, 100, 'var(--success)')}</td></tr>
      ${s.type !== 'village' ? `<tr><td>Surlar</td><td class="n">${Math.round(s.walls)}</td><td>${bar(s.walls, 100, 'var(--info)')}</td></tr>
      <tr><td>Erzak</td><td class="n">${Math.round(s.food)}</td><td>${bar(s.food, 100, 'var(--accent)')}</td></tr>` : ''}
      <tr><td>Toplanabilir asker</td><td class="n">${Math.round(s.recruits)}</td><td class="small muted">Huzursuzluk ${Math.round(s.unrest)}</td></tr>
      <tr><td>Günlük gelir</td><td class="n">${fmt((s.type === 'town' ? 45 + s.prosperity * 2.4 : s.type === 'castle' ? 12 + s.prosperity * 0.5 : 6 + s.prosperity * 0.55) * S.opts.economy)}</td><td class="small muted">dinar</td></tr>
    </table>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm" data-act="focus">Haritada göster</button>
      ${s.type !== 'village' ? `<button class="btn sm" data-act="troopEditor" data-kind="settlement" data-id="${s.id}">Garnizonu düzenle</button>
      <button class="btn sm" data-act="reinforce" data-id="${s.id}">Garnizon takviyesi</button>` : ''}
      ${s.besiegedBy ? `<button class="btn sm" data-act="breakSiege" data-id="${s.id}">Kuşatmayı kaldır</button>` : ''}
      <button class="btn sm" data-act="giveFief" data-id="${s.id}">Tımar ver</button>
    </div>
  </div>

  ${s.type !== 'village' ? `<div class="card"><h3>Garnizon <span class="sub">${fmt(stackCount(s.garrison))} asker · savunma gücü ${fmt(settlementDefPower(s))}</span></h3>
    ${troopLines(s.garrison, 8)}
    ${stackCount(s.prisoners) ? `<div class="small muted" style="margin-top:6px">Zindanda ${fmt(stackCount(s.prisoners))} esir</div>` : ''}
  </div>` : ''}

  ${kids.length ? `<div class="card"><h3>Bağlı köyler</h3><div class="list">
    ${kids.map(v => `<div class="item" data-act="selStl" data-id="${v.id}">${facDot(v.faction)}
      <div class="grow"><div class="t">${esc(v.name)}</div><div class="s">Refah ${Math.round(v.prosperity)}${v.raidedUntil > S.day ? ' · yağmalandı' : ''}</div></div></div>`).join('')}
  </div></div>` : ''}

  ${nearby.length ? `<div class="card"><h3>Yakındaki ordular</h3><div class="list">
    ${nearby.slice(0, 8).map(p => `<div class="item" data-act="selParty" data-id="${p.id}">${facDot(p.faction)}
      <div class="grow"><div class="t">${esc(partyLabel(p))}</div><div class="s">${fmt(stackCount(p.troops))} asker · ${esc(goalLabel(p))}</div></div></div>`).join('')}
  </div></div>` : ''}

  <div class="card">
    <h3>Düzenle</h3>
    ${fText('İsim', 'settlement', s.id, 'name')}
    ${fSel('Sahip krallık', 'settlement', s.id, 'faction', facOpts(false))}
    ${fSel('Tımar sahibi', 'settlement', s.id, 'lordId', [{ v:'', t:'— sahipsiz —' }].concat(
      S.order.lords.map(i => S.lords[i]).filter(l => l.faction === s.faction && l.state !== 'dead').map(l => ({ v: l.id, t: `${l.title} ${l.name}` }))))}
    <div class="grid2">
      ${fNum('Refah', 'settlement', s.id, 'prosperity', 0, 100, 1)}
      ${s.type !== 'village' ? fNum('Surlar', 'settlement', s.id, 'walls', 0, 100, 1) : ''}
      ${s.type !== 'village' ? fNum('Erzak', 'settlement', s.id, 'food', 0, 100, 1) : ''}
      ${fNum('Asker havuzu', 'settlement', s.id, 'recruits', 0, 200, 1)}
      ${fNum('Huzursuzluk', 'settlement', s.id, 'unrest', 0, 100, 1)}
      ${fSel('Tür', 'settlement', s.id, 'type', [{ v:'town', t:'Şehir' }, { v:'castle', t:'Kale' }, { v:'village', t:'Köy' }])}
    </div>
  </div>`;
}

function selFaction(f) {
  if (!f) return '<div class="card">Krallık bulunamadı.</div>';
  const king = f.kingId ? S.lords[f.kingId] : null;
  const own = ownSettlements(f.id);
  const lords = S.order.lords.map(i => S.lords[i]).filter(l => l.faction === f.id && l.state !== 'dead');
  const troops = S.order.parties.map(i => S.parties[i]).filter(p => p && p.faction === f.id).reduce((a, p) => a + stackCount(p.troops), 0);
  const wars = Object.keys(S.factions).filter(o => atWar(f.id, o));
  return `
  <div class="card">
    <h3>${facDot(f.id)} ${esc(f.name)}</h3>
    <div class="row wrap" style="gap:6px;margin-bottom:8px">
      ${king ? `<span class="tag gold" data-act="selLord" data-id="${king.id}" style="cursor:pointer">${esc(king.title)} ${esc(king.name)}</span>` : '<span class="tag war">Hükümdarsız</span>'}
      <span class="tag">${own.filter(s => s.type === 'town').length} şehir</span>
      <span class="tag">${own.filter(s => s.type === 'castle').length} kale</span>
      <span class="tag">${own.filter(s => s.type === 'village').length} köy</span>
      ${f.alive ? '' : '<span class="tag war">Yıkıldı</span>'}
    </div>
    <table class="tbl">
      <tr><td>Hazine</td><td class="n">${fmt(f.treasury)} dinar</td></tr>
      <tr><td>Sahadaki asker</td><td class="n">${fmt(troops)}</td></tr>
      <tr><td>Askerî güç</td><td class="n">${fmt(factionStrength(f.id))}</td></tr>
      <tr><td>Lordlar</td><td class="n">${lords.length}</td></tr>
      <tr><td>Savaşta</td><td>${wars.length ? wars.map(w => `<span class="tag war">${esc(S.factions[w].short)}</span>`).join(' ') : '<span class="tag peace">Barış</span>'}</td></tr>
    </table>
  </div>
  <div class="card"><h3>Düzenle</h3>
    ${fText('Krallık adı', 'faction', f.id, 'name')}
    ${fText('Kısa ad', 'faction', f.id, 'short')}
    ${fText('Hükümdar unvanı', 'faction', f.id, 'rulerTitle')}
    ${fText('Lord unvanı', 'faction', f.id, 'lordTitle')}
    ${fSel('Hükümdar', 'faction', f.id, 'kingId', lords.map(l => ({ v: l.id, t: `${l.title} ${l.name}` })))}
    ${fSel('Kültür (birlik ağacı)', 'faction', f.id, 'culture', [
      { v:'sw', t:'Swadya' }, { v:'vg', t:'Vaegir' }, { v:'kh', t:'Kherjit' },
      { v:'nd', t:'Nord' }, { v:'rh', t:'Rodok' }, { v:'sr', t:'Sarranid' }])}
    <div class="grid2">
      ${fNum('Hazine', 'faction', f.id, 'treasury', 0, 99999999, 500)}
      ${fNum('Saldırganlık (0-1.5)', 'faction', f.id, 'aggr', 0, 1.5, 0.05)}
    </div>
    <label class="f"><span>Renk</span><input type="color" value="${f.color}" data-edit="faction|${f.id}|color|color"></label>
    <div class="btnrow">
      <button class="btn sm" data-act="facLords" data-id="${f.id}">Lordlarını listele</button>
      <button class="btn sm" data-act="facTreasury" data-id="${f.id}">Hazineye 50.000 ekle</button>
      <button class="btn sm danger" data-act="facDestroy" data-id="${f.id}">Krallığı yık</button>
    </div>
  </div>`;
}

/* ---------- GENEL ---------- */
function renderOvw() {
  const live = Object.values(S.factions).filter(f => !f.isBandit);
  const rows = live.map(f => {
    const own = ownSettlements(f.id);
    const troops = S.order.parties.map(i => S.parties[i]).filter(p => p && p.faction === f.id).reduce((a, p) => a + stackCount(p.troops), 0);
    return { f, towns: own.filter(s => s.type === 'town').length, castles: own.filter(s => s.type === 'castle').length,
      vil: own.filter(s => s.type === 'village').length, troops, str: factionStrength(f.id), gold: f.treasury };
  }).sort((a, b) => b.str - a.str);
  const maxStr = Math.max(1, ...rows.map(r => r.str));
  const sieges = S.order.settlements.map(i => S.settlements[i]).filter(s => s.besiegedBy);
  const wars = Object.keys(S.wars);

  $('#paneOvw').innerHTML = `
  <div class="card">
    <h3>Kalradya <span class="sub">${dateStr(S.day)}</span></h3>
    <div class="grid3 small">
      <div><div class="muted">Savaşlar</div><b>${wars.length}</b></div>
      <div><div class="muted">Kuşatmalar</div><b>${sieges.length}</b></div>
      <div><div class="muted">Meydan savaşı</div><b>${fmt(S.stats.battles)}</b></div>
      <div><div class="muted">Ordular</div><b>${S.order.parties.length}</b></div>
      <div><div class="muted">Lordlar</div><b>${S.order.lords.filter(i => S.lords[i].state !== 'dead').length}</b></div>
      <div><div class="muted">Geçen gün</div><b>${fmt(S.stats.days)}</b></div>
    </div>
  </div>

  <div class="card">
    <h3>Güç dengesi</h3>
    <table class="tbl">
      <tr><th>Krallık</th><th class="n">Şehir</th><th class="n">Kale</th><th class="n">Asker</th><th style="width:26%">Güç</th></tr>
      ${rows.map(r => `<tr class="clk" data-act="selFac" data-id="${r.f.id}">
        <td>${facDot(r.f.id)} ${esc(r.f.short)}${r.f.alive ? '' : ' <span class="tag war">yıkıldı</span>'}</td>
        <td class="n">${r.towns}</td><td class="n">${r.castles}</td><td class="n">${fmt(r.troops)}</td>
        <td>${bar(r.str, maxStr, r.f.color)}</td></tr>`).join('')}
    </table>
  </div>

  ${sieges.length ? `<div class="card"><h3>Süren kuşatmalar</h3><div class="list">
    ${sieges.map(s => { const p = S.parties[s.besiegedBy]; return `<div class="item" data-act="selStl" data-id="${s.id}">
      ${facDot(s.faction)}<div class="grow"><div class="t">${esc(s.name)}</div>
      <div class="s">${p ? esc(partyLabel(p)) + ' — ' + esc(facName(p.faction)) : '?'} · %${Math.round(s.siegeProgress)}</div></div></div>`; }).join('')}
  </div></div>` : ''}

  <div class="card"><h3>En güçlü ordular</h3><div class="list">
    ${S.order.parties.map(i => S.parties[i]).filter(p => p && p.type === 'lord')
      .sort((a, b) => stackCount(b.troops) - stackCount(a.troops)).slice(0, 8)
      .map(p => `<div class="item" data-act="selParty" data-id="${p.id}">${facDot(p.faction)}
        <div class="grow"><div class="t">${esc(partyLabel(p))}</div><div class="s">${esc(goalLabel(p))}</div></div>
        <div class="num">${fmt(stackCount(p.troops))}</div></div>`).join('')}
  </div></div>`;
}

/* ---------- KRALLIKLAR ---------- */
function renderFac() {
  const live = Object.values(S.factions).filter(f => !f.isBandit);
  $('#paneFac').innerHTML = live.map(f => {
    const king = f.kingId ? S.lords[f.kingId] : null;
    const own = ownSettlements(f.id);
    const wars = Object.keys(S.factions).filter(o => atWar(f.id, o));
    const lords = S.order.lords.map(i => S.lords[i]).filter(l => l.faction === f.id && l.state !== 'dead');
    return `<div class="card">
      <h3>${facDot(f.id)} ${esc(f.name)} ${f.alive ? '' : '<span class="tag war">yıkıldı</span>'}</h3>
      <div class="small muted" style="margin-bottom:6px">
        ${king ? `${esc(king.title)} ${esc(king.name)}` : 'Hükümdarsız'} · ${lords.length} lord · ${fmt(f.treasury)} dinar
      </div>
      <div class="row wrap" style="gap:4px;margin-bottom:8px">
        <span class="tag">${own.filter(s => s.type === 'town').length} şehir</span>
        <span class="tag">${own.filter(s => s.type === 'castle').length} kale</span>
        <span class="tag">${own.filter(s => s.type === 'village').length} köy</span>
        ${wars.length ? wars.map(w => `<span class="tag war">⚔ ${esc(S.factions[w].short)}</span>`).join('') : '<span class="tag peace">Barış</span>'}
      </div>
      <div class="btnrow">
        <button class="btn sm" data-act="selFac" data-id="${f.id}">Aç ve düzenle</button>
        <button class="btn sm" data-act="facLords" data-id="${f.id}">Lordlar</button>
        <button class="btn sm" data-act="facFocus" data-id="${f.id}">Haritada</button>
      </div>
    </div>`;
  }).join('');
}

/* ---------- LORDLAR ---------- */
function renderLrd() {
  let list = S.order.lords.map(i => S.lords[i]);
  if (ui.lordFac) list = list.filter(l => l.faction === ui.lordFac);
  if (ui.lordState) list = list.filter(l => l.state === ui.lordState);
  if (ui.lordQuery) { const q = ui.lordQuery.toLowerCase(); list = list.filter(l => l.name.toLowerCase().includes(q)); }
  const key = ui.lordSort;
  list.sort((a, b) => {
    if (key === 'name') return a.name.localeCompare(b.name, 'tr');
    if (key === 'fiefs') return b.fiefs.length - a.fiefs.length;
    if (key === 'troops') return partyTroops(b) - partyTroops(a);
    if (key === 'relKing') return a.relKing - b.relKing;
    return b.renown - a.renown;
  });
  $('#paneLrd').innerHTML = `
  <div class="card">
    <div class="grid2">
      <label class="f"><span>Ara</span><input type="text" id="lrdQ" value="${esc(ui.lordQuery)}" placeholder="Lord adı"></label>
      <label class="f"><span>Sırala</span><select id="lrdSort">
        ${[['renown','Şöhret'],['name','İsim'],['fiefs','Tımar sayısı'],['troops','Asker'],['relKing','Krala bağlılık']]
          .map(o => `<option value="${o[0]}" ${ui.lordSort === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}
      </select></label>
      <label class="f"><span>Krallık</span><select id="lrdFac">
        <option value="">Hepsi</option>${Object.values(S.factions).filter(f => !f.isBandit).map(f => `<option value="${f.id}" ${ui.lordFac === f.id ? 'selected' : ''}>${esc(f.short)}</option>`).join('')}
      </select></label>
      <label class="f"><span>Durum</span><select id="lrdState">
        <option value="">Hepsi</option>
        ${[['active','Sahada'],['prisoner','Esir'],['regroup','Toparlanıyor'],['exile','Sürgün'],['dead','Ölü']]
          .map(o => `<option value="${o[0]}" ${ui.lordState === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}
      </select></label>
    </div>
    <div class="small muted">${list.length} lord listeleniyor</div>
  </div>
  <div class="list">
    ${list.slice(0, 120).map(l => `<div class="item" data-act="selLord" data-id="${l.id}">
      ${facDot(l.faction)}
      <div class="grow"><div class="t">${l.isKing ? '👑 ' : ''}${esc(l.title)} ${esc(l.name)}</div>
      <div class="s">${esc(stateLabel(l))} · ${l.fiefs.length} tımar · şöhret ${fmt(l.renown)}</div></div>
      <div class="num small">${fmt(partyTroops(l))}</div>
    </div>`).join('')}
  </div>`;
  const q = $('#lrdQ');
  if (q) q.oninput = e => { ui.lordQuery = e.target.value; uiDirty.lrd = true; renderUI(true); $('#lrdQ').focus(); };
  const bindSel = (id, prop) => { const el2 = $('#' + id); if (el2) el2.onchange = e => { ui[prop] = e.target.value; uiDirty.lrd = true; renderUI(true); }; };
  bindSel('lrdSort', 'lordSort'); bindSel('lrdFac', 'lordFac'); bindSel('lrdState', 'lordState');
}
function partyTroops(l) { const p = l.partyId ? S.parties[l.partyId] : null; return p ? stackCount(p.troops) : 0; }

/* ---------- YERLEŞİMLER ---------- */
function renderStl() {
  let list = S.order.settlements.map(i => S.settlements[i]);
  if (ui.stlType) list = list.filter(s => s.type === ui.stlType);
  if (ui.stlFac) list = list.filter(s => s.faction === ui.stlFac);
  if (ui.stlQuery) { const q = ui.stlQuery.toLowerCase(); list = list.filter(s => s.name.toLowerCase().includes(q)); }
  const order = { town: 0, castle: 1, village: 2 };
  list.sort((a, b) => order[a.type] - order[b.type] || a.name.localeCompare(b.name, 'tr'));
  $('#paneStl').innerHTML = `
  <div class="card">
    <div class="grid2">
      <label class="f"><span>Ara</span><input type="text" id="stlQ" value="${esc(ui.stlQuery)}" placeholder="Yerleşim adı"></label>
      <label class="f"><span>Tür</span><select id="stlType">
        <option value="">Hepsi</option><option value="town" ${ui.stlType === 'town' ? 'selected' : ''}>Şehirler</option>
        <option value="castle" ${ui.stlType === 'castle' ? 'selected' : ''}>Kaleler</option>
        <option value="village" ${ui.stlType === 'village' ? 'selected' : ''}>Köyler</option></select></label>
      <label class="f" style="grid-column:1/-1"><span>Krallık</span><select id="stlFac">
        <option value="">Hepsi</option>${Object.values(S.factions).filter(f => !f.isBandit).map(f => `<option value="${f.id}" ${ui.stlFac === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}
      </select></label>
    </div>
    <div class="small muted">${list.length} yerleşim</div>
  </div>
  <div class="list">
    ${list.slice(0, 160).map(s => `<div class="item" data-act="selStl" data-id="${s.id}">
      ${facDot(s.faction)}
      <div class="grow"><div class="t">${s.type === 'town' ? '🏛 ' : s.type === 'castle' ? '🏰 ' : '🏘 '}${esc(s.name)}</div>
      <div class="s">${esc(facName(s.faction))}${s.besiegedBy ? ' · kuşatma altında' : ''}${s.raidedUntil > S.day ? ' · yağmalandı' : ''}</div></div>
      <div class="num small">${Math.round(s.prosperity)}</div>
    </div>`).join('')}

  if (q) q.oninput = e => { ui.stlQuery = e.target.value; uiDirty.stl = true; renderUI(true); $('#stlQ').focus(); };

}

/* ---------- DİPLOMASİ ---------- */
function renderDip() {
  const live = Object.values(S.factions).filter(f => !f.isBandit && f.alive);
  const wars = Object.entries(S.wars).map(([k, v]) => {
    const [a, b] = k.split('|'); return { a, b, since: v.since, days: Math.floor(S.day - v.since) };
  }).sort((x, y) => y.days - x.days);
  $('#paneDip').innerHTML = `
  <div class="card">
    <h3>Süren savaşlar <span class="sub">${wars.length}</span></h3>
    ${wars.length ? `<div class="list">${wars.map(w => `<div class="item">
      ${facDot(w.a)}<div class="grow"><div class="t">${esc(S.factions[w.a].short)} ⚔ ${esc(S.factions[w.b].short)}</div>
      <div class="s">${w.days} gündür sürüyor</div></div>
      <button class="btn sm" data-act="peace" data-a="${w.a}" data-b="${w.b}">Barış</button></div>`).join('')}</div>`
    : '<div class="small muted">Kalradya şu an barış içinde.</div>'}
  </div>

  <div class="card">
    <h3>Savaş / barış tablosu <span class="sub">hücreye tıkla, durumu değiştir</span></h3>
    <div style="overflow-x:auto">
    <table class="tbl"><tr><th></th>${live.map(f => `<th class="n" title="${esc(f.name)}">${esc(f.short.slice(0, 4))}</th>`).join('')}</tr>
      ${live.map(a => `<tr><td><b>${facDot(a.id)} ${esc(a.short)}</b></td>${live.map(b => {
        if (a.id === b.id) return '<td class="n muted">—</td>';
        const w = atWar(a.id, b.id);
        return `<td class="n"><span class="tag ${w ? 'war' : 'peace'}" style="cursor:pointer" data-act="toggleWar" data-a="${a.id}" data-b="${b.id}">${w ? '⚔' : '🕊'}</span></td>`;
      }).join('')}</tr>`).join('')}

  </div>

  <div class="card">
    <h3>İlişki puanları</h3>
    <div style="overflow-x:auto">
    <table class="tbl"><tr><th></th>${live.map(f => `<th class="n">${esc(f.short.slice(0, 4))}</th>`).join('')}</tr>
      ${live.map(a => `<tr><td>${facDot(a.id)} ${esc(a.short)}</td>${live.map(b => a.id === b.id ? '<td class="n muted">—</td>'
        : `<td class="n" style="color:${(a.rel[b.id] || 0) < 0 ? 'var(--danger)' : 'var(--success)'}">${Math.round(a.rel[b.id] || 0)}</td>`).join('')}</tr>`).join('')}
    </table></div>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm" data-act="allPeace">Tüm savaşları bitir</button>
      <button class="btn sm danger" data-act="allWar">Herkesi savaştır</button>
    </div>
  </div>`;
}

function partyOptions(selIndex) {
  const list = S.order.parties.map(i => S.parties[i]).filter(Boolean)
    .sort((a, b) => stackCount(b.troops) - stackCount(a.troops)).slice(0, 120);
  let pickIdx = selIndex || 0;
  if (selIndex === 1) {
    const first = list[0];
    const other = list.findIndex(p => first && p.faction !== first.faction);
    pickIdx = other > 0 ? other : Math.min(1, list.length - 1);
  }
  return list.map((p, i) => `<option value="${p.id}" ${i === pickIdx ? 'selected' : ''}>${esc(partyLabel(p))} — ${esc(S.factions[p.faction] ? S.factions[p.faction].short : '?')} (${stackCount(p.troops)})</option>`).join('');
}

function troopEditor(kind, id) {
  const target = kind === 'party' ? S.parties[id] : S.settlements[id];
  if (!target) return;
  const stack = kind === 'party' ? target.troops : target.garrison;
  const culture = S.factions[target.faction] ? S.factions[target.faction].culture : 'sw';
  const render = () => {
    const rows = Object.entries(stack).filter(e => e[1] > 0)
      .sort((a, b) => (TROOPS[b[0]]?.tier || 0) - (TROOPS[a[0]]?.tier || 0))
      .map(([k, v]) => `<tr><td>${esc(TROOPS[k] ? TROOPS[k].name : k)}</td><td class="small muted">T${TROOPS[k] ? TROOPS[k].tier : '?'}</td>
        <td class="n"><input type="number" value="${v}" min="0" max="99999" data-troop="${k}" style="width:88px;text-align:right"></td></tr>`).join('');
    const opts = Object.values(TROOPS).sort((a, b) => a.culture.localeCompare(b.culture) || a.tier - b.tier)
      .map(t => `<option value="${t.id}">${esc(t.name)} (T${t.tier})</option>`).join('');
    $('#dlgBody').innerHTML = `
      <div class="small muted" style="margin-bottom:8px">${esc(kind === 'party' ? partyLabel(target) : target.name)} — toplam <b>${fmt(stackCount(stack))}</b> asker, güç ${fmt(stackPower(stack))}</div>
      <table class="tbl">${rows || '<tr><td class="small muted">Boş</td></tr>'}</table>
      <div class="row" style="gap:6px;margin-top:10px">
        <select id="teType" class="grow">${opts}</select>
        <input type="number" id="teN" value="20" min="1" max="9999" style="width:90px">
        <button class="btn sm" id="teAdd">Ekle</button>
      </div>
      <div class="btnrow" style="margin-top:8px">
        <button class="btn sm" id="teFill">Kültür ordusu ekle (+100)</button>
        <button class="btn sm" id="teUp">Hepsini terfi ettir</button>
        <button class="btn sm danger" id="teClear">Boşalt</button>
      </div>`;
    $$('#dlgBody input[data-troop]').forEach(inp => {
      inp.onchange = e => {
        const k = e.target.dataset.troop, v = Math.max(0, Math.round(+e.target.value || 0));
        if (v === 0) delete stack[k]; else stack[k] = v;
        uiDirty.sel = true; render(); requestDraw();
      };
    });
    $('#teAdd').onclick = () => { const k = $('#teType').value, n = Math.max(1, +$('#teN').value || 1);
      stack[k] = (stack[k] || 0) + n; render(); uiDirty.sel = true; requestDraw(); };
    $('#teFill').onclick = () => { stackMerge(stack, makeStack(culture, 100, 0.55)); render(); uiDirty.sel = true; requestDraw(); };
    $('#teUp').onclick = () => { for (let i = 0; i < 12; i++) upgradeStack(stack, null); render(); uiDirty.sel = true; requestDraw(); };
    $('#teClear').onclick = () => { Object.keys(stack).forEach(k => delete stack[k]); render(); uiDirty.sel = true; requestDraw(); };
  };
  openDlg(kind === 'party' ? 'Askerleri düzenle' : 'Garnizonu düzenle', '', [{ t: 'Tamam', cls: 'primary', fn: () => { dlg.close(); renderUI(true); } }]);
  render();
}

/* ---------- komut dağıtıcı ---------- */
const ACTIONS = {
  focus: () => focusSel(),
  selStl: (el2) => select({ type: 'settlement', id: el2.dataset.id }),
  selLord: (el2) => select({ type: 'lord', id: el2.dataset.id }),
  selParty: (el2) => select({ type: 'party', id: el2.dataset.id }),
  selFac: (el2) => { S.sel = { type: 'faction', id: el2.dataset.id }; uiDirty.sel = true; setTab('sel'); },
  toggleFac: (el2) => { const f = el2.dataset.id; S.hidden[f] = !S.hidden[f]; renderLegend(); requestDraw(); },
  facFocus: (el2) => {
    const own = ownSettlements(el2.dataset.id);
    if (!own.length) return;
    const cx = own.reduce((a, s) => a + s.x, 0) / own.length, cy = own.reduce((a, s) => a + s.y, 0) / own.length;
    focusOn(cx, cy, 1.1); if (window.innerWidth <= 900) $('#side').classList.remove('open');
  },
  facLords: (el2) => { ui.lordFac = el2.dataset.id; ui.lordState = ''; uiDirty.lrd = true; setTab('lrd'); },
  facTreasury: (el2) => { const f = S.factions[el2.dataset.id]; if (f) { f.treasury += 50000; toast('Hazineye 50.000 dinar eklendi'); uiDirty.sel = true; renderUI(true); } },
  facDestroy: (el2) => {
    const f = S.factions[el2.dataset.id]; if (!f) return;
    openDlg('Krallığı yık', `<div>${esc(f.name)} krallığının tüm toprakları dağıtılacak ve krallık haritadan silinecek. Emin misin?</div>`,
      [{ t: 'Yık', cls: 'danger', fn: () => {
        const others = Object.values(S.factions).filter(o => !o.isBandit && o.alive && o.id !== f.id);
        ownSettlements(f.id).forEach(s => { if (others.length) changeOwner(s, pick(others).id, null); });
        checkFactionAlive(f.id); dlg.close(); territoryDirty = true; renderUI(true); requestDraw();
      } }, { t: 'Vazgeç', fn: () => dlg.close() }]);
  },
  lordHeal: (el2) => {
    const l = S.lords[el2.dataset.id]; if (!l) return;
    let p = l.partyId ? S.parties[l.partyId] : null;
    if (!p) { if (l.state === 'prisoner' || l.state === 'dead') { l.state = 'active'; } p = spawnLordParty(l); }
    const cap = lordPartyCap(l), cnt = stackCount(p.troops);
    if (cnt < cap) stackMerge(p.troops, makeStack(S.factions[l.faction].culture, cap - cnt, 0.5));
    p.morale = 100; toast('Ordu tamamlandı'); uiDirty.sel = true; renderUI(true); requestDraw();
  },
  lordElite: (el2) => {
    const l = S.lords[el2.dataset.id]; if (!l) return;
    const p = l.partyId ? S.parties[l.partyId] : spawnLordParty(l);
    stackMerge(p.troops, makeStack(S.factions[l.faction].culture, 60, 0.95));
    toast('Seçkin birlikler katıldı'); uiDirty.sel = true; renderUI(true); requestDraw();
  },
  lordFree: (el2) => { const l = S.lords[el2.dataset.id]; if (l) { releaseLord(l); renderUI(true); } },
  lordSpawn: (el2) => { const l = S.lords[el2.dataset.id]; if (l && !l.partyId) { l.state = 'active'; spawnLordParty(l); renderUI(true); requestDraw(); } },
  lordKill: (el2) => {
    const l = S.lords[el2.dataset.id]; if (!l) return;
    if (l.partyId) removeParty(l.partyId);
    l.partyId = null; l.state = 'dead';
    l.fiefs.slice().forEach(f => { const s = S.settlements[f]; if (s) { s.lordId = null; } });

function createLord(faction) {
  const fac = S.factions[faction];
  const pool = LORD_NAMES[faction] || LORD_NAMES.swadia;
  const used = new Set(S.order.lords.map(i => S.lords[i].name));
  const nm = pool.find(n => !used.has(n)) || pool[ri(0, pool.length - 1)] + ' ' + ri(2, 9);
  const id = uid('l');
  S.lords[id] = {
    id, name: nm, faction, title: fac.lordTitle, isKing: false, personality: pick(PERSONALITIES).id,
    renown: ri(100, 400), relKing: ri(0, 40), gold: ri(1000, 5000),
    skillTactics: ri(2, 6), skillLeadership: ri(3, 8), fiefs: [], partyId: null,
    state: 'active', prisonerOf: null, freeAt: 0, wounded: 0, kills: 0, battlesWon: 0, battlesLost: 0
  };
  S.order.lords.push(id);
  uiDirty.lrd = true;
  return S.lords[id];
}

function makeKing(l) {
  const fac = S.factions[l.faction]; if (!fac) return;
  const old = fac.kingId ? S.lords[fac.kingId] : null;
  if (old && old !== l) { old.isKing = false; old.title = fac.lordTitle; old.relKing = -30; }
  l.isKing = true; l.title = fac.rulerTitle; l.relKing = 100;
  fac.kingId = l.id;
  addLog(`👑 ${l.title} ${l.name}, ${fac.name} tahtına oturdu.`, 'siege');
  uiDirty.fac = true; uiDirty.lrd = true; uiDirty.sel = true;
}
function succession(factionId) {
  const fac = S.factions[factionId]; if (!fac) return;
  const cands = S.order.lords.map(i => S.lords[i]).filter(l => l.faction === factionId && l.state !== 'dead');
  if (!cands.length) { fac.kingId = null; checkFactionAlive(factionId); return; }
  cands.sort((a, b) => (b.renown + b.fiefs.length * 60) - (a.renown + a.fiefs.length * 60));
  makeKing(cands[0]);
}

function skipDays(n) {
  const wasSpeed = S.speed;
  const stepsPerDay = 4;
  for (let i = 0; i < n * stepsPerDay; i++) stepWorld(1 / stepsPerDay);
  S.speed = wasSpeed;
  uiDirty.sel = uiDirty.ovw = uiDirty.fac = uiDirty.lrd = uiDirty.stl = uiDirty.dip = true;
  territoryDirty = true;
  renderUI(true); requestDraw();
  toast(`${n} gün ilerlendi`);
}

/* ---------- düzenleme uygulaması ---------- */
function applyEdit(kind, id, key, raw, type) {
  const obj = getEnt(kind, id); if (!obj) return;
  let v = raw;
  if (type === 'num') v = +raw;
  if (type === 'num' && isNaN(v)) return;

  if (kind === 'lord' && key === 'faction' && v !== obj.faction) { transferLord(obj, v); renderUI(true); requestDraw(); return; }
  if (kind === 'lord' && key === 'state') {
    obj.state = v;
    if (v === 'dead' || v === 'prisoner' || v === 'exile') { if (obj.partyId) removeParty(obj.partyId); obj.partyId = null; }
    if (v === 'active' && !obj.partyId) spawnLordParty(obj);
    if (v === 'regroup') obj.freeAt = S.day + 2;
    renderUI(true); requestDraw(); return;
  }
  if (kind === 'settlement' && key === 'faction' && v !== obj.faction) {
    changeOwner(obj, v, null); territoryDirty = true; renderUI(true); requestDraw(); return;
  }
  if (kind === 'settlement' && key === 'lordId') {
    const l = v ? S.lords[v] : null;
    if (l) grantFief(obj, l);
    else { if (obj.lordId && S.lords[obj.lordId]) S.lords[obj.lordId].fiefs = S.lords[obj.lordId].fiefs.filter(f => f !== obj.id); obj.lordId = null; }
    renderUI(true); return;
  }
  if (kind === 'settlement' && key === 'type') { obj.type = v; territoryDirty = true; rebuildSettlementNodes(); requestDraw(); renderUI(true); return; }
  if (kind === 'faction' && key === 'kingId') { const l = S.lords[v]; if (l) makeKing(l); renderUI(true); return; }
  if (kind === 'faction' && key === 'color') { obj.color = v; territoryDirty = true; requestDraw(); renderLegend(); return; }

  obj[key] = v;
  if (kind === 'settlement' && (key === 'x' || key === 'y')) territoryDirty = true;
  uiDirty.sel = true; uiDirty.ovw = true;
  requestDraw();
}

function transferLord(l, toFaction) {
  const from = l.faction;
  l.faction = toFaction;
  l.title = l.isKing ? S.factions[toFaction].rulerTitle : S.factions[toFaction].lordTitle;
  if (l.partyId && S.parties[l.partyId]) S.parties[l.partyId].faction = toFaction;
  l.fiefs.slice().forEach(f => { const s = S.settlements[f]; if (s) { s.faction = toFaction; if (s.type !== 'village') {
    S.order.settlements.forEach(i => { const v = S.settlements[i]; if (v.parentId === s.id) v.faction = toFaction; }); } } });
  if (l.isKing) {
    const oldFac = S.factions[from];
    if (oldFac && oldFac.kingId === l.id) { l.isKing = false; l.title = S.factions[toFaction].lordTitle; succession(from); }
  }
  addLog(`${l.title} ${l.name} artık ${facName(toFaction)} hizmetinde.`, '');
  territoryDirty = true; checkFactionAlive(from);
  uiDirty.lrd = true; uiDirty.fac = true;
}

const SAVE_KEY = 'kalradya_save_v1';

function snapshot() {
  return JSON.stringify({
    v: 1, uidn: UIDN,
    day: S.day, factions: S.factions, settlements: S.settlements, lords: S.lords,
    parties: S.parties, order: S.order, wars: S.wars, log: S.log, opts: S.opts, stats: S.stats
  });
}
function restore(json) {
  const d = typeof json === 'string' ? JSON.parse(json) : json;
  if (!d || !d.settlements) throw new Error('Geçersiz kayıt');
  S.day = d.day; S.factions = d.factions; S.settlements = d.settlements; S.lords = d.lords;
  S.parties = d.parties; S.order = d.order; S.wars = d.wars || {}; S.log = d.log || [];
  S.opts = Object.assign(S.opts, d.opts || {}); S.stats = d.stats || S.stats;
  S.sel = null;
  UIDN = Math.max(d.uidn || 0, ...S.order.parties.map(x => +String(x).replace(/\D/g, '') || 0), 0);
  territoryDirty = true; logDirty = true;
  Object.keys(uiDirty).forEach(k => uiDirty[k] = true);
  initSvg(); requestDraw(); renderUI(true);
}
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, snapshot()); toast('Oyun kaydedildi'); }
  catch (e) { toast('Kayıt başarısız: ' + e.message); }
}
function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) { toast('Kayıt bulunamadı'); return; }
  try { restore(raw); toast('Kayıt yüklendi'); } catch (e) { toast('Yükleme hatası: ' + e.message); }
}
function exportGame() {
  const blob = new Blob([snapshot()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kalradya-${shortDate(S.day).replace(/\./g, '-')}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importGame() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { restore(r.result); toast('Dosya yüklendi'); } catch (e) { toast('Hatalı dosya: ' + e.message); } };
    r.readAsText(f);
  };
  inp.click();
}
function newWorld(seed) {
  buildWorld(seed);
  S.day = 150; S.sel = null; S.hidden = {};
  territoryDirty = true; logDirty = true;
  Object.keys(uiDirty).forEach(k => uiDirty[k] = true);
  initSvg(); fitView(); requestDraw(); renderUI(true);
  toast('Yeni Kalradya kuruldu');
}

svg.addEventListener('pointerdown', onPointerDown);

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.14 : 1 / 1.14);
}, { passive: false });

/* dokunmatik pinch */
const touches = new Map();
svg.addEventListener('pointerdown', e => touches.set(e.pointerId, e));
svg.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, e);
  if (touches.size === 2) {
    dragging = false;
    const [a, b] = Array.from(touches.values());
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const rect = svg.getBoundingClientRect();
    const mx = (a.clientX + b.clientX) / 2 - rect.left, my = (a.clientY + b.clientY) / 2 - rect.top;
    if (pinchDist) zoomAt(mx, my, d / pinchDist);
    pinchDist = d;
  }
});
const endTouch = e => { touches.delete(e.pointerId); if (touches.size < 2) pinchDist = 0; };
svg.addEventListener('pointerup', endTouch);
svg.addEventListener('pointercancel', endTouch);

window.addEventListener('resize', () => { resizeCanvas(); clampView(); requestDraw(); });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') { e.preventDefault(); setSpeed(S.speed > 0 ? 0 : 1); }
  else if (e.key === '1') setSpeed(1);
  else if (e.key === '2') setSpeed(3);
  else if (e.key === '3') setSpeed(8);
  else if (e.key === '4') setSpeed(20);
  else if (e.key === '0') setSpeed(0);
  else if (e.key.toLowerCase() === 'f') { fitView(); requestDraw(); }
  else if (e.key.toLowerCase() === 's') { e.preventDefault(); saveGame(); }
});

/* ---------------- ana döngü ---------------- */
let lastFrame = performance.now();
let acc = 0;
function frame(now) {
  const dtReal = Math.min(0.25, (now - lastFrame) / 1000);
  lastFrame = now;
  if (S.speed > 0) {
    let days = dtReal * S.speed;
    let guard = 0;
    while (days > 0 && guard++ < 200) {
      const st = Math.min(0.2, days);
      stepWorld(st);
      days -= st;
    }
  }
  drawCanvas(); updateSvg(); renderUI();
  requestAnimationFrame(frame);
}

  } catch (e) {}

  buildWorld(20250810);
  buildTerrain();
  territoryDirty = true;
  initSvg();
  fitView();
  setSpeed(1);
  setTab('sel');
  renderUI(true);
  requestDraw();
  requestAnimationFrame(frame);
  booted = true;
  if (localStorage.getItem(SAVE_KEY)) addLog('Kayıtlı bir oyun bulundu — Müdahale sekmesinden yükleyebilirsin.', '');
}
boot();

/* çevrimdışı önbellek */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('warband-sw.js').catch(function () {});
}
</script>
