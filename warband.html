const cv = document.getElementById('mapCanvas');
const cx2 = cv.getContext('2d');
const svg = document.getElementById('mapSvg');
const SVGNS = 'http://www.w3.org/2000/svg';

const view = { x: 0, y: 0, k: 1, minK: 0.4, maxK: 6 };
let terrainCv = null, territoryCv = null, territoryDirty = true;
let logDirty = true;
const uiDirty = { sel: true, ovw: true, fac: true, lrd: true, stl: true, dip: true, god: true };

/* ---------- gürültü ---------- */
function hash2(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y) { return vnoise(x, y) * 0.6 + vnoise(x * 2.1, y * 2.1) * 0.3 + vnoise(x * 4.3, y * 4.3) * 0.1; }

function mixHex(h1, h2, t) {
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const a = p(h1), b = p(h2);
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)})`;
}
function hexRGBA(h, a) {
  const r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---------- arazi (bir kez çizilir) ---------- */
function buildTerrain() {
  terrainCv = document.createElement('canvas');
  terrainCv.width = MAP_W; terrainCv.height = MAP_H;
  const g = terrainCv.getContext('2d');

  /* deniz */
  const sg = g.createLinearGradient(0, 0, MAP_W, MAP_H);
  sg.addColorStop(0, '#12212f'); sg.addColorStop(0.5, '#16283a'); sg.addColorStop(1, '#0f1e2b');
  g.fillStyle = sg; g.fillRect(0, 0, MAP_W, MAP_H);
  /* deniz dokusu */
  g.globalAlpha = 0.06; g.strokeStyle = '#7fb6d8'; g.lineWidth = 1;
  for (let y = 0; y < MAP_H; y += 14) {
    g.beginPath();
    for (let x = 0; x <= MAP_W; x += 16) g.lineTo(x, y + Math.sin((x + y) / 26) * 3);
    g.stroke();
  }
  g.globalAlpha = 1;

  /* kara maskesi */
  const path = new Path2D();
  COAST.forEach((p, i) => i ? path.lineTo(p[0], p[1]) : path.moveTo(p[0], p[1]));
  path.closePath();

  g.save();
  g.clip(path);
  const CELL = 4;
  for (let y = 0; y < MAP_H; y += CELL) {
    for (let x = 0; x < MAP_W; x += CELL) {
      let tot = 0; const acc = {};
      for (const b of BIOMES) {
        const d = dist2(b.x, b.y, x, y);
        const w = Math.max(0, 1 - d / b.r);
        if (w > 0) { acc[b.k] = (acc[b.k] || 0) + w * w; tot += w * w; }
      }
      let col;
      if (!tot) col = BIOME_COLORS.plain[0];
      else {
        const sorted = Object.entries(acc).sort((a, b) => b[1] - a[1]);
        const n = fbm(x / 60, y / 60);
        const k1 = sorted[0][0], k2 = sorted[1] ? sorted[1][0] : k1;
        const t = sorted[1] ? clamp(sorted[1][1] / (sorted[0][1] + sorted[1][1]) * 1.6 + (n - 0.5) * 0.5, 0, 1) : 0;
        const c1 = BIOME_COLORS[k1][n > 0.5 ? 0 : 1];
        const c2 = BIOME_COLORS[k2][n > 0.5 ? 0 : 1];
        col = mixHex(c1.length === 7 ? c1 : '#7d8f4e', c2.length === 7 ? c2 : '#7d8f4e', t);
      }
      g.fillStyle = col;
      g.fillRect(x, y, CELL + 1, CELL + 1);
    }
  }
  /* doku lekeleri */
  g.globalAlpha = 0.10;
  for (let i = 0; i < 2600; i++) {
    const x = rnd() * MAP_W, y = rnd() * MAP_H;
    g.fillStyle = fbm(x / 25, y / 25) > 0.5 ? '#000' : '#fff';
    g.fillRect(x, y, 2 + rnd() * 3, 2 + rnd() * 3);
  }
  g.globalAlpha = 1;

  /* ormanlar */
  g.globalAlpha = 0.55;
  for (let i = 0; i < 1500; i++) {
    const x = rnd() * MAP_W, y = rnd() * MAP_H;
    const b = biomeAt(x, y);
    if (b !== 'forest' && !(b === 'plain' && rnd() < 0.18) && !(b === 'hills' && rnd() < 0.12)) continue;
    if (fbm(x / 40, y / 40) < 0.42) continue;
    g.fillStyle = '#2f4a28';
    g.beginPath(); g.moveTo(x, y - 4); g.lineTo(x + 2.6, y + 2); g.lineTo(x - 2.6, y + 2); g.closePath(); g.fill();
  }
  g.globalAlpha = 1;

  /* nehirler */
  g.strokeStyle = 'rgba(90,140,180,.75)'; g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round';
  RIVERS.forEach(r => {
    g.beginPath();
    r.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.stroke();
  });

  /* dağ sıraları */
  MOUNTAINS.forEach(m => {
    for (let i = 0; i < m.n; i++) {
      const t = i / Math.max(1, m.n - 1);
      const x = m.x + (t - 0.5) * m.w + rf(-8, 8);
      const y = m.y + Math.sin(t * 3.1) * 16 + rf(-7, 7);
      const h = 12 + rnd() * 9, w = h * 0.95;
      g.fillStyle = '#6a6152';
      g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + w, y + h * 0.45); g.lineTo(x - w, y + h * 0.45); g.closePath(); g.fill();
      g.fillStyle = '#efeee8';
      g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + w * 0.34, y - h * 0.34); g.lineTo(x - w * 0.34, y - h * 0.34); g.closePath(); g.fill();
      g.fillStyle = 'rgba(0,0,0,.22)';
      g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + w, y + h * 0.45); g.lineTo(x + w * 0.1, y + h * 0.45); g.closePath(); g.fill();
    }
  });
  g.restore();

  /* kıyı çizgisi */
  g.strokeStyle = 'rgba(20,32,44,.85)'; g.lineWidth = 2.2; g.stroke(path);
  g.strokeStyle = 'rgba(255,255,255,.10)'; g.lineWidth = 5; g.stroke(path);
}

/* ---------- krallık sınırları ---------- */
function buildTerritory() {
  if (!territoryCv) {
    territoryCv = document.createElement('canvas');
    territoryCv.width = MAP_W; territoryCv.height = MAP_H;
  }
  const g = territoryCv.getContext('2d');
  g.clearRect(0, 0, MAP_W, MAP_H);

  const CELL = 3, cols = Math.ceil(MAP_W / CELL), rows = Math.ceil(MAP_H / CELL);
  const owners = new Array(cols * rows).fill(null);
  const best = new Float32Array(cols * rows);

  const stl = S.order.settlements.map(id => S.settlements[id])
    .filter(s => s && S.factions[s.faction] && !S.factions[s.faction].isBandit);
  const reach = s => s.type === 'town' ? 175 : s.type === 'castle' ? 120 : 62;

  /* her yerleşim kendi çevresine "etki" saçar (yakın olan kazanır) */
  stl.forEach(s => {
    const rr = reach(s);
    const w = s.type === 'town' ? 1.25 : s.type === 'castle' ? 1.1 : 0.92;
    const c0 = Math.max(0, Math.floor((s.x - rr) / CELL)), c1 = Math.min(cols - 1, Math.ceil((s.x + rr) / CELL));
    const r0 = Math.max(0, Math.floor((s.y - rr) / CELL)), r1 = Math.min(rows - 1, Math.ceil((s.y + rr) / CELL));
    for (let r = r0; r <= r1; r++) {
      const y = r * CELL + CELL / 2;
      for (let c = c0; c <= c1; c++) {
        const x = c * CELL + CELL / 2;
        const d = Math.hypot(s.x - x, s.y - y);
        if (d > rr) continue;
        const sc = (1 - d / rr) * w;
        const i = r * cols + c;
        if (sc > best[i]) { best[i] = sc; owners[i] = s.faction; }
      }
    }
  });
  /* denizi ayıkla */
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      if (owners[i] && !isLand(c * CELL + CELL / 2, r * CELL + CELL / 2)) owners[i] = null;
    }
  }

  /* dolgu: düşük çözünürlüklü tampon büyütülerek yumuşatılır */
  const small = document.createElement('canvas');
  small.width = cols; small.height = rows;
  const sg = small.getContext('2d');
  const img = sg.createImageData(cols, rows);
  const rgbCache = {};
  for (let i = 0; i < owners.length; i++) {
    const f = owners[i]; if (!f) continue;
    let col = rgbCache[f];
    if (!col) {
      const h = S.factions[f].color;
      col = rgbCache[f] = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    }
    const o = i * 4;
    img.data[o] = col[0]; img.data[o + 1] = col[1]; img.data[o + 2] = col[2]; img.data[o + 3] = 72;
  }
  sg.putImageData(img, 0, 0);
  g.imageSmoothingEnabled = true;
  g.drawImage(small, 0, 0, MAP_W, MAP_H);

  /* sınır çizgileri */
  g.lineWidth = 2.4; g.lineCap = 'round';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const f = owners[r * cols + c];
      const rt = c + 1 < cols ? owners[r * cols + c + 1] : null;
      const dn = r + 1 < rows ? owners[(r + 1) * cols + c] : null;
      if (f !== rt) {
        const col = f || rt;
        if (col) { g.strokeStyle = hexRGBA(S.factions[col].color, 0.8);
          g.beginPath(); g.moveTo((c + 1) * CELL, r * CELL); g.lineTo((c + 1) * CELL, (r + 1) * CELL); g.stroke(); }
      }
      if (f !== dn) {
        const col = f || dn;
        if (col) { g.strokeStyle = hexRGBA(S.factions[col].color, 0.8);
          g.beginPath(); g.moveTo(c * CELL, (r + 1) * CELL); g.lineTo((c + 1) * CELL, (r + 1) * CELL); g.stroke(); }
      }
    }
  }
  territoryDirty = false;
}

/* ---------- canvas çizimi ---------- */
let dpr = Math.min(2, window.devicePixelRatio || 1);
function resizeCanvas() {
  const w = cv.clientWidth, h = cv.clientHeight;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(w * dpr));
  cv.height = Math.max(1, Math.round(h * dpr));
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
}
function fitView() {
  const w = cv.clientWidth, h = cv.clientHeight;
  const k = Math.min(w / MAP_W, h / MAP_H) * 0.98;
  view.k = k; view.minK = k * 0.85; view.maxK = k * 8;
  view.x = (w - MAP_W * k) / 2; view.y = (h - MAP_H * k) / 2;
}
function clampView() {
  const w = cv.clientWidth, h = cv.clientHeight;
  const mw = MAP_W * view.k, mh = MAP_H * view.k;
  if (mw <= w) view.x = (w - mw) / 2; else view.x = clamp(view.x, w - mw, 0);
  if (mh <= h) view.y = (h - mh) / 2; else view.y = clamp(view.y, h - mh, 0);
}
const w2s = (x, y) => ({ x: x * view.k + view.x, y: y * view.k + view.y });
const s2w = (x, y) => ({ x: (x - view.x) / view.k, y: (y - view.y) / view.k });

function drawCanvas() {
  const w = cv.clientWidth, h = cv.clientHeight;
  cx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx2.clearRect(0, 0, w, h);
  cx2.fillStyle = '#0d1a26'; cx2.fillRect(0, 0, w, h);
  cx2.save();
  cx2.translate(view.x, view.y); cx2.scale(view.k, view.k);
  cx2.imageSmoothingEnabled = true;
  if (terrainCv) cx2.drawImage(terrainCv, 0, 0);
  if (S.layers.borders) {
    if (territoryDirty) buildTerritory();
    if (territoryCv) cx2.drawImage(territoryCv, 0, 0);
  }
  if (S.layers.fog) drawTrails();
  cx2.restore();
}

function drawTrails() {
  cx2.lineWidth = 1.2 / view.k;
  S.order.parties.forEach(id => {
    const p = S.parties[id];
    if (!p || !p.tx || S.hidden[p.faction]) return;
    cx2.strokeStyle = hexRGBA(S.factions[p.faction].color, 0.35);
    cx2.setLineDash([4 / view.k, 4 / view.k]);
    cx2.beginPath(); cx2.moveTo(p.x, p.y); cx2.lineTo(p.tx, p.ty); cx2.stroke();
    cx2.setLineDash([]);
  });
}

/* ---------- SVG işaretleri ---------- */
const svgNodes = { stl: new Map(), party: new Map() };
let gRoot, gStl, gParty, gLbl, gSel;

function initSvg() {
  svg.innerHTML = '';
  gRoot = document.createElementNS(SVGNS, 'g'); svg.appendChild(gRoot);
  gStl = document.createElementNS(SVGNS, 'g'); gRoot.appendChild(gStl);
  gParty = document.createElementNS(SVGNS, 'g'); gRoot.appendChild(gParty);
  gLbl = document.createElementNS(SVGNS, 'g'); gRoot.appendChild(gLbl);
  gSel = document.createElementNS(SVGNS, 'g'); gRoot.appendChild(gSel);
  svgNodes.stl.clear(); svgNodes.party.clear();
  rebuildSettlementNodes();
}

function el(tag, attrs, parent) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function rebuildSettlementNodes() {
  gStl.innerHTML = ''; gLbl.innerHTML = '';
  svgNodes.stl.clear();
  S.order.settlements.forEach(id => {
    const s = S.settlements[id];
    const g = el('g', { class: 'stl', 'data-id': id }, gStl);
    const shape = el('path', { d: '' }, g);
    const inner = el('circle', { r: 2, fill: 'rgba(0,0,0,.55)' }, g);
    const siege = el('path', { d: '', fill: '#d1503f', opacity: 0 }, g);
    const lbl = el('text', { class: 'stl-label', 'text-anchor': 'middle' }, gLbl);
    lbl.textContent = s.name;
    svgNodes.stl.set(id, { g, shape, inner, siege, lbl });
  });
}

function stlPath(type, r) {
  if (type === 'town') return `M ${-r} ${-r} L ${r} ${-r} L ${r} ${r} L ${-r} ${r} Z`;
  if (type === 'castle') return `M 0 ${-r * 1.3} L ${r * 1.15} 0 L 0 ${r * 1.3} L ${-r * 1.15} 0 Z`;
  return `M 0 ${-r} A ${r} ${r} 0 1 0 0.01 ${-r} Z`;
}

function updateSvg() {
  const k = view.k;
  gRoot.setAttribute('transform', `translate(${view.x},${view.y}) scale(${k})`);
  const inv = 1 / k;

  /* yerleşimler */
  S.order.settlements.forEach(id => {
    const s = S.settlements[id];
    const n = svgNodes.stl.get(id); if (!n) return;
    const isVil = s.type === 'village';
    const hidden = (isVil && !S.layers.villages) || S.hidden[s.faction];
    n.g.style.display = hidden ? 'none' : '';
    n.lbl.style.display = hidden || !S.layers.labels ? 'none' : '';
    if (hidden) return;
    const base = s.type === 'town' ? 7 : s.type === 'castle' ? 5.6 : 3.2;
    const r = base * Math.min(1.35, Math.max(0.55, inv * 0.9 + 0.35));
    const col = S.factions[s.faction] ? S.factions[s.faction].color : '#888';
    n.g.setAttribute('transform', `translate(${s.x},${s.y})`);
    n.shape.setAttribute('d', stlPath(s.type, r));
    n.shape.setAttribute('fill', col);
    n.shape.setAttribute('stroke', s.besiegedBy ? '#d1503f' : 'rgba(0,0,0,.75)');
    n.shape.setAttribute('stroke-width', (s.besiegedBy ? 2.2 : 1.2) * inv * 0.8 + 0.3);
    n.inner.setAttribute('r', isVil ? 0 : r * 0.28);
    n.siege.setAttribute('opacity', s.besiegedBy ? 1 : 0);
    if (s.besiegedBy) n.siege.setAttribute('d', `M ${-r * 1.9} ${-r * 1.9} l ${r * 1.1} 0 l 0 ${r * 0.5} l ${-r * 1.1} 0 Z`);
    /* etiket */
    const showLbl = S.layers.labels && (s.type === 'town' || (s.type === 'castle' && k > 0.75) || (isVil && k > 1.5));
    n.lbl.style.display = showLbl ? '' : 'none';
    if (showLbl) {
      const fs = (s.type === 'town' ? 12 : s.type === 'castle' ? 10 : 8) * inv;
      n.lbl.setAttribute('x', s.x);
      n.lbl.setAttribute('y', s.y - r - 3 * inv);
      n.lbl.setAttribute('font-size', fs);
      n.lbl.setAttribute('stroke-width', 3 * inv);
      if (isVil) n.lbl.classList.add('vil-label'); else n.lbl.classList.remove('vil-label');
    }
  });

  /* ordular */
  const seen = new Set();
  S.order.parties.forEach(id => {
    const p = S.parties[id]; if (!p) return;
    seen.add(id);
    let n = svgNodes.party.get(id);
    if (!n) {
      const g = el('g', { class: 'party', 'data-pid': id }, gParty);
      const body = el('path', { d: '' }, g);
      const flag = el('rect', { width: 0, height: 0, opacity: 0 }, g);
      n = { g, body, flag }; svgNodes.party.set(id, n);
    }
    const hidden = !S.layers.parties || S.hidden[p.faction];
    n.g.style.display = hidden ? 'none' : '';
    if (hidden) return;
    const cnt = stackCount(p.troops);
    const sz = clamp(3.2 + Math.sqrt(cnt) * 0.55, 3.2, 11) * Math.min(1.3, Math.max(0.6, inv * 0.9 + 0.35));
    const col = S.factions[p.faction] ? S.factions[p.faction].color : '#999';
    n.g.setAttribute('transform', `translate(${p.x},${p.y})`);
    const lord = p.lordId ? S.lords[p.lordId] : null;
    if (lord && lord.isKing) n.body.setAttribute('d', `M 0 ${-sz * 1.35} L ${sz * 0.42} ${-sz * 0.42} L ${sz * 1.35} ${-sz * 0.42} L ${sz * 0.62} ${sz * 0.3} L ${sz * 0.9} ${sz * 1.25} L 0 ${sz * 0.65} L ${-sz * 0.9} ${sz * 1.25} L ${-sz * 0.62} ${sz * 0.3} L ${-sz * 1.35} ${-sz * 0.42} L ${-sz * 0.42} ${-sz * 0.42} Z`);
    else if (p.type === 'bandit') n.body.setAttribute('d', `M ${-sz} ${-sz * 0.7} L ${sz} ${-sz * 0.7} L ${sz * 0.6} ${sz * 0.9} L ${-sz * 0.6} ${sz * 0.9} Z`);
    else n.body.setAttribute('d', `M 0 ${-sz * 1.15} L ${sz} ${sz * 0.85} L 0 ${sz * 0.35} L ${-sz} ${sz * 0.85} Z`);
    n.body.setAttribute('fill', col);
    n.body.setAttribute('stroke', p.besieging ? '#ffdd88' : 'rgba(0,0,0,.7)');
    n.body.setAttribute('stroke-width', (p.besieging ? 1.6 : 0.9) * inv * 0.9 + 0.2);
  });
  svgNodes.party.forEach((n, id) => { if (!seen.has(id)) { n.g.remove(); svgNodes.party.delete(id); } });

  /* seçim halkası */
  gSel.innerHTML = '';
  const target = selectedPoint();
  if (target) {
    el('circle', { class: 'sel-ring', cx: target.x, cy: target.y, r: 15 * inv, 'stroke-width': 2 * inv }, gSel);
    el('circle', { class: 'sel-ring', cx: target.x, cy: target.y, r: 20 * inv, 'stroke-width': 1 * inv, opacity: .45 }, gSel);
  }
}

function selectedPoint() {
  if (!S.sel) return null;
  if (S.sel.type === 'settlement') { const s = S.settlements[S.sel.id]; return s ? { x: s.x, y: s.y } : null; }
  if (S.sel.type === 'party') { const p = S.parties[S.sel.id]; return p ? { x: p.x, y: p.y } : null; }
  if (S.sel.type === 'lord') {
    const l = S.lords[S.sel.id]; if (!l) return null;
    const p = l.partyId ? S.parties[l.partyId] : null;
    if (p) return { x: p.x, y: p.y };
    const f = l.fiefs.map(f => S.settlements[f]).find(Boolean);
    return f ? { x: f.x, y: f.y } : null;
  }
  return null;
}

/* ---------- gezinme ---------- */
let dragging = false, dragMoved = false, lastPt = null, pinchDist = 0;
function onPointerDown(e) {
  dragging = true; dragMoved = false;
  lastPt = { x: e.clientX, y: e.clientY };
  svg.setPointerCapture && e.pointerId != null && svg.setPointerCapture(e.pointerId);
}
function onPointerMove(e) {
  if (!dragging || !lastPt) return;
  const dx = e.clientX - lastPt.x, dy = e.clientY - lastPt.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
  view.x += dx; view.y += dy; lastPt = { x: e.clientX, y: e.clientY };
  clampView(); requestDraw();
}
function onPointerUp(e) {
  if (dragging && !dragMoved) handleMapClick(e);
  dragging = false; lastPt = null;
}
function zoomAt(sx, sy, factor) {
  const before = s2w(sx, sy);
  view.k = clamp(view.k * factor, view.minK, view.maxK);
  const after = s2w(sx, sy);
  view.x += (after.x - before.x) * view.k;
  view.y += (after.y - before.y) * view.k;
  clampView(); requestDraw();
}
function handleMapClick(e) {
  const rect = svg.getBoundingClientRect();
  const p = s2w(e.clientX - rect.left, e.clientY - rect.top);
  const tol = 14 / view.k;
  let best = null, bestD = 1e9;
  S.order.parties.forEach(id => {
    const q = S.parties[id]; if (!q || !S.layers.parties || S.hidden[q.faction]) return;
    const d = dist2(q.x, q.y, p.x, p.y);
    if (d < tol && d < bestD) { bestD = d; best = { type: 'party', id }; }
  });
  S.order.settlements.forEach(id => {
    const s = S.settlements[id]; if (!s || S.hidden[s.faction]) return;
    if (s.type === 'village' && !S.layers.villages) return;
    const d = dist2(s.x, s.y, p.x, p.y);
    const t = s.type === 'village' ? tol * 0.7 : tol;
    if (d < t && d < bestD * 1.2) { bestD = d; best = { type: 'settlement', id }; }
  });
  select(best);
}

function select(sel) {
  if (sel && sel.type === 'party') {
    const p = S.parties[sel.id];
    if (p && p.lordId) sel = { type: 'lord', id: p.lordId };
  }
  S.sel = sel;
  uiDirty.sel = true;
  if (sel) setTab('sel');
  requestDraw(); renderUI();
}

function focusOn(x, y, k) {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (k) view.k = clamp(k, view.minK, view.maxK);
  view.x = w / 2 - x * view.k; view.y = h / 2 - y * view.k;
  clampView(); requestDraw();
}
function focusSel() {
  const p = selectedPoint();
  if (p) focusOn(p.x, p.y, Math.max(view.k, 1.6));
}

let drawQueued = false;
function requestDraw() {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; drawCanvas(); updateSvg(); });
}
/* =====================================================================
   Bölüm 4: Simülasyon — ordular, savaşlar, kuşatmalar, ekonomi, diplomasi
   ===================================================================== */

const BASE_SPEED = 26;      // gün başına harita birimi
const ENCOUNTER_R = 9;      // karşılaşma yarıçapı
const SIEGE_R = 12;

function partySpeed(p) {
  const n = stackCount(p.troops);
  const mix = stackMix(p.troops);
  const cavRatio = n ? mix.cav / n : 0;
  let s = BASE_SPEED * (1 + cavRatio * 0.35);
  s *= 1 / (1 + n / 320);
  if (p.type === 'bandit') s *= 1.12;
  if (p.morale < 35) s *= 0.9;
  return s;
}
function partyPower(p) {
  const lord = p.lordId ? S.lords[p.lordId] : null;
  let pw = stackPower(p.troops);
  if (lord) pw *= (1 + lord.skillTactics * 0.035);
  pw *= 0.6 + p.morale / 140;
  return pw;
}
function settlementDefPower(s) {
  let pw = stackPower(s.garrison) * (1 + (s.walls / 100) * (s.type === 'town' ? 0.95 : 0.75));
  S.order.parties.forEach(id => {
    const p = S.parties[id];
    if (p && p.goal === 'garrison' && p.targetId === s.id && p.faction === s.faction) pw += partyPower(p);
  });
  return pw;
}

function setSpeed(v) {
  S.speed = v; S.running = v > 0;
  document.querySelectorAll('#spdCtl button').forEach(b => b.classList.toggle('on', +b.dataset.spd === v));
}

/* ---------------- ana adım ---------------- */
function stepWorld(dt) {
  const before = Math.floor(S.day);
  S.day += dt;
  const after = Math.floor(S.day);

  moveParties(dt);
  checkEncounters();
  progressSieges(dt);

  for (let d = before; d < after; d++) dailyTick();
  if (after !== before) { uiDirty.ovw = true; uiDirty.lrd = true; uiDirty.stl = true; uiDirty.sel = true; }
}

/* ---------------- hareket ve hedefler ---------------- */
function moveParties(dt) {
  S.order.parties.forEach(id => {
    const p = S.parties[id]; if (!p) return;
    if (p.cooldown > 0) p.cooldown -= dt;
    if (p.besieging) return;
    if (p.tx == null || p.goal === 'idle') { decideGoal(p); }
    if (p.tx == null) return;
    const d = dist2(p.x, p.y, p.tx, p.ty);
    const step = partySpeed(p) * dt;
    if (d <= step) {
      p.x = p.tx; p.y = p.ty;
      arriveAtTarget(p);
    } else {
      p.x += (p.tx - p.x) / d * step;
      p.y += (p.ty - p.y) / d * step;
    }
  });
}

function ownSettlements(f) { return S.order.settlements.map(i => S.settlements[i]).filter(s => s.faction === f); }
function enemyFactions(f) {
  return Object.keys(S.factions).filter(o => o !== f && atWar(f, o) && S.factions[o].alive);
}

function decideGoal(p) {
  if (p.type === 'bandit') return banditGoal(p);
  const lord = S.lords[p.lordId]; if (!lord) { p.goal = 'idle'; p.tx = null; return; }
  const fac = S.factions[p.faction]; if (!fac) return;
  const pers = PERSONALITIES.find(x => x.id === lord.personality) || PERSONALITIES[0];
  const cnt = stackCount(p.troops);
  const cap = lordPartyCap(lord);

  /* 1) zayıf veya moralsizse tımara dön */
  if (cnt < cap * 0.32 || p.morale < 30) {
    const home = homeSettlement(lord);
    if (home) return setGoal(p, 'return', home);
  }
  /* 2) kendi topraklarında kuşatma varsa savun */
  const besieged = ownSettlements(p.faction).filter(s => s.besiegedBy);
  if (besieged.length) {
    besieged.sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
    const t = besieged[0];
    if (dist2(t.x, t.y, p.x, p.y) < 320 && partyPower(p) > 0) return setGoal(p, 'defend', t);
  }
  /* 3) müttefik bir kuşatma sürüyorsa oraya koş */
  const enemies = enemyFactions(p.faction);
  if (enemies.length && cnt > cap * 0.3) {
    const ongoing = S.order.settlements.map(i => S.settlements[i]).filter(s =>
      s.besiegedBy && S.parties[s.besiegedBy] && S.parties[s.besiegedBy].faction === p.faction && atWar(p.faction, s.faction));
    if (ongoing.length && rnd() < 0.9) {
      ongoing.sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
      return setGoal(p, 'siege', ongoing[0]);
    }
  }
  if (enemies.length) {
    const wantWar = rnd() < clamp(0.42 * pers.aggr * fac.aggr * S.opts.aggression + (lord.isKing ? 0.15 : 0), 0.05, 0.95);
    if (wantWar && cnt > cap * 0.5) {
      const target = fac.target && S.settlements[fac.target] && enemies.includes(S.settlements[fac.target].faction)
        ? S.settlements[fac.target] : pickCampaignTarget(p.faction, enemies);
      if (target) {
        /* güçlü ordular kuşatır, zayıflar köy yağmalar */
        const myPw = partyPower(p);
        if (target.type !== 'village' && myPw > settlementDefPower(target) * 0.45) return setGoal(p, 'siege', target);
        const vil = pickRaidTarget(p, enemies);
        if (vil && pers.greed > 0.65) return setGoal(p, 'raid', vil);
        return setGoal(p, 'siege', target);
      }
    }
    const vil = pickRaidTarget(p, enemies);
    if (vil && rnd() < 0.5) return setGoal(p, 'raid', vil);
  }
  /* 4) barışta: devriye / asker topla */
  if (cnt < cap * 0.85 && rnd() < 0.7) {
    const home = homeSettlement(lord) || nearestOwn(p);
    if (home) return setGoal(p, 'return', home);
  }
  const own = ownSettlements(p.faction).filter(s => s.type !== 'village');
  if (own.length) return setGoal(p, 'patrol', pick(own));
  p.goal = 'idle'; p.tx = null;
}

function homeSettlement(lord) {
  const f = lord.fiefs.map(x => S.settlements[x]).filter(s => s && s.faction === lord.faction);
  return f.find(s => s.type === 'town') || f.find(s => s.type === 'castle') || f[0]
    || S.settlements[S.factions[lord.faction] && S.factions[lord.faction].capital]
    || ownSettlements(lord.faction)[0];
}
function nearestOwn(p) {
  const own = ownSettlements(p.faction).filter(s => s.type !== 'village');
  if (!own.length) return null;
  return own.reduce((a, b) => dist2(a.x, a.y, p.x, p.y) < dist2(b.x, b.y, p.x, p.y) ? a : b);
}
function pickCampaignTarget(f, enemies) {
  const cands = S.order.settlements.map(i => S.settlements[i])
    .filter(s => enemies.includes(s.faction) && s.type !== 'village');
  if (!cands.length) return null;
  const mine = ownSettlements(f);
  if (!mine.length) return pick(cands);
  let best = null, bestScore = -1e9;
  cands.forEach(s => {
    const near = mine.reduce((m, o) => Math.min(m, dist2(o.x, o.y, s.x, s.y)), 1e9);
    const score = -near * 1.1 - stackCount(s.garrison) * 1.6 - s.walls * 1.2 + (s.type === 'castle' ? 60 : 0);
    if (score > bestScore) { bestScore = score; best = s; }
  });
  return best;
}
function pickRaidTarget(p, enemies) {
  const vils = S.order.settlements.map(i => S.settlements[i])
    .filter(s => s.type === 'village' && enemies.includes(s.faction) && s.raidedUntil < S.day);
  if (!vils.length) return null;
  vils.sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
  return vils[Math.min(vils.length - 1, ri(0, 2))];
}
function banditGoal(p) {
  const vils = S.order.settlements.map(i => S.settlements[i])
    .filter(s => s.type === 'village' && s.raidedUntil < S.day);
  if (rnd() < 0.55 && vils.length) {
    vils.sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
    const t = vils[Math.min(vils.length - 1, ri(0, 4))];
    return setGoal(p, 'raid', t);
  }
  for (let i = 0; i < 30; i++) {
    const a = rnd() * Math.PI * 2, r = rf(40, 180);
    const x = clamp(p.x + Math.cos(a) * r, 40, MAP_W - 40), y = clamp(p.y + Math.sin(a) * r, 40, MAP_H - 40);
    if (isLand(x, y)) { p.goal = 'roam'; p.targetId = null; p.tx = x; p.ty = y; return; }
  }
  p.goal = 'idle'; p.tx = null;
}
function setGoal(p, goal, target) {
  p.goal = goal; p.targetId = target ? target.id : null;
  p.tx = target ? target.x : null; p.ty = target ? target.y : null;
}

function arriveAtTarget(p) {
  const t = p.targetId ? S.settlements[p.targetId] : null;
  if (!t) { p.goal = 'idle'; p.tx = null; return; }
  if (p.goal === 'raid' && t.type === 'village' && (p.type === 'bandit' || atWar(p.faction, t.faction))) {
    raidVillage(p, t); p.goal = 'idle'; p.tx = null; return;
  }
  if (p.goal === 'siege' && atWar(p.faction, t.faction) && t.type !== 'village') {
    startSiege(p, t); return;
  }
  if (p.goal === 'return' || p.goal === 'patrol' || p.goal === 'defend') {
    if (t.faction === p.faction) {
      p.restUntil = S.day + (p.goal === 'defend' ? 1 : rf(2, 5));
      p.goal = 'garrison'; p.tx = null;
      return;
    }
  }
  p.goal = 'idle'; p.tx = null;
}

/* ---------------- karşılaşmalar ---------------- */
function checkEncounters() {
  const list = S.order.parties.map(id => S.parties[id]).filter(Boolean);
  for (let i = 0; i < list.length; i++) {
    const a = list[i]; if (!S.parties[a.id]) continue;
    for (let j = i + 1; j < list.length; j++) {
      const b = list[j]; if (!S.parties[b.id] || !S.parties[a.id]) continue;
      if (a.faction === b.faction) continue;
      const hostile = a.faction === 'bandit' || b.faction === 'bandit' || atWar(a.faction, b.faction);
      if (!hostile) continue;
      if (a.cooldown > 0 || b.cooldown > 0) continue;
      if (dist2(a.x, a.y, b.x, b.y) > ENCOUNTER_R) continue;
      /* zayıf taraf kaçmaya çalışır */
      const pa = partyPower(a), pb = partyPower(b);
      const weak = pa < pb ? a : b, strong = pa < pb ? b : a;
      const ratio = Math.min(pa, pb) / Math.max(1, Math.max(pa, pb));
      if (ratio < 0.45 && partySpeed(weak) > partySpeed(strong) * 0.98 && rnd() < 0.65) {
        fleeFrom(weak, strong); weak.cooldown = 0.8; strong.cooldown = 0.4; continue;
      }
      resolveBattle(a, b, 'field');
    }
  }
}
function fleeFrom(weak, strong) {
  const dx = weak.x - strong.x, dy = weak.y - strong.y;
  const d = Math.hypot(dx, dy) || 1;
  let nx = clamp(weak.x + dx / d * 90, 30, MAP_W - 30), ny = clamp(weak.y + dy / d * 90, 30, MAP_H - 30);
  if (!isLand(nx, ny)) { nx = clamp(weak.x - dx / d * 40, 30, MAP_W - 30); ny = clamp(weak.y - dy / d * 40, 30, MAP_H - 30); }
  weak.goal = 'flee'; weak.targetId = null; weak.tx = nx; weak.ty = ny;
  weak.morale = clamp(weak.morale - 4, 0, 100);
}

/* ---------------- savaş çözümü ---------------- */
function partyLabel(p) {
  if (!p) return '—';
  if (p.lordId && S.lords[p.lordId]) { const l = S.lords[p.lordId]; return `${l.title} ${l.name}`; }
  return p.name || (S.factions[p.faction] ? S.factions[p.faction].short + ' ordusu' : 'Ordu');
}
function factionName(f) { return S.factions[f] ? S.factions[f].name : '—'; }

/* iki birlik yığını arasında çarpışma; sonuç {winner:'a'|'b', lossA, lossB} */
function fightStacks(stA, stB, modA, modB) {
  const A = JSON.parse(JSON.stringify(stA)), B = JSON.parse(JSON.stringify(stB));
  const start = { a: stackCount(A), b: stackCount(B) };
  let rounds = 0;
  const leth = 0.055 * S.opts.lethality;
  while (rounds++ < 120) {
    const ca = stackCount(A), cb = stackCount(B);
    if (ca <= 0 || cb <= 0) break;
    const pa = stackPower(A) * modA * rf(0.9, 1.1);
    const pb = stackPower(B) * modB * rf(0.9, 1.1);
    if (pa <= 0 || pb <= 0) break;
    const avgA = stackPower(A) / ca, avgB = stackPower(B) / cb;
    const killB = Math.max(1, (pa * leth) / Math.max(1, avgB) * 0.35);
    const killA = Math.max(1, (pb * leth) / Math.max(1, avgA) * 0.35);
    stackRemove(B, Math.min(cb, killB));
    stackRemove(A, Math.min(ca, killA));
    /* kırılma noktası */
    const ra = stackCount(A) / start.a, rb = stackCount(B) / start.b;
    if (ra < 0.22 || rb < 0.22) break;
  }
  const endA = stackCount(A), endB = stackCount(B);
  const winner = (endA / Math.max(1, start.a)) >= (endB / Math.max(1, start.b)) ? 'a' : 'b';
  return { A, B, winner, lossA: start.a - endA, lossB: start.b - endB, startA: start.a, startB: start.b };
}

function resolveBattle(a, b, kind) {
  const lordA = a.lordId ? S.lords[a.lordId] : null;
  const lordB = b.lordId ? S.lords[b.lordId] : null;
  const modA = (1 + (lordA ? lordA.skillTactics * 0.035 : 0)) * (0.65 + a.morale / 150);
  const modB = (1 + (lordB ? lordB.skillTactics * 0.035 : 0)) * (0.65 + b.morale / 150);
  const r = fightStacks(a.troops, b.troops, modA, modB);
  a.troops = r.A; b.troops = r.B;
  const win = r.winner === 'a' ? a : b, lose = r.winner === 'a' ? b : a;
  const winLord = r.winner === 'a' ? lordA : lordB, loseLord = r.winner === 'a' ? lordB : lordA;
  const loseLoss = r.winner === 'a' ? r.lossB : r.lossA;
  const winLoss = r.winner === 'a' ? r.lossA : r.lossB;

  /* kaçış sırasında ek kayıp ve esirler */
  const extra = stackRemove(lose.troops, stackCount(lose.troops) * rf(0.12, 0.3));
  const capt = {};
  Object.entries(extra).forEach(([k, v]) => { const n = Math.round(v * 0.6); if (n > 0) capt[k] = n; });
  if (win.type !== 'bandit') stackMerge(win.prisoners, capt);

  win.morale = clamp(win.morale + 7, 0, 100);
  lose.morale = clamp(lose.morale - 16, 0, 100);
  win.cooldown = 1.0; lose.cooldown = 1.2;
  if (winLord) { winLord.renown += Math.round(3 + loseLoss / 6); winLord.battlesWon++; winLord.kills += loseLoss; }
  if (loseLord) { loseLord.renown = Math.max(0, loseLord.renown - 4); loseLord.battlesLost++; }

  S.stats.battles++;
  const wiped = stackCount(lose.troops) <= 2;
  addLog(`⚔ ${partyLabel(win)} (${factionName(win.faction)}), ${partyLabel(lose)} ordusunu ${kind === 'siege' ? 'kuşatmada' : 'meydan savaşında'} yendi. Kayıplar: ${fmt(loseLoss + stackCount(extra))} / ${fmt(winLoss)}.`, 'war');

  if (wiped) destroyParty(lose, win);
  else {
    fleeFrom(lose, win);
    if (loseLord && rnd() < 0.12) capturePrisoner(loseLord, win);
  }
  if (win.faction !== 'bandit' && S.factions[win.faction]) S.factions[win.faction].treasury += Math.round(loseLoss * rf(4, 12));
  uiDirty.ovw = true; uiDirty.lrd = true;
  return { win, lose };
}

function destroyParty(p, winner) {
  const lord = p.lordId ? S.lords[p.lordId] : null;
  if (lord) {
    lord.partyId = null;
    if (rnd() < 0.55 && winner && winner.faction !== 'bandit') capturePrisoner(lord, winner);
    else {
      lord.state = 'regroup'; lord.freeAt = S.day + rf(4, 10);
      addLog(`${lord.title} ${lord.name} ordusunu kaybetti, dağılan adamlarını topluyor.`, '');
    }
  } else if (p.type === 'bandit') {
    addLog(`${p.name} yok edildi.`, '');
  }
  removeParty(p.id);
}
function removeParty(id) {
  const p = S.parties[id]; if (!p) return;
  if (p.lordId && S.lords[p.lordId] && S.lords[p.lordId].partyId === id) S.lords[p.lordId].partyId = null;
  delete S.parties[id];
  S.order.parties = S.order.parties.filter(x => x !== id);
  if (S.sel && S.sel.type === 'party' && S.sel.id === id) S.sel = null;
}
function capturePrisoner(lord, winner) {
  lord.state = 'prisoner';
  lord.prisonerOf = winner.faction;
  lord.freeAt = S.day + rf(10, 35);
  if (lord.partyId) removeParty(lord.partyId);
  lord.partyId = null;
  addLog(`🔒 ${lord.title} ${lord.name} esir alındı! (${factionName(winner.faction)})`, 'war');
  uiDirty.lrd = true;
}
function releaseLord(lord) {
  lord.state = 'regroup'; lord.prisonerOf = null; lord.freeAt = S.day + rf(1, 3);
  addLog(`${lord.title} ${lord.name} esaretten kurtuldu.`, '');
}

/* ---------------- yağma ---------------- */
function raidVillage(p, v) {
  const loot = Math.round(v.prosperity * rf(6, 16));
  v.prosperity = clamp(v.prosperity - rf(7, 17), 5, 100);
  v.raidedUntil = S.day + rf(12, 25);
  v.recruits = Math.max(0, v.recruits - ri(5, 15));
  if (p.faction !== 'bandit' && S.factions[p.faction]) S.factions[p.faction].treasury += loot;
  if (p.lordId && S.lords[p.lordId]) S.lords[p.lordId].gold += Math.round(loot * 0.4);
  p.morale = clamp(p.morale + 3, 0, 100);
  const owner = S.factions[v.faction];
  if (owner && !owner.isBandit && p.faction !== 'bandit') {
    owner.rel[p.faction] = clamp((owner.rel[p.faction] || 0) - 2, -100, 100);
  }
  addLog(`🔥 ${partyLabel(p)}, ${v.name} köyünü yağmaladı (${fmt(loot)} dinar).`, 'siege');
  uiDirty.stl = true;
}

/* ---------------- kuşatma ---------------- */
function startSiege(p, s) {
  if (!atWar(p.faction, s.faction)) { p.goal = 'idle'; p.tx = null; return; }
  if (s.besiegedBy && S.parties[s.besiegedBy] && S.parties[s.besiegedBy].faction !== p.faction) {
    /* düşman kuşatmasını kır */
    resolveBattle(p, S.parties[s.besiegedBy], 'siege'); return;
  }
  p.besieging = s.id; p.goal = 'siege'; p.tx = null;
  p.x = s.x + rf(-10, 10); p.y = s.y + rf(-10, 10);
  if (!s.besiegedBy) {
    s.besiegedBy = p.id; s.siegeProgress = 0;
    S.stats.sieges++;
    addLog(`🏰 ${partyLabel(p)}, ${s.name} yerleşimini kuşattı.`, 'siege');
    if (S.opts.pauseOnSiege) setSpeed(0);
  }
  uiDirty.stl = true;
}
function liftSiege(p) {
  if (!p || !p.besieging) return;
  const s = S.settlements[p.besieging];
  if (s && s.besiegedBy === p.id) {
    const other = S.order.parties.map(i => S.parties[i]).find(q => q && q.besieging === s.id && q.id !== p.id && q.faction === p.faction);
    s.besiegedBy = other ? other.id : null;
    if (!other) s.siegeProgress = 0;
  }
  p.besieging = null; p.goal = 'idle'; p.tx = null;
}
function progressSieges(dt) {
  S.order.settlements.forEach(id => {
    const s = S.settlements[id];
    if (!s.besiegedBy) return;
    const lead = S.parties[s.besiegedBy];
    if (!lead) { s.besiegedBy = null; s.siegeProgress = 0; return; }
    if (!atWar(lead.faction, s.faction)) { liftSiege(lead); return; }
    const attackers = S.order.parties.map(i => S.parties[i]).filter(q => q && q.besieging === s.id && q.faction === lead.faction);
    const atkPw = attackers.reduce((a, q) => a + partyPower(q), 0);
    const defPw = settlementDefPower(s);
    s.food = clamp(s.food - dt * 4, 0, 100);
    const ratio = atkPw / Math.max(1, defPw);
    const rate = ratio < 0.3 ? 0.25
      : clamp(ratio * 15 * (1 - s.walls / 260) + (s.food < 25 ? 5 : 0), 0.5, 60);
    s.siegeProgress += rate * dt;
    s.prosperity = clamp(s.prosperity - dt * 0.5, 5, 100);
    if (s.siegeProgress >= 100) assault(s, attackers);
  });
}
function assault(s, attackers) {
  if (!attackers.length) { s.besiegedBy = null; s.siegeProgress = 0; return; }
  const atkStack = {};
  attackers.forEach(q => stackMerge(atkStack, q.troops));
  const defStack = JSON.parse(JSON.stringify(s.garrison));
  const helpers = S.order.parties.map(i => S.parties[i]).filter(q => q && q.goal === 'garrison' && q.targetId === s.id && q.faction === s.faction);
  helpers.forEach(q => stackMerge(defStack, q.troops));
  const wallMod = 1 + (s.walls / 100) * (s.type === 'town' ? 0.85 : 0.7);
  const r = fightStacks(atkStack, defStack, 1, wallMod);

  /* kayıpları kuşatanlara dağıt */
  const lossRatioA = r.startA ? (r.startA - stackCount(r.A)) / r.startA : 0;
  attackers.forEach(q => { stackRemove(q.troops, stackCount(q.troops) * lossRatioA); q.morale = clamp(q.morale + (r.winner === 'a' ? 8 : -18), 0, 100); });
  const lossRatioB = r.startB ? (r.startB - stackCount(r.B)) / r.startB : 0;
  stackRemove(s.garrison, stackCount(s.garrison) * lossRatioB);
  helpers.forEach(q => stackRemove(q.troops, stackCount(q.troops) * lossRatioB));

  const attackerName = partyLabel(attackers[0]);
  if (r.winner === 'a') {
    const cap = attackers[0];
    addLog(`🏳 ${s.name} düştü! ${attackerName} şehri ele geçirdi. (Saldıran kaybı ${fmt(r.startA - stackCount(r.A))}, savunan ${fmt(r.startB - stackCount(r.B))})`, 'siege');
    helpers.forEach(q => { if (stackCount(q.troops) <= 2) destroyParty(q, cap); else fleeFrom(q, cap); });
    captureSettlement(s, cap);
  } else {
    addLog(`🛡 ${s.name} kuşatmayı püskürttü. ${attackerName} geri çekiliyor.`, 'siege');
    attackers.forEach(q => {
      if (stackCount(q.troops) <= 2) destroyParty(q, { faction: s.faction, type: 'lord' });
      else { liftSiege(q); q.cooldown = 2; const home = q.lordId && S.lords[q.lordId] ? homeSettlement(S.lords[q.lordId]) : null; if (home) setGoal(q, 'return', home); }
    });
    s.siegeProgress = 0; s.besiegedBy = null;
  }
  uiDirty.stl = true; uiDirty.ovw = true;
}

function captureSettlement(s, cap) {
  const oldF = s.faction;
  const newF = cap.faction;
  /* garnizon: kuşatan ordudan asker bırak */
  const leave = Math.min(stackCount(cap.troops) - 8, Math.round(stackCount(cap.troops) * 0.35));
  s.garrison = {};
  if (leave > 0) { const g = stackRemove(cap.troops, leave); stackMerge(s.garrison, g); }
  if (stackCount(s.garrison) < 10) stackMerge(s.garrison, makeStack(S.factions[newF].culture, 20, 0.35));
  changeOwner(s, newF, cap.lordId ? S.lords[cap.lordId] : null);
  s.siegeProgress = 0; s.besiegedBy = null; s.walls = clamp(s.walls - 15, 20, 100);
  s.prosperity = clamp(s.prosperity - 10, 5, 100); s.food = 60; s.unrest = 45;
  /* kuşatan ordu içeri girer */
  S.order.parties.forEach(i => { const q = S.parties[i]; if (q && q.besieging === s.id) { q.besieging = null; q.goal = 'garrison'; q.targetId = s.id; q.tx = null; q.restUntil = S.day + 2; } });
  if (S.factions[oldF]) S.factions[oldF].rel[newF] = clamp((S.factions[oldF].rel[newF] || 0) - 12, -100, 100);
  checkFactionAlive(oldF);
  territoryDirty = true; uiDirty.fac = true; uiDirty.stl = true; uiDirty.ovw = true;
}

function changeOwner(s, newF, lord) {
  const old = s.faction;
  s.faction = newF; s.lastOwnerChange = S.day;
  if (s.lordId && S.lords[s.lordId]) S.lords[s.lordId].fiefs = S.lords[s.lordId].fiefs.filter(f => f !== s.id);
  s.lordId = null;
  if (lord && lord.faction === newF) grantFief(s, lord);
  else {
    const cands = S.order.lords.map(i => S.lords[i]).filter(l => l.faction === newF && l.state !== 'dead');
    if (cands.length) {
      cands.sort((a, b) => a.fiefs.length - b.fiefs.length || b.renown - a.renown);
      grantFief(s, cands[0]);
    }
  }
  /* köyleri de devral */
  if (s.type !== 'village') {
    S.order.settlements.forEach(id => {
      const v = S.settlements[id];
      if (v.type === 'village' && v.parentId === s.id) { v.faction = newF; v.lordId = s.lordId; }
    });
  }
  territoryDirty = true;
  return old;
}

function checkFactionAlive(f) {
  const fac = S.factions[f]; if (!fac || fac.isBandit) return;
  const own = ownSettlements(f);
  if (own.length === 0 && fac.alive) {
    fac.alive = false;
    addLog(`💀 ${fac.name} haritadan silindi!`, 'war');
    Object.keys(S.wars).forEach(k => { if (k.includes(f)) delete S.wars[k]; });
    S.order.lords.forEach(id => {
      const l = S.lords[id];
      if (l.faction === f && l.state !== 'dead') {
        l.state = 'exile';
        if (l.partyId) removeParty(l.partyId);
        l.partyId = null;
      }
    });
    uiDirty.fac = true; uiDirty.dip = true;
  }
}

/* ---------------- günlük olaylar ---------------- */
function dailyTick() {
  S.stats.days++;
  const day = Math.floor(S.day);

  /* yerleşimler */
  S.order.settlements.forEach(id => {
    const s = S.settlements[id];
    const raided = s.raidedUntil > S.day;
    const target = raided ? 25 : (s.besiegedBy ? 30 : (s.type === 'town' ? 85 : s.type === 'castle' ? 60 : 70));
    s.prosperity += (target - s.prosperity) * 0.03 * S.opts.economy;
    s.prosperity = clamp(s.prosperity, 3, 100);
    if (!s.besiegedBy) s.food = clamp(s.food + 3, 0, 100);
    s.unrest = clamp(s.unrest - 0.6, 0, 100);
    const regen = s.type === 'town' ? 5.5 : s.type === 'castle' ? 2.6 : 4;
    const capR = s.type === 'town' ? 90 : s.type === 'castle' ? 45 : 55;
    s.recruits = clamp(s.recruits + (raided ? 0.25 : 1) * regen * (0.5 + s.prosperity / 120) * S.opts.recruitRate, 0, capR);
    if (s.type !== 'village' && !s.besiegedBy && day % 3 === 0) refillGarrison(s, false);
    if (s.walls < 100 && !s.besiegedBy && s.type !== 'village') s.walls = clamp(s.walls + 0.12, 0, 100);
  });

  /* krallık ekonomisi */
  Object.values(S.factions).forEach(fac => {
    if (fac.isBandit || !fac.alive) return;
    let inc = 0;
    const mine = ownSettlements(fac.id);
    mine.forEach(s => { inc += settlementIncome(s); });
    inc *= S.opts.economy;
    let wages = 0;
    S.order.parties.forEach(i => { const p = S.parties[i]; if (p && p.faction === fac.id) wages += stackWage(p.troops) * 0.3; });
    mine.forEach(s => { wages += stackWage(s.garrison) * 0.2; });
    S.order.lords.forEach(i => { const l = S.lords[i]; if (l.faction === fac.id && l.state === 'active' && !l.fiefs.length) { wages += 140; l.gold += 140; } });
    fac.treasury += Math.round(inc - wages);

    /* hazine harcaması: savunma takviyesi ve lord maaşları */
    if (fac.treasury > 12000) {
      const budget = fac.treasury * 0.05;
      let spent = 0;
      const forts = mine.filter(s => s.type !== 'village');
      const threatened = forts.filter(s => s.besiegedBy || S.order.parties.some(i => {
        const q = S.parties[i]; return q && atWar(q.faction, fac.id) && dist2(q.x, q.y, s.x, s.y) < 130;
      }));
      const pool = (threatened.length ? threatened : forts)
        .filter(s => stackCount(s.garrison) < garrisonTarget(s) * (s.besiegedBy ? 1.5 : 1.1));
      for (let i = 0; i < 3 && spent < budget && pool.length; i++) {
        const s = pick(pool);
        const room = Math.round(garrisonTarget(s) * 1.4 - stackCount(s.garrison));
        const n = Math.min(30, room, Math.floor((budget - spent) / 90));
        if (n < 4) break;
        stackMerge(s.garrison, makeStack(fac.culture, n, 0.55));
        spent += n * 90;
      }
      const poorLords = S.order.lords.map(i => S.lords[i])
        .filter(l => l.faction === fac.id && l.state === 'active' && l.gold < 2500);
      if (poorLords.length && spent < budget) {
        const each = Math.min(1500, Math.floor((budget - spent) / poorLords.length));
        if (each > 50) { poorLords.forEach(l => { l.gold += each; }); spent += each * poorLords.length; }
      }
      fac.treasury -= Math.round(spent);
    }

    if (fac.treasury < 0) {
      fac.treasury = 0;
      /* maaş ödenemezse firar */
      S.order.parties.forEach(i => {
        const p = S.parties[i];
        if (p && p.faction === fac.id && rnd() < 0.15) { stackRemove(p.troops, stackCount(p.troops) * 0.02); p.morale = clamp(p.morale - 2, 0, 100); }
      });
    }
  });

  /* ordular: dinlenme, asker toplama, terfi, moral */
  S.order.parties.forEach(id => {
    const p = S.parties[id]; if (!p) return;
    const lord = p.lordId ? S.lords[p.lordId] : null;
    if (p.type === 'bandit') {
      p.morale = clamp(p.morale + 0.4, 0, 100);
      if (rnd() < 0.02) stackMerge(p.troops, { bd_looter: ri(2, 6) });
      if (p.goal === 'idle' || p.tx == null) banditGoal(p);
      return;
    }
    if (!lord) return;
    const cap = lordPartyCap(lord);
    const cnt = stackCount(p.troops);
    if (p.goal === 'garrison' && p.targetId) {
      const s = S.settlements[p.targetId];
      if (s && s.faction === p.faction) {
        /* asker topla: yerleşimin ve bağlı köylerinin havuzundan */
        let want = Math.min(cap - cnt, 30 * S.opts.recruitRate);
        if (want > 0) {
          const pools = [s].concat(S.order.settlements.map(i => S.settlements[i])
            .filter(v => v.type === 'village' && v.parentId === s.id && v.faction === s.faction));
          let took = 0;
          for (const src of pools) {
            if (want <= 0) break;
            const take = Math.min(Math.floor(src.recruits), want);
            if (take > 0) { src.recruits -= take; want -= take; took += take; }
          }
          if (took > 0) {
            stackMerge(p.troops, makeStack(S.factions[p.faction].culture, took, 0.12));
            lord.gold -= took * 10;
          }
        }
        p.morale = clamp(p.morale + 3.5, 0, 100);
        /* esirleri hapse at */
        if (stackCount(p.prisoners) > 0) { stackMerge(s.prisoners, p.prisoners); p.prisoners = {}; }
        if (S.day > (p.restUntil || 0) && (cnt >= cap * 0.9 || S.day > (p.restUntil || 0) + 4)) { p.goal = 'idle'; p.tx = null; }
      } else { p.goal = 'idle'; p.tx = null; }
    } else {
      p.morale = clamp(p.morale + (p.besieging ? -0.8 : 0.6), 0, 100);
    }
    /* terfi */
    for (let u = 0; u < 3; u++) if (rnd() < 0.55 * S.opts.recruitRate) upgradeStack(p.troops, lord);
    /* gelir */
    lord.gold += Math.round(lord.fiefs.reduce((a, f) => {
      const s = S.settlements[f]; if (!s || s.faction !== lord.faction) return a;
      const mult = s.raidedUntil > S.day ? 0.2 : 1;
      return a + (s.type === 'town' ? 200 : s.type === 'castle' ? 70 : 40) * (s.prosperity / 70) * mult;
    }, 0));
    lord.gold -= Math.round(stackWage(p.troops) * 0.3);
    if (lord.gold > 6000 && S.factions[lord.faction]) {
      const tax = Math.round((lord.gold - 6000) * 0.12);
      lord.gold -= tax; S.factions[lord.faction].treasury += tax;
    }
    if (lord.gold < 0) { lord.gold = 0; if (rnd() < 0.3) stackRemove(p.troops, Math.max(1, cnt * 0.03)); }
    if (p.goal === 'idle' || (p.tx == null && !p.besieging && p.goal !== 'garrison')) decideGoal(p);
  });

  /* lord durumları */
  S.order.lords.forEach(id => {
    const l = S.lords[id];
    if (l.state === 'prisoner' && S.day >= l.freeAt) releaseLord(l);
    else if (l.state === 'regroup' && S.day >= l.freeAt) {
      const own = ownSettlements(l.faction);
      if (own.length) { l.state = 'active'; spawnLordParty(l); }
      else l.freeAt = S.day + 5;
    }
    if (l.state === 'exile' && rnd() < 0.02) tryExileJoin(l);
  });

  /* diplomasi */
  if (day % 6 === 0) diplomacyTick();
  /* haydutlar */
  if (S.opts.banditSpawn && rnd() < 0.35 * S.opts.banditRate) {
    const bandits = S.order.parties.filter(i => S.parties[i] && S.parties[i].type === 'bandit').length;
    if (bandits < 26 * S.opts.banditRate) spawnBandit();
  }
  /* lord memnuniyeti / firar */
  if (S.opts.lordDefection && day % 10 === 0) defectionTick();
}

function upgradeStack(st, lord) {
  const keys = Object.keys(st).filter(k => TROOPS[k] && TROOPS[k].up.length && st[k] > 0);
  if (!keys.length) return;
  const k = pick(keys);
  const t = TROOPS[k];
  const n = Math.max(1, Math.round(st[k] * rf(0.05, 0.16)));
  const cost = n * (t.tier * 22);
  if (lord && lord.gold < cost) return;
  if (lord) lord.gold -= cost;
  const to = pick(t.up);
  st[k] -= n; if (st[k] <= 0) delete st[k];
  st[to] = (st[to] || 0) + n;
}

function settlementIncome(s) {
  const raided = s.raidedUntil > S.day ? 0.15 : 1;
  const base = s.type === 'town' ? 100 + s.prosperity * 6
    : s.type === 'castle' ? 30 + s.prosperity * 1.5
    : 12 + s.prosperity * 1.5;
  return base * raided * (s.besiegedBy ? 0.3 : 1);
}

function factionStrength(f) {
  let pw = 0;
  S.order.parties.forEach(i => { const p = S.parties[i]; if (p && p.faction === f) pw += stackPower(p.troops); });
  ownSettlements(f).forEach(s => { pw += stackPower(s.garrison) * 0.6; });
  return pw;
}

function diplomacyTick() {
  const live = Object.values(S.factions).filter(f => !f.isBandit && f.alive);
  live.forEach(fac => {
    const wars = live.filter(o => o.id !== fac.id && atWar(fac.id, o.id));
    /* barış arayışı */
    if (S.opts.autoPeace && wars.length) {
      wars.forEach(o => {
        const k = warKey(fac.id, o.id);
        const dur = S.day - (S.wars[k] ? S.wars[k].since : S.day);
        const my = factionStrength(fac.id), his = factionStrength(o.id);
        const desperate = my < his * 0.5 || ownSettlements(fac.id).filter(s => s.type === 'town').length <= 1;
        const losing = my < his * 0.75;
        const chance = clamp((dur - 30) / 350 + (losing ? 0.12 : 0) + (desperate ? 0.35 : 0) + (wars.length > 1 ? 0.1 : 0), 0, 0.75);
        if (dur > 15 && rnd() < chance) makePeace(fac.id, o.id);
      });
    }
    /* savaş ilanı */
    if (wars.length < 2 && rnd() < 0.16 * fac.aggr * S.opts.aggression) {
      const cands = live.filter(o => o.id !== fac.id && !atWar(fac.id, o.id));
      if (cands.length) {
        const my = factionStrength(fac.id);
        cands.sort((a, b) => (factionStrength(a.id) + (fac.rel[a.id] || 0) * 30) - (factionStrength(b.id) + (fac.rel[b.id] || 0) * 30));
        const t = cands[0];
        const theirWars = live.filter(o => o.id !== t.id && atWar(t.id, o.id)).length;
        if (theirWars < 2 && factionStrength(t.id) < my * 1.25 && (fac.rel[t.id] || 0) < 25) declareWar(fac.id, t.id);
      }
    }
    /* sefer hedefi güncelle */
    const en = enemyFactions(fac.id);
    if (en.length) {
      const t = pickCampaignTarget(fac.id, en);
      fac.target = t ? t.id : null;
    } else fac.target = null;
  });
  uiDirty.dip = true;
}

function defectionTick() {
  S.order.lords.forEach(id => {
    const l = S.lords[id];
    if (l.isKing || l.state === 'dead' || l.state === 'exile') return;
    const pers = PERSONALITIES.find(p => p.id === l.personality) || PERSONALITIES[0];
    l.relKing += (l.fiefs.length ? 1.2 : -1.4) * pers.loyal * 0.6 + rf(-1.5, 1.5);
    l.relKing = clamp(l.relKing, -100, 100);
    if (l.relKing < -45 && rnd() < 0.1) {
      const others = Object.values(S.factions).filter(f => !f.isBandit && f.alive && f.id !== l.faction && !atWar(f.id, l.faction));
      if (!others.length) return;
      const to = pick(others);
      defect(l, to.id);
    }
  });
  uiDirty.lrd = true;
}

function defect(l, toFaction) {
  const from = l.faction;
  const fiefs = l.fiefs.slice();
  l.faction = toFaction; l.relKing = ri(-5, 25);
  l.title = S.factions[toFaction].lordTitle;
  if (l.partyId && S.parties[l.partyId]) S.parties[l.partyId].faction = toFaction;
  fiefs.forEach(f => { const s = S.settlements[f]; if (s) { s.faction = toFaction; } });
  addLog(`🕊 ${l.title} ${l.name}, ${factionName(from)} krallığından ayrılıp ${factionName(toFaction)} saflarına geçti!`, 'peace');
  territoryDirty = true; checkFactionAlive(from);
  uiDirty.lrd = true; uiDirty.fac = true;
}

function tryExileJoin(l) {
  const others = Object.values(S.factions).filter(f => !f.isBandit && f.alive);
  if (!others.length) return;
  const to = pick(others);
  l.faction = to.id; l.state = 'regroup'; l.freeAt = S.day + 2; l.relKing = ri(0, 20);
  l.title = to.lordTitle; l.fiefs = [];
  addLog(`${l.title} ${l.name} sürgünden dönüp ${to.name} hizmetine girdi.`, '');
}

   Bölüm 5: Arayüz — paneller, listeler, seçim ekranı
   ===================================================================== */

const ui = {
  tab: 'sel',
  lordSort: 'renown', lordQuery: '', lordFac: '', lordState: '',
  stlType: '', stlFac: '', stlQuery: '',
  troopEdit: null
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

let booted = false;
function setTab(t) {
  ui.tab = t;
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $$('.pane').forEach(p => p.classList.toggle('on', p.dataset.pane === t));
  uiDirty[t] = true; renderUI();
  if (booted && window.innerWidth <= 900) $('#side').classList.add('open');
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- küçük parçalar ---------- */
function facDot(f) { const c = S.factions[f] ? S.factions[f].color : '#888'; return `<span class="dot" style="background:${c}"></span>`; }
function facName(f) { return S.factions[f] ? S.factions[f].name : '—'; }
function bar(v, max, color) {
  const p = clamp(v / (max || 100) * 100, 0, 100);
  return `<div class="bar"><i style="width:${p}%;background:${color || 'var(--accent)'}"></i></div>`;
}
function troopLines(st, limit) {
  const e = Object.entries(st).filter(x => x[1] > 0)
    .sort((a, b) => (TROOPS[b[0]]?.tier || 0) - (TROOPS[a[0]]?.tier || 0));
  if (!e.length) return '<div class="small muted">Asker yok</div>';
  const list = limit ? e.slice(0, limit) : e;
  return `<table class="tbl">${list.map(([k, v]) => {
    const t = TROOPS[k];
    return `<tr><td>${esc(t ? t.name : k)}</td><td class="small muted">T${t ? t.tier : '?'}</td><td class="n">${fmt(v)}</td></tr>`;
  }).join('')}${limit && e.length > limit ? `<tr><td colspan="3" class="small muted">+${e.length - limit} tür daha</td></tr>` : ''}</table>`;
}
function stateLabel(l) {
  return { active:'Sahada', prisoner:'Esir', regroup:'Toparlanıyor', dead:'Ölü', exile:'Sürgün' }[l.state] || l.state;
}
function goalLabel(p) {
  if (p.besieging) { const s = S.settlements[p.besieging]; return `${s ? s.name : '?'} kuşatmasında`; }
  const t = p.targetId ? S.settlements[p.targetId] : null;
  const m = {
    patrol:'Devriyede', raid:'Yağma seferinde', siege:'Kuşatmaya gidiyor', defend:'Savunmaya koşuyor',
    return:'Tımarına dönüyor', garrison:'Yerleşimde konaklıyor', flee:'Çekiliyor', roam:'Dolaşıyor', idle:'Bekliyor'
  };
  return (m[p.goal] || p.goal) + (t ? ` — ${t.name}` : '');
}

/* ---------- düzenleme alanları ---------- */
function fNum(label, kind, id, key, min, max, step) {
  const obj = getEnt(kind, id); if (!obj) return '';
  return `<label class="f"><span>${esc(label)}</span><input type="number" value="${Math.round((obj[key] ?? 0) * 100) / 100}" min="${min}" max="${max}" step="${step || 1}" data-edit="${kind}|${id}|${key}|num"></label>`;
}
function fText(label, kind, id, key) {
  const obj = getEnt(kind, id); if (!obj) return '';
  return `<label class="f"><span>${esc(label)}</span><input type="text" value="${esc(obj[key] ?? '')}" data-edit="${kind}|${id}|${key}|text"></label>`;
}
function fSel(label, kind, id, key, opts) {
  const obj = getEnt(kind, id); if (!obj) return '';
  const cur = obj[key];
  return `<label class="f"><span>${esc(label)}</span><select data-edit="${kind}|${id}|${key}|sel">${
    opts.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(cur) ? 'selected' : ''}>${esc(o.t)}</option>`).join('')
  }</select></label>`;
}
function getEnt(kind, id) {
  return kind === 'lord' ? S.lords[id] : kind === 'settlement' ? S.settlements[id]
    : kind === 'faction' ? S.factions[id] : kind === 'party' ? S.parties[id]
    : kind === 'opts' ? S.opts : null;
}
const facOpts = (incBandit) => Object.values(S.factions).filter(f => incBandit || !f.isBandit).map(f => ({ v: f.id, t: f.name }));

/* ---------- ana render ---------- */
let lastUiRender = 0;
function renderUI(force) {
  const now = performance.now();
  if (!force && now - lastUiRender < 220) return;
  lastUiRender = now;
  const pane = ui.tab;
  const act = document.activeElement;
  const inPane = act && act.closest && act.closest('.panes') && (act.tagName === 'INPUT' || act.tagName === 'SELECT' || act.tagName === 'TEXTAREA');
  if (inPane && !force) { renderLog(); renderTop(); return; }
  if (pane === 'sel' && (uiDirty.sel || force)) { renderSel(); uiDirty.sel = false; }
  if (pane === 'ovw' && (uiDirty.ovw || force)) { renderOvw(); uiDirty.ovw = false; }
  if (pane === 'fac' && (uiDirty.fac || force)) { renderFac(); uiDirty.fac = false; }
  if (pane === 'lrd' && (uiDirty.lrd || force)) { renderLrd(); uiDirty.lrd = false; }
  if (pane === 'stl' && (uiDirty.stl || force)) { renderStl(); uiDirty.stl = false; }
  if (pane === 'dip' && (uiDirty.dip || force)) { renderDip(); uiDirty.dip = false; }
  if (pane === 'god' && (uiDirty.god || force)) { renderGod(); uiDirty.god = false; }
  renderTop(); renderLog(); renderLegend();
}

function renderTop() {
  const c = calendar(S.day);
  $('#tbDate').textContent = `${c.dayOfMonth} ${c.month} ${c.year}`;
  $('#tbSeason').textContent = `· ${c.season}`;
}

let lastLogLen = -1;
function renderLog() {
  if (!logDirty && S.log.length === lastLogLen) return;
  logDirty = false; lastLogLen = S.log.length;
  $('#logList').innerHTML = S.log.slice(0, 60).map(l =>
    `<div class="log-line ${l.k}"><span class="d">${shortDate(l.d)}</span><span class="m">${esc(l.m)}</span></div>`).join('');
}

function renderLegend() {
  const box = $('#legend');
  const rows = Object.values(S.factions).filter(f => !f.isBandit).map(f => {
    const own = ownSettlements(f.id).length;
    return `<div class="lrow ${S.hidden[f.id] ? 'off' : ''}" data-act="toggleFac" data-id="${f.id}">
      <span class="swatch" style="background:${f.color}"></span>
      <span class="lname">${esc(f.short)}</span><span class="lval">${own}</span></div>`;
  }).join('');
  const html = rows + `<div class="lrow ${S.hidden.bandit ? 'off' : ''}" data-act="toggleFac" data-id="bandit">
      <span class="swatch" style="background:${BANDIT_FACTION.color}"></span><span class="lname">Haydutlar</span>
      <span class="lval">${S.order.parties.filter(i => S.parties[i] && S.parties[i].type === 'bandit').length}</span></div>`;
  if (box.dataset.h !== html) { box.innerHTML = html; box.dataset.h = html; }
}

/* ---------- SEÇİM ---------- */
function renderSel() {
  const box = $('#paneSel');
  if (!S.sel) {
    box.innerHTML = `<div class="card"><h3>Seçim yok</h3>
      <div class="small muted">Haritadan bir şehir, kale, köy ya da ordu seç. Buradan o birimin her özelliğini değiştirebilirsin.
      Krallıkların tamamını düzenlemek için <b>Müdahale</b> sekmesine bak.</div></div>`;
    return;
  }
  if (S.sel.type === 'lord') box.innerHTML = selLord(S.lords[S.sel.id]);
  else if (S.sel.type === 'settlement') box.innerHTML = selSettlement(S.settlements[S.sel.id]);
  else if (S.sel.type === 'faction') box.innerHTML = selFaction(S.factions[S.sel.id]);
  else if (S.sel.type === 'party') box.innerHTML = selParty(S.parties[S.sel.id]);
  else box.innerHTML = '';
}

function selLord(l) {
  if (!l) return '<div class="card">Lord bulunamadı.</div>';
  const fac = S.factions[l.faction];
  const p = l.partyId ? S.parties[l.partyId] : null;
  const pers = PERSONALITIES.find(x => x.id === l.personality) || PERSONALITIES[0];
  const cap = lordPartyCap(l);
  const cnt = p ? stackCount(p.troops) : 0;
  return `
  <div class="card">
    <h3>${facDot(l.faction)} ${esc(l.title)} ${esc(l.name)} <span class="sub">— ${esc(fac ? fac.name : '')}</span></h3>
    <div class="row wrap" style="gap:6px;margin-bottom:8px">
      <span class="tag ${l.isKing ? 'gold' : ''}">${l.isKing ? 'Hükümdar' : 'Vassal'}</span>
      <span class="tag">${esc(stateLabel(l))}</span>
      <span class="tag">${esc(pers.name)}</span>
      <span class="tag gold">${fmt(l.gold)} dinar</span>
    </div>
    <table class="tbl">
      <tr><td>Şöhret</td><td class="n">${fmt(l.renown)}</td><td style="width:40%">${bar(l.renown, 1000)}</td></tr>
      <tr><td>Krala bağlılık</td><td class="n">${Math.round(l.relKing)}</td><td>${bar(l.relKing + 100, 200, l.relKing < 0 ? 'var(--danger)' : 'var(--success)')}</td></tr>
      <tr><td>Taktik / Liderlik</td><td class="n">${l.skillTactics} / ${l.skillLeadership}</td><td class="small muted">Ordu üst sınırı ${cap}</td></tr>
      <tr><td>Zafer / Yenilgi</td><td class="n">${l.battlesWon} / ${l.battlesLost}</td><td class="small muted">${fmt(l.kills)} düşman kaybı</td></tr>
    </table>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm" data-act="focus">Haritada göster</button>
      <button class="btn sm" data-act="lordHeal" data-id="${l.id}">Orduyu tamamla</button>
      <button class="btn sm" data-act="lordElite" data-id="${l.id}">Seçkin birlik ver</button>
      ${l.state === 'prisoner' ? `<button class="btn sm" data-act="lordFree" data-id="${l.id}">Serbest bırak</button>` : ''}
      ${!l.isKing ? `<button class="btn sm" data-act="makeKing" data-id="${l.id}">Kral yap</button>` : ''}
      <button class="btn sm danger" data-act="lordKill" data-id="${l.id}">Öldür</button>
    </div>
  </div>

  <div class="card">
    <h3>Ordusu <span class="sub">${p ? `${fmt(cnt)} / ${cap} asker` : 'sahada değil'}</span></h3>
    ${p ? `<div class="small muted" style="margin-bottom:6px">${esc(goalLabel(p))} · Moral ${Math.round(p.morale)} · Güç ${fmt(partyPower(p))}</div>
      ${troopLines(p.troops)}
      <div class="btnrow" style="margin-top:8px">
        <button class="btn sm" data-act="troopEditor" data-kind="party" data-id="${p.id}">Askerleri düzenle</button>
        <button class="btn sm" data-act="teleport" data-id="${p.id}">Işınla</button>
        <button class="btn sm" data-act="orderParty" data-id="${p.id}">Emir ver</button>
      </div>
      ${stackCount(p.prisoners) ? `<div class="small muted" style="margin-top:8px">Esirler: ${fmt(stackCount(p.prisoners))}</div>` : ''}`
    : `<div class="small muted">Bu lordun sahada ordusu yok.</div>
       <div class="btnrow" style="margin-top:6px"><button class="btn sm primary" data-act="lordSpawn" data-id="${l.id}">Ordu kur</button></div>`}
  </div>

  <div class="card">
    <h3>Tımarları <span class="sub">${l.fiefs.length} yerleşim</span></h3>
    <div class="list">
      ${l.fiefs.map(f => S.settlements[f]).filter(Boolean).map(s => `
        <div class="item" data-act="selStl" data-id="${s.id}">
          ${facDot(s.faction)}<div class="grow"><div class="t">${esc(s.name)}</div>
          <div class="s">${s.type === 'town' ? 'Şehir' : s.type === 'castle' ? 'Kale' : 'Köy'} · Refah ${Math.round(s.prosperity)}</div></div>

    </div>
  </div>

  <div class="card">
    <h3>Düzenle</h3>
    ${fText('İsim', 'lord', l.id, 'name')}
    ${fText('Unvan', 'lord', l.id, 'title')}
    ${fSel('Krallık', 'lord', l.id, 'faction', facOpts(false))}
    ${fSel('Kişilik', 'lord', l.id, 'personality', PERSONALITIES.map(p => ({ v: p.id, t: `${p.name} — ${p.desc}` })))}
    <div class="grid2">
      ${fNum('Şöhret', 'lord', l.id, 'renown', 0, 3000, 10)}
      ${fNum('Altın', 'lord', l.id, 'gold', 0, 9999999, 100)}
      ${fNum('Krala bağlılık', 'lord', l.id, 'relKing', -100, 100, 1)}
      ${fNum('Taktik', 'lord', l.id, 'skillTactics', 0, 10, 1)}
      ${fNum('Liderlik', 'lord', l.id, 'skillLeadership', 0, 10, 1)}
      ${fSel('Durum', 'lord', l.id, 'state', [
        { v:'active', t:'Sahada' }, { v:'regroup', t:'Toparlanıyor' }, { v:'prisoner', t:'Esir' },
        { v:'exile', t:'Sürgün' }, { v:'dead', t:'Ölü' }])}
