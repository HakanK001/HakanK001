/* ---------- gezinme ---------- */
let dragging = false, dragMoved = false, lastPt = null, pinchDist = 0;
function onPointerDown(e) {
  dragging = true; dragMoved = false;
  lastPt = { x: e.clientX, y: e.clientY };
}
function onPointerMove(e) {
  if (dragging && lastPt) {
    const dx = e.clientX - lastPt.x, dy = e.clientY - lastPt.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
    view.x += dx; view.y += dy; lastPt = { x: e.clientX, y: e.clientY };
    clampView(); requestDraw(); hideTip();
    return;
  }
  const rect = svg.getBoundingClientRect();
  const hit = hitTest(e.clientX - rect.left, e.clientY - rect.top);
  if (!hit) { hideTip(); return; }
  showTip(hitTip(hit), e.clientX - rect.left, e.clientY - rect.top);
}
function onPointerUp(e) {
  if (dragging && !dragMoved) handleMapClick(e);
  dragging = false; lastPt = null;
}
function zoomAt(sx, sy, factor) {
  const before = s2w(sx, sy);
  view.k = clamp(view.k * factor, view.minK, view.maxK);
  const after = s2w(sx, sy);
  view.x += (after.x - before.x) * view.k;
  view.y += (after.y - before.y) * view.k;
  clampView(); requestDraw();
}

function hitTest(sx, sy) {
  const p = s2w(sx, sy);
  const tol = 15 / view.k;
  let best = null, bestD = 1e9;
  S.battles.forEach(b => {
    if (S.day - b.day > 4) return;
    const d = dist2(b.x, b.y, p.x, p.y);
    if (d < tol && d < bestD) { bestD = d; best = { type: 'battle', id: b.id }; }
  });
  S.order.parties.forEach(id => {
    const q = S.parties[id]; if (!q || !S.layers.parties || S.hidden[q.faction] || q.besieging) return;
    const d = dist2(q.x, q.y - 6 / view.k, p.x, p.y);
    if (d < tol && d < bestD) { bestD = d; best = { type: 'party', id }; }
  });
  S.order.settlements.forEach(id => {
    const s = S.settlements[id]; if (!s || S.hidden[s.faction]) return;
    if (s.type === 'village' && !S.layers.villages) return;
    const d = dist2(s.x, s.y, p.x, p.y);
    const t = s.type === 'village' ? tol * 0.75 : tol;
    if (d < t && d < bestD * 1.15) { bestD = d; best = { type: 'settlement', id }; }
  });
  return best;
}
function hitTip(hit) {
  if (hit.type === 'settlement') {
    const s = S.settlements[hit.id];
    const t = s.type === 'town' ? 'Şehir' : s.type === 'castle' ? 'Kale' : 'Köy';
    return `<b>${esc(s.name)}</b> · ${t}<br><span style="color:${S.factions[s.faction] ? S.factions[s.faction].color : '#999'}">${esc(facName(s.faction))}</span>` +
      (s.type !== 'village' ? ` · ${fmt(stackCount(s.garrison))} garnizon` : '') +
      (s.besiegedBy ? ` · <span style="color:#ff6a4d">kuşatma %${Math.round(s.siegeProgress)}</span>` : '');
  }
  if (hit.type === 'party') {
    const p = S.parties[hit.id];
    return `<b>${esc(partyLabel(p))}</b><br><span style="color:${S.factions[p.faction] ? S.factions[p.faction].color : '#999'}">${esc(facName(p.faction))}</span> · ${fmt(stackCount(p.troops))} asker · ${esc(goalLabel(p))}`;
  }
  if (hit.type === 'battle') {
    const b = S.battles.find(x => x.id === hit.id);
    return b ? `<b>⚔ ${esc(b.title)}</b><br>${esc(b.a.name)} ${b.a.start} ⨯ ${b.b.start} ${esc(b.b.name)} · <b>tıkla, izle</b>` : '';
  }
  return '';
}

function handleMapClick(e) {
  const rect = svg.getBoundingClientRect();
  const w = s2w(e.clientX - rect.left, e.clientY - rect.top);
  if (placeMode) {
    const fn = placeMode.fn; cancelPlace();
    fn(w); return;
  }
  const hit = hitTest(e.clientX - rect.left, e.clientY - rect.top);
  if (hit && hit.type === 'battle') { openBattle(hit.id); return; }
  select(hit);
}

function select(sel) {
  if (sel && sel.type === 'party') {
    const p = S.parties[sel.id];
    if (p && p.lordId) sel = { type: 'lord', id: p.lordId };
  }
  S.sel = sel;
  uiDirty.sel = true;
  if (sel) setTab('sel');
  requestDraw(); renderUI(true);
}

function focusOn(x, y, k) {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (k) view.k = clamp(k, view.minK, view.maxK);
  view.x = w / 2 - x * view.k; view.y = h / 2 - y * view.k;
  clampView(); requestDraw();
}
function focusSel() {
  const p = selectedPoint();
  if (p) { focusOn(p.x, p.y, Math.max(view.k, 1.5)); if (window.innerWidth <= 900) document.getElementById('side').classList.remove('open'); }
}

let drawQueued = false;
function requestDraw() {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; drawCanvas(); updateSvg(); });
}
/* =====================================================================
   Bölüm 4: Simülasyon — ordular, savaşlar, kuşatmalar, ekonomi, diplomasi
   ===================================================================== */

const BASE_SPEED = 26;      // gün başına harita birimi
const ENCOUNTER_R = 9;      // karşılaşma yarıçapı

function partySpeed(p) {
  const n = stackCount(p.troops);
  const mix = stackMix(p.troops);
  const cavRatio = n ? mix.cav / n : 0;
  let s = BASE_SPEED * (1 + cavRatio * 0.35);
  s *= 1 / (1 + n / 320);
  if (p.type === 'bandit') s *= 1.12;
  if (p.morale < 35) s *= 0.9;
  const season = calendar(S.day).season;
  if (season === 'Kış') s *= 0.82;
  return s;
}
function partyPower(p) {
  const lord = p.lordId ? S.lords[p.lordId] : null;
  let pw = stackPower(p.troops);
  if (lord) pw *= (1 + lord.skillTactics * 0.035);
  pw *= 0.6 + p.morale / 140;
  return pw;
}
function garrisonHelpers(s) {
  return S.order.parties.map(i => S.parties[i])
    .filter(p => p && p.faction === s.faction && p.goal === 'garrison' && p.targetId === s.id);
}
function settlementDefPower(s) {
  let pw = stackPower(s.garrison) * (1 + (s.walls / 100) * (s.type === 'town' ? 0.95 : 0.75));
  garrisonHelpers(s).forEach(p => { pw += partyPower(p); });
  return pw;
}
function settlementDefCount(s) {
  return stackCount(s.garrison) + garrisonHelpers(s).reduce((a, p) => a + stackCount(p.troops), 0);
}

function setSpeed(v) {
  S.speed = v; S.running = v > 0;
  document.querySelectorAll('#spdCtl button').forEach(b => b.classList.toggle('on', +b.dataset.spd === v));
}

/* ---------------- ana adım ---------------- */
function stepWorld(dt) {
  const before = Math.floor(S.day);
  S.day += dt;
  const after = Math.floor(S.day);

  moveParties(dt);
  checkEncounters();
  progressSieges(dt);

  for (let d = before; d < after; d++) dailyTick();
  if (after !== before) { uiDirty.sel = uiDirty.kra = uiDirty.war = true; }
}

/* ---------------- hareket ---------------- */
function moveParties(dt) {
  S.order.parties.forEach(id => {
    const p = S.parties[id]; if (!p) return;
    if (p.cooldown > 0) p.cooldown -= dt;
    if (p.besieging) return;
    /* mareşali takip: hedef sürekli güncellenir */
    if (p.goal === 'follow') {
      const lead = p.targetId ? S.parties[p.targetId] : null;
      if (!lead || lead.faction !== p.faction) { p.goal = 'idle'; p.tx = null; }
      else if (lead.besieging) {
        const s = S.settlements[lead.besieging];
        if (s && atWar(p.faction, s.faction)) { setGoal(p, 'siege', s); }
        else { p.goal = 'idle'; p.tx = null; }
      } else { p.tx = lead.x; p.ty = lead.y; }
    }
    if (p.tx == null || p.goal === 'idle') decideGoal(p);
    if (p.tx == null) return;
    const d = dist2(p.x, p.y, p.tx, p.ty);
    const step = partySpeed(p) * dt;
    if (d <= step) {
      p.x = p.tx; p.y = p.ty;
      if (p.goal === 'follow') return;
      arriveAtTarget(p);
    } else {
      p.x += (p.tx - p.x) / d * step;
      p.y += (p.ty - p.y) / d * step;
    }
  });
}

function ownSettlements(f) { return S.order.settlements.map(i => S.settlements[i]).filter(s => s.faction === f); }
function enemyFactions(f) {
  return Object.keys(S.factions).filter(o => o !== f && atWar(f, o) && S.factions[o].alive);
}

function decideGoal(p) {
  if (p.type === 'bandit') return banditGoal(p);
  const lord = S.lords[p.lordId]; if (!lord) { p.goal = 'idle'; p.tx = null; return; }
  const fac = S.factions[p.faction]; if (!fac) return;
  const pers = PERSONALITIES.find(x => x.id === lord.personality) || PERSONALITIES[0];
  const cnt = stackCount(p.troops);
  const cap = lordPartyCap(lord);

  /* 1) zayıfsa tımara dön */
  if (cnt < cap * 0.32 || p.morale < 30) {
    const home = homeSettlement(lord);
    if (home) return setGoal(p, 'return', home);
  }
  /* 2) kendi toprağında kuşatma varsa savun */
  const besieged = ownSettlements(p.faction).filter(s => s.besiegedBy);
  if (besieged.length) {
    besieged.sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
    const t = besieged[0];
    if (dist2(t.x, t.y, p.x, p.y) < 340) return setGoal(p, 'defend', t);
  }
  const enemies = enemyFactions(p.faction);
  /* 3) süren dost kuşatmasına katıl */
  if (enemies.length && cnt > cap * 0.3) {
    const ongoing = S.order.settlements.map(i => S.settlements[i]).filter(s =>
      s.besiegedBy && S.parties[s.besiegedBy] && S.parties[s.besiegedBy].faction === p.faction && atWar(p.faction, s.faction));
    if (ongoing.length && rnd() < 0.9) {
      ongoing.sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
      return setGoal(p, 'siege', ongoing[0]);
    }
  }
  /* 4) mareşalin ordusuna katıl */
  if (enemies.length && fac.marshalId && fac.marshalId !== lord.id && cnt > cap * 0.35) {
    const m = S.lords[fac.marshalId];
    const mp = m && m.partyId ? S.parties[m.partyId] : null;
    if (mp && dist2(mp.x, mp.y, p.x, p.y) < 420 && rnd() < 0.7) {
      p.goal = 'follow'; p.targetId = mp.id; p.tx = mp.x; p.ty = mp.y;
      return;
    }
  }
  /* 5) sefer */
  if (enemies.length) {
    const wantWar = rnd() < clamp(0.42 * pers.aggr * fac.aggr * S.opts.aggression + (lord.isKing ? 0.15 : 0), 0.05, 0.95);
    if (wantWar && cnt > cap * 0.5) {
      const target = fac.target && S.settlements[fac.target] && enemies.includes(S.settlements[fac.target].faction)
        ? S.settlements[fac.target] : pickCampaignTarget(p.faction, enemies);
      if (target) {
        const myPw = partyPower(p);
        if (target.type !== 'village' && myPw > settlementDefPower(target) * 0.45) return setGoal(p, 'siege', target);
        const vil = pickRaidTarget(p, enemies);
        if (vil && pers.greed > 0.65) return setGoal(p, 'raid', vil);
        return setGoal(p, 'siege', target);
      }
    }
    const vil = pickRaidTarget(p, enemies);
    if (vil && rnd() < 0.5) return setGoal(p, 'raid', vil);
  }
  /* 6) barışta */
  if (cnt < cap * 0.85 && rnd() < 0.7) {
    const home = homeSettlement(lord) || nearestOwn(p);
    if (home) return setGoal(p, 'return', home);
  }
  const own = ownSettlements(p.faction).filter(s => s.type !== 'village');
  if (own.length) return setGoal(p, 'patrol', pick(own));
  p.goal = 'idle'; p.tx = null;
}

function homeSettlement(lord) {
  const f = lord.fiefs.map(x => S.settlements[x]).filter(s => s && s.faction === lord.faction);
  return f.find(s => s.type === 'town') || f.find(s => s.type === 'castle') || f[0]
    || S.settlements[S.factions[lord.faction] && S.factions[lord.faction].capital]
    || ownSettlements(lord.faction)[0];
}
function nearestOwn(p) {
  const own = ownSettlements(p.faction).filter(s => s.type !== 'village');
  if (!own.length) return null;
  return own.reduce((a, b) => dist2(a.x, a.y, p.x, p.y) < dist2(b.x, b.y, p.x, p.y) ? a : b);
}
function pickCampaignTarget(f, enemies) {
  const cands = S.order.settlements.map(i => S.settlements[i])
    .filter(s => enemies.includes(s.faction) && s.type !== 'village');
  if (!cands.length) return null;
  const mine = ownSettlements(f);
  if (!mine.length) return pick(cands);
  let best = null, bestScore = -1e9;
  cands.forEach(s => {
    const near = mine.reduce((m, o) => Math.min(m, dist2(o.x, o.y, s.x, s.y)), 1e9);
    const score = -near * 1.1 - stackCount(s.garrison) * 1.6 - s.walls * 1.2 + (s.type === 'castle' ? 60 : 0);
    if (score > bestScore) { bestScore = score; best = s; }
  });
  return best;
}
function pickRaidTarget(p, enemies) {
  const vils = S.order.settlements.map(i => S.settlements[i])
    .filter(s => s.type === 'village' && enemies.includes(s.faction) && s.raidedUntil < S.day);
  if (!vils.length) return null;
  vils.sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
  return vils[Math.min(vils.length - 1, ri(0, 2))];
}
function banditGoal(p) {
  const vils = S.order.settlements.map(i => S.settlements[i])
    .filter(s => s.type === 'village' && s.raidedUntil < S.day);
  if (rnd() < 0.5 && vils.length) {
    vils.sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
    return setGoal(p, 'raid', vils[Math.min(vils.length - 1, ri(0, 4))]);
  }
  for (let i = 0; i < 30; i++) {
    const a = rnd() * Math.PI * 2, r = rf(40, 180);
    const x = clamp(p.x + Math.cos(a) * r, 40, MAP_W - 40), y = clamp(p.y + Math.sin(a) * r, 40, MAP_H - 40);
    if (isLand(x, y)) { p.goal = 'roam'; p.targetId = null; p.tx = x; p.ty = y; return; }
  }
  p.goal = 'idle'; p.tx = null;
}
function setGoal(p, goal, target) {
  p.goal = goal; p.targetId = target ? target.id : null;
  p.tx = target ? target.x : null; p.ty = target ? target.y : null;
}

function arriveAtTarget(p) {
  const t = p.targetId ? S.settlements[p.targetId] : null;
  if (!t) { p.goal = 'idle'; p.tx = null; return; }
  if (p.goal === 'raid' && t.type === 'village' && (p.type === 'bandit' || atWar(p.faction, t.faction))) {
    raidVillage(p, t); p.goal = 'idle'; p.tx = null; return;
  }
  if (p.goal === 'siege' && atWar(p.faction, t.faction) && t.type !== 'village') {
    startSiege(p, t); return;
  }
  if (p.goal === 'return' || p.goal === 'patrol' || p.goal === 'defend') {
    if (t.faction === p.faction) {
      p.restUntil = S.day + (p.goal === 'defend' ? 1 : rf(2, 5));
      p.goal = 'garrison'; p.tx = null;
      return;
    }
  }
  p.goal = 'idle'; p.tx = null;
}

/* ---------------- karşılaşmalar ---------------- */
function checkEncounters() {
  const list = S.order.parties.map(id => S.parties[id]).filter(Boolean);
  for (let i = 0; i < list.length; i++) {
    const a = list[i]; if (!S.parties[a.id]) continue;
    for (let j = i + 1; j < list.length; j++) {
      const b = list[j]; if (!S.parties[b.id] || !S.parties[a.id]) continue;
      if (a.faction === b.faction) continue;
      const hostile = a.faction === 'bandit' || b.faction === 'bandit' || atWar(a.faction, b.faction);
      if (!hostile) continue;
      if (a.cooldown > 0 || b.cooldown > 0) continue;
      if (dist2(a.x, a.y, b.x, b.y) > ENCOUNTER_R) continue;
      const pa = partyPower(a), pb = partyPower(b);
      const weak = pa < pb ? a : b, strong = pa < pb ? b : a;
      const ratio = Math.min(pa, pb) / Math.max(1, Math.max(pa, pb));
      if (ratio < 0.45 && partySpeed(weak) > partySpeed(strong) * 0.98 && rnd() < 0.65) {
        fleeFrom(weak, strong); weak.cooldown = 0.8; strong.cooldown = 0.4; continue;
      }
      resolveBattle(a, b, 'field');
    }
  }
}
function fleeFrom(weak, strong) {
  const dx = weak.x - strong.x, dy = weak.y - strong.y;
  const d = Math.hypot(dx, dy) || 1;
  let nx = clamp(weak.x + dx / d * 90, 30, MAP_W - 30), ny = clamp(weak.y + dy / d * 90, 30, MAP_H - 30);
  if (!isLand(nx, ny)) { nx = clamp(weak.x - dx / d * 40, 30, MAP_W - 30); ny = clamp(weak.y - dy / d * 40, 30, MAP_H - 30); }
  weak.goal = 'flee'; weak.targetId = null; weak.tx = nx; weak.ty = ny;
  weak.morale = clamp(weak.morale - 4, 0, 100);
}

/* ---------------- savaş çözümü ---------------- */
function partyLabel(p) {
  if (!p) return '—';
  if (p.lordId && S.lords[p.lordId]) { const l = S.lords[p.lordId]; return `${l.title} ${l.name}`; }
  return p.name || (S.factions[p.faction] ? S.factions[p.faction].short + ' ordusu' : 'Ordu');
}
function factionName(f) { return S.factions[f] ? S.factions[f].name : '—'; }
function nearestPlace(x, y) {
  let best = null, bd = 1e9;
  S.order.settlements.forEach(id => {
    const s = S.settlements[id];
    const d = dist2(s.x, s.y, x, y);
    if (d < bd) { bd = d; best = s; }
  });
  if (!best) return { name: 'Kalradya', d: 0 };
  return { name: best.name, d: bd, id: best.id };
}

/* iki yığın çarpışır; tur tur kayıt tutulur */
function fightStacks(stA, stB, modA, modB) {
  const A = JSON.parse(JSON.stringify(stA)), B = JSON.parse(JSON.stringify(stB));
  const start = { a: stackCount(A), b: stackCount(B) };
  const rounds = [{ a: start.a, b: start.b }];
  let n = 0;
  const leth = 0.055 * S.opts.lethality;
  while (n++ < 120) {
    const ca = stackCount(A), cb = stackCount(B);
    if (ca <= 0 || cb <= 0) break;
    const pa = stackPower(A) * modA * rf(0.9, 1.1);
    const pb = stackPower(B) * modB * rf(0.9, 1.1);
    if (pa <= 0 || pb <= 0) break;
    const avgA = stackPower(A) / ca, avgB = stackPower(B) / cb;
    stackRemove(B, Math.min(cb, Math.max(1, (pa * leth) / Math.max(1, avgB) * 0.35)));
    stackRemove(A, Math.min(ca, Math.max(1, (pb * leth) / Math.max(1, avgA) * 0.35)));
    rounds.push({ a: stackCount(A), b: stackCount(B) });
    const ra = stackCount(A) / start.a, rb = stackCount(B) / start.b;
    if (ra < 0.22 || rb < 0.22) break;
  }
  const endA = stackCount(A), endB = stackCount(B);
  const winner = (endA / Math.max(1, start.a)) >= (endB / Math.max(1, start.b)) ? 'a' : 'b';
  return { A, B, winner, lossA: start.a - endA, lossB: start.b - endB, startA: start.a, startB: start.b, rounds };
}

function recordBattle(rec) {
  rec.id = uid('b');
  rec.day = S.day;
  S.battles.unshift(rec);
  if (S.battles.length > 60) S.battles.length = 60;
  S.stats.battles++;
  uiDirty.war = true;
  const total = rec.a.start + rec.b.start;
  if (total >= 180 && S.opts.battleAlert) {
    S.alert = { id: rec.id, title: rec.title, sub: `${rec.a.name} ${rec.a.start} ⨯ ${rec.b.start} ${rec.b.name}` };
    alertDirty = true;
    if (S.opts.pauseOnBattle) setSpeed(0);
  }
  return rec;
}

function stackSnapshot(st) { return JSON.parse(JSON.stringify(st)); }

function resolveBattle(a, b, kind) {
  const lordA = a.lordId ? S.lords[a.lordId] : null;
  const lordB = b.lordId ? S.lords[b.lordId] : null;
  const modA = (1 + (lordA ? lordA.skillTactics * 0.035 : 0)) * (0.65 + a.morale / 150);
  const modB = (1 + (lordB ? lordB.skillTactics * 0.035 : 0)) * (0.65 + b.morale / 150);
  const snapA = stackSnapshot(a.troops), snapB = stackSnapshot(b.troops);
  const r = fightStacks(a.troops, b.troops, modA, modB);
  a.troops = r.A; b.troops = r.B;

  const win = r.winner === 'a' ? a : b, lose = r.winner === 'a' ? b : a;
  const winLord = r.winner === 'a' ? lordA : lordB, loseLord = r.winner === 'a' ? lordB : lordA;
  const loseLoss = r.winner === 'a' ? r.lossB : r.lossA;
  const winLoss = r.winner === 'a' ? r.lossA : r.lossB;

  /* çekilirken ek kayıp ve esirler */
  const extra = stackRemove(lose.troops, stackCount(lose.troops) * rf(0.12, 0.3));
  const capt = {};
  Object.entries(extra).forEach(([k, v]) => { const n = Math.round(v * 0.6); if (n > 0) capt[k] = n; });
  if (win.type !== 'bandit') stackMerge(win.prisoners, capt);

  win.morale = clamp(win.morale + 7, 0, 100);
  lose.morale = clamp(lose.morale - 16, 0, 100);
  win.cooldown = 1.0; lose.cooldown = 1.2;
  if (winLord) { winLord.renown += Math.round(3 + loseLoss / 6); winLord.battlesWon++; winLord.kills += loseLoss; }
  if (loseLord) { loseLord.renown = Math.max(0, loseLord.renown - 4); loseLord.battlesLost++; }

  const place = nearestPlace((a.x + b.x) / 2, (a.y + b.y) / 2);
  const rec = recordBattle({
    x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
    place: place.name, placeId: place.id,
    type: kind === 'siege' ? 'sortie' : 'field',
    title: `${place.name} ${place.d < 30 ? 'önünde' : 'yakınlarında'} meydan savaşı`,
    a: { name: partyLabel(a), faction: a.faction, lordId: a.lordId, start: r.startA, end: stackCount(a.troops), loss: r.lossA, stack: snapA },
    b: { name: partyLabel(b), faction: b.faction, lordId: b.lordId, start: r.startB, end: stackCount(b.troops), loss: r.lossB, stack: snapB },
    winner: r.winner, rounds: r.rounds, prisoners: stackCount(capt)
  });

  const wiped = stackCount(lose.troops) <= 2;
  addLog(`⚔ ${rec.title}: ${partyLabel(win)} (${fmt(r.winner === 'a' ? r.startA : r.startB)}) — ` +
    `${partyLabel(lose)} (${fmt(r.winner === 'a' ? r.startB : r.startA)}) yenildi. Kayıp ${fmt(winLoss)} / ${fmt(loseLoss + stackCount(extra))}.`,
    'war', rec.a.start + rec.b.start >= 120 ? 2 : 1, rec.id);

  if (wiped) destroyParty(lose, win);
  else {
    fleeFrom(lose, win);
    if (loseLord && rnd() < 0.12) capturePrisoner(loseLord, win, place.name);
  }
  if (win.faction !== 'bandit' && S.factions[win.faction]) S.factions[win.faction].treasury += Math.round(loseLoss * rf(4, 12));
  uiDirty.kra = true;
  return { win, lose, rec };
}

function destroyParty(p, winner) {
  const lord = p.lordId ? S.lords[p.lordId] : null;
  if (lord) {
    lord.partyId = null;
    if (rnd() < 0.55 && winner && winner.faction !== 'bandit') capturePrisoner(lord, winner);
    else {
      lord.state = 'regroup'; lord.freeAt = S.day + rf(4, 10);
      addLog(`${lord.title} ${lord.name} ordusunu kaybetti, dağılan adamlarını topluyor.`, '', 1);
    }
  } else if (p.type === 'bandit') {
    addLog(`${p.name} çetesi yok edildi.`, '', 0);
  }
  removeParty(p.id);
}
function removeParty(id) {
  const p = S.parties[id]; if (!p) return;
  if (p.besieging) liftSiege(p);
  if (p.lordId && S.lords[p.lordId] && S.lords[p.lordId].partyId === id) S.lords[p.lordId].partyId = null;
  delete S.parties[id];
  S.order.parties = S.order.parties.filter(x => x !== id);
  S.order.parties.forEach(i => { const q = S.parties[i]; if (q && q.goal === 'follow' && q.targetId === id) { q.goal = 'idle'; q.tx = null; } });
  if (S.sel && S.sel.type === 'party' && S.sel.id === id) S.sel = null;
}
function capturePrisoner(lord, winner, place) {
  lord.state = 'prisoner';
  lord.prisonerOf = winner.faction;
  lord.freeAt = S.day + rf(10, 35);
  if (lord.partyId) removeParty(lord.partyId);
  lord.partyId = null;
  addLog(`🔒 ${lord.title} ${lord.name}${place ? ' (' + place + ')' : ''} esir düştü — ${factionName(winner.faction)} zindanında.`, 'war', 2);
  uiDirty.kra = true;
}
function releaseLord(lord) {
  lord.state = 'regroup'; lord.prisonerOf = null; lord.freeAt = S.day + rf(1, 3);
  addLog(`${lord.title} ${lord.name} esaretten kurtuldu.`, '', 1);
}

/* ---------------- yağma ---------------- */
function raidVillage(p, v) {
  const loot = Math.round(v.prosperity * rf(6, 16));
  v.prosperity = clamp(v.prosperity - rf(7, 17), 5, 100);
  v.raidedUntil = S.day + rf(12, 25);
  v.recruits = Math.max(0, v.recruits - ri(5, 15));
  if (p.faction !== 'bandit' && S.factions[p.faction]) S.factions[p.faction].treasury += loot;
  if (p.lordId && S.lords[p.lordId]) S.lords[p.lordId].gold += Math.round(loot * 0.4);
  p.morale = clamp(p.morale + 3, 0, 100);
  const owner = S.factions[v.faction];
  if (owner && !owner.isBandit && p.faction !== 'bandit') {
    owner.rel[p.faction] = clamp((owner.rel[p.faction] || 0) - 2, -100, 100);
  }
  addLog(`🔥 ${partyLabel(p)}, ${v.name} köyünü yağmaladı (${fmt(loot)} dinar).`, 'siege', p.type === 'bandit' ? 0 : 1);
  uiDirty.sel = true;
}

/* ---------------- kuşatma ---------------- */
function startSiege(p, s) {
  if (!atWar(p.faction, s.faction)) { p.goal = 'idle'; p.tx = null; return; }
  if (s.besiegedBy && S.parties[s.besiegedBy] && S.parties[s.besiegedBy].faction !== p.faction) {
    resolveBattle(p, S.parties[s.besiegedBy], 'siege'); return;
  }
  p.besieging = s.id; p.goal = 'siege'; p.tx = null;
  p.x = s.x + rf(-10, 10); p.y = s.y + rf(-10, 10);
  if (!s.besiegedBy) {
    s.besiegedBy = p.id; s.siegeProgress = 0;
    S.stats.sieges++;
    addLog(`🏰 ${partyLabel(p)} ${fmt(stackCount(p.troops))} askerle ${s.name} önüne geldi — kuşatma başladı (garnizon ${fmt(settlementDefCount(s))}).`, 'siege', 2);
    if (S.opts.pauseOnSiege) setSpeed(0);
  }
  uiDirty.sel = true;
}
function liftSiege(p) {
  if (!p || !p.besieging) return;
  const s = S.settlements[p.besieging];
  if (s && s.besiegedBy === p.id) {
    const other = S.order.parties.map(i => S.parties[i]).find(q => q && q.besieging === s.id && q.id !== p.id && q.faction === p.faction);
    s.besiegedBy = other ? other.id : null;
    if (!other) s.siegeProgress = 0;
  }
  p.besieging = null; p.goal = 'idle'; p.tx = null;
}
function progressSieges(dt) {
  S.order.settlements.forEach(id => {
    const s = S.settlements[id];
    if (!s.besiegedBy) return;
    const lead = S.parties[s.besiegedBy];
    if (!lead) { s.besiegedBy = null; s.siegeProgress = 0; return; }
    if (!atWar(lead.faction, s.faction)) { liftSiege(lead); return; }
    const attackers = S.order.parties.map(i => S.parties[i]).filter(q => q && q.besieging === s.id && q.faction === lead.faction);
    const atkPw = attackers.reduce((a, q) => a + partyPower(q), 0);
    const defPw = settlementDefPower(s);
    s.food = clamp(s.food - dt * 4, 0, 100);
    const ratio = atkPw / Math.max(1, defPw);
    const rate = ratio < 0.3 ? 0.25 : clamp(ratio * 15 * (1 - s.walls / 260) + (s.food < 25 ? 5 : 0), 0.5, 60);
    s.siegeProgress += rate * dt;
    s.prosperity = clamp(s.prosperity - dt * 0.5, 5, 100);
    if (s.siegeProgress >= 100) assault(s, attackers);
  });
}
function assault(s, attackers) {
  if (!attackers.length) { s.besiegedBy = null; s.siegeProgress = 0; return; }
  const atkStack = {};
  attackers.forEach(q => stackMerge(atkStack, q.troops));
  const defStack = stackSnapshot(s.garrison);
  const helpers = garrisonHelpers(s);
  helpers.forEach(q => stackMerge(defStack, q.troops));
  const snapA = stackSnapshot(atkStack), snapB = stackSnapshot(defStack);
  const wallMod = 1 + (s.walls / 100) * (s.type === 'town' ? 0.85 : 0.7);
  const r = fightStacks(atkStack, defStack, 1, wallMod);

  const lossRatioA = r.startA ? (r.startA - stackCount(r.A)) / r.startA : 0;
  attackers.forEach(q => { stackRemove(q.troops, stackCount(q.troops) * lossRatioA); q.morale = clamp(q.morale + (r.winner === 'a' ? 8 : -18), 0, 100); });
  const lossRatioB = r.startB ? (r.startB - stackCount(r.B)) / r.startB : 0;
  stackRemove(s.garrison, stackCount(s.garrison) * lossRatioB);
  helpers.forEach(q => stackRemove(q.troops, stackCount(q.troops) * lossRatioB));

  const cap = attackers[0];
  const defenderLord = s.lordId ? S.lords[s.lordId] : null;
  const rec = recordBattle({
    x: s.x, y: s.y, place: s.name, placeId: s.id, type: 'siege',
    title: `${s.name} kuşatma saldırısı`,
    a: { name: partyLabel(cap) + (attackers.length > 1 ? ` +${attackers.length - 1} ordu` : ''), faction: cap.faction, lordId: cap.lordId,
         start: r.startA, end: stackCount(r.A), loss: r.startA - stackCount(r.A), stack: snapA },
    b: { name: `${s.name} garnizonu`, faction: s.faction, lordId: defenderLord ? defenderLord.id : null,
         start: r.startB, end: stackCount(r.B), loss: r.startB - stackCount(r.B), stack: snapB },
    winner: r.winner, rounds: r.rounds, prisoners: 0
  });

  if (r.winner === 'a') {
    addLog(`🏳 ${s.name} DÜŞTÜ! ${rec.a.name} surları aştı. Saldıran kaybı ${fmt(rec.a.loss)}, savunan ${fmt(rec.b.loss)}.`, 'siege', 2, rec.id);
    helpers.forEach(q => { if (stackCount(q.troops) <= 2) destroyParty(q, cap); else fleeFrom(q, cap); });
    captureSettlement(s, cap);
  } else {
    addLog(`🛡 ${s.name} kuşatmayı püskürttü! Saldıran ${fmt(rec.a.loss)} asker kaybetti.`, 'siege', 2, rec.id);
    attackers.forEach(q => {
      if (stackCount(q.troops) <= 2) destroyParty(q, { faction: s.faction, type: 'lord' });
      else { liftSiege(q); q.cooldown = 2; const home = q.lordId && S.lords[q.lordId] ? homeSettlement(S.lords[q.lordId]) : null; if (home) setGoal(q, 'return', home); }
    });
    s.siegeProgress = 0; s.besiegedBy = null;
  }
  uiDirty.sel = true; uiDirty.kra = true;
}

function captureSettlement(s, cap) {
  const oldF = s.faction;
  const newF = cap.faction;
  const leave = Math.min(stackCount(cap.troops) - 8, Math.round(stackCount(cap.troops) * 0.35));
  s.garrison = {};
  if (leave > 0) stackMerge(s.garrison, stackRemove(cap.troops, leave));
  if (stackCount(s.garrison) < 10) stackMerge(s.garrison, makeStack(S.factions[newF].culture, 20, 0.35));
  changeOwner(s, newF, cap.lordId ? S.lords[cap.lordId] : null);
  s.siegeProgress = 0; s.besiegedBy = null; s.walls = clamp(s.walls - 15, 20, 100);
  s.prosperity = clamp(s.prosperity - 10, 5, 100); s.food = 60; s.unrest = 45;
  S.order.parties.forEach(i => {
    const q = S.parties[i];
    if (q && q.besieging === s.id) { q.besieging = null; q.goal = 'garrison'; q.targetId = s.id; q.tx = null; q.restUntil = S.day + 2; }
  });
  if (S.factions[oldF]) S.factions[oldF].rel[newF] = clamp((S.factions[oldF].rel[newF] || 0) - 12, -100, 100);
  checkFactionAlive(oldF);
  territoryDirty = true; uiDirty.kra = true; uiDirty.sel = true;
}

function changeOwner(s, newF, lord) {
  const old = s.faction;
  s.faction = newF; s.lastOwnerChange = S.day;
  if (s.lordId && S.lords[s.lordId]) S.lords[s.lordId].fiefs = S.lords[s.lordId].fiefs.filter(f => f !== s.id);
  s.lordId = null;
  if (lord && lord.faction === newF) grantFief(s, lord);
  else {
    const cands = S.order.lords.map(i => S.lords[i]).filter(l => l.faction === newF && l.state !== 'dead');
    if (cands.length) {
      cands.sort((a, b) => a.fiefs.length - b.fiefs.length || b.renown - a.renown);
      grantFief(s, cands[0]);
    }
  }
  if (s.type !== 'village') {
    S.order.settlements.forEach(id => {
      const v = S.settlements[id];
      if (v.type === 'village' && v.parentId === s.id) { v.faction = newF; v.lordId = s.lordId; }
    });
  }
  territoryDirty = true;
  return old;
}

function checkFactionAlive(f) {
  const fac = S.factions[f]; if (!fac || fac.isBandit) return;
  const own = ownSettlements(f);
  if (own.length === 0 && fac.alive) {
    fac.alive = false;
    addLog(`💀 ${fac.name} haritadan silindi!`, 'war', 2);
    Object.keys(S.wars).forEach(k => { if (k.split('|').includes(f)) delete S.wars[k]; });
    S.order.lords.forEach(id => {
      const l = S.lords[id];
      if (l.faction === f && l.state !== 'dead') {
        l.state = 'exile';
        if (l.partyId) removeParty(l.partyId);
        l.partyId = null;
      }
    });
    uiDirty.kra = true;
  }
}

/* ---------------- günlük ---------------- */
function settlementIncome(s) {
  const raided = s.raidedUntil > S.day ? 0.15 : 1;
  const base = s.type === 'town' ? 100 + s.prosperity * 6
    : s.type === 'castle' ? 30 + s.prosperity * 1.5
    : 12 + s.prosperity * 1.5;
  return base * raided * (s.besiegedBy ? 0.3 : 1);
}

function dailyTick() {
  S.stats.days++;
  const day = Math.floor(S.day);

  S.order.settlements.forEach(id => {
    const s = S.settlements[id];
    const raided = s.raidedUntil > S.day;
    const target = raided ? 25 : (s.besiegedBy ? 30 : (s.type === 'town' ? 85 : s.type === 'castle' ? 60 : 70));
    s.prosperity = clamp(s.prosperity + (target - s.prosperity) * 0.03 * S.opts.economy, 3, 100);
    if (!s.besiegedBy) s.food = clamp(s.food + 3, 0, 100);
    s.unrest = clamp(s.unrest - 0.6, 0, 100);
    const regen = s.type === 'town' ? 5.5 : s.type === 'castle' ? 2.6 : 4;
    const capR = s.type === 'town' ? 90 : s.type === 'castle' ? 45 : 55;
    s.recruits = clamp(s.recruits + (raided ? 0.25 : 1) * regen * (0.5 + s.prosperity / 120) * S.opts.recruitRate, 0, capR);
    if (s.type !== 'village' && !s.besiegedBy && day % 3 === 0) refillGarrison(s, false);
    if (s.walls < 100 && !s.besiegedBy && s.type !== 'village') s.walls = clamp(s.walls + 0.12, 0, 100);
  });

  Object.values(S.factions).forEach(fac => {
    if (fac.isBandit || !fac.alive) return;
    const mine = ownSettlements(fac.id);
    let inc = 0;
    mine.forEach(s => { inc += settlementIncome(s); });
    inc *= S.opts.economy;
    let wages = 0;
    S.order.parties.forEach(i => { const p = S.parties[i]; if (p && p.faction === fac.id) wages += stackWage(p.troops) * 0.3; });
    mine.forEach(s => { wages += stackWage(s.garrison) * 0.2; });
    S.order.lords.forEach(i => {
      const l = S.lords[i];
      if (l.faction === fac.id && l.state === 'active' && !l.fiefs.length) { wages += 140; l.gold += 140; }
    });
    fac.treasury += Math.round(inc - wages);

    if (fac.treasury > 12000) {
      const budget = fac.treasury * 0.05;
      let spent = 0;
      const forts = mine.filter(s => s.type !== 'village');
      const threatened = forts.filter(s => s.besiegedBy || S.order.parties.some(i => {
        const q = S.parties[i]; return q && atWar(q.faction, fac.id) && dist2(q.x, q.y, s.x, s.y) < 130;
      }));
      const pool = (threatened.length ? threatened : forts)
        .filter(s => stackCount(s.garrison) < garrisonTarget(s) * (s.besiegedBy ? 1.5 : 1.1));
      for (let i = 0; i < 3 && spent < budget && pool.length; i++) {
        const s = pick(pool);
        const room = Math.round(garrisonTarget(s) * 1.4 - stackCount(s.garrison));
        const n = Math.min(30, room, Math.floor((budget - spent) / 90));
        if (n < 4) break;
        stackMerge(s.garrison, makeStack(fac.culture, n, 0.55));
        spent += n * 90;
      }
      const poorLords = S.order.lords.map(i => S.lords[i])
        .filter(l => l.faction === fac.id && l.state === 'active' && l.gold < 2500);
      if (poorLords.length && spent < budget) {
        const each = Math.min(1500, Math.floor((budget - spent) / poorLords.length));
        if (each > 50) { poorLords.forEach(l => { l.gold += each; }); spent += each * poorLords.length; }
      }
      fac.treasury -= Math.round(spent);
    }
    if (fac.treasury < 0) {
      fac.treasury = 0;
      S.order.parties.forEach(i => {
        const p = S.parties[i];
        if (p && p.faction === fac.id && rnd() < 0.15) { stackRemove(p.troops, stackCount(p.troops) * 0.02); p.morale = clamp(p.morale - 2, 0, 100); }
      });
    }
  });

  S.order.parties.forEach(id => {
    const p = S.parties[id]; if (!p) return;
    const lord = p.lordId ? S.lords[p.lordId] : null;
    if (p.type === 'bandit') {
      p.morale = clamp(p.morale + 0.4, 0, 100);
      if (rnd() < 0.02) stackMerge(p.troops, { bd_looter: ri(2, 6) });
      if (p.goal === 'idle' || p.tx == null) banditGoal(p);
      return;
    }
    if (!lord) return;
    const cap = lordPartyCap(lord);
    const cnt = stackCount(p.troops);
    if (p.goal === 'garrison' && p.targetId) {
      const s = S.settlements[p.targetId];
      if (s && s.faction === p.faction) {
        let want = Math.min(cap - cnt, 30 * S.opts.recruitRate);
        if (want > 0) {
          const pools = [s].concat(S.order.settlements.map(i => S.settlements[i])
            .filter(v => v.type === 'village' && v.parentId === s.id && v.faction === s.faction));
          let took = 0;
          for (const src of pools) {
            if (want <= 0) break;
            const take = Math.min(Math.floor(src.recruits), want);
            if (take > 0) { src.recruits -= take; want -= take; took += take; }
          }
          if (took > 0) {
            stackMerge(p.troops, makeStack(S.factions[p.faction].culture, took, 0.12));
            lord.gold -= took * 10;
          }
        }
        p.morale = clamp(p.morale + 3.5, 0, 100);
        if (stackCount(p.prisoners) > 0) { stackMerge(s.prisoners, p.prisoners); p.prisoners = {}; }
        if (S.day > (p.restUntil || 0) && (cnt >= cap * 0.9 || S.day > (p.restUntil || 0) + 4)) { p.goal = 'idle'; p.tx = null; }
      } else { p.goal = 'idle'; p.tx = null; }
    } else {
      p.morale = clamp(p.morale + (p.besieging ? -0.8 : 0.6), 0, 100);
    }
    for (let u = 0; u < 3; u++) if (rnd() < 0.55 * S.opts.recruitRate) upgradeStack(p.troops, lord);
    lord.gold += Math.round(lord.fiefs.reduce((a, f) => {
      const s = S.settlements[f]; if (!s || s.faction !== lord.faction) return a;
      const mult = s.raidedUntil > S.day ? 0.2 : 1;
      return a + (s.type === 'town' ? 200 : s.type === 'castle' ? 70 : 40) * (s.prosperity / 70) * mult;
    }, 0));
    lord.gold -= Math.round(stackWage(p.troops) * 0.3);
    if (lord.gold > 6000 && S.factions[lord.faction]) {
      const tax = Math.round((lord.gold - 6000) * 0.12);
      lord.gold -= tax; S.factions[lord.faction].treasury += tax;
    }
    if (lord.gold < 0) { lord.gold = 0; if (rnd() < 0.3) stackRemove(p.troops, Math.max(1, cnt * 0.03)); }
    if (p.goal === 'idle' || (p.tx == null && !p.besieging && p.goal !== 'garrison')) decideGoal(p);
  });

  S.order.lords.forEach(id => {
    const l = S.lords[id];
    if (l.state === 'prisoner' && S.day >= l.freeAt) releaseLord(l);
    else if (l.state === 'regroup' && S.day >= l.freeAt) {
      if (ownSettlements(l.faction).length) { l.state = 'active'; spawnLordParty(l); }
      else l.freeAt = S.day + 5;
    }
    if (l.state === 'exile' && rnd() < 0.02) tryExileJoin(l);
  });

  if (day % 6 === 0) diplomacyTick();
  if (S.opts.banditSpawn && rnd() < 0.35 * S.opts.banditRate) {
    const bandits = S.order.parties.filter(i => S.parties[i] && S.parties[i].type === 'bandit').length;
    if (bandits < 26 * S.opts.banditRate) spawnBandit();
  }
  if (S.opts.lordDefection && day % 10 === 0) defectionTick();
}

function upgradeStack(st, lord) {
  const keys = Object.keys(st).filter(k => TROOPS[k] && TROOPS[k].up.length && st[k] > 0);
  if (!keys.length) return;
  const k = pick(keys);
  const t = TROOPS[k];
  const n = Math.max(1, Math.round(st[k] * rf(0.05, 0.16)));
  const cost = n * (t.tier * 22);
  if (lord && lord.gold < cost) return;
  if (lord) lord.gold -= cost;
  const to = pick(t.up);
  st[k] -= n; if (st[k] <= 0) delete st[k];
  st[to] = (st[to] || 0) + n;
}

function factionStrength(f) {
  let pw = 0;
  S.order.parties.forEach(i => { const p = S.parties[i]; if (p && p.faction === f) pw += stackPower(p.troops); });
  ownSettlements(f).forEach(s => { pw += stackPower(s.garrison) * 0.6; });
  return pw;
}
function factionTroops(f) {
  let n = 0;
  S.order.parties.forEach(i => { const p = S.parties[i]; if (p && p.faction === f) n += stackCount(p.troops); });
  return n;
}

function diplomacyTick() {
  const live = Object.values(S.factions).filter(f => !f.isBandit && f.alive);
  live.forEach(fac => {
    const wars = live.filter(o => o.id !== fac.id && atWar(fac.id, o.id));
    if (S.opts.autoPeace && wars.length) {
      wars.forEach(o => {
        const k = warKey(fac.id, o.id);
        const dur = S.day - (S.wars[k] ? S.wars[k].since : S.day);
        const my = factionStrength(fac.id), his = factionStrength(o.id);
        const desperate = my < his * 0.5 || ownSettlements(fac.id).filter(s => s.type === 'town').length <= 1;
        const losing = my < his * 0.75;
        const chance = clamp((dur - 30) / 350 + (losing ? 0.12 : 0) + (desperate ? 0.35 : 0) + (wars.length > 1 ? 0.1 : 0), 0, 0.75);
        if (dur > 15 && rnd() < chance) makePeace(fac.id, o.id);
      });
    }
    if (wars.length < 2 && rnd() < 0.16 * fac.aggr * S.opts.aggression) {
      const cands = live.filter(o => o.id !== fac.id && !atWar(fac.id, o.id));
      if (cands.length) {
        const my = factionStrength(fac.id);
        cands.sort((a, b) => (factionStrength(a.id) + (fac.rel[a.id] || 0) * 30) - (factionStrength(b.id) + (fac.rel[b.id] || 0) * 30));
        const t = cands[0];
        const theirWars = live.filter(o => o.id !== t.id && atWar(t.id, o.id)).length;
        if (theirWars < 2 && factionStrength(t.id) < my * 1.25 && (fac.rel[t.id] || 0) < 25) declareWar(fac.id, t.id);
      }
    }
    const en = enemyFactions(fac.id);
    if (en.length) {
      const t = pickCampaignTarget(fac.id, en);
      fac.target = t ? t.id : null;
      /* mareşal seç: kral sahadaysa kral, değilse en şöhretli lord */
      const cands = S.order.lords.map(i => S.lords[i])
        .filter(l => l.faction === fac.id && l.state === 'active' && l.partyId);
      if (cands.length) {
        cands.sort((a, b) => (b.isKing ? 500 : 0) + b.renown - ((a.isKing ? 500 : 0) + a.renown));
        if (fac.marshalId !== cands[0].id) {
          fac.marshalId = cands[0].id;
          if (rnd() < 0.5) addLog(`${cands[0].title} ${cands[0].name}, ${fac.name} ordularının mareşali oldu.`, '', 1);
        }
      } else fac.marshalId = null;
    } else { fac.target = null; fac.marshalId = null; }
  });
  uiDirty.kra = true;
}

function defectionTick() {
  S.order.lords.forEach(id => {
    const l = S.lords[id];
    if (l.isKing || l.state === 'dead' || l.state === 'exile') return;
    const pers = PERSONALITIES.find(p => p.id === l.personality) || PERSONALITIES[0];
    l.relKing += (l.fiefs.length ? 1.2 : -1.4) * pers.loyal * 0.6 + rf(-1.5, 1.5);
    l.relKing = clamp(l.relKing, -100, 100);
    if (l.relKing < -45 && rnd() < 0.1) {
      const others = Object.values(S.factions).filter(f => !f.isBandit && f.alive && f.id !== l.faction && !atWar(f.id, l.faction));
      if (others.length) defect(l, pick(others).id);
    }
  });
  uiDirty.kra = true;
}

function defect(l, toFaction) {
  const from = l.faction;
  const fiefs = l.fiefs.slice();
  l.faction = toFaction; l.relKing = ri(-5, 25);
  l.title = S.factions[toFaction].lordTitle;
  if (l.partyId && S.parties[l.partyId]) S.parties[l.partyId].faction = toFaction;
  fiefs.forEach(f => { const s = S.settlements[f]; if (s) s.faction = toFaction; });
  addLog(`🕊 ${l.title} ${l.name}, ${factionName(from)} krallığından ayrılıp ${factionName(toFaction)} saflarına geçti (${fiefs.length} tımarıyla).`, 'peace', 2);
  territoryDirty = true; checkFactionAlive(from);
  uiDirty.kra = true;
}

function tryExileJoin(l) {
  const others = Object.values(S.factions).filter(f => !f.isBandit && f.alive);
  if (!others.length) return;
  const to = pick(others);
  l.faction = to.id; l.state = 'regroup'; l.freeAt = S.day + 2; l.relKing = ri(0, 20);
  l.title = to.lordTitle; l.fiefs = [];
  addLog(`${l.title} ${l.name} sürgünden dönüp ${to.name} hizmetine girdi.`, '', 1);
}

function facDot(f) { const c = S.factions[f] ? S.factions[f].color : '#888'; return `<span class="dot" style="background:${c}"></span>`; }
function facName(f) { return S.factions[f] ? S.factions[f].name : '—'; }
function facShort(f) { return S.factions[f] ? S.factions[f].short : '—'; }
function facColor(f) { return S.factions[f] ? S.factions[f].color : '#888'; }
function bar(v, max, color) {
  const p = clamp(v / (max || 100) * 100, 0, 100);
  return `<div class="bar"><i style="width:${p}%;background:${color || 'var(--accent)'}"></i></div>`;
}
function stat(k, v, sub) {
  return `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${v}</div>${sub ? `<div class="k">${esc(sub)}</div>` : ''}</div>`;
}
function sect(id, title, body, defOpen) {

const TYPE_ICON = { town: '🏛', castle: '🏰', village: '🏘' };

function troopLines(st, limit) {
  const e = Object.entries(st).filter(x => x[1] > 0)
    .sort((a, b) => (TROOPS[b[0]] ? TROOPS[b[0]].tier : 0) - (TROOPS[a[0]] ? TROOPS[a[0]].tier : 0));
  if (!e.length) return '<div class="small muted">Asker yok</div>';
  const list = limit ? e.slice(0, limit) : e;
  const tot = stackCount(st);
  return `<table class="tbl">${list.map(([k, v]) => {
    const t = TROOPS[k];
    return `<tr><td>${esc(t ? t.name : k)}</td><td class="small muted">T${t ? t.tier : '?'}</td>
      <td class="n">${fmt(v)}</td><td style="width:34%">${bar(v, tot, facColorOfTroop(t))}</td></tr>`;
  }).join('')}${limit && e.length > limit ? `<tr><td colspan="4" class="small muted">+${e.length - limit} tür daha</td></tr>` : ''}</table>`;
}
function facColorOfTroop(t) {
  if (!t) return 'var(--accent)';
  return t.cls === 'cav' ? '#c98a3a' : t.cls === 'arch' ? '#6f9e5a' : '#7d90b8';
}
function stateLabel(l) {
  return { active:'Sahada', prisoner:'Esir', regroup:'Toparlanıyor', dead:'Ölü', exile:'Sürgün' }[l.state] || l.state;
}
function goalLabel(p) {
  if (p.besieging) { const s = S.settlements[p.besieging]; return `${s ? s.name : '?'} kuşatmasında`; }
  const t = p.targetId ? S.settlements[p.targetId] : null;
  if (p.goal === 'follow') {
    const lead = S.parties[p.targetId];
    return lead ? `${partyLabel(lead)} ordusuna katılıyor` : 'Orduya katılıyor';
  }
  const m = {
    patrol:'Devriyede', raid:'Yağmaya gidiyor', siege:'Kuşatmaya gidiyor', defend:'Savunmaya koşuyor',
    return:'Tımarına dönüyor', garrison:'Konaklıyor', flee:'Çekiliyor', roam:'Dolaşıyor', idle:'Bekliyor'
  };
  return (m[p.goal] || p.goal) + (t ? ` — ${t.name}` : '');
}

/* ---------- ana render ---------- */
let lastUiRender = 0;
function renderUI(force) {
  const now = performance.now();
  if (!force && now - lastUiRender < 300) return;
  lastUiRender = now;
  const act = document.activeElement;
  const inPane = act && act.closest && act.closest('.panes') && ['INPUT','SELECT','TEXTAREA'].includes(act.tagName);
  if (inPane && !force) { renderLog(); renderTop(); return; }
  const pane = ui.tab;
  if (pane === 'sel' && (uiDirty.sel || force)) { $('#paneSel').innerHTML = viewSel(); uiDirty.sel = false; }
  if (pane === 'kra' && (uiDirty.kra || force)) { $('#paneKra').innerHTML = viewKra(); bindKraInputs(); uiDirty.kra = false; }
  if (pane === 'war' && (uiDirty.war || force)) { $('#paneWar').innerHTML = viewWar(); uiDirty.war = false; }
  if (pane === 'box' && (uiDirty.box || force)) { renderBox(); uiDirty.box = false; }
  renderTop(); renderLog(); renderLegend(); renderAlert();
}

function renderTop() {
  const c = calendar(S.day);
  $('#tbDate').textContent = `${c.dayOfMonth} ${c.month} ${c.year}`;
  $('#tbSeason').textContent = `· ${c.season}`;
}

let lastLogKey = '';
function renderLog() {
  const key = S.log.length + '|' + (S.log[0] ? S.log[0].m : '') + '|' + ui.logFilter;
  if (!logDirty && key === lastLogKey) return;
  logDirty = false; lastLogKey = key;
  const imp = S.log.filter(l => l.i >= 1);
  $('#logLatest').textContent = imp[0] ? imp[0].m : (S.log[0] ? S.log[0].m : '—');
  $('#logList').innerHTML = logLines(imp.slice(0, 40));
}

      <tr><td>Moral</td><td class="n">${Math.round(p.morale)}</td><td>${bar(p.morale, 100, 'var(--success)')}</td></tr>

    <h3>Komutlar</h3>

  ${sect('edit', '✎ Bütün özellikleri düzenle', `
    ${fText('İsim', 'lord', l.id, 'name')}
    ${fText('Unvan', 'lord', l.id, 'title')}
    ${fSel('Krallık', 'lord', l.id, 'faction', facOpts())}
    ${fSel('Kişilik', 'lord', l.id, 'personality', PERSONALITIES.map(x => ({ v: x.id, t: `${x.name} — ${x.desc}` })))}
    <div class="grid2">
      ${fNum('Şöhret', 'lord', l.id, 'renown', 0, 5000, 10)}
      ${fNum('Altın', 'lord', l.id, 'gold', 0, 9999999, 100)}
      ${fNum('Krala bağlılık', 'lord', l.id, 'relKing', -100, 100, 1)}

}

}

function viewSettlement(s) {
  if (!s) return '<div class="card">Yerleşim bulunamadı.</div>';
  const owner = s.lordId ? S.lords[s.lordId] : null;
  const kids = S.order.settlements.map(i => S.settlements[i]).filter(v => v.parentId === s.id);
  const nearby = S.order.parties.map(i => S.parties[i]).filter(p => p && dist2(p.x, p.y, s.x, s.y) < 50);
  const hist = S.battles.filter(b => b.placeId === s.id).slice(0, 3);
  const bp = s.besiegedBy ? S.parties[s.besiegedBy] : null;
  return `
  <div class="hero">
    <div class="crest" style="background:${hexRGBA(facColor(s.faction), .22)};border-color:${facColor(s.faction)}">${TYPE_ICON[s.type]}</div>
    <div class="grow"><h2>${esc(s.name)}</h2>
      <div class="sub2">${TYPE_TR[s.type]} · ${esc(facName(s.faction))}${owner ? ' · ' + esc(owner.title) + ' ' + esc(owner.name) : ' · sahipsiz'}</div></div>
  </div>
  ${s.besiegedBy ? `<div class="card" style="border-color:var(--danger)">
    <h3 style="color:var(--danger)">⚔ Kuşatma altında</h3>
    <table class="tbl">
      <tr><td>Kuşatan</td><td>${bp ? esc(partyLabel(bp)) + ' — ' + esc(facName(bp.faction)) : '?'}</td></tr>
      <tr><td>Saldıran gücü</td><td class="n">${fmt(S.order.parties.map(i => S.parties[i]).filter(q => q && q.besieging === s.id).reduce((a, q) => a + stackCount(q.troops), 0))} asker</td></tr>
      <tr><td>Savunan</td><td class="n">${fmt(settlementDefCount(s))} asker</td></tr>
      <tr><td>İlerleme</td><td>${bar(s.siegeProgress, 100, 'var(--danger)')}</td></tr>
      <tr><td>Erzak</td><td>${bar(s.food, 100, 'var(--accent)')}</td></tr>
    </table>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm" data-act="breakSiege" data-id="${s.id}">Kuşatmayı kaldır</button>
      <button class="btn sm danger" data-act="stormNow" data-id="${s.id}">Hemen saldırsınlar</button>
    </div>
  </div>` : ''}
  <div class="statgrid">
    ${stat('Refah', Math.round(s.prosperity))}
    ${s.type !== 'village' ? stat('Garnizon', fmt(stackCount(s.garrison))) : stat('Asker havuzu', Math.round(s.recruits))}
    ${stat('Gelir', fmt(settlementIncome(s) * S.opts.economy), 'dinar/gün')}
  </div>
  <div class="card">
    <table class="tbl">
      <tr><td>Refah</td><td class="n">${Math.round(s.prosperity)}</td><td style="width:45%">${bar(s.prosperity, 100, 'var(--success)')}</td></tr>
      ${s.type !== 'village' ? `<tr><td>Surlar</td><td class="n">${Math.round(s.walls)}</td><td>${bar(s.walls, 100, 'var(--info)')}</td></tr>
      <tr><td>Erzak</td><td class="n">${Math.round(s.food)}</td><td>${bar(s.food, 100, 'var(--accent)')}</td></tr>` : ''}
      <tr><td>Asker havuzu</td><td class="n">${Math.round(s.recruits)}</td><td class="small muted">huzursuzluk ${Math.round(s.unrest)}</td></tr>
      ${s.raidedUntil > S.day ? `<tr><td colspan="3"><span class="tag war">Yağmalandı — ${Math.ceil(s.raidedUntil - S.day)} gün toparlanacak</span></td></tr>` : ''}
    </table>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm" data-act="focus">Haritada bul</button>
      ${s.type !== 'village' ? `<button class="btn sm" data-act="troopEditor" data-kind="settlement" data-id="${s.id}">Garnizon</button>
      <button class="btn sm" data-act="reinforce" data-id="${s.id}">+60 asker</button>` : ''}
      <button class="btn sm" data-act="giveFief" data-id="${s.id}">Tımar ver</button>
      <button class="btn sm" data-act="stlMove" data-id="${s.id}">Haritada taşı</button>
      <button class="btn sm danger" data-act="stlDelete" data-id="${s.id}">Sil</button>
    </div>
  </div>
  ${s.type !== 'village' ? `<div class="card"><h3>Garnizon <span class="sub">${fmt(stackCount(s.garrison))} asker · savunma gücü ${fmt(settlementDefPower(s))}</span></h3>
    ${troopLines(s.garrison, 7)}
    ${stackCount(s.prisoners) ? `<div class="small muted" style="margin-top:6px">Zindanda ${fmt(stackCount(s.prisoners))} esir</div>` : ''}</div>` : ''}
  ${kids.length ? `<div class="card"><h3>Bağlı köyler</h3><div class="list">
    ${kids.map(v => `<div class="item" data-act="selStl" data-id="${v.id}">${facDot(v.faction)}
      <div class="grow"><div class="t">${esc(v.name)}</div><div class="s">refah ${Math.round(v.prosperity)}${v.raidedUntil > S.day ? ' · yağmalandı' : ''}</div></div>
      <div class="num small">${Math.round(v.recruits)} asker</div></div>`).join('')}</div></div>` : ''}
  ${nearby.length ? `<div class="card"><h3>Yakındaki ordular</h3><div class="list">
    ${nearby.slice(0, 6).map(p => `<div class="item" data-act="selParty" data-id="${p.id}">${facDot(p.faction)}
      <div class="grow"><div class="t">${esc(partyLabel(p))}</div><div class="s">${esc(goalLabel(p))}</div></div>
      <div class="num small">${fmt(stackCount(p.troops))}</div></div>`).join('')}</div></div>` : ''}
  ${hist.length ? `<div class="card"><h3>Burada olanlar</h3><div class="list">${hist.map(b => battleItem(b)).join('')}</div></div>` : ''}
  ${sect('edit', '✎ Bütün özellikleri düzenle', `
    ${fText('İsim', 'settlement', s.id, 'name')}
    ${fSel('Sahip krallık', 'settlement', s.id, 'faction', facOpts())}
    ${fSel('Tımar sahibi', 'settlement', s.id, 'lordId', [{ v:'', t:'— sahipsiz —' }].concat(
      S.order.lords.map(i => S.lords[i]).filter(l => l.faction === s.faction && l.state !== 'dead').map(l => ({ v: l.id, t: `${l.title} ${l.name}` }))))}
    ${fSel('Tür', 'settlement', s.id, 'type', [{ v:'town', t:'Şehir' }, { v:'castle', t:'Kale' }, { v:'village', t:'Köy' }])}
    <div class="grid2">
      ${fNum('Refah', 'settlement', s.id, 'prosperity', 0, 100, 1)}
      ${fNum('Surlar', 'settlement', s.id, 'walls', 0, 100, 1)}
      ${fNum('Erzak', 'settlement', s.id, 'food', 0, 100, 1)}
      ${fNum('Asker havuzu', 'settlement', s.id, 'recruits', 0, 300, 1)}
      ${fNum('Huzursuzluk', 'settlement', s.id, 'unrest', 0, 100, 1)}
      ${fNum('Kuşatma %', 'settlement', s.id, 'siegeProgress', 0, 100, 1)}
    </div>`)}`;
}

  const own = ownSettlements(f.id);
  const lords = S.order.lords.map(i => S.lords[i]).filter(l => l.faction === f.id && l.state !== 'dead');
  const wars = Object.keys(S.factions).filter(o => atWar(f.id, o));
  const marshal = f.marshalId ? S.lords[f.marshalId] : null;
  return `
  <div class="hero">
    <div class="crest" style="background:${hexRGBA(f.color, .25)};border-color:${f.color}">🛡</div>
    <div class="grow"><h2>${esc(f.name)}</h2>
      <div class="sub2">${king ? esc(king.title) + ' ' + esc(king.name) : 'hükümdarsız'} · ${lords.length} lord${f.alive ? '' : ' · yıkıldı'}</div></div>
  </div>
  <div class="statgrid">
    ${stat('Toprak', own.length, `${own.filter(s => s.type === 'town').length} şehir / ${own.filter(s => s.type === 'castle').length} kale`)}

  <div class="card">
    <table class="tbl">
      <tr><td>Askerî güç</td><td class="n">${fmt(factionStrength(f.id))}</td></tr>
      <tr><td>Mareşal</td><td>${marshal ? `<span class="tag" data-act="selLord" data-id="${marshal.id}" style="cursor:pointer">${esc(marshal.title)} ${esc(marshal.name)}</span>` : '—'}</td></tr>
      <tr><td>Sefer hedefi</td><td>${f.target && S.settlements[f.target] ? `<span class="tag" data-act="selStl" data-id="${f.target}" style="cursor:pointer">${esc(S.settlements[f.target].name)}</span>` : '—'}</td></tr>
      <tr><td>Durum</td><td>${wars.length ? wars.map(w => `<span class="tag war">⚔ ${esc(facShort(w))}</span>`).join(' ') : '<span class="tag peace">Barış</span>'}</td></tr>
    </table>
    <div class="btnrow" style="margin-top:8px">

      <button class="btn sm" data-act="facTreasury" data-id="${f.id}">+50.000 dinar</button>
      <button class="btn sm" data-act="gfArmyFor" data-id="${f.id}">Orduları tamamla</button>
    </div>
  </div>
  <div class="card"><h3>Lordları</h3><div class="list">
    ${lords.sort((a, b) => (b.isKing ? 1e6 : 0) + b.renown - ((a.isKing ? 1e6 : 0) + a.renown)).slice(0, 20).map(l => lordItem(l)).join('')}
  </div></div>
  ${sect('fstl', `Toprakları (${own.length})`, `<div class="list">${own.slice(0, 60).map(s => `
    <div class="item" data-act="selStl" data-id="${s.id}">${facDot(s.faction)}
      <div class="grow"><div class="t">${TYPE_ICON[s.type]} ${esc(s.name)}</div><div class="s">${TYPE_TR[s.type]} · refah ${Math.round(s.prosperity)}</div></div></div>`).join('')}</div>`)}
  ${sect('edit', '✎ Krallığı düzenle', `
    ${fText('Krallık adı', 'faction', f.id, 'name')}
    ${fText('Kısa ad', 'faction', f.id, 'short')}
    ${fText('Hükümdar unvanı', 'faction', f.id, 'rulerTitle')}
    ${fText('Lord unvanı', 'faction', f.id, 'lordTitle')}
    ${fSel('Hükümdar', 'faction', f.id, 'kingId', lords.map(l => ({ v: l.id, t: `${l.title} ${l.name}` })))}
    ${fSel('Kültür (birlik ağacı)', 'faction', f.id, 'culture', [
      { v:'sw', t:'Swadya' }, { v:'vg', t:'Vaegir' }, { v:'kh', t:'Kherjit' },
      { v:'nd', t:'Nord' }, { v:'rh', t:'Rodok' }, { v:'sr', t:'Sarranid' }])}
    <div class="grid2">
      ${fNum('Hazine', 'faction', f.id, 'treasury', 0, 99999999, 500)}
      ${fNum('Saldırganlık', 'faction', f.id, 'aggr', 0, 1.5, 0.05)}

    <label class="f"><span>Renk</span><input type="color" value="${f.color}" data-edit="faction|${f.id}|color|color"></label>
    <div class="btnrow"><button class="btn sm danger" data-act="facDestroy" data-id="${f.id}">Krallığı yık</button></div>`)}`;
}

function lordItem(l) {
  const p = l.partyId ? S.parties[l.partyId] : null;
  return `<div class="item" data-act="selLord" data-id="${l.id}">${facDot(l.faction)}
    <div class="grow"><div class="t">${l.isKing ? '👑 ' : ''}${esc(l.title)} ${esc(l.name)}</div>
    <div class="s">${esc(stateLabel(l))} · ${l.fiefs.length} tımar · şöhret ${fmt(l.renown)}</div></div>
    <div class="num small">${p ? fmt(stackCount(p.troops)) : '—'}</div></div>`;
}

/* =====================  KRALLIKLAR  ===================== */
function viewKra() {
  const live = Object.values(S.factions).filter(f => !f.isBandit);
  const ranked = live.map(f => ({ f, own: ownSettlements(f.id), str: factionStrength(f.id) })).sort((a, b) => b.str - a.str);
  const maxStr = Math.max(1, ...ranked.map(r => r.str));
  const alive = live.filter(f => f.alive);
  const wars = Object.entries(S.wars).map(([k, v]) => { const [a, b] = k.split('|'); return { a, b, days: Math.floor(S.day - v.since) }; });

  let lords = S.order.lords.map(i => S.lords[i]);
  if (ui.lordFac) lords = lords.filter(l => l.faction === ui.lordFac);
  if (ui.lordQuery) { const q = ui.lordQuery.toLocaleLowerCase('tr'); lords = lords.filter(l => l.name.toLocaleLowerCase('tr').includes(q)); }
  lords.sort((a, b) => (b.isKing ? 1e6 : 0) + b.renown - ((a.isKing ? 1e6 : 0) + a.renown));

  return `
  <div class="card">
    <h3>Krallıklar</h3>
    <div class="list">
      ${ranked.map(r => `<div class="item" data-act="selFac" data-id="${r.f.id}">
        <span class="dot" style="background:${r.f.color}"></span>
        <div class="grow"><div class="t">${esc(r.f.name)}${r.f.alive ? '' : ' <span class="tag war">yıkıldı</span>'}</div>
          <div class="s">${r.own.filter(s => s.type === 'town').length} şehir · ${r.own.filter(s => s.type === 'castle').length} kale · ${fmt(factionTroops(r.f.id))} asker</div>
          <div style="margin-top:4px">${bar(r.str, maxStr, r.f.color)}</div></div>
      </div>`).join('')}
    </div>
  </div>

  <div class="card">
    <h3>Savaş durumu <span class="sub">${wars.length} savaş</span></h3>
    ${wars.length ? `<div class="list" style="margin-bottom:8px">${wars.map(w => `<div class="item">
      ${facDot(w.a)}<div class="grow"><div class="t">${esc(facShort(w.a))} ⚔ ${esc(facShort(w.b))}</div><div class="s">${w.days} gündür sürüyor</div></div>
      <button class="btn sm" data-act="peace" data-a="${w.a}" data-b="${w.b}">Barıştır</button></div>`).join('')}</div>`
      : '<div class="small muted" style="margin-bottom:8px">Kalradya şu an barış içinde.</div>'}
    <div class="small muted" style="margin-bottom:4px">Tabloda bir hücreye tıkla — savaş açar ya da barıştırır.</div>
    <div style="overflow-x:auto"><table class="tbl">
      <tr><th></th>${alive.map(f => `<th class="n" title="${esc(f.name)}">${esc(f.short.slice(0, 4))}</th>`).join('')}</tr>
      ${alive.map(a => `<tr><td><b>${facDot(a.id)} ${esc(a.short)}</b></td>${alive.map(b => a.id === b.id ? '<td class="n muted">—</td>'
        : `<td class="n"><span class="tag ${atWar(a.id, b.id) ? 'war' : 'peace'}" style="cursor:pointer" data-act="toggleWar" data-a="${a.id}" data-b="${b.id}">${atWar(a.id, b.id) ? '⚔' : '🕊'}</span></td>`).join('')}</tr>`).join('')}
    </table></div>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm" data-act="allPeace">Tüm savaşları bitir</button>
      <button class="btn sm danger" data-act="allWar">Herkesi savaştır</button>
    </div>
  </div>

  <div class="card">
    <h3>Lordlar <span class="sub">${lords.length}</span></h3>
    <div class="grid2">
      <label class="f"><span>Ara</span><input type="text" id="lrdQ" value="${esc(ui.lordQuery)}" placeholder="Lord adı"></label>
      <label class="f"><span>Krallık</span><select id="lrdFac"><option value="">Hepsi</option>
        ${live.map(f => `<option value="${f.id}" ${ui.lordFac === f.id ? 'selected' : ''}>${esc(f.short)}</option>`).join('')}</select></label>
    </div>
    <div class="list">${lords.slice(0, 60).map(l => lordItem(l)).join('')}</div>
  </div>`;
}

function bindKraInputs() {
  const q = $('#lrdQ');
  if (q) q.oninput = e => { ui.lordQuery = e.target.value; uiDirty.kra = true; renderUI(true); const n = $('#lrdQ'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
  const f = $('#lrdFac');
  if (f) f.onchange = e => { ui.lordFac = e.target.value; uiDirty.kra = true; renderUI(true); };
}

/* =====================  SAVAŞLAR  ===================== */
function viewWar() {
  const filters = [['all','Hepsi'],['war','Savaş'],['siege','Kuşatma'],['peace','Diplomasi']];
  const list = S.log.filter(l => ui.logFilter === 'all' ? true : l.k === ui.logFilter);
  return `
  <div class="card">
    <h3>Savaş defteri <span class="sub">${S.battles.length} kayıt · toplam ${fmt(S.stats.battles)} çarpışma</span></h3>
    ${S.battles.length ? `<div class="list">${S.battles.slice(0, 25).map(b => battleItem(b)).join('')}</div>`
      : '<div class="small muted">Henüz kayda değer bir çarpışma olmadı.</div>'}

function startReplay(b) {
  stopReplay();
  const cvs = $('#btCanvas'); if (!cvs) return;
  const dp = Math.min(2, window.devicePixelRatio || 1);
  const W = cvs.clientWidth, H = cvs.clientHeight;
  cvs.width = W * dp; cvs.height = H * dp;
  const g = cvs.getContext('2d');
  g.setTransform(dp, 0, 0, dp, 0, 0);

  const MAXDOTS = 90;
  const mk = (side, stack, total) => {
    const n = Math.max(1, Math.min(MAXDOTS, Math.round(total / Math.max(1, total / MAXDOTS))));
    const dots = [];
    const comp = [];
    Object.entries(stack || {}).forEach(([k, v]) => { const t = TROOPS[k]; if (t && v > 0) comp.push({ cls: t.cls, n: v, tier: t.tier }); });
    const tot = comp.reduce((a, c) => a + c.n, 0) || 1;
    const cols = 6, rows = Math.ceil(n / cols);
    for (let i = 0; i < n; i++) {
      const col = Math.floor(i / rows), row = i % rows;
      let r = rnd() * tot, cls = 'inf', tier = 2;
      for (const c of comp) { r -= c.n; if (r <= 0) { cls = c.cls; tier = c.tier; break; } }
      dots.push({
        row, col, cls, tier, alive: true, deadAt: 0,
        hx: side === 'a' ? -1 : 1, jitter: rf(-3, 3)
      });
    }
    return { dots, rows, cols };
  };
  const A = mk('a', b.a.stack, b.a.start), B = mk('b', b.b.stack, b.b.start);
  const rounds = b.rounds && b.rounds.length ? b.rounds : [{ a: b.a.start, b: b.b.start }];
  const dur = 1200 + Math.min(7000, rounds.length * 260);
  const t0 = performance.now();

  const colFor = (faction, cls, tier) => {
    const base = facColor(faction);
    const f = cls === 'cav' ? 1.15 : cls === 'arch' ? 0.75 : 0.95;
    return darken(base, clamp(f * (0.75 + tier * 0.06), 0.35, 1.25));
  };

  function drawSide(side, pack, faction, phase, aliveRatio) {
    const midY = H / 2;
    const spacing = Math.min(15, (H - 26) / Math.max(1, pack.rows));
    const clashX = side === 'a' ? W / 2 - 11 : W / 2 + 11;
    const startX = side === 'a' ? 22 : W - 22;
    const aliveCount = Math.round(pack.dots.length * aliveRatio);
    pack.dots.forEach((d, i) => {
      if (i >= aliveCount && d.alive) { d.alive = false; d.deadAt = phase; }
      const depth = d.col * (side === 'a' ? -1 : 1) * 11;
      const x = startX + (clashX - startX) * Math.min(1, phase * 3.2) + depth;
      const y = midY + (d.row - pack.rows / 2 + 0.5) * spacing + d.jitter * 0.35;
      if (!d.alive) {
        g.globalAlpha = clamp(0.35 - (phase - d.deadAt) * 0.5, 0, 0.35);
        g.strokeStyle = '#20140c'; g.lineWidth = 1.6;
        g.beginPath(); g.moveTo(x - 3, y - 3); g.lineTo(x + 3, y + 3); g.moveTo(x + 3, y - 3); g.lineTo(x - 3, y + 3); g.stroke();
        g.globalAlpha = 1;
        return;
      }
      const wob = Math.sin((performance.now() / 220) + i) * (phase > 0.3 ? 1.2 : 0);
      g.fillStyle = colFor(faction, d.cls, d.tier);
      g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 1;
      if (d.cls === 'cav') {
        g.beginPath(); g.ellipse(x + wob, y, 5.2, 3.4, 0, 0, Math.PI * 2); g.fill(); g.stroke();
      } else if (d.cls === 'arch') {
        g.beginPath(); g.moveTo(x + wob, y - 4.4); g.lineTo(x + wob + 3.8, y + 3.2); g.lineTo(x + wob - 3.8, y + 3.2); g.closePath(); g.fill(); g.stroke();
      } else {
        g.beginPath(); g.rect(x + wob - 3.4, y - 4, 6.8, 8); g.fill(); g.stroke();
      }
    });
  }

  function frame(now) {
    const t = clamp((now - t0) / dur, 0, 1);
    const ri2 = Math.min(rounds.length - 1, Math.floor(t * rounds.length));
    const ra = rounds[ri2].a / Math.max(1, b.a.start), rb = rounds[ri2].b / Math.max(1, b.b.start);
    g.clearRect(0, 0, W, H);
    /* zemin */
    const grd = g.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, 'rgba(255,255,255,.05)'); grd.addColorStop(1, 'rgba(0,0,0,.20)');
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    if (b.type === 'siege') {
      g.fillStyle = 'rgba(0,0,0,.22)';
      g.fillRect(W / 2 + 12, 8, W / 2 - 20, H - 16);
      g.strokeStyle = 'rgba(240,233,220,.35)'; g.lineWidth = 2;
      g.strokeRect(W / 2 + 12, 8, W / 2 - 20, H - 16);
    }
    /* çarpışma hattı */
    if (t > 0.28) {
      const pulse = 0.35 + Math.abs(Math.sin(now / 260)) * 0.4;
      const lg = g.createLinearGradient(W / 2 - 26, 0, W / 2 + 26, 0);
      lg.addColorStop(0, 'rgba(255,180,90,0)');
      lg.addColorStop(0.5, `rgba(255,190,110,${0.22 * pulse})`);
      lg.addColorStop(1, 'rgba(255,180,90,0)');
      g.fillStyle = lg; g.fillRect(W / 2 - 26, 6, 52, H - 12);
    }
    drawSide('a', A, b.a.faction, t, ra);
    drawSide('b', B, b.b.faction, t, rb);
    /* rakamlar */
    g.font = '600 12px system-ui, sans-serif';
    g.fillStyle = facColor(b.a.faction); g.textAlign = 'left';
    g.fillText(fmt(rounds[ri2].a), 10, 16);
    g.fillStyle = facColor(b.b.faction); g.textAlign = 'right';
    g.fillText(fmt(rounds[ri2].b), W - 10, 16);
    const pr = $('#btProg'), rd = $('#btRound');
    if (pr) pr.style.width = (t * 100) + '%';
    if (rd) rd.textContent = `tur ${ri2 + 1}/${rounds.length}`;
    if (t < 1 && dlg.open) replay.raf = requestAnimationFrame(frame);
    else replay = null;
  }
  replay = { raf: requestAnimationFrame(frame) };
}

function troopEditor(kind, id) {
  const target = kind === 'party' ? S.parties[id] : S.settlements[id];
  if (!target) return;
  const stack = kind === 'party' ? target.troops : target.garrison;
  const culture = S.factions[target.faction] ? S.factions[target.faction].culture : 'sw';
  const render = () => {
    const rows = Object.entries(stack).filter(e => e[1] > 0)
      .sort((a, b) => (TROOPS[b[0]] ? TROOPS[b[0]].tier : 0) - (TROOPS[a[0]] ? TROOPS[a[0]].tier : 0))
      .map(([k, v]) => `<tr><td>${esc(TROOPS[k] ? TROOPS[k].name : k)}</td><td class="small muted">T${TROOPS[k] ? TROOPS[k].tier : '?'}</td>
        <td class="n"><input type="number" value="${v}" min="0" max="99999" data-troop="${k}" style="width:88px;text-align:right"></td></tr>`).join('');
    const opts = Object.values(TROOPS).sort((a, b) => a.culture.localeCompare(b.culture) || a.tier - b.tier)
      .map(t => `<option value="${t.id}">${esc(t.name)} (T${t.tier})</option>`).join('');
    $('#dlgBody').innerHTML = `
      <div class="small muted" style="margin-bottom:8px">${esc(kind === 'party' ? partyLabel(target) : target.name)} — toplam <b>${fmt(stackCount(stack))}</b> asker, güç ${fmt(stackPower(stack))}</div>
      <table class="tbl">${rows || '<tr><td class="small muted">Boş</td></tr>'}</table>
      <div class="row" style="gap:6px;margin-top:10px">
        <select id="teType" class="grow">${opts}</select>
        <input type="number" id="teN" value="20" min="1" max="9999" style="width:90px">
        <button class="btn sm" id="teAdd">Ekle</button>
      </div>
      <div class="btnrow" style="margin-top:8px">
        <button class="btn sm" id="teFill">Kültür ordusu (+100)</button>
        <button class="btn sm" id="teUp">Hepsini terfi ettir</button>
        <button class="btn sm danger" id="teClear">Boşalt</button>
      </div>`;
    $$('#dlgBody input[data-troop]').forEach(inp => {
      inp.onchange = e => {
        const k = e.target.dataset.troop, v = Math.max(0, Math.round(+e.target.value || 0));
        if (v === 0) delete stack[k]; else stack[k] = v;
        uiDirty.sel = true; render(); requestDraw();
      };
    });
    $('#teAdd').onclick = () => { const k = $('#teType').value, n = Math.max(1, +$('#teN').value || 1);
      stack[k] = (stack[k] || 0) + n; render(); uiDirty.sel = true; requestDraw(); };
    $('#teFill').onclick = () => { stackMerge(stack, makeStack(culture, 100, 0.55)); render(); uiDirty.sel = true; requestDraw(); };
    $('#teUp').onclick = () => { for (let i = 0; i < 12; i++) upgradeStack(stack, null); render(); uiDirty.sel = true; requestDraw(); };
    $('#teClear').onclick = () => { Object.keys(stack).forEach(k => delete stack[k]); render(); uiDirty.sel = true; requestDraw(); };
  };
  openDlg(kind === 'party' ? 'Askerleri düzenle' : 'Garnizonu düzenle', '', [{ t: 'Tamam', cls: 'primary', fn: () => { dlg.close(); renderUI(true); } }]);
  render();
}

function createSettlement(opt, x, y) {
  const id = uid('s');
  const s = {
    id, name: opt.name, type: opt.type, x: Math.round(x), y: Math.round(y),
    faction: opt.faction, origFaction: opt.faction, lordId: null, parentId: null,
    prosperity: opt.prosperity, food: 100, walls: opt.type === 'village' ? 0 : opt.walls,
    garrison: {}, prisoners: {}, besiegedBy: null, siegeProgress: 0,
    raidedUntil: 0, recruits: 20, unrest: 0, lastOwnerChange: S.day
  };
  if (opt.type === 'village') {
    let best = null, bd = 1e9;
    S.order.settlements.forEach(i => {
      const o = S.settlements[i];
      if (o.type === 'village' || o.faction !== s.faction) return;
      const d = dist2(o.x, o.y, s.x, s.y);
      if (d < bd) { bd = d; best = o; }
    });
    if (best) s.parentId = best.id;
  } else if (opt.garrison > 0) {
    s.garrison = makeStack(S.factions[s.faction].culture, opt.garrison, 0.45);
  }
  S.settlements[id] = s; S.order.settlements.push(id);
  const cands = S.order.lords.map(i => S.lords[i]).filter(l => l.faction === s.faction && l.state !== 'dead');
  if (cands.length) {
    cands.sort((a, b) => a.fiefs.length - b.fiefs.length);
    grantFief(s, cands[0]);
  }
  addLog(`🏗 ${s.name} kuruldu — ${facName(s.faction)} (${TYPE_TR[s.type]}).`, '', 2);
  territoryDirty = true; rebuildSettlementNodes(); requestDraw();
  uiDirty.kra = uiDirty.sel = true;
  return s;
}

function deleteSettlement(id) {
  const s = S.settlements[id]; if (!s) return;
  const kids = S.order.settlements.map(i => S.settlements[i]).filter(v => v.parentId === id);
  kids.forEach(v => { v.parentId = null; });
  if (s.lordId && S.lords[s.lordId]) S.lords[s.lordId].fiefs = S.lords[s.lordId].fiefs.filter(f => f !== id);
  S.order.parties.forEach(i => {
    const p = S.parties[i];
    if (p && (p.targetId === id || p.besieging === id)) { p.besieging = null; p.goal = 'idle'; p.tx = null; p.targetId = null; }
  });
  const f = s.faction;
  delete S.settlements[id];
  S.order.settlements = S.order.settlements.filter(x => x !== id);
  if (S.sel && S.sel.type === 'settlement' && S.sel.id === id) S.sel = null;
  addLog(`🏚 ${s.name} haritadan silindi.`, '', 2);
  checkFactionAlive(f);
  territoryDirty = true; rebuildSettlementNodes(); requestDraw();
  uiDirty.sel = uiDirty.kra = uiDirty.box = true;
}

const ACTIONS = {

  focus: () => focusSel(),

  selLord: el2 => select({ type: 'lord', id: el2.dataset.id }),

  searchPick: el2 => { dlg.close(); const t = el2.dataset.t;
    if (t === 'faction') { S.sel = { type: 'faction', id: el2.dataset.id }; uiDirty.sel = true; setTab('sel'); }
    else select({ type: t, id: el2.dataset.id });
    setTimeout(focusSel, 30); },
  openBattle: el2 => openBattle(el2.dataset.id),
  logFilter: el2 => { ui.logFilter = el2.dataset.id; uiDirty.war = true; logDirty = true; renderUI(true); },
  toggleFac: el2 => { const f = el2.dataset.id; S.hidden[f] = !S.hidden[f]; renderLegend(); requestDraw(); },
  facFocus: el2 => {
    const own = ownSettlements(el2.dataset.id);
    if (!own.length) return;
    const cx = own.reduce((a, s) => a + s.x, 0) / own.length, cy = own.reduce((a, s) => a + s.y, 0) / own.length;
    focusOn(cx, cy, 1.1); if (window.innerWidth <= 900) $('#side').classList.remove('open');
  },
  facTreasury: el2 => { const f = S.factions[el2.dataset.id]; if (f) { f.treasury += 50000; toast('+50.000 dinar'); renderUI(true); } },
  gfArmyFor: el2 => { fillFactionArmies(el2.dataset.id); },
  facDestroy: el2 => {
    const f = S.factions[el2.dataset.id]; if (!f) return;
    openDlg('Krallığı yık', `<div>${esc(f.name)} krallığının tüm toprakları dağıtılacak. Emin misin?</div>`,
      [{ t: 'Yık', cls: 'danger', fn: () => {
        const others = Object.values(S.factions).filter(o => !o.isBandit && o.alive && o.id !== f.id);
        ownSettlements(f.id).forEach(s => { if (others.length) changeOwner(s, pick(others).id, null); });
        checkFactionAlive(f.id); dlg.close(); territoryDirty = true; renderUI(true); requestDraw();
      } }, { t: 'Vazgeç', fn: () => dlg.close() }]);
  },
  lordHeal: el2 => {
    const l = S.lords[el2.dataset.id]; if (!l) return;
    let p = l.partyId ? S.parties[l.partyId] : null;
    if (!p) { l.state = 'active'; p = spawnLordParty(l); }
    const cap = lordPartyCap(l), cnt = stackCount(p.troops);
    if (cnt < cap) stackMerge(p.troops, makeStack(S.factions[l.faction].culture, cap - cnt, 0.5));
    p.morale = 100; toast('Ordu tamamlandı'); renderUI(true); requestDraw();
  },
  lordElite: el2 => {
    const l = S.lords[el2.dataset.id]; if (!l) return;
    const p = l.partyId ? S.parties[l.partyId] : spawnLordParty(l);
    stackMerge(p.troops, makeStack(S.factions[l.faction].culture, 60, 0.95));
    toast('Seçkin birlikler katıldı'); renderUI(true); requestDraw();
  },
  lordGold: el2 => { const l = S.lords[el2.dataset.id]; if (l) { l.gold += 5000; toast('+5.000 dinar'); renderUI(true); } },
  lordFree: el2 => { const l = S.lords[el2.dataset.id]; if (l) { releaseLord(l); renderUI(true); } },
  lordSpawn: el2 => { const l = S.lords[el2.dataset.id]; if (l && !l.partyId) { l.state = 'active'; spawnLordParty(l); renderUI(true); requestDraw(); } },
  lordMove: el2 => {
    const l = S.lords[el2.dataset.id]; if (!l) return;
    const p = l.partyId ? S.parties[l.partyId] : null;
    if (!p) { toast('Önce ordu kur'); return; }
    startPlace(`${l.name} nereye gitsin?`, w => {
      if (p.besieging) liftSiege(p);
      p.x = w.x; p.y = w.y; p.goal = 'idle'; p.tx = null; requestDraw(); renderUI(true); toast('Taşındı');
    });
  },
  partyMove: el2 => {
    const p = S.parties[el2.dataset.id]; if (!p) return;
    startPlace('Ordu nereye gitsin?', w => { if (p.besieging) liftSiege(p); p.x = w.x; p.y = w.y; p.goal = 'idle'; p.tx = null; requestDraw(); renderUI(true); });
  },
  cloneLord: el2 => newLordDialog(el2.dataset.id),
  lordKill: el2 => {
    const l = S.lords[el2.dataset.id]; if (!l) return;
    if (l.partyId) removeParty(l.partyId);
    l.partyId = null; l.state = 'dead';
    l.fiefs.slice().forEach(f => { const s = S.settlements[f]; if (s) s.lordId = null; });
    l.fiefs = [];
    if (l.isKing) { l.isKing = false; succession(l.faction); }
    addLog(`☠ ${l.title} ${l.name} öldü.`, 'war', 2);
    if (S.sel && S.sel.type === 'lord' && S.sel.id === l.id) S.sel = null;
    renderUI(true); requestDraw();
  },
  makeKing: el2 => { const l = S.lords[el2.dataset.id]; if (l) { makeKing(l); renderUI(true); } },
  troopEditor: el2 => troopEditor(el2.dataset.kind, el2.dataset.id),
  orderParty: el2 => orderDialog(el2.dataset.id),
  killParty: el2 => { const p = S.parties[el2.dataset.id]; if (p) { destroyParty(p, null); renderUI(true); requestDraw(); } },
  reinforce: el2 => {
    const s = S.settlements[el2.dataset.id]; if (!s) return;
    stackMerge(s.garrison, makeStack(S.factions[s.faction].culture, 60, 0.6));
    toast('Garnizon takviye edildi'); renderUI(true);
