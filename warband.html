<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0b08">
<link rel="manifest" href="warband-manifest.webmanifest">
<link rel="icon" href="warband-icon.svg" type="image/svg+xml">
<title>Kalradya — Warband Simülatörü</title>
<style>
  :root {
    --bg: #0d0b08;
    --bg-primary: #17140f;
    --bg-secondary: #1f1b14;
    --bg-tertiary: #2a251c;
    --bg-quaternary: #352f23;
    --text-primary: #f0e9dc;
    --text-secondary: #b6a992;
    --text-tertiary: #7d7261;
    --border-tertiary: #241f17;
    --border-secondary: #3a3226;
    --accent: #d9a441;
    --accent-dim: #b3832c;
    --accent-bg: rgba(217,164,65,0.13);
    --accent-border: rgba(217,164,65,0.42);
    --danger: #d1503f;
    --danger-bg: rgba(209,80,63,0.14);
    --success: #6fa84f;
    --success-bg: rgba(111,168,79,0.14);
    --info: #5d97c9;
    --sea: #16283a;
    --sea-deep: #101d2b;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.4);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --topbar-h: 56px;
    --log-h: 132px;
    --side-w: 424px;
  }
  :root[data-theme="light"] {
    --bg: #e8e0d0;
    --bg-primary: #fbf6ea;
    --bg-secondary: #f2ebda;
    --bg-tertiary: #e6dcc6;
    --bg-quaternary: #d9ccb0;
    --text-primary: #241d12;
    --text-secondary: #5b4f3c;
    --text-tertiary: #8d8069;
    --border-tertiary: #ded3bb;
    --border-secondary: #c4b596;
    --accent: #9a6b12;
    --accent-dim: #7d560c;
    --accent-bg: rgba(154,107,18,0.12);
    --accent-border: rgba(154,107,18,0.38);
    --danger: #b03a2b;
    --danger-bg: rgba(176,58,43,0.12);
    --success: #4d7a33;
    --success-bg: rgba(77,122,51,0.12);
    --info: #2f6b9c;
    --card-shadow: 0 1px 2px rgba(60,45,20,0.10), 0 8px 22px rgba(60,45,20,0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text-primary); background: var(--bg);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    font-size: 14px; line-height: 1.45; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--bg-quaternary); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- layout ---------- */
  #app { display: flex; flex-direction: column; height: 100dvh; }
  #topbar {
    height: var(--topbar-h); flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; background: linear-gradient(180deg, var(--bg-secondary), var(--bg-primary));
    border-bottom: 1px solid var(--border-secondary); z-index: 40;
  }
  #stage { flex: 1; display: flex; min-height: 0; }
  #mapWrap { flex: 1; position: relative; min-width: 0; background: var(--sea-deep); overflow: hidden; }
  #side {
    width: var(--side-w); flex: none; display: flex; flex-direction: column; min-height: 0;
    background: var(--bg-primary); border-left: 1px solid var(--border-secondary);
  }
  #chronicle {
    height: var(--log-h); flex: none; background: var(--bg-primary);
    border-top: 1px solid var(--border-secondary); overflow-y: auto; padding: 6px 12px;
    font-size: 12.5px;
  }

  /* ---------- topbar ---------- */
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .4px; }
  .brand-mark { width: 26px; height: 26px; flex: none; }
  .brand-txt { font-size: 15px; color: var(--accent); white-space: nowrap; }
  .tb-date { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
  .tb-date b { color: var(--text-primary); font-size: 14px; }
  .spacer { flex: 1; }
  .spd { display: flex; gap: 2px; background: var(--bg-tertiary); border: 1px solid var(--border-secondary); border-radius: var(--radius-sm); padding: 2px; }
  .spd button {
    background: none; border: 0; color: var(--text-secondary); padding: 4px 9px; border-radius: 4px;
    font-size: 12px; font-weight: 600; min-width: 34px;
  }
  .spd button.on { background: var(--accent); color: #17140f; }
  .iconbtn {
    background: var(--bg-tertiary); border: 1px solid var(--border-secondary); color: var(--text-secondary);
    border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12.5px; white-space: nowrap;
  }
  .iconbtn:hover { border-color: var(--accent-border); color: var(--text-primary); }
  .iconbtn.on { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }

  /* ---------- map ---------- */
  #mapCanvas, #mapSvg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #mapSvg { touch-action: none; }
  #mapCanvas { image-rendering: auto; }
  .mapctl { position: absolute; z-index: 12; display: flex; gap: 6px; flex-wrap: wrap; }
  .mapctl.tl { top: 10px; left: 10px; max-width: calc(100% - 20px); }
  .mapctl.bl { bottom: 10px; left: 10px; }
  .mapctl.tr { top: 10px; right: 10px; }
  .chip {
    background: rgba(23,20,15,.86); border: 1px solid var(--border-secondary); color: var(--text-secondary);
    border-radius: 999px; padding: 5px 11px; font-size: 12px; backdrop-filter: blur(6px);
  }
  :root[data-theme="light"] .chip, :root[data-theme="light"] .legend { background: rgba(251,246,234,.9); }
  .chip.on { color: var(--accent); border-color: var(--accent-border); background: var(--accent-bg); }
  .legend {
    background: rgba(23,20,15,.86); border: 1px solid var(--border-secondary); border-radius: var(--radius-md);
    padding: 8px 10px; font-size: 11.5px; backdrop-filter: blur(6px); max-width: 190px;
  }
  .legend .lrow { display: flex; align-items: center; gap: 6px; margin: 2px 0; cursor: pointer; }
  .legend .lrow.off { opacity: .35; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.4); }
  .legend .lname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend .lval { color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

  /* svg map bits */
  .stl { cursor: pointer; }
  .stl-label { fill: var(--text-primary); paint-order: stroke; stroke: rgba(0,0,0,.75);
    stroke-linejoin: round; pointer-events: none; font-weight: 600; }
  :root[data-theme="light"] .stl-label { stroke: rgba(255,255,255,.85); }
  .vil-label { fill: var(--text-secondary); font-weight: 400; }
  .party { cursor: pointer; }
  .sel-ring { fill: none; stroke: var(--accent); stroke-width: 2; opacity: .9; }

  /* ---------- side panel ---------- */
  .tabs { display: flex; flex: none; border-bottom: 1px solid var(--border-secondary); background: var(--bg-secondary); overflow-x: auto; }
  .tabs button {
    flex: 1 0 auto; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text-tertiary);
    padding: 9px 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; letter-spacing: -.1px;
  }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); background: var(--accent-bg); }
  .panes { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px; }
  .pane { display: none; }
  .pane.on { display: block; }

  .card { background: var(--bg-secondary); border: 1px solid var(--border-tertiary); border-radius: var(--radius-md); padding: 10px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .5px; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; }
  .card h3 .sub { text-transform: none; letter-spacing: 0; color: var(--text-tertiary); font-weight: 400; font-size: 11.5px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--text-tertiary); }
  .small { font-size: 11.5px; }
  .num { font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
    border: 1px solid var(--border-secondary); color: var(--text-secondary); white-space: nowrap; }
  .tag.war { background: var(--danger-bg); border-color: rgba(209,80,63,.4); color: var(--danger); }
  .tag.peace { background: var(--success-bg); border-color: rgba(111,168,79,.4); color: var(--success); }
  .tag.gold { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }

  .list { display: flex; flex-direction: column; gap: 6px; }
  .item {
    display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: var(--radius-sm);
    background: var(--bg-tertiary); border: 1px solid var(--border-tertiary); cursor: pointer;
  }
  .item:hover { border-color: var(--accent-border); }
  .item.on { border-color: var(--accent); background: var(--accent-bg); }
  .item .t { font-weight: 600; font-size: 13px; }
  .item .s { font-size: 11.5px; color: var(--text-tertiary); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,.45); }

  label.f { display: block; margin-bottom: 8px; }
  label.f > span { display: block; font-size: 11.5px; color: var(--text-tertiary); margin-bottom: 3px; }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%; background: var(--bg-primary); border: 1px solid var(--border-secondary);
    border-radius: var(--radius-sm); padding: 6px 8px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input[type="color"] { width: 100%; height: 32px; padding: 2px; background: var(--bg-primary); border: 1px solid var(--border-secondary); border-radius: var(--radius-sm); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .btn {
    background: var(--bg-quaternary); border: 1px solid var(--border-secondary); color: var(--text-primary);
    border-radius: var(--radius-sm); padding: 7px 11px; font-size: 12.5px; font-weight: 600;
  }
  .btn:hover { border-color: var(--accent-border); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #17140f; }
  .btn.danger { background: var(--danger-bg); border-color: rgba(209,80,63,.45); color: var(--danger); }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 4px 8px; font-size: 11.5px; }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; }

  table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.tbl th, table.tbl td { padding: 5px 6px; border-bottom: 1px solid var(--border-tertiary); text-align: left; }
  table.tbl th { color: var(--text-tertiary); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  table.tbl td.n, table.tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.tbl tr.clk { cursor: pointer; }
  table.tbl tr.clk:hover td { background: var(--bg-tertiary); }

  .bar { height: 6px; border-radius: 3px; background: var(--bg-quaternary); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }

  .log-line { padding: 2px 0; border-bottom: 1px dashed var(--border-tertiary); display: flex; gap: 8px; }
  .log-line .d { color: var(--text-tertiary); flex: none; font-variant-numeric: tabular-nums; font-size: 11px; min-width: 74px; }
  .log-line.war .m { color: var(--danger); }
  .log-line.peace .m { color: var(--success); }
  .log-line.siege .m { color: var(--accent); }
  .log-line .m { flex: 1; }

  dialog {
    background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-secondary);
    border-radius: var(--radius-lg); padding: 0; max-width: min(680px, 94vw); width: 100%; box-shadow: var(--card-shadow);
  }
  dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(2px); }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border-tertiary); }
  .dlg-head h2 { margin: 0; font-size: 16px; flex: 1; }
  .dlg-body { padding: 14px; max-height: 70vh; overflow-y: auto; }
  .dlg-foot { padding: 10px 14px; border-top: 1px solid var(--border-tertiary); display: flex; gap: 8px; justify-content: flex-end; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--log-h) + 16px);
    background: var(--bg-tertiary); border: 1px solid var(--accent-border); color: var(--text-primary);
    padding: 8px 14px; border-radius: 999px; font-size: 12.5px; z-index: 90; box-shadow: var(--card-shadow);
    opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  .toast.show { opacity: 1; }

  .sheet-toggle { display: none; }
  @media (max-width: 900px) {
    :root { --side-w: 100%; --log-h: 96px; }
    #stage { position: relative; }
    #side {
      position: absolute; inset: 0; z-index: 30; border-left: 0; transform: translateY(100%);
      transition: transform .22s ease; border-top: 1px solid var(--border-secondary);
    }
    #side.open { transform: translateY(0); }
    .sheet-toggle { display: inline-flex; }
    .brand-txt { display: none; }
    .legend { max-width: 150px; font-size: 10.5px; }
  }
  @media (max-width: 640px) {
    :root { --topbar-h: 50px; }
    .tb-date { font-size: 11px; line-height: 1.15; }
    .tb-date b { font-size: 12px; display: block; }
    .grid3 { grid-template-columns: 1fr 1fr; }
    #topbar { gap: 6px; padding: 0 8px; }
    .spd button { padding: 4px 6px; min-width: 26px; font-size: 11px; }
    .iconbtn { padding: 5px 8px; font-size: 11.5px; }
    #btnSave { display: none; }
    .mapctl.tl .chip { padding: 4px 8px; font-size: 11px; }
  }

  /* ================= v2: sadeleştirilmiş arayüz ================= */
  :root { --log-h: 34px; }
  .tabs button { flex: 1 1 0; font-size: 13px; padding: 10px 4px; }

  /* olay şeridi */
  #chronicle { height: 34px; overflow: hidden; padding: 0; display: flex; flex-direction: column; transition: height .18s ease; }
  #chronicle.open { height: 210px; }
  .log-head { display: flex; align-items: center; gap: 8px; padding: 4px 10px; flex: none; height: 34px; cursor: pointer; }
  .log-head .latest { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; color: var(--text-secondary); }
  .log-head .caret { color: var(--text-tertiary); font-size: 11px; transition: transform .18s; }
  #chronicle.open .log-head .caret { transform: rotate(180deg); }
  #logList { overflow-y: auto; padding: 0 10px 8px; font-size: 12.5px; }
  .log-line { cursor: pointer; }
  .log-line:hover .m { color: var(--accent); }

  /* açılır bölümler */
  .sect { border: 1px solid var(--border-tertiary); border-radius: var(--radius-md); margin-bottom: 10px; overflow: hidden; background: var(--bg-secondary); }
  .sect > summary { list-style: none; cursor: pointer; padding: 9px 11px; font-size: 12.5px; font-weight: 700;
    color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
  .sect > summary::-webkit-details-marker { display: none; }
  .sect > summary::after { content: '▾'; margin-left: auto; color: var(--text-tertiary); font-size: 11px; }
  .sect[open] > summary::after { content: '▴'; }
  .sect > summary:hover { color: var(--text-primary); }
  .sect .body { padding: 0 11px 11px; }

  /* seçim başlığı */
  .hero { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary)); border: 1px solid var(--border-tertiary); margin-bottom: 10px; }
  .hero .crest { width: 42px; height: 42px; flex: none; border-radius: 8px; display: grid; place-items: center;
    border: 1px solid rgba(0,0,0,.4); font-size: 20px; }
  .hero h2 { margin: 0; font-size: 17px; line-height: 1.15; }
  .hero .sub2 { font-size: 12px; color: var(--text-tertiary); }
  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat { background: var(--bg-secondary); border: 1px solid var(--border-tertiary); border-radius: var(--radius-sm); padding: 7px 9px; }
  .stat .k { font-size: 10.5px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .3px; }
  .stat .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* savaş raporu */
  .bt-head { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
  .bt-side { padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-tertiary); background: var(--bg-secondary); }
  .bt-side.win { border-color: var(--accent); background: var(--accent-bg); }
  .bt-side .nm { font-weight: 700; font-size: 13.5px; }
  .bt-side .fc { font-size: 11.5px; color: var(--text-tertiary); }
  .bt-side .ct { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bt-vs { font-size: 20px; color: var(--text-tertiary); }
  #btCanvas { width: 100%; height: 190px; display: block; border-radius: var(--radius-sm);
    background: linear-gradient(180deg, #1a2a17, #26301c); border: 1px solid var(--border-tertiary); }
  :root[data-theme="light"] #btCanvas { background: linear-gradient(180deg, #cdd8bd, #b9c7a6); }
  .bt-ctl { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .bt-ctl .prog { flex: 1; height: 5px; border-radius: 3px; background: var(--bg-quaternary); overflow: hidden; }
  .bt-ctl .prog > i { display: block; height: 100%; background: var(--accent); width: 0; }

  /* harita yerleştirme modu */
  .placebar { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); z-index: 20;
    background: var(--accent); color: #17140f; padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    box-shadow: var(--card-shadow); display: none; align-items: center; gap: 10px; }
  .placebar.on { display: flex; }
  .placebar button { background: rgba(0,0,0,.18); border: 0; color: inherit; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; }

  /* büyük savaş bildirimi */
  .alert { position: absolute; top: 50px; right: 12px; z-index: 22; max-width: 260px;
    background: rgba(23,20,15,.94); border: 1px solid var(--danger); border-left-width: 4px;
    border-radius: var(--radius-md); padding: 9px 11px; box-shadow: var(--card-shadow); display: none; }
  :root[data-theme="light"] .alert { background: rgba(251,246,234,.96); }
  .alert.on { display: block; }
  .alert .t { font-weight: 700; font-size: 12.5px; margin-bottom: 2px; }
  .alert .s { font-size: 11.5px; color: var(--text-secondary); margin-bottom: 6px; }

  /* arama */
  .searchbox input { width: 100%; }
  .sres { max-height: 50vh; overflow-y: auto; }

  /* mobil: panel alttan yükselen sayfa, sekme şeridi hep görünür */
  @media (max-width: 900px) {
    #stage { overflow: hidden; }
    #side { transform: translateY(calc(100% - 46px)); box-shadow: 0 -8px 24px rgba(0,0,0,.4); }
    #side.open { transform: translateY(0); }
    #side .tabs { position: relative; }
    #chronicle { display: none; }
    .sheet-toggle { display: none; }
    .mapctl.bl { bottom: 54px; }
    .legend { max-width: 132px; font-size: 10px; padding: 6px 8px; }
    .toast { bottom: 64px; }
  }
  @media (max-width: 640px) {
    .tabs button { font-size: 12px; }
    .statgrid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2 4 7v9c0 7.2 5 12.3 12 14 7-1.7 12-6.8 12-14V7L16 2z" fill="none" stroke="#d9a441" stroke-width="2"/>
        <path d="M16 8v14M11 12l5-4 5 4" fill="none" stroke="#d9a441" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-txt">KALRADYA</span>
    </div>
    <div class="tb-date"><b id="tbDate">1084</b> <span id="tbSeason" class="muted"></span></div>
    <div class="spd" id="spdCtl">
      <button data-spd="0" title="Duraklat (Boşluk)">❚❚</button>
      <button data-spd="1" class="on">1×</button>
      <button data-spd="2">2×</button>
      <button data-spd="4">4×</button>
      <button data-spd="10">10×</button>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnSearch" title="Ara (A)">🔍</button>
    <button class="iconbtn" id="btnTheme" title="Tema">☾</button>
    <button class="iconbtn" id="btnMenu" title="Menü">☰</button>
    <button class="iconbtn sheet-toggle" id="btnSheet">Panel</button>
  </header>

/* ---------------- Yardımcılar ---------------- */
let RNG_STATE = 20250810;
function srand(seed) { RNG_STATE = seed >>> 0; }
function rnd() {
  RNG_STATE |= 0; RNG_STATE = (RNG_STATE + 0x6D2B79F5) | 0;
  let t = Math.imul(RNG_STATE ^ (RNG_STATE >>> 15), 1 | RNG_STATE);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const rf = (a, b) => a + rnd() * (b - a);
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const dist2 = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
let UIDN = 0;
function uid(p) { return `${p}${++UIDN}`; }
function fmt(n) { return Math.round(n).toLocaleString('tr-TR'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
const isLand = (x, y) => pointInPoly(x, y, COAST);

/* Takvim */
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const SEASONS = ['Kış','Kış','İlkbahar','İlkbahar','İlkbahar','Yaz','Yaz','Yaz','Sonbahar','Sonbahar','Sonbahar','Kış'];
function calendar(day) {
  const d = Math.floor(day);
  const year = 1084 + Math.floor(d / 360);
  const doy = ((d % 360) + 360) % 360;
  const mi = Math.floor(doy / 30);
  return { year, month: MONTHS[mi], season: SEASONS[mi], dayOfMonth: (doy % 30) + 1, mi };
}
function dateStr(day) { const c = calendar(day); return `${c.dayOfMonth} ${c.month} ${c.year}`; }
function shortDate(day) { const c = calendar(day); return `${c.dayOfMonth}.${c.mi + 1}.${c.year}`; }

/* ---------------- Birlik yığını yardımcıları ---------------- */
function cultureTroops(culture) {
  return Object.values(TROOPS).filter(t => t.culture === culture).sort((a, b) => a.tier - b.tier);
}
function makeStack(culture, size, quality) {
  const stack = {};
  if (size <= 0) return stack;
  const pool = cultureTroops(culture);
  if (!pool.length) return stack;
  const maxTier = Math.max(...pool.map(t => t.tier));
  /* kalite (0..1) yüksek tier ağırlığını kaydırır */
  const center = 1 + quality * (maxTier - 1);
  const weights = pool.map(t => {
    const d = Math.abs(t.tier - center);
    let w = Math.exp(-(d * d) / 1.1);
    if (t.cls === 'cav') w *= 0.8;
    return w;
  });
  const total = weights.reduce((a, b) => a + b, 0) || 1;
  let left = size;
  pool.forEach((t, i) => {
    const n = i === pool.length - 1 ? left : Math.min(left, Math.round(size * weights[i] / total));
    if (n > 0) { stack[t.id] = (stack[t.id] || 0) + n; left -= n; }
  });
  if (left > 0) { const r = CULTURE_TREE_ROOT[culture] || pool[0].id; stack[r] = (stack[r] || 0) + left; }
  for (const k in stack) if (stack[k] <= 0) delete stack[k];
  return stack;
}
function stackCount(st) { let n = 0; for (const k in st) n += st[k]; return n; }
function stackPower(st) {
  let p = 0;
  for (const k in st) { const t = TROOPS[k]; if (t) p += t.pw * st[k]; }
  return p;
}
function stackWage(st) {
  let w = 0;
  for (const k in st) { const t = TROOPS[k]; if (t) w += t.wage * st[k]; }
  return w;
}
function stackTop(st, n) {
  return Object.entries(st).filter(e => e[1] > 0)
    .sort((a, b) => (TROOPS[b[0]]?.tier || 0) - (TROOPS[a[0]]?.tier || 0)).slice(0, n || 99);
}
function stackAvgTier(st) {
  let s = 0, n = 0;
  for (const k in st) { const t = TROOPS[k]; if (t) { s += t.tier * st[k]; n += st[k]; } }
  return n ? s / n : 0;
}
function stackMix(st) {
  const m = { inf:0, arch:0, cav:0 };
  for (const k in st) { const t = TROOPS[k]; if (t) m[t.cls] += st[k]; }
  return m;
}
/* yığından n adet kayıp düş: önce düşük tier */
function stackRemove(st, n) {
  const removed = {};
  const order = Object.keys(st).filter(k => st[k] > 0)
    .sort((a, b) => (TROOPS[a] ? TROOPS[a].tier : 0) - (TROOPS[b] ? TROOPS[b].tier : 0));
  let left = Math.round(n);
  for (const k of order) {
    if (left <= 0) break;
    const take = Math.min(st[k], left);
    st[k] -= take; left -= take;
    removed[k] = (removed[k] || 0) + take;
    if (st[k] <= 0) delete st[k];
  }
  return removed;
}
function stackMerge(dst, src) { for (const k in src) if (src[k] > 0) dst[k] = (dst[k] || 0) + src[k]; return dst; }

/* ---------------- Dünya kurulumu ---------------- */
function buildWorld(seed) {
  srand(seed || 20250810);
  S.factions = {}; S.settlements = {}; S.lords = {}; S.parties = {};
  S.wars = {}; S.log = []; S.battles = []; S.alert = null;
  S.order = { settlements: [], lords: [], parties: [] };

  /* --- krallıklar --- */
  const allFac = FACTION_DEFS.concat([BANDIT_FACTION]);
  allFac.forEach(d => {
    S.factions[d.id] = {
      id: d.id, name: d.name, short: d.short, color: d.color, culture: d.culture,
      rulerTitle: d.rulerTitle, lordTitle: d.lordTitle, capital: d.capital || null,
      aggr: d.aggr, kingId: null, treasury: d.id === 'bandit' ? 0 : ri(9000, 26000),
      rel: {}, warWeariness: {}, target: null, marshalId: null, alive: true, isBandit: d.id === 'bandit'
    };
  });
  Object.keys(S.factions).forEach(a => Object.keys(S.factions).forEach(b => { if (a !== b) S.factions[a].rel[b] = ri(-15, 10); }));

  /* --- şehir ve kaleler --- */
  SETTLEMENT_DEFS.forEach(d => {
    const isTown = d.type === 'town';
    const s = {
      id: d.id, name: d.name, type: d.type, x: d.x, y: d.y,
      faction: d.f, origFaction: d.f, lordId: null, parentId: null,
      prosperity: isTown ? ri(45, 72) : ri(30, 55),
      food: 100, walls: isTown ? ri(55, 80) : ri(45, 75),
      garrison: {}, prisoners: {}, besiegedBy: null, siegeProgress: 0,
      raidedUntil: 0, recruits: ri(10, 30), unrest: 0, lastOwnerChange: 0
    };
    S.settlements[s.id] = s; S.order.settlements.push(s.id);
  });

  /* --- köyler --- */
  let vn = 0;
  const nameNext = () => VILLAGE_NAMES[(vn++) % VILLAGE_NAMES.length];
  const placed = SETTLEMENT_DEFS.map(d => ({ x: d.x, y: d.y }));
  SETTLEMENT_DEFS.forEach((d, di) => {
    const count = d.type === 'town' ? 3 : 1;
    for (let i = 0; i < count; i++) {
      let bx = 0, by = 0, ok = false;
      for (let tries = 0; tries < 40 && !ok; tries++) {
        const ang = (di * 1.7 + i * 2.3 + tries * 0.55) % (Math.PI * 2);
        const rad = 34 + (tries % 5) * 7 + (i * 6);
        bx = d.x + Math.cos(ang) * rad; by = d.y + Math.sin(ang) * rad * 0.85;
        if (bx < 40 || bx > MAP_W - 40 || by < 30 || by > MAP_H - 30) continue;
        if (!isLand(bx, by)) continue;
        if (placed.some(p => dist2(p.x, p.y, bx, by) < 27)) continue;
        ok = true;
      }
      if (!ok) continue;
      placed.push({ x: bx, y: by });
      const id = `v_${d.id}_${i}`;
      S.settlements[id] = {
        id, name: nameNext(), type: 'village', x: Math.round(bx), y: Math.round(by),
        faction: d.f, origFaction: d.f, lordId: null, parentId: d.id,
        prosperity: ri(35, 65), food: 100, walls: 0,
        garrison: {}, prisoners: {}, besiegedBy: null, siegeProgress: 0,
        raidedUntil: 0, recruits: ri(6, 20), unrest: 0, lastOwnerChange: 0
      };
      S.order.settlements.push(id);
    }
  });

  /* --- lordlar --- */
  FACTION_DEFS.forEach(fd => {
    const names = LORD_NAMES[fd.id].slice();
    const fac = S.factions[fd.id];
    const n = 14;
    for (let i = 0; i < n; i++) {
      const isKing = i === 0;
      const nm = names[i % names.length];
      const p = pick(PERSONALITIES);
      const id = `l_${fd.id}_${i}`;
      S.lords[id] = {
        id, name: nm, faction: fd.id,
        title: isKing ? fd.rulerTitle : fd.lordTitle,
        isKing, personality: isKing ? 'martial' : p.id,
        renown: isKing ? ri(700, 900) : ri(80, 520),
        relKing: isKing ? 100 : ri(-25, 55),
        gold: isKing ? ri(12000, 24000) : ri(800, 6000),
        skillTactics: isKing ? ri(4, 7) : ri(1, 6),
        skillLeadership: isKing ? ri(7, 10) : ri(3, 8),
        fiefs: [], partyId: null, state: 'active', prisonerOf: null, freeAt: 0,
        wounded: 0, kills: 0, battlesWon: 0, battlesLost: 0
      };
      S.order.lords.push(id);
      if (isKing) fac.kingId = id;
    }
  });

  /* --- tımarların dağıtımı --- */
  FACTION_DEFS.forEach(fd => {
    const fac = S.factions[fd.id];
    const towns = S.order.settlements.map(i => S.settlements[i]).filter(s => s.faction === fd.id && s.type === 'town');
    const castles = S.order.settlements.map(i => S.settlements[i]).filter(s => s.faction === fd.id && s.type === 'castle');
    const lords = S.order.lords.map(i => S.lords[i]).filter(l => l.faction === fd.id);
    const king = lords.find(l => l.isKing);
    const others = shuffle(lords.filter(l => !l.isKing));
    const cap = S.settlements[fd.capital];
    if (cap) grantFief(cap, king);
    let qi = 0;
    towns.filter(t => t !== cap).forEach(t => { grantFief(t, others[qi % others.length]); qi++; });
    castles.forEach(c => { grantFief(c, others[qi % others.length]); qi++; });
    /* köyler ana yerleşimin sahibine bağlı */
    S.order.settlements.forEach(id => {
      const v = S.settlements[id];
      if (v.type === 'village' && v.parentId) {
        const par = S.settlements[v.parentId];
        v.lordId = par ? par.lordId : null;
        if (v.lordId && S.lords[v.lordId] && !S.lords[v.lordId].fiefs.includes(v.id)) S.lords[v.lordId].fiefs.push(v.id);
      }
    });
    fac.treasury += towns.length * 2000;
  });

  /* --- ordular --- */
  S.order.lords.forEach(id => spawnLordParty(S.lords[id]));
  S.order.settlements.forEach(id => { const s = S.settlements[id]; if (s.type !== 'village') refillGarrison(s, true); });

  /* --- başlangıç savaşları --- */
  declareWar('swadia', 'rhodok', true);
  declareWar('vaegir', 'nord', true);
  declareWar('khergit', 'sarranid', true);

  /* --- haydutlar --- */
  for (let i = 0; i < 16; i++) spawnBandit();

  S.stats = { battles: 0, sieges: 0, days: 0 };
  addLog('Kalradya\'da yeni bir çağ başlıyor. Altı krallık, tek bir taht.', 'siege', 2);
  Object.keys(S.wars).forEach(k => {
    const [a, b] = k.split('|');
    addLog(`${S.factions[a].name} ile ${S.factions[b].name} arasında savaş sürüyor.`, 'war', 2);
  });
}

function grantFief(s, lord) {
  if (!s || !lord) return;
  if (s.lordId && S.lords[s.lordId]) {
    const old = S.lords[s.lordId];
    old.fiefs = old.fiefs.filter(f => f !== s.id);
  }
  s.lordId = lord.id;
  if (!lord.fiefs.includes(s.id)) lord.fiefs.push(s.id);
  /* köyleri de aynı lorda bağla */
  if (s.type !== 'village') {
    S.order.settlements.forEach(id => {
      const v = S.settlements[id];
      if (v.type === 'village' && v.parentId === s.id) {
        if (v.lordId && S.lords[v.lordId]) S.lords[v.lordId].fiefs = S.lords[v.lordId].fiefs.filter(f => f !== v.id);
        v.lordId = lord.id;
        if (!lord.fiefs.includes(v.id)) lord.fiefs.push(v.id);
      }
    });
  }
}

function lordPartyCap(l) {
  return Math.round(34 + l.skillLeadership * 14 + l.renown / 8 + (l.isKing ? 150 : 0));
}

function spawnLordParty(l) {
  const fac = S.factions[l.faction];
  const home = l.fiefs.map(f => S.settlements[f]).find(s => s && s.type !== 'village')
    || S.settlements[fac.capital]
    || S.order.settlements.map(i => S.settlements[i]).find(s => s.faction === l.faction);
  const cap = lordPartyCap(l);
  const size = Math.round(cap * rf(0.45, 0.85));
  const q = clamp(0.28 + l.renown / 1400 + (l.isKing ? 0.22 : 0), 0.2, 0.85);
  const p = {
    id: uid('p'), type: 'lord', lordId: l.id, faction: l.faction,
    x: home ? home.x + rf(-14, 14) : 600, y: home ? home.y + rf(-14, 14) : 400,
    tx: null, ty: null, goal: 'patrol', targetId: null,
    troops: makeStack(fac.culture, size, q), prisoners: {},
    morale: ri(60, 90), speed: 1, besieging: null, path: [], lastFight: -99, cooldown: 0
  };
  S.parties[p.id] = p; S.order.parties.push(p.id); l.partyId = p.id;
  return p;
}

function garrisonTarget(s) {
  if (!s || s.type === 'village') return 0;
  return Math.round(s.type === 'town' ? 90 + s.prosperity * 0.8 : 45 + s.prosperity * 0.5);
}
function refillGarrison(s, initial) {
  const fac = S.factions[s.faction]; if (!fac) return;
  const q = s.type === 'town' ? 0.45 : 0.4;
  const target = garrisonTarget(s);
  if (initial) s.garrison = makeStack(fac.culture, Math.round(target * rf(0.8, 1.05)), q);
  else {
    const cur = stackCount(s.garrison);
    if (cur < target) stackMerge(s.garrison, makeStack(fac.culture, Math.min(12, target - cur), q * 0.8));
  }
}

const BANDIT_KINDS = [
  { t:'bd_looter',  name:'Çapulcular',       biome:['plain','forest','hills','steppe','desert','snow','tundra'] },
  { t:'bd_bandit',  name:'Orman Haydutları', biome:['forest','plain'] },
  { t:'bd_brigand', name:'Dağ Haydutları',   biome:['hills'] },
  { t:'bd_steppe',  name:'Bozkır Haydutları',biome:['steppe','tundra'] },
  { t:'bd_desert',  name:'Çöl Haydutları',   biome:['desert'] },
  { t:'bd_sea',     name:'Deniz Akıncıları', biome:['snow','tundra'] }
];

function spawnBandit(x, y) {
  let px = x, py = y;
  if (px == null) {
    for (let i = 0; i < 60; i++) {
      const cx = rf(80, MAP_W - 80), cy = rf(60, MAP_H - 60);
      if (!isLand(cx, cy)) continue;
      const near = S.order.settlements.some(id => { const s = S.settlements[id]; return dist2(s.x, s.y, cx, cy) < 45; });
      if (near) continue;
      px = cx; py = cy; break;
    }
  }
  if (px == null) { px = rf(300, 900); py = rf(200, 600); }
  const bi = biomeAt(px, py);
  const kinds = BANDIT_KINDS.filter(k => k.biome.includes(bi));
  const kind = kinds.length ? pick(kinds) : BANDIT_KINDS[0];
  const size = ri(12, 44);
  const stack = {}; stack[kind.t] = size;
  if (rnd() < 0.5) stack['bd_looter'] = (stack['bd_looter'] || 0) + ri(4, 14);
  const p = {
    id: uid('p'), type: 'bandit', lordId: null, faction: 'bandit', name: kind.name,
    x: px, y: py, tx: null, ty: null, goal: 'roam', targetId: null,
    troops: stack, prisoners: {}, morale: ri(40, 70), speed: 1.05, besieging: null, path: [], lastFight: -99, cooldown: 0
  };
  S.parties[p.id] = p; S.order.parties.push(p.id);
  return p;
}

/* biyom sorgusu (harita çizimi ve haydut türü için) */
function biomeAt(x, y) {
  let best = null, bw = -1;
  for (const b of BIOMES) {
    const d = dist2(b.x, b.y, x, y);
    const w = Math.max(0, 1 - d / b.r);
    if (w > bw) { bw = w; best = b.k; }
  }
  return best || 'plain';
}

/* ---------------- Savaş ilanı / barış ---------------- */
function declareWar(a, b, silent) {
  if (!a || !b || a === b) return;
  const k = warKey(a, b);
  if (S.wars[k]) return;
  S.wars[k] = { since: S.day };
  if (S.factions[a]) { S.factions[a].rel[b] = Math.min(S.factions[a].rel[b] ?? 0, -40); }
  if (S.factions[b]) { S.factions[b].rel[a] = Math.min(S.factions[b].rel[a] ?? 0, -40); }
  if (!silent) {
    addLog(`⚔ ${S.factions[a].name}, ${S.factions[b].name} krallığına savaş ilan etti!`, 'war', 2);
    if (S.opts.pauseOnWar) setSpeed(0);
  }
  uiDirty.kra = true;
}
function makePeace(a, b, silent) {
  const k = warKey(a, b);
  if (!S.wars[k]) return;
  delete S.wars[k];
  if (S.factions[a]) S.factions[a].rel[b] = Math.max(S.factions[a].rel[b] ?? 0, 5);
  if (S.factions[b]) S.factions[b].rel[a] = Math.max(S.factions[b].rel[a] ?? 0, 5);
  /* kuşatmaları kaldır */
  S.order.parties.forEach(id => {
    const p = S.parties[id]; if (!p || !p.besieging) return;
    const s = S.settlements[p.besieging];
    if (s && ((p.faction === a && s.faction === b) || (p.faction === b && s.faction === a))) liftSiege(p);
  });
  if (!silent) addLog(`🕊 ${S.factions[a].name} ile ${S.factions[b].name} arasında barış imzalandı.`, 'peace', 2);
  uiDirty.kra = true;
}

/* ---------- gürültü ---------- */
function hash2(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y) { return vnoise(x, y) * 0.6 + vnoise(x * 2.1, y * 2.1) * 0.3 + vnoise(x * 4.3, y * 4.3) * 0.1; }

function mixHex(h1, h2, t) {
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const a = p(h1), b = p(h2);
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)})`;
}
function hexRGBA(h, a) {
  const r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}
function darken(h, f) {
  const r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
  return `rgb(${Math.round(r * f)},${Math.round(g * f)},${Math.round(b * f)})`;
}

/* ---------- arazi (bir kez çizilir) ---------- */
function buildTerrain() {
  terrainCv = document.createElement('canvas');
  terrainCv.width = MAP_W; terrainCv.height = MAP_H;
  const g = terrainCv.getContext('2d');

  const sg = g.createLinearGradient(0, 0, MAP_W, MAP_H);
  sg.addColorStop(0, '#12212f'); sg.addColorStop(0.5, '#16283a'); sg.addColorStop(1, '#0f1e2b');
  g.fillStyle = sg; g.fillRect(0, 0, MAP_W, MAP_H);
  g.globalAlpha = 0.06; g.strokeStyle = '#7fb6d8'; g.lineWidth = 1;
  for (let y = 0; y < MAP_H; y += 14) {
    g.beginPath();
    for (let x = 0; x <= MAP_W; x += 16) g.lineTo(x, y + Math.sin((x + y) / 26) * 3);
    g.stroke();
  }
  g.globalAlpha = 1;

  const path = new Path2D();
  COAST.forEach((p, i) => i ? path.lineTo(p[0], p[1]) : path.moveTo(p[0], p[1]));
  path.closePath();

  g.save();
  g.clip(path);
  const CELL = 4;
  for (let y = 0; y < MAP_H; y += CELL) {
    for (let x = 0; x < MAP_W; x += CELL) {
      let tot = 0; const acc = {};
      for (const b of BIOMES) {
        const d = dist2(b.x, b.y, x, y);
        const w = Math.max(0, 1 - d / b.r);
        if (w > 0) { acc[b.k] = (acc[b.k] || 0) + w * w; tot += w * w; }
      }
      let col;
      if (!tot) col = BIOME_COLORS.plain[0];
      else {
        const sorted = Object.entries(acc).sort((a, b) => b[1] - a[1]);
        const n = fbm(x / 60, y / 60);
        const k1 = sorted[0][0], k2 = sorted[1] ? sorted[1][0] : k1;
        const t = sorted[1] ? clamp(sorted[1][1] / (sorted[0][1] + sorted[1][1]) * 1.6 + (n - 0.5) * 0.5, 0, 1) : 0;
        col = mixHex(BIOME_COLORS[k1][n > 0.5 ? 0 : 1], BIOME_COLORS[k2][n > 0.5 ? 0 : 1], t);
      }
      g.fillStyle = col;
      g.fillRect(x, y, CELL + 1, CELL + 1);
    }
  }
  g.globalAlpha = 0.10;
  for (let i = 0; i < 2600; i++) {
    const x = rnd() * MAP_W, y = rnd() * MAP_H;
    g.fillStyle = fbm(x / 25, y / 25) > 0.5 ? '#000' : '#fff';
    g.fillRect(x, y, 2 + rnd() * 3, 2 + rnd() * 3);
  }
  g.globalAlpha = 1;

  /* ormanlar */
  g.globalAlpha = 0.55;
  for (let i = 0; i < 1500; i++) {
    const x = rnd() * MAP_W, y = rnd() * MAP_H;
    const b = biomeAt(x, y);
    if (b !== 'forest' && !(b === 'plain' && rnd() < 0.18) && !(b === 'hills' && rnd() < 0.12)) continue;
    if (fbm(x / 40, y / 40) < 0.42) continue;
    g.fillStyle = '#2f4a28';
    g.beginPath(); g.moveTo(x, y - 4); g.lineTo(x + 2.6, y + 2); g.lineTo(x - 2.6, y + 2); g.closePath(); g.fill();
  }
  g.globalAlpha = 1;

  /* nehirler */
  g.strokeStyle = 'rgba(90,140,180,.75)'; g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round';
  RIVERS.forEach(r => {
    g.beginPath();
    r.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.stroke();
  });

  /* dağlar */
  MOUNTAINS.forEach(m => {
    for (let i = 0; i < m.n; i++) {
      const t = i / Math.max(1, m.n - 1);
      const x = m.x + (t - 0.5) * m.w + rf(-8, 8);
      const y = m.y + Math.sin(t * 3.1) * 16 + rf(-7, 7);
      const h = 12 + rnd() * 9, w = h * 0.95;
      g.fillStyle = '#6a6152';
      g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + w, y + h * 0.45); g.lineTo(x - w, y + h * 0.45); g.closePath(); g.fill();
      g.fillStyle = '#efeee8';
      g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + w * 0.34, y - h * 0.34); g.lineTo(x - w * 0.34, y - h * 0.34); g.closePath(); g.fill();
      g.fillStyle = 'rgba(0,0,0,.22)';
      g.beginPath(); g.moveTo(x, y - h); g.lineTo(x + w, y + h * 0.45); g.lineTo(x + w * 0.1, y + h * 0.45); g.closePath(); g.fill();
    }
  });
  g.restore();

  g.strokeStyle = 'rgba(20,32,44,.85)'; g.lineWidth = 2.2; g.stroke(path);
  g.strokeStyle = 'rgba(255,255,255,.10)'; g.lineWidth = 5; g.stroke(path);
}

/* ---------- krallık sınırları ---------- */
function buildTerritory() {
  if (!territoryCv) {
    territoryCv = document.createElement('canvas');
    territoryCv.width = MAP_W; territoryCv.height = MAP_H;
  }
  const g = territoryCv.getContext('2d');
  g.clearRect(0, 0, MAP_W, MAP_H);

  const CELL = 3, cols = Math.ceil(MAP_W / CELL), rows = Math.ceil(MAP_H / CELL);
  const owners = new Array(cols * rows).fill(null);
  const best = new Float32Array(cols * rows);

  const stl = S.order.settlements.map(id => S.settlements[id])
    .filter(s => s && S.factions[s.faction] && !S.factions[s.faction].isBandit);
  const reach = s => s.type === 'town' ? 175 : s.type === 'castle' ? 120 : 62;

  stl.forEach(s => {
    const rr = reach(s);
    const w = s.type === 'town' ? 1.25 : s.type === 'castle' ? 1.1 : 0.92;
    const c0 = Math.max(0, Math.floor((s.x - rr) / CELL)), c1 = Math.min(cols - 1, Math.ceil((s.x + rr) / CELL));
    const r0 = Math.max(0, Math.floor((s.y - rr) / CELL)), r1 = Math.min(rows - 1, Math.ceil((s.y + rr) / CELL));
    for (let r = r0; r <= r1; r++) {
      const y = r * CELL + CELL / 2;
      for (let c = c0; c <= c1; c++) {
        const x = c * CELL + CELL / 2;
        const d = Math.hypot(s.x - x, s.y - y);
        if (d > rr) continue;
        const sc = (1 - d / rr) * w;
        const i = r * cols + c;
        if (sc > best[i]) { best[i] = sc; owners[i] = s.faction; }
      }
    }
  });
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      if (owners[i] && !isLand(c * CELL + CELL / 2, r * CELL + CELL / 2)) owners[i] = null;
    }
  }

  const small = document.createElement('canvas');
  small.width = cols; small.height = rows;
  const sg = small.getContext('2d');
  const img = sg.createImageData(cols, rows);
  const rgbCache = {};
  for (let i = 0; i < owners.length; i++) {
    const f = owners[i]; if (!f) continue;
    let col = rgbCache[f];
    if (!col) {
      const h = S.factions[f].color;
      col = rgbCache[f] = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    }
    const o = i * 4;
    img.data[o] = col[0]; img.data[o + 1] = col[1]; img.data[o + 2] = col[2]; img.data[o + 3] = 92;
  }
  sg.putImageData(img, 0, 0);
  g.imageSmoothingEnabled = true;
  g.drawImage(small, 0, 0, MAP_W, MAP_H);

  g.lineWidth = 2.4; g.lineCap = 'round';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const f = owners[r * cols + c];
      const rt = c + 1 < cols ? owners[r * cols + c + 1] : null;
      const dn = r + 1 < rows ? owners[(r + 1) * cols + c] : null;
      if (f !== rt) {
        const col = f || rt;
        if (col) { g.strokeStyle = hexRGBA(S.factions[col].color, 0.8);
          g.beginPath(); g.moveTo((c + 1) * CELL, r * CELL); g.lineTo((c + 1) * CELL, (r + 1) * CELL); g.stroke(); }
      }
      if (f !== dn) {
        const col = f || dn;
        if (col) { g.strokeStyle = hexRGBA(S.factions[col].color, 0.8);
          g.beginPath(); g.moveTo(c * CELL, (r + 1) * CELL); g.lineTo((c + 1) * CELL, (r + 1) * CELL); g.stroke(); }
      }
    }
  }
  territoryDirty = false;
}

/* ---------- canvas ---------- */
let dpr = Math.min(2, window.devicePixelRatio || 1);
function resizeCanvas() {
  const w = cv.clientWidth, h = cv.clientHeight;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(w * dpr));
  cv.height = Math.max(1, Math.round(h * dpr));
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
}
function fitView() {
  const w = cv.clientWidth, h = cv.clientHeight;
  const fit = Math.min(w / MAP_W, h / MAP_H) * 0.98;
  const k = w < 700 ? Math.min(fit * 2.3, (w / MAP_W) * 2.3) : fit;
  view.k = k; view.minK = fit * 0.85; view.maxK = fit * 9;
  view.x = (w - MAP_W * k) / 2; view.y = (h - MAP_H * k) / 2;
  clampView();
}
function clampView() {
  const w = cv.clientWidth, h = cv.clientHeight;
  const mw = MAP_W * view.k, mh = MAP_H * view.k;
  if (mw <= w) view.x = (w - mw) / 2; else view.x = clamp(view.x, w - mw, 0);
  if (mh <= h) view.y = (h - mh) / 2; else view.y = clamp(view.y, h - mh, 0);
}
const s2w = (x, y) => ({ x: (x - view.x) / view.k, y: (y - view.y) / view.k });

function drawCanvas() {
  const w = cv.clientWidth, h = cv.clientHeight;
  cx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx2.clearRect(0, 0, w, h);
  cx2.fillStyle = '#0d1a26'; cx2.fillRect(0, 0, w, h);
  cx2.save();
  cx2.translate(view.x, view.y); cx2.scale(view.k, view.k);
  if (terrainCv) cx2.drawImage(terrainCv, 0, 0);
  if (S.layers.borders) {
    if (territoryDirty) buildTerritory();
    if (territoryCv) cx2.drawImage(territoryCv, 0, 0);
  }
  if (S.layers.fog) drawTrails();
  cx2.restore();
}

function drawTrails() {
  cx2.lineWidth = 1.2 / view.k;
  S.order.parties.forEach(id => {
    const p = S.parties[id];
    if (!p || p.tx == null || S.hidden[p.faction]) return;
    cx2.strokeStyle = hexRGBA(S.factions[p.faction].color, 0.4);
    cx2.setLineDash([4 / view.k, 4 / view.k]);
    cx2.beginPath(); cx2.moveTo(p.x, p.y); cx2.lineTo(p.tx, p.ty); cx2.stroke();
    cx2.setLineDash([]);
  });
}

/* ---------- SVG katmanları ---------- */
const svgNodes = { stl: new Map(), party: new Map(), battle: new Map() };
let gRoot, gStl, gSiege, gParty, gLbl, gBattle, gSel;

function initSvg() {
  svg.innerHTML = '';
  gRoot = document.createElementNS(SVGNS, 'g'); svg.appendChild(gRoot);
  gStl = document.createElementNS(SVGNS, 'g'); gRoot.appendChild(gStl);
  gSiege = document.createElementNS(SVGNS, 'g'); gRoot.appendChild(gSiege);
  gParty = document.createElementNS(SVGNS, 'g'); gRoot.appendChild(gParty);
  gLbl = document.createElementNS(SVGNS, 'g'); gRoot.appendChild(gLbl);
  gBattle = document.createElementNS(SVGNS, 'g'); gRoot.appendChild(gBattle);
  gSel = document.createElementNS(SVGNS, 'g'); gRoot.appendChild(gSel);
  svgNodes.stl.clear(); svgNodes.party.clear(); svgNodes.battle.clear();
  rebuildSettlementNodes();
}

function el(tag, attrs, parent) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

/* şehir / kale / köy simgeleri (birim kutuda tanımlı, ölçekle çarpılır) */
const GLYPH = {
  town: 'M -1 .7 L -1 -.5 L -.62 -.5 L -.62 -.86 L -.28 -.86 L -.28 -.5 L .05 -.5 L .05 -1.05 L .42 -1.05 L .42 -.5 L 1 -.5 L 1 .7 Z',
  castle: 'M -.72 .72 L -.72 -.42 L -.44 -.42 L -.44 -.82 L -.16 -.82 L -.16 -.42 L .16 -.42 L .16 -.82 L .44 -.82 L .44 -.42 L .72 -.42 L .72 .72 Z',
  village: 'M -.8 .7 L -.8 -.08 L 0 -.85 L .8 -.08 L .8 .7 Z'
};

function rebuildSettlementNodes() {
  gStl.innerHTML = ''; gLbl.innerHTML = ''; gSiege.innerHTML = '';
  svgNodes.stl.clear();
  S.order.settlements.forEach(id => {
    const s = S.settlements[id];
    const g = el('g', { class: 'stl', 'data-id': id }, gStl);
    el('ellipse', { class: 'shadow', rx: 0, ry: 0, cy: 0, fill: 'rgba(0,0,0,.32)' }, g);
    const shape = el('path', { d: '', 'stroke-linejoin': 'round' }, g);
    const roof = el('path', { d: '', fill: 'rgba(0,0,0,.25)' }, g);
    const lbl = el('text', { class: 'stl-label', 'text-anchor': 'middle' }, gLbl);
    lbl.textContent = s.name;
    svgNodes.stl.set(id, { g, shape, roof, lbl, shadow: g.firstChild });
  });
}

function partyIconSize(p, inv) {
  const cnt = stackCount(p.troops);
  const base = clamp(4.4 + Math.sqrt(cnt) * 0.42, 4.4, 10);
  return base * clamp(inv, 0.42, 1.5);
}

function updateSvg() {
  const k = view.k;
  gRoot.setAttribute('transform', `translate(${view.x},${view.y}) scale(${k})`);
  const inv = 1 / k;

  /* --- yerleşimler --- */
  S.order.settlements.forEach(id => {
    const s = S.settlements[id];
    const n = svgNodes.stl.get(id); if (!n) return;
    const isVil = s.type === 'village';
    const hidden = (isVil && !S.layers.villages) || S.hidden[s.faction];
    n.g.style.display = hidden ? 'none' : '';
    n.lbl.style.display = 'none';
    if (hidden) return;
    const base = s.type === 'town' ? 11 : s.type === 'castle' ? 8.5 : 5.4;
    const r = base * clamp(inv, 0.4, 1.45);
    const col = S.factions[s.faction] ? S.factions[s.faction].color : '#888';
    n.g.setAttribute('transform', `translate(${s.x},${s.y}) scale(${r})`);
    n.shape.setAttribute('d', GLYPH[s.type] || GLYPH.village);
    n.shape.setAttribute('fill', col);
    n.shape.setAttribute('stroke', s.besiegedBy ? '#ff5c45' : 'rgba(0,0,0,.8)');
    n.shape.setAttribute('stroke-width', (s.besiegedBy ? 0.20 : 0.11));
    n.roof.setAttribute('d', isVil ? 'M -.8 -.08 L 0 -.85 L .8 -.08 Z' : 'M -1 -.5 L 1 -.5 L 1 -.28 L -1 -.28 Z');
    n.roof.setAttribute('opacity', isVil ? 0.35 : 0.22);
    n.shadow.setAttribute('rx', 0.95); n.shadow.setAttribute('ry', 0.26); n.shadow.setAttribute('cy', 0.78);

    const showLbl = S.layers.labels && (s.type === 'town' || (s.type === 'castle' && k > 0.7) || (isVil && k > 1.7));
    if (showLbl) {
      n.lbl.style.display = '';
      const fs = (s.type === 'town' ? 12.5 : s.type === 'castle' ? 10.5 : 8.5) * inv;
      n.lbl.setAttribute('x', s.x);
      n.lbl.setAttribute('y', s.y + r * 1.05 + 11 * inv);
      n.lbl.setAttribute('font-size', fs);
      n.lbl.setAttribute('stroke-width', 3 * inv);
      if (isVil) n.lbl.classList.add('vil-label'); else n.lbl.classList.remove('vil-label');
    }
  });

  /* --- kuşatma kampları --- */
  gSiege.innerHTML = '';
  S.order.settlements.forEach(id => {
    const s = S.settlements[id];
    if (!s.besiegedBy || S.hidden[s.faction]) return;
    const bp = S.parties[s.besiegedBy];
    const col = bp && S.factions[bp.faction] ? S.factions[bp.faction].color : '#d1503f';
    const r = 9 * clamp(inv, 0.4, 1.45);
    const g = el('g', { transform: `translate(${s.x},${s.y})` }, gSiege);
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + 0.6;
      const tx = Math.cos(a) * r * 2.1, ty = Math.sin(a) * r * 1.5 + r * 0.4;
      el('path', { d: `M ${tx - r * 0.42} ${ty + r * 0.3} L ${tx} ${ty - r * 0.45} L ${tx + r * 0.42} ${ty + r * 0.3} Z`,
        fill: col, stroke: 'rgba(0,0,0,.7)', 'stroke-width': 0.8 * inv }, g);
    }
    /* kuşatma ilerlemesi halkası */
    const rr = r * 2.6, circ = 2 * Math.PI * rr;
    el('circle', { cx: 0, cy: 0, r: rr, fill: 'none', stroke: 'rgba(0,0,0,.35)', 'stroke-width': 2.4 * inv }, g);
    el('circle', { cx: 0, cy: 0, r: rr, fill: 'none', stroke: col, 'stroke-width': 2.4 * inv,
      'stroke-dasharray': `${circ * clamp(s.siegeProgress / 100, 0, 1)} ${circ}`,
      transform: 'rotate(-90)', 'stroke-linecap': 'round' }, g);
  });

  /* --- ordular --- */
  const seen = new Set();
  S.order.parties.forEach(id => {
    const p = S.parties[id]; if (!p) return;
    seen.add(id);
    let n = svgNodes.party.get(id);
    if (!n) {
      const g = el('g', { class: 'party', 'data-pid': id }, gParty);
      const shadow = el('ellipse', { rx: 0, ry: 0, fill: 'rgba(0,0,0,.3)' }, g);
      const pole = el('path', { d: '', stroke: '#2b2118', fill: 'none', 'stroke-linecap': 'round' }, g);
      const flag = el('path', { d: '', stroke: 'rgba(0,0,0,.65)' }, g);
      const body = el('path', { d: '', stroke: 'rgba(0,0,0,.7)' }, g);
      const badge = el('text', { 'text-anchor': 'middle', class: 'stl-label' }, g);
      n = { g, shadow, pole, flag, body, badge }; svgNodes.party.set(id, n);
    }
    const hidden = !S.layers.parties || S.hidden[p.faction] || p.besieging;
    n.g.style.display = hidden ? 'none' : '';
    if (hidden) return;
    const cnt = stackCount(p.troops);
    const sz = partyIconSize(p, inv);
    const col = S.factions[p.faction] ? S.factions[p.faction].color : '#999';
    const lord = p.lordId ? S.lords[p.lordId] : null;
    n.g.setAttribute('transform', `translate(${p.x},${p.y})`);
    n.shadow.setAttribute('rx', sz * 0.62); n.shadow.setAttribute('ry', sz * 0.2);
    n.shadow.setAttribute('cy', sz * 0.52);
    /* gövde: miğfer/at silueti */
    const mix = stackMix(p.troops);
    const cavHeavy = cnt > 0 && mix.cav / cnt > 0.45;
    n.body.setAttribute('d', cavHeavy
      ? `M ${-sz * 0.55} ${sz * 0.45} q ${sz * 0.1} ${-sz * 0.75} ${sz * 0.55} ${-sz * 0.75} q ${sz * 0.45} 0 ${sz * 0.55} ${sz * 0.75} Z`
      : `M 0 ${-sz * 0.62} a ${sz * 0.42} ${sz * 0.42} 0 0 1 ${sz * 0.42} ${sz * 0.42} l 0 ${sz * 0.28} l ${-sz * 0.84} 0 l 0 ${-sz * 0.28} a ${sz * 0.42} ${sz * 0.42} 0 0 1 ${sz * 0.42} ${-sz * 0.42} Z`);
    n.body.setAttribute('fill', darken(col, 0.62));
    n.body.setAttribute('stroke-width', 0.9 * inv);
    /* sancak */
    const poleTop = -sz * 2.05;
    n.pole.setAttribute('d', `M 0 ${sz * 0.35} L 0 ${poleTop}`);
    n.pole.setAttribute('stroke-width', Math.max(0.9, sz * 0.11));
    const fw = sz * 1.25, fh = sz * 0.62;
    n.flag.setAttribute('d', p.type === 'bandit'
      ? `M 0 ${poleTop} L ${fw} ${poleTop + fh * 0.35} L ${fw * 0.55} ${poleTop + fh * 0.75} L ${fw} ${poleTop + fh * 1.15} L 0 ${poleTop + fh * 1.2} Z`
      : `M 0 ${poleTop} L ${fw} ${poleTop + fh * 0.42} L 0 ${poleTop + fh * 0.95} Z`);
    n.flag.setAttribute('fill', col);
    n.flag.setAttribute('stroke-width', 0.8 * inv);
    /* asker sayısı */
    const showBadge = k > 0.8 || (S.sel && S.sel.type === 'lord' && lord && S.sel.id === lord.id);
    n.badge.style.display = showBadge ? '' : 'none';
    if (showBadge) {
      n.badge.textContent = cnt >= 1000 ? (cnt / 1000).toFixed(1) + 'b' : cnt;
      n.badge.setAttribute('x', 0);
      n.badge.setAttribute('y', sz * 1.35 + 3 * inv);
      n.badge.setAttribute('font-size', 9.5 * inv);
      n.badge.setAttribute('stroke-width', 2.6 * inv);
      n.badge.setAttribute('fill', lord && lord.isKing ? '#ffd98a' : '#f0e9dc');
    }
  });
  svgNodes.party.forEach((n, id) => { if (!seen.has(id)) { n.g.remove(); svgNodes.party.delete(id); } });

  /* --- savaş işaretleri --- */
  gBattle.innerHTML = '';
  S.battles.forEach(b => {
    const age = S.day - b.day;
    if (age > 4 || age < 0) return;
    const sz = 9 * clamp(inv, 0.45, 1.5);
    const op = clamp(1 - age / 4, 0.25, 1);
    const g = el('g', { transform: `translate(${b.x},${b.y})`, opacity: op, class: 'party', 'data-bid': b.id,
      style: 'cursor:pointer' }, gBattle);
    el('circle', { r: sz * 1.05, fill: 'rgba(20,10,6,.72)', stroke: '#ff6a4d', 'stroke-width': 1.4 * inv }, g);
    el('path', { d: `M ${-sz * 0.5} ${sz * 0.5} L ${sz * 0.5} ${-sz * 0.5} M ${-sz * 0.5} ${-sz * 0.5} L ${sz * 0.5} ${sz * 0.5}`,
      stroke: '#ffd9a0', 'stroke-width': Math.max(1.2, sz * 0.22), 'stroke-linecap': 'round', fill: 'none' }, g);
  });

  /* --- seçim halkası --- */
  gSel.innerHTML = '';
  const target = selectedPoint();
  if (target) {
    el('circle', { class: 'sel-ring', cx: target.x, cy: target.y, r: 17 * inv, 'stroke-width': 2 * inv }, gSel);
    el('circle', { class: 'sel-ring', cx: target.x, cy: target.y, r: 23 * inv, 'stroke-width': 1 * inv, opacity: .4 }, gSel);
  }
}

function selectedPoint() {
  if (!S.sel) return null;
  if (S.sel.type === 'settlement') { const s = S.settlements[S.sel.id]; return s ? { x: s.x, y: s.y } : null; }
  if (S.sel.type === 'party') { const p = S.parties[S.sel.id]; return p ? { x: p.x, y: p.y } : null; }
  if (S.sel.type === 'lord') {
    const l = S.lords[S.sel.id]; if (!l) return null;
    const p = l.partyId ? S.parties[l.partyId] : null;
    if (p && !p.besieging) return { x: p.x, y: p.y };
    if (p && p.besieging) { const s = S.settlements[p.besieging]; if (s) return { x: s.x, y: s.y }; }
    const f = l.fiefs.map(f => S.settlements[f]).find(Boolean);
    return f ? { x: f.x, y: f.y } : null;
  }
  return null;
}

/* ---------- ipucu balonu ---------- */
const tip = document.createElement('div');
tip.style.cssText = 'position:absolute;z-index:15;pointer-events:none;display:none;background:rgba(23,20,15,.94);' +
  'border:1px solid var(--border-secondary);border-radius:8px;padding:5px 9px;font-size:11.5px;white-space:nowrap;' +
  'box-shadow:0 4px 14px rgba(0,0,0,.4);color:var(--text-primary)';
document.getElementById('mapWrap').appendChild(tip);
function showTip(html, sx, sy) {
  tip.innerHTML = html; tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = clamp(sx - w / 2, 4, svg.clientWidth - w - 4) + 'px';

/* ---------- yerleştirme modu ---------- */
let placeMode = null;
function startPlace(msg, fn) {
  placeMode = { fn };
  document.getElementById('placeMsg').textContent = msg;
  document.getElementById('placeBar').classList.add('on');
  if (window.innerWidth <= 900) document.getElementById('side').classList.remove('open');
