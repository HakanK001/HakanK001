    const d = dist2(b.x, b.y, p.x, p.y);
    if (d < tol && d < bestD) { bestD = d; best = { type: 'battle', id: b.id }; }
  });
  (S.builds || []).forEach(b => {
    if (S.hidden[b.faction]) return;
    const d = dist2(b.x, b.y, p.x, p.y);
    if (d < tol && d < bestD) { bestD = d; best = { type: 'build', id: b.id }; }
  });
  S.order.parties.forEach(id => {
    const q = S.parties[id]; if (!q || !S.layers.parties || S.hidden[q.faction] || q.besieging) return;
    const d = dist2(q.x, q.y - 6 / view.k, p.x, p.y);
    if (d < tol && d < bestD) { bestD = d; best = { type: 'party', id }; }
  });
  S.order.settlements.forEach(id => {
    const s = S.settlements[id]; if (!s || S.hidden[s.faction]) return;
    if (s.type === 'village' && !S.layers.villages) return;
    const d = dist2(s.x, s.y, p.x, p.y);
    const t = s.type === 'village' ? tol * 0.75 : tol;
    if (d < t && d < bestD * 1.15) { bestD = d; best = { type: 'settlement', id }; }
  });
  return best;
}
function hitTip(hit) {
  if (hit.type === 'settlement') {
    const s = S.settlements[hit.id];
    const t = s.type === 'town' ? 'Şehir' : s.type === 'castle' ? 'Kale' : 'Köy';
    return `<b>${esc(s.name)}</b> · ${t}<br><span style="color:${S.factions[s.faction] ? S.factions[s.faction].color : '#999'}">${esc(facName(s.faction))}</span>` +
      (s.type !== 'village' ? ` · ${fmt(stackCount(s.garrison))} garnizon` : '') +
      (s.besiegedBy ? ` · <span style="color:#ff6a4d">kuşatma %${Math.round(s.siegeProgress)}</span>` : '');
  }
  if (hit.type === 'party') {
    const p = S.parties[hit.id];
    if (p.type === 'caravan') {
      const g = p.cargo ? GOOD_BY_ID[p.cargo.good] : null;
      const to = S.settlements[p.targetId];
      return `<b>🐫 ${esc(p.name)}</b><br>${g ? esc(g.name) + ' · ' + p.cargo.qty + ' yük' : 'yük'} → ${to ? esc(to.name) : '?'}`;
    }
    return `<b>${esc(partyLabel(p))}</b><br><span style="color:${S.factions[p.faction] ? S.factions[p.faction].color : '#999'}">${esc(facName(p.faction))}</span> · ${fmt(stackCount(p.troops))} asker · ${esc(goalLabel(p))}`;
  }
  if (hit.type === 'build') {
    const b = (S.builds || []).find(x => x.id === hit.id);
    if (!b) return '';
    return `<b>🧱 ${esc(b.name)}</b><br>${esc(BUILD_DEFS[b.type].name)} inşaatı · ${esc(facName(b.faction))} · %${Math.round(b.progress / b.days * 100)}${b.stalled ? ' (durdu)' : ''}`;
  }
  if (hit.type === 'battle') {
    const b = S.battles.find(x => x.id === hit.id);
    return b ? `<b>⚔ ${esc(b.title)}</b><br>${esc(b.a.name)} ${b.a.start} ⨯ ${b.b.start} ${esc(b.b.name)} · <b>tıkla, izle</b>` : '';
  }
  return '';
}

function handleMapClick(e) {
  const rect = svg.getBoundingClientRect();
  const w = s2w(e.clientX - rect.left, e.clientY - rect.top);
  if (placeMode) {
    const fn = placeMode.fn; cancelPlace();
    fn(w); return;
  }
  const hit = hitTest(e.clientX - rect.left, e.clientY - rect.top);
  if (hit && hit.type === 'battle') { openBattle(hit.id); return; }
  select(hit);
}

function select(sel) {
  if (sel && sel.type === 'party') {
    const p = S.parties[sel.id];
    if (p && p.lordId) sel = { type: 'lord', id: p.lordId };
  }
  S.sel = sel;
  uiDirty.sel = true;
  if (sel) setTab('sel');
  requestDraw(); renderUI(true);
}

function focusOn(x, y, k) {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (k) view.k = clamp(k, view.minK, view.maxK);
  view.x = w / 2 - x * view.k; view.y = h / 2 - y * view.k;
  clampView(); requestDraw();
}
function focusSel() {
  const p = selectedPoint();
  if (p) { focusOn(p.x, p.y, Math.max(view.k, 1.5)); if (window.innerWidth <= 900) document.getElementById('side').classList.remove('open'); }
}

let drawQueued = false;
function requestDraw() {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; drawCanvas(); updateSvg(); });
}
/* =====================================================================
   Bölüm 4: Simülasyon — ordular, savaşlar, kuşatmalar, ekonomi, diplomasi
   ===================================================================== */

const BASE_SPEED = 26;      // gün başına harita birimi
const ENCOUNTER_R = 9;      // karşılaşma yarıçapı

function partySpeed(p) {
  const n = stackCount(p.troops);
  const mix = stackMix(p.troops);
  const cavRatio = n ? mix.cav / n : 0;
  let s = BASE_SPEED * (1 + cavRatio * 0.35);
  s *= 1 / (1 + n / 320);
  if (p.type === 'bandit') s *= 1.12;
  if (p.morale < 35) s *= 0.9;
  const season = calendar(S.day).season;
  if (season === 'Kış') s *= 0.82;
  if (p.type === 'caravan') s *= 0.85;
  if (nearRoad(p.x, p.y)) s *= 1.32;
  return s;
}
function partyPower(p) {
  const lord = p.lordId ? S.lords[p.lordId] : null;
  let pw = stackPower(p.troops);
  if (lord) pw *= (1 + lord.skillTactics * 0.035);
  pw *= 0.6 + p.morale / 140;
  return pw;
}
function garrisonHelpers(s) {
  return S.order.parties.map(i => S.parties[i])
    .filter(p => p && p.faction === s.faction && p.goal === 'garrison' && p.targetId === s.id);
}
function settlementDefPower(s) {
  let pw = stackPower(s.garrison) * (1 + (s.walls / 100) * (s.type === 'town' ? 0.95 : 0.75));
  garrisonHelpers(s).forEach(p => { pw += partyPower(p); });
  return pw;
}
function settlementDefCount(s) {
  return stackCount(s.garrison) + garrisonHelpers(s).reduce((a, p) => a + stackCount(p.troops), 0);
}

function setSpeed(v) {
  S.speed = v; S.running = v > 0;
  document.querySelectorAll('#spdCtl button').forEach(b => b.classList.toggle('on', +b.dataset.spd === v));
}

/* ---------------- ana adım ---------------- */
function stepWorld(dt) {
  const before = Math.floor(S.day);
  S.day += dt;
  const after = Math.floor(S.day);

  moveParties(dt);
  checkEncounters();
  progressSieges(dt);

  for (let d = before; d < after; d++) dailyTick();
  if (after !== before) { uiDirty.sel = uiDirty.kra = uiDirty.war = uiDirty.his = true; }
}

/* ---------------- hareket ---------------- */
function moveParties(dt) {
  S.order.parties.forEach(id => {
    const p = S.parties[id]; if (!p) return;
    if (p.cooldown > 0) p.cooldown -= dt;
    if (p.besieging) return;
    /* mareşali takip: hedef sürekli güncellenir */
    if (p.goal === 'follow') {
      const lead = p.targetId ? S.parties[p.targetId] : null;
      if (!lead || lead.faction !== p.faction) { p.goal = 'idle'; p.tx = null; }
      else if (lead.besieging) {
        const s = S.settlements[lead.besieging];
        if (s && atWar(p.faction, s.faction)) { setGoal(p, 'siege', s); }
        else { p.goal = 'idle'; p.tx = null; }
      } else { p.tx = lead.x; p.ty = lead.y; }
    }
    if (p.type === 'caravan') {
      if (p.tx == null) { const t = S.settlements[p.targetId]; if (t) { p.tx = t.x; p.ty = t.y; } else { removeParty(p.id); return; } }
    } else if (p.tx == null || p.goal === 'idle') decideGoal(p);
    if (p.tx == null) return;
    const d = dist2(p.x, p.y, p.tx, p.ty);
    const step = partySpeed(p) * dt;
    if (d <= step) {
      p.x = p.tx; p.y = p.ty;
      if (p.goal === 'follow') return;
      if (p.type === 'caravan') { caravanArrive(p); return; }
      arriveAtTarget(p);
    } else {
      p.x += (p.tx - p.x) / d * step;
      p.y += (p.ty - p.y) / d * step;
    }
  });
}

function ownSettlements(f) { return S.order.settlements.map(i => S.settlements[i]).filter(s => s.faction === f); }
function enemyFactions(f) {
  return Object.keys(S.factions).filter(o => o !== f && atWar(f, o) && S.factions[o].alive);
}

function decideGoal(p) {
  if (p.type === 'bandit') return banditGoal(p);
  if (p.type === 'raider') return raiderGoal(p);
  const lord = S.lords[p.lordId]; if (!lord) { p.goal = 'idle'; p.tx = null; return; }
  const fac = S.factions[p.faction]; if (!fac) return;
  const pers = PERSONALITIES.find(x => x.id === lord.personality) || PERSONALITIES[0];
  const cnt = stackCount(p.troops);
  const cap = lordPartyCap(lord);

  /* 1) zayıfsa tımara dön */
  if (cnt < cap * 0.32 || p.morale < 30) {
    const home = homeSettlement(lord);
    if (home) return setGoal(p, 'return', home);
  }
  /* 2) kendi toprağında kuşatma varsa savun */
  const besieged = ownSettlements(p.faction).filter(s => s.besiegedBy);
  if (besieged.length) {
    besieged.sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
    const t = besieged[0];
    if (dist2(t.x, t.y, p.x, p.y) < 340) return setGoal(p, 'defend', t);
  }
  const enemies = enemyFactions(p.faction);
  /* 3) süren dost kuşatmasına katıl */
  if (enemies.length && cnt > cap * 0.3) {
    const ongoing = S.order.settlements.map(i => S.settlements[i]).filter(s =>
      s.besiegedBy && S.parties[s.besiegedBy] && S.parties[s.besiegedBy].faction === p.faction && atWar(p.faction, s.faction));
    if (ongoing.length && rnd() < 0.9) {
      ongoing.sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
      return setGoal(p, 'siege', ongoing[0]);
    }
  }
  /* 4) mareşalin ordusuna katıl */
  if (enemies.length && fac.marshalId && fac.marshalId !== lord.id && cnt > cap * 0.35) {
    const m = S.lords[fac.marshalId];
    const mp = m && m.partyId ? S.parties[m.partyId] : null;
    if (mp && dist2(mp.x, mp.y, p.x, p.y) < 420 && rnd() < 0.7) {
      p.goal = 'follow'; p.targetId = mp.id; p.tx = mp.x; p.ty = mp.y;
      return;
    }
  }
  /* 5) krallığın savaş planına uy */
  if (enemies.length) {
    const plan = fac.warPlan;
    const disciplined = clamp(0.45 + (lord.relKing + 100) / 260 + (lord.skillStrategy || 4) / 24, 0.2, 0.95) * S.opts.aiSkill;
    if (plan && rnd() < disciplined) {
      const t = S.settlements[plan.settlementId];
      if (t) {
        if (plan.kind === 'defend' && t.faction === p.faction) return setGoal(p, 'defend', t);
        if (plan.kind === 'attack' && enemies.includes(t.faction)) {
          const myPw = partyPower(p);
          const allied = S.order.parties.map(i => S.parties[i])
            .filter(q => q && q.faction === p.faction && q !== p && (q.besieging === t.id || q.targetId === t.id))
            .reduce((a, q) => a + partyPower(q), 0);
          const def = settlementDefPower(t);
          /* tek başına yetmiyorsa yaklaş ve bekle/yağmala, birlikte yeter oluyorsa kuşat */
          if (myPw + allied > def * 0.85 || t.besiegedBy) return setGoal(p, 'siege', t);
          const vil = pickRaidTarget(p, enemies);
          if (vil && dist2(vil.x, vil.y, t.x, t.y) < 260) return setGoal(p, 'raid', vil);
          return setGoal(p, 'siege', t);
        }
      }
    }
    const wantWar = rnd() < clamp(0.42 * pers.aggr * fac.aggr * S.opts.aggression + (lord.isKing ? 0.15 : 0), 0.05, 0.95);
    if (wantWar && cnt > cap * 0.5) {
      const target = pickCampaignTarget(p.faction, enemies);
      if (target) {
        const myPw = partyPower(p);
        if (target.type !== 'village' && myPw > settlementDefPower(target) * 0.45) return setGoal(p, 'siege', target);
        const vil = pickRaidTarget(p, enemies);
        if (vil && pers.greed > 0.65) return setGoal(p, 'raid', vil);
        return setGoal(p, 'siege', target);
      }
    }
    const vil = pickRaidTarget(p, enemies);
    if (vil && rnd() < 0.5) return setGoal(p, 'raid', vil);
  }
  /* 6) barışta */
  if (cnt < cap * 0.85 && rnd() < 0.7) {
    const home = homeSettlement(lord) || nearestOwn(p);
    if (home) return setGoal(p, 'return', home);
  }
  const own = ownSettlements(p.faction).filter(s => s.type !== 'village');
  if (own.length) return setGoal(p, 'patrol', pick(own));
  p.goal = 'idle'; p.tx = null;
}

function homeSettlement(lord) {
  const f = lord.fiefs.map(x => S.settlements[x]).filter(s => s && s.faction === lord.faction);
  return f.find(s => s.type === 'town') || f.find(s => s.type === 'castle') || f[0]
    || S.settlements[S.factions[lord.faction] && S.factions[lord.faction].capital]
    || ownSettlements(lord.faction)[0];
}
function nearestOwn(p) {
  const own = ownSettlements(p.faction).filter(s => s.type !== 'village');
  if (!own.length) return null;
  return own.reduce((a, b) => dist2(a.x, a.y, p.x, p.y) < dist2(b.x, b.y, p.x, p.y) ? a : b);
}
function pickCampaignTarget(f, enemies) {
  const cands = S.order.settlements.map(i => S.settlements[i])
    .filter(s => enemies.includes(s.faction) && s.type !== 'village');
  if (!cands.length) return null;
  const mine = ownSettlements(f);
  if (!mine.length) return pick(cands);
  let best = null, bestScore = -1e9;
  cands.forEach(s => {
    const near = mine.reduce((m, o) => Math.min(m, dist2(o.x, o.y, s.x, s.y)), 1e9);
    const score = -near * 1.1 - stackCount(s.garrison) * 1.6 - s.walls * 1.2 + (s.type === 'castle' ? 60 : 0);
    if (score > bestScore) { bestScore = score; best = s; }
  });
  return best;
}
function pickRaidTarget(p, enemies) {
  const vils = S.order.settlements.map(i => S.settlements[i])
    .filter(s => s.type === 'village' && enemies.includes(s.faction) && s.raidedUntil < S.day);
  if (!vils.length) return null;
  vils.sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
  return vils[Math.min(vils.length - 1, ri(0, 2))];
}
function banditGoal(p) {
  const vils = S.order.settlements.map(i => S.settlements[i])
    .filter(s => s.type === 'village' && s.raidedUntil < S.day);
  if (rnd() < 0.5 && vils.length) {
    vils.sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
    return setGoal(p, 'raid', vils[Math.min(vils.length - 1, ri(0, 4))]);
  }
  for (let i = 0; i < 30; i++) {
    const a = rnd() * Math.PI * 2, r = rf(40, 180);
    const x = clamp(p.x + Math.cos(a) * r, 40, MAP_W - 40), y = clamp(p.y + Math.sin(a) * r, 40, MAP_H - 40);
    if (isLand(x, y)) { p.goal = 'roam'; p.targetId = null; p.tx = x; p.ty = y; return; }
  }
  p.goal = 'idle'; p.tx = null;
}
/* deniz akıncıları: kıyı köylerini vurur, sonra denize açılır */
function raiderGoal(p) {
  const enemies = enemyFactions(p.faction);
  if (!enemies.length || p.raidsLeft <= 0) {
    /* denize dön ve kaybol */
    const sea = nearestSea(p.x, p.y, 260);
    if (!sea) { removeParty(p.id); return; }
    p.goal = 'sail'; p.targetId = null; p.tx = sea.x; p.ty = sea.y;
    return;
  }
  const targets = S.order.settlements.map(i => S.settlements[i])
    .filter(s => enemies.includes(s.faction) && s.raidedUntil < S.day && isCoastal(s));
  if (!targets.length) { p.raidsLeft = 0; return raiderGoal(p); }
  targets.sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y));
  setGoal(p, 'raid', targets[Math.min(targets.length - 1, ri(0, 2))]);
}
function isCoastal(s) {
  for (let a = 0; a < 8; a++) {
    const ang = a / 8 * Math.PI * 2;
    if (!isLand(s.x + Math.cos(ang) * 52, s.y + Math.sin(ang) * 52)) return true;
  }
  return false;
}
function nearestSea(x, y, maxR) {
  for (let r = 30; r <= (maxR || 300); r += 22) {
    for (let a = 0; a < 12; a++) {
      const ang = a / 12 * Math.PI * 2;
      const px = clamp(x + Math.cos(ang) * r, 8, MAP_W - 8), py = clamp(y + Math.sin(ang) * r, 8, MAP_H - 8);
      if (!isLand(px, py)) return { x: px, y: py };
    }
  }
  return null;
}
function seaRaidTick() {
  Object.values(S.factions).forEach(fac => {
    if (fac.isBandit || !fac.alive) return;
    const coastal = fac.culture === 'nd' || fac.culture === 'sr';
    if (!coastal) return;
    const enemies = enemyFactions(fac.id);
    if (!enemies.length) return;
    if (fac.treasury < 6000) return;
    const active = S.order.parties.filter(i => S.parties[i] && S.parties[i].type === 'raider' && S.parties[i].faction === fac.id).length;
    if (active >= 2) return;
    if (rnd() > 0.05 * S.opts.aggression) return;
    const home = ownSettlements(fac.id).filter(isCoastal)[0];
    if (!home) return;
    const start = nearestSea(home.x, home.y, 200);
    if (!start) return;
    fac.treasury -= 4000;
    const size = ri(40, 110);
    const p = {
      id: uid('p'), type: 'raider', lordId: null, faction: fac.id,
      name: `${fac.short} deniz akıncıları`, x: start.x, y: start.y,
      tx: null, ty: null, goal: 'idle', targetId: null,
      troops: makeStack(fac.culture, size, 0.6), prisoners: {},
      morale: 90, speed: 1.2, besieging: null, cooldown: 0, raidsLeft: ri(2, 4)
    };
    S.parties[p.id] = p; S.order.parties.push(p.id);
    addLog(`⛵ ${fac.name} ${fmt(size)} kişilik bir akıncı filosu denize açtı.`, 'war', 1);
  });
}
function setGoal(p, goal, target) {
  p.goal = goal; p.targetId = target ? target.id : null;
  p.tx = target ? target.x : null; p.ty = target ? target.y : null;
}

function arriveAtTarget(p) {
  const t = p.targetId ? S.settlements[p.targetId] : null;
  if (!t) { p.goal = 'idle'; p.tx = null; return; }
  if (p.goal === 'raid' && t.type === 'village' && (p.type === 'bandit' || p.type === 'raider' || atWar(p.faction, t.faction))) {
    raidVillage(p, t);
    if (p.type === 'raider') p.raidsLeft = (p.raidsLeft || 1) - 1;
    p.goal = 'idle'; p.tx = null; return;
  }
  if (p.goal === 'siege' && atWar(p.faction, t.faction) && t.type !== 'village') {
    startSiege(p, t); return;
  }
  if (p.goal === 'sail') { removeParty(p.id); return; }
  if (p.goal === 'return' || p.goal === 'patrol' || p.goal === 'defend') {
    if (t.faction === p.faction) {
      p.restUntil = S.day + (p.goal === 'defend' ? 1 : rf(2, 5));
      p.goal = 'garrison'; p.tx = null;
      return;
    }
  }
  p.goal = 'idle'; p.tx = null;
}

/* ---------------- karşılaşmalar ---------------- */
/* yakındaki dost/düşman gücü (akıllı karar için) */
function nearbyPower(x, y, faction, hostile, radius) {
  let pw = 0;
  S.order.parties.forEach(i => {
    const q = S.parties[i]; if (!q) return;
    const isFoe = q.faction !== faction && (q.type === 'bandit' || atWar(q.faction, faction));
    if (hostile ? !isFoe : q.faction !== faction) return;
    const d = dist2(q.x, q.y, x, y);
    if (d < (radius || 120)) pw += partyPower(q) * (1 - d / (radius || 120));
  });
  return pw;
}

function checkEncounters() {
  const list = S.order.parties.map(id => S.parties[id]).filter(Boolean);
  for (let i = 0; i < list.length; i++) {
    const a = list[i]; if (!S.parties[a.id]) continue;
    for (let j = i + 1; j < list.length; j++) {
      const b = list[j]; if (!S.parties[b.id] || !S.parties[a.id]) continue;
      if (a.faction === b.faction && !partiesFeuding(a, b)) continue;
      const hostile = a.faction === b.faction ? true
        : (a.faction === 'bandit' || b.faction === 'bandit' || atWar(a.faction, b.faction));
      if (!hostile) continue;
      if (a.cooldown > 0 || b.cooldown > 0) continue;
      if (dist2(a.x, a.y, b.x, b.y) > ENCOUNTER_R) continue;
      const pa = partyPower(a), pb = partyPower(b);
      const weak = pa < pb ? a : b, strong = pa < pb ? b : a;
      const ratio = Math.min(pa, pb) / Math.max(1, Math.max(pa, pb));
      if (ratio < 0.45 && partySpeed(weak) > partySpeed(strong) * 0.98 && rnd() < 0.65) {
        fleeFrom(weak, strong); weak.cooldown = 0.8; strong.cooldown = 0.4; continue;
      }
      resolveBattle(a, b, 'field');
    }
  }
}
function fleeFrom(weak, strong) {
  const dx = weak.x - strong.x, dy = weak.y - strong.y;
  const d = Math.hypot(dx, dy) || 1;
  let nx = clamp(weak.x + dx / d * 90, 30, MAP_W - 30), ny = clamp(weak.y + dy / d * 90, 30, MAP_H - 30);
  if (!isLand(nx, ny)) { nx = clamp(weak.x - dx / d * 40, 30, MAP_W - 30); ny = clamp(weak.y - dy / d * 40, 30, MAP_H - 30); }
  weak.goal = 'flee'; weak.targetId = null; weak.tx = nx; weak.ty = ny;
  weak.morale = clamp(weak.morale - 4, 0, 100);
}

/* ---------------- savaş çözümü ---------------- */
function partyLabel(p) {
  if (!p) return '—';
  if (p.lordId && S.lords[p.lordId]) { const l = S.lords[p.lordId]; return `${l.title} ${l.name}`; }
  return p.name || (S.factions[p.faction] ? S.factions[p.faction].short + ' ordusu' : 'Ordu');
}
function factionName(f) { return S.factions[f] ? S.factions[f].name : '—'; }
function nearestPlace(x, y) {
  let best = null, bd = 1e9;
  S.order.settlements.forEach(id => {
    const s = S.settlements[id];
    const d = dist2(s.x, s.y, x, y);
    if (d < bd) { bd = d; best = s; }
  });
  if (!best) return { name: 'Kalradya', d: 0 };
  return { name: best.name, d: bd, id: best.id };
}

/* lordun taktiği: birlik karışımı, arazi ve düşmana göre */
function chooseTactic(stack, terrain, lord, enemyStack) {
  const n = stackCount(stack) || 1;
  const m = stackMix(stack);
  const cavR = m.cav / n, archR = m.arch / n;
  const skill = ((lord ? lord.skillTactics : 3) / 10) * S.opts.aiSkill;
  const tm = TERRAIN_MOD[terrain] || TERRAIN_MOD.plain;
  let best = TACTICS[0], bestScore = -1e9;
  TACTICS.forEach(t => {
    let sc = (m.inf * t.inf * tm.inf + m.arch * t.arch * tm.arch + m.cav * t.cav * tm.cav) / n;
    if (t.id === 'feigned' && cavR < 0.4) sc -= 0.25;
    if (t.id === 'charge' && cavR < 0.25) sc -= 0.3;
    if (t.id === 'skirmish' && archR < 0.2) sc -= 0.25;
    if (enemyStack) {
      const en = stackCount(enemyStack) || 1, em = stackMix(enemyStack);
      if (t.id === 'shieldwall' && em.cav / en > 0.4) sc += 0.18;
      if (t.id === 'skirmish' && em.inf / en > 0.6) sc += 0.12;
      if (t.id === 'charge' && em.arch / en > 0.35) sc += 0.16;
    }
    sc += rf(-0.22, 0.22) * (1 - skill);
    if (sc > bestScore) { bestScore = sc; best = t; }
  });
  return best;
}
function tacticPower(stack, tactic, terrain) {
  const tm = TERRAIN_MOD[terrain] || TERRAIN_MOD.plain;
  let pw = 0;
  for (const k in stack) {
    const t = TROOPS[k]; if (!t) continue;
    pw += t.pw * stack[k] * (tactic ? tactic[t.cls] : 1) * tm[t.cls];
  }
  return pw;
}

/* iki yığın çarpışır; tur tur kayıt tutulur */
function fightStacks(stA, stB, modA, modB, ctx) {
  const A = JSON.parse(JSON.stringify(stA)), B = JSON.parse(JSON.stringify(stB));
  const start = { a: stackCount(A), b: stackCount(B) };
  const rounds = [{ a: start.a, b: start.b }];
  let n = 0;
  const leth = 0.055 * S.opts.lethality;
  const terrain = ctx && ctx.terrain ? ctx.terrain : 'plain';
  const tacA = ctx && ctx.tacticA ? ctx.tacticA : null;
  const tacB = ctx && ctx.tacticB ? ctx.tacticB : null;
  while (n++ < 120) {
    const ca = stackCount(A), cb = stackCount(B);
    if (ca <= 0 || cb <= 0) break;
    const pa = tacticPower(A, tacA, terrain) * modA * rf(0.9, 1.1);
    const pb = tacticPower(B, tacB, terrain) * modB * rf(0.9, 1.1);
    if (pa <= 0 || pb <= 0) break;
    const avgA = stackPower(A) / ca, avgB = stackPower(B) / cb;
    stackRemove(B, Math.min(cb, Math.max(1, (pa * leth) / Math.max(1, avgB) * 0.35)));
    stackRemove(A, Math.min(ca, Math.max(1, (pb * leth) / Math.max(1, avgA) * 0.35)));
    rounds.push({ a: stackCount(A), b: stackCount(B) });
    const ra = stackCount(A) / start.a, rb = stackCount(B) / start.b;
    if (ra < 0.22 || rb < 0.22) break;
  }
  const endA = stackCount(A), endB = stackCount(B);
  const winner = (endA / Math.max(1, start.a)) >= (endB / Math.max(1, start.b)) ? 'a' : 'b';
  return { A, B, winner, lossA: start.a - endA, lossB: start.b - endB, startA: start.a, startB: start.b, rounds };
}

function recordBattle(rec) {
  rec.id = uid('b');
  rec.day = S.day;
  S.battles.unshift(rec);
  if (S.battles.length > 60) S.battles.length = 60;
  S.stats.battles++;
  uiDirty.war = true;
  const total = rec.a.start + rec.b.start;
  if (total >= 180 && S.opts.battleAlert) {
    S.alert = { id: rec.id, title: rec.title, sub: `${rec.a.name} ${rec.a.start} ⨯ ${rec.b.start} ${rec.b.name}` };
    alertDirty = true;
    if (S.opts.pauseOnBattle) setSpeed(0);
  }
  return rec;
}

function stackSnapshot(st) { return JSON.parse(JSON.stringify(st)); }

function resolveBattle(a, b, kind) {
  const lordA = a.lordId ? S.lords[a.lordId] : null;
  const lordB = b.lordId ? S.lords[b.lordId] : null;
  const modA = (1 + (lordA ? lordA.skillTactics * 0.035 : 0)) * (0.65 + a.morale / 150);
  const modB = (1 + (lordB ? lordB.skillTactics * 0.035 : 0)) * (0.65 + b.morale / 150);
  const snapA = stackSnapshot(a.troops), snapB = stackSnapshot(b.troops);
  const terrain = biomeAt((a.x + b.x) / 2, (a.y + b.y) / 2);
  const tacA = chooseTactic(a.troops, terrain, lordA, b.troops);
  const tacB = chooseTactic(b.troops, terrain, lordB, a.troops);
  const r = fightStacks(a.troops, b.troops, modA, modB, { terrain, tacticA: tacA, tacticB: tacB });
  a.troops = r.A; b.troops = r.B;

  const win = r.winner === 'a' ? a : b, lose = r.winner === 'a' ? b : a;
  const winLord = r.winner === 'a' ? lordA : lordB, loseLord = r.winner === 'a' ? lordB : lordA;
  const loseLoss = r.winner === 'a' ? r.lossB : r.lossA;
  const winLoss = r.winner === 'a' ? r.lossA : r.lossB;

  /* çekilirken ek kayıp ve esirler */
  const extra = stackRemove(lose.troops, stackCount(lose.troops) * rf(0.12, 0.3));
  const capt = {};
  Object.entries(extra).forEach(([k, v]) => { const n = Math.round(v * 0.6); if (n > 0) capt[k] = n; });
  if (win.type !== 'bandit') stackMerge(win.prisoners, capt);

  win.morale = clamp(win.morale + 7, 0, 100);
  lose.morale = clamp(lose.morale - 16, 0, 100);
  win.cooldown = 1.0; lose.cooldown = 1.2;
  if (winLord) { winLord.renown += Math.round(3 + loseLoss / 6); winLord.battlesWon++; winLord.kills += loseLoss; }
  if (loseLord) { loseLord.renown = Math.max(0, loseLord.renown - 4); loseLord.battlesLost++; }

  const place = nearestPlace((a.x + b.x) / 2, (a.y + b.y) / 2);
  const rec = recordBattle({
    x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
    place: place.name, placeId: place.id,
    type: kind === 'siege' ? 'sortie' : 'field',
    title: `${place.name} ${place.d < 30 ? 'önünde' : 'yakınlarında'} meydan savaşı`,
    terrain,
    a: { name: partyLabel(a), faction: a.faction, lordId: a.lordId, start: r.startA, end: stackCount(a.troops), loss: r.lossA, stack: snapA, tactic: tacA.name },
    b: { name: partyLabel(b), faction: b.faction, lordId: b.lordId, start: r.startB, end: stackCount(b.troops), loss: r.lossB, stack: snapB, tactic: tacB.name },
    winner: r.winner, rounds: r.rounds, prisoners: stackCount(capt)
  });

  const wiped = stackCount(lose.troops) <= 2;
  addLog(`⚔ ${rec.title}: ${partyLabel(win)} (${fmt(r.winner === 'a' ? r.startA : r.startB)}) — ` +
    `${partyLabel(lose)} (${fmt(r.winner === 'a' ? r.startB : r.startA)}) yenildi. Kayıp ${fmt(winLoss)} / ${fmt(loseLoss + stackCount(extra))}.`,
    'war', (() => {
      const tot = rec.a.start + rec.b.start;
      const banditFight = a.type === 'bandit' || b.type === 'bandit';
      if (banditFight) return tot >= 200 ? 1 : 0;
      return tot >= 120 ? 2 : 1;
    })(), rec.id);

  if (wiped) destroyParty(lose, win);
  else {
    fleeFrom(lose, win);
    if (loseLord && rnd() < 0.12) { capturePrisoner(loseLord, win, place.name); houseFeudFromBattle(win, loseLord, 12); }
  }
  if (win.faction !== 'bandit' && S.factions[win.faction]) S.factions[win.faction].treasury += Math.round(loseLoss * rf(4, 12));
  uiDirty.kra = true;
  return { win, lose, rec };
}

function destroyParty(p, winner) {
  const lord = p.lordId ? S.lords[p.lordId] : null;
  if (lord) {
    lord.partyId = null;
    if (rnd() < 0.55 && winner && winner.faction !== 'bandit') { capturePrisoner(lord, winner); houseFeudFromBattle(winner, lord, 10); }
    else {
      lord.state = 'regroup'; lord.freeAt = S.day + rf(4, 10);
      addLog(`${lord.title} ${lord.name} ordusunu kaybetti, dağılan adamlarını topluyor.`, '', 1);
    }
  } else if (p.type === 'bandit') {
    addLog(`${p.name} çetesi yok edildi.`, '', 0);
  }
  removeParty(p.id);
}
function removeParty(id) {
  const p = S.parties[id]; if (!p) return;
  if (p.besieging) liftSiege(p);
  if (p.lordId && S.lords[p.lordId] && S.lords[p.lordId].partyId === id) S.lords[p.lordId].partyId = null;
  delete S.parties[id];
  S.order.parties = S.order.parties.filter(x => x !== id);
  S.order.parties.forEach(i => { const q = S.parties[i]; if (q && q.goal === 'follow' && q.targetId === id) { q.goal = 'idle'; q.tx = null; } });
  if (S.sel && S.sel.type === 'party' && S.sel.id === id) S.sel = null;
}
function houseFeudFromBattle(winnerParty, loserLord, amount) {
  const wl = winnerParty && winnerParty.lordId ? S.lords[winnerParty.lordId] : null;
  if (!wl || !loserLord || !wl.houseId || !loserLord.houseId) return;
  if (wl.houseId === loserLord.houseId) return;
  addFeud(wl.houseId, loserLord.houseId, amount, 'savaş meydanında dökülen kan');
}
function capturePrisoner(lord, winner, place) {
  lord.state = 'prisoner';
  lord.prisonerOf = winner.faction;
  lord.freeAt = S.day + rf(10, 35);
  if (lord.partyId) removeParty(lord.partyId);
  lord.partyId = null;
  addLog(`🔒 ${lord.title} ${lord.name}${place ? ' (' + place + ')' : ''} esir düştü — ${factionName(winner.faction)} zindanında.`, 'war', 2);
  uiDirty.kra = true;
}
function releaseLord(lord) {
  lord.state = 'regroup'; lord.prisonerOf = null; lord.freeAt = S.day + rf(1, 3);
  addLog(`${lord.title} ${lord.name} esaretten kurtuldu.`, '', 1);
}

/* ---------------- yağma ---------------- */
function raidVillage(p, v) {
  const loot = Math.round(v.prosperity * rf(6, 16));
  v.prosperity = clamp(v.prosperity - rf(7, 17), 5, 100);
  v.raidedUntil = S.day + rf(12, 25);
  v.recruits = Math.max(0, v.recruits - ri(5, 15));
  if (p.faction !== 'bandit' && S.factions[p.faction]) S.factions[p.faction].treasury += loot;
  if (p.lordId && S.lords[p.lordId]) S.lords[p.lordId].gold += Math.round(loot * 0.4);
  p.morale = clamp(p.morale + 3, 0, 100);
  const owner = S.factions[v.faction];
  if (owner && !owner.isBandit && p.faction !== 'bandit') {
    owner.rel[p.faction] = clamp((owner.rel[p.faction] || 0) - 2, -100, 100);
  }
  addLog(`🔥 ${partyLabel(p)}, ${v.name} köyünü yağmaladı (${fmt(loot)} dinar).`, 'siege', p.type === 'bandit' ? 0 : 1);
  uiDirty.sel = true;
}

/* ---------------- kuşatma ---------------- */
function startSiege(p, s) {
  if (!atWar(p.faction, s.faction)) { p.goal = 'idle'; p.tx = null; return; }
  if (s.besiegedBy && S.parties[s.besiegedBy] && S.parties[s.besiegedBy].faction !== p.faction) {
    resolveBattle(p, S.parties[s.besiegedBy], 'siege'); return;
  }
  p.besieging = s.id; p.goal = 'siege'; p.tx = null;
  p.x = s.x + rf(-10, 10); p.y = s.y + rf(-10, 10);
  if (!s.besiegedBy) {
    s.besiegedBy = p.id; s.siegeProgress = 0;
    S.stats.sieges++;
    addLog(`🏰 ${partyLabel(p)} ${fmt(stackCount(p.troops))} askerle ${s.name} önüne geldi — kuşatma başladı (garnizon ${fmt(settlementDefCount(s))}).`, 'siege', 2);
    if (S.opts.pauseOnSiege) setSpeed(0);
  }
  uiDirty.sel = true;
}
function liftSiege(p) {
  if (!p || !p.besieging) return;
  const s = S.settlements[p.besieging];
  if (s && s.besiegedBy === p.id) {
    const other = S.order.parties.map(i => S.parties[i]).find(q => q && q.besieging === s.id && q.id !== p.id && q.faction === p.faction);
    s.besiegedBy = other ? other.id : null;
    if (!other) s.siegeProgress = 0;
  }
  p.besieging = null; p.goal = 'idle'; p.tx = null;
}
function progressSieges(dt) {
  S.order.settlements.forEach(id => {
    const s = S.settlements[id];
    if (!s.besiegedBy) return;
    const lead = S.parties[s.besiegedBy];
    if (!lead) { s.besiegedBy = null; s.siegeProgress = 0; return; }
    if (!atWar(lead.faction, s.faction)) { liftSiege(lead); return; }
    const attackers = S.order.parties.map(i => S.parties[i]).filter(q => q && q.besieging === s.id && q.faction === lead.faction);
    const atkPw = attackers.reduce((a, q) => a + partyPower(q), 0);
    const defPw = settlementDefPower(s);
    s.food = clamp(s.food - dt * 4, 0, 100);
    const ratio = atkPw / Math.max(1, defPw);
    const rate = ratio < 0.3 ? 0.25 : clamp(ratio * 15 * (1 - s.walls / 260) + (s.food < 25 ? 5 : 0), 0.5, 60);
    s.siegeProgress += rate * dt;
    s.prosperity = clamp(s.prosperity - dt * 0.5, 5, 100);
    if (s.siegeProgress >= 100) assault(s, attackers);
  });
}
function assault(s, attackers) {
  if (!attackers.length) { s.besiegedBy = null; s.siegeProgress = 0; return; }
  const cap0 = attackers[0];
  const atkStack = {};
  attackers.forEach(q => stackMerge(atkStack, q.troops));
  const defStack = stackSnapshot(s.garrison);
  const helpers = garrisonHelpers(s);
  helpers.forEach(q => stackMerge(defStack, q.troops));
  const snapA = stackSnapshot(atkStack), snapB = stackSnapshot(defStack);
  const wallMod = 1 + (s.walls / 100) * (s.type === 'town' ? 0.85 : 0.7);
  const terrain = biomeAt(s.x, s.y);
  const capLord = cap0 && cap0.lordId ? S.lords[cap0.lordId] : null;
  const tacA = chooseTactic(atkStack, terrain, capLord, defStack);
  const r = fightStacks(atkStack, defStack, 1, wallMod, { terrain, tacticA: tacA, tacticB: TACTICS[1] });

  const lossRatioA = r.startA ? (r.startA - stackCount(r.A)) / r.startA : 0;
  attackers.forEach(q => { stackRemove(q.troops, stackCount(q.troops) * lossRatioA); q.morale = clamp(q.morale + (r.winner === 'a' ? 8 : -18), 0, 100); });
  const lossRatioB = r.startB ? (r.startB - stackCount(r.B)) / r.startB : 0;
  stackRemove(s.garrison, stackCount(s.garrison) * lossRatioB);
  helpers.forEach(q => stackRemove(q.troops, stackCount(q.troops) * lossRatioB));

  const cap = cap0;
  const defenderLord = s.lordId ? S.lords[s.lordId] : null;
  const rec = recordBattle({
    x: s.x, y: s.y, place: s.name, placeId: s.id, type: 'siege', terrain,
    title: `${s.name} kuşatma saldırısı`,
    a: { name: partyLabel(cap) + (attackers.length > 1 ? ` +${attackers.length - 1} ordu` : ''), faction: cap.faction, lordId: cap.lordId,
         start: r.startA, end: stackCount(r.A), loss: r.startA - stackCount(r.A), stack: snapA },
    b: { name: `${s.name} garnizonu`, faction: s.faction, lordId: defenderLord ? defenderLord.id : null,
         start: r.startB, end: stackCount(r.B), loss: r.startB - stackCount(r.B), stack: snapB },
    winner: r.winner, rounds: r.rounds, prisoners: 0
  });

  if (r.winner === 'a') {
    addLog(`🏳 ${s.name} DÜŞTÜ! ${rec.a.name} surları aştı. Saldıran kaybı ${fmt(rec.a.loss)}, savunan ${fmt(rec.b.loss)}.`, 'siege', 2, rec.id);
    helpers.forEach(q => { if (stackCount(q.troops) <= 2) destroyParty(q, cap); else fleeFrom(q, cap); });
    captureSettlement(s, cap);
  } else {
    addLog(`🛡 ${s.name} kuşatmayı püskürttü! Saldıran ${fmt(rec.a.loss)} asker kaybetti.`, 'siege', 2, rec.id);
    attackers.forEach(q => {
      if (stackCount(q.troops) <= 2) destroyParty(q, { faction: s.faction, type: 'lord' });
      else { liftSiege(q); q.cooldown = 2; const home = q.lordId && S.lords[q.lordId] ? homeSettlement(S.lords[q.lordId]) : null; if (home) setGoal(q, 'return', home); }
    });
    s.siegeProgress = 0; s.besiegedBy = null;
  }
  uiDirty.sel = true; uiDirty.kra = true;
}

function captureSettlement(s, cap) {
  const oldF = s.faction;
  const newF = cap.faction;
  const wasCapital = S.factions[oldF] && S.factions[oldF].capital === s.id;
  const leave = Math.min(stackCount(cap.troops) - 8, Math.round(stackCount(cap.troops) * 0.35));
  s.garrison = {};
  if (leave > 0) stackMerge(s.garrison, stackRemove(cap.troops, leave));
  if (stackCount(s.garrison) < 10) stackMerge(s.garrison, makeStack(S.factions[newF].culture, 20, 0.35));
  changeOwner(s, newF, null);
  grantConquest(s, cap.lordId ? S.lords[cap.lordId] : null);
  if (wasCapital) capitalLost(s, oldF);
  s.siegeProgress = 0; s.besiegedBy = null; s.walls = clamp(s.walls - 15, 20, 100);
  s.prosperity = clamp(s.prosperity - 10, 5, 100); s.food = 60; s.unrest = 45;
  S.order.parties.forEach(i => {
    const q = S.parties[i];
    if (q && q.besieging === s.id) { q.besieging = null; q.goal = 'garrison'; q.targetId = s.id; q.tx = null; q.restUntil = S.day + 2; }
  });
  if (S.factions[oldF]) S.factions[oldF].rel[newF] = clamp((S.factions[oldF].rel[newF] || 0) - 12, -100, 100);
  checkFactionAlive(oldF);
  territoryDirty = true; uiDirty.kra = true; uiDirty.sel = true;
}

function changeOwner(s, newF, lord) {
  const old = s.faction;
  s.faction = newF; s.lastOwnerChange = S.day;
  if (s.lordId && S.lords[s.lordId]) S.lords[s.lordId].fiefs = S.lords[s.lordId].fiefs.filter(f => f !== s.id);
  s.lordId = null;
  if (lord && lord.faction === newF) grantFief(s, lord);
  else {
    const cands = S.order.lords.map(i => S.lords[i]).filter(l => l.faction === newF && l.state !== 'dead');
    if (cands.length) {
      cands.sort((a, b) => a.fiefs.length - b.fiefs.length || b.renown - a.renown);
      grantFief(s, cands[0]);
    }
  }
  if (s.type !== 'village') {
    S.order.settlements.forEach(id => {
      const v = S.settlements[id];
      if (v.type === 'village' && v.parentId === s.id) { v.faction = newF; v.lordId = s.lordId; }
    });
  }
  territoryDirty = true;
  return old;
}

function checkFactionAlive(f) {
  const fac = S.factions[f]; if (!fac || fac.isBandit) return;
  if (fac.isBanner) return;
  const own = ownSettlements(f);
  if (own.length === 0 && fac.alive) {
    fac.alive = false;
    addLog(`💀 ${fac.name} haritadan silindi!`, 'war', 2);
    Object.keys(S.wars).forEach(k => { if (k.split('|').includes(f)) delete S.wars[k]; });
    S.order.lords.forEach(id => {
      const l = S.lords[id];
      if (l.faction === f && l.state !== 'dead') {
        l.state = 'exile';
        if (l.partyId) removeParty(l.partyId);
        l.partyId = null;
      }
    });
    uiDirty.kra = true;
  }
}

/* ---------------- günlük ---------------- */
function settlementIncome(s) {
  const raided = s.raidedUntil > S.day ? 0.15 : 1;
  const base = s.type === 'town' ? 100 + s.prosperity * 6
    : s.type === 'castle' ? 30 + s.prosperity * 1.5
    : 12 + s.prosperity * 1.5;
  return base * raided * (s.besiegedBy ? 0.3 : 1);
}

function dailyTick() {
  S.stats.days++;
  const day = Math.floor(S.day);

  S.order.settlements.forEach(id => {
    const s = S.settlements[id];
    const raided = s.raidedUntil > S.day;
    const target = raided ? 25 : (s.besiegedBy ? 30 : (s.type === 'town' ? 85 : s.type === 'castle' ? 60 : 70));
    s.prosperity = clamp(s.prosperity + (target - s.prosperity) * 0.03 * S.opts.economy, 3, 100);
    if (!s.besiegedBy) s.food = clamp(s.food + 3, 0, 100);
    s.unrest = clamp(s.unrest - 0.6, 0, 100);
    const regen = s.type === 'town' ? 5.5 : s.type === 'castle' ? 2.6 : 4;
    const capR = s.type === 'town' ? 90 : s.type === 'castle' ? 45 : 55;
    s.recruits = clamp(s.recruits + (raided ? 0.25 : 1) * regen * (0.5 + s.prosperity / 120) * S.opts.recruitRate, 0, capR);
    if (s.type !== 'village' && !s.besiegedBy && day % 3 === 0) refillGarrison(s, false);
    /* huzursuzluk tavan yaparsa halk ayaklanır */
    if (s.unrest > 88 && rnd() < 0.03) {
      s.unrest = 45; s.prosperity = clamp(s.prosperity - 8, 3, 100);
      const b = spawnBandit(s.x + rf(-22, 22), s.y + rf(-22, 22));
      if (b) { b.name = `${s.name} asileri`; stackMerge(b.troops, { bd_brigand: ri(10, 25) }); }
      addLog(`⚒ ${s.name} halkı ayaklandı.`, 'war', 1);
    }
    if (s.walls < 100 && !s.besiegedBy && s.type !== 'village') s.walls = clamp(s.walls + 0.12, 0, 100);
  });

  Object.values(S.factions).forEach(fac => {
    if (fac.isBandit || !fac.alive) return;
    const mine = ownSettlements(fac.id);
    let inc = 0;
    mine.forEach(s => { inc += settlementIncome(s); });
    inc *= S.opts.economy;
    let wages = 0;
    S.order.parties.forEach(i => { const p = S.parties[i]; if (p && p.faction === fac.id) wages += stackWage(p.troops) * 0.3; });
    mine.forEach(s => { wages += stackWage(s.garrison) * 0.2; });
    S.order.lords.forEach(i => {
      const l = S.lords[i];
      if (l.faction === fac.id && l.state === 'active' && !l.fiefs.length) { wages += 140; l.gold += 140; }
    });
    fac.treasury += Math.round(inc - wages);

    if (fac.treasury > 12000) {
      const budget = fac.treasury * (fac.treasury > 100000 ? 0.14 : fac.treasury > 40000 ? 0.08 : 0.05);
      let spent = 0;
      const forts = mine.filter(s => s.type !== 'village');
      const threatened = forts.filter(s => s.besiegedBy || S.order.parties.some(i => {
        const q = S.parties[i]; return q && atWar(q.faction, fac.id) && dist2(q.x, q.y, s.x, s.y) < 130;
      }));
      const pool = (threatened.length ? threatened : forts)
        .filter(s => stackCount(s.garrison) < garrisonTarget(s) * (s.besiegedBy ? 1.5 : 1.1));
      for (let i = 0; i < 3 && spent < budget && pool.length; i++) {
        const s = pick(pool);
        const room = Math.round(garrisonTarget(s) * 1.4 - stackCount(s.garrison));
        const n = Math.min(30, room, Math.floor((budget - spent) / 90));
        if (n < 4) break;
        stackMerge(s.garrison, makeStack(fac.culture, n, 0.55));
        spent += n * 90;
      }
      const poorLords = S.order.lords.map(i => S.lords[i])
        .filter(l => l.faction === fac.id && l.state === 'active' && l.gold < 2500);
      if (poorLords.length && spent < budget) {
        const each = Math.min(3500, Math.floor((budget - spent) / poorLords.length));
        if (each > 50) { poorLords.forEach(l => { l.gold += each; }); spent += each * poorLords.length; }
      }
      fac.treasury -= Math.round(spent);
    }
    if (fac.treasury < 0) {
      fac.treasury = 0;
      S.order.parties.forEach(i => {
        const p = S.parties[i];
        if (p && p.faction === fac.id && rnd() < 0.15) { stackRemove(p.troops, stackCount(p.troops) * 0.02); p.morale = clamp(p.morale - 2, 0, 100); }
      });
    }
  });

  S.order.parties.forEach(id => {
    const p = S.parties[id]; if (!p) return;
    const lord = p.lordId ? S.lords[p.lordId] : null;
    if (p.type === 'bandit') {
      p.morale = clamp(p.morale + 0.4, 0, 100);
      if (rnd() < 0.02) stackMerge(p.troops, { bd_looter: ri(2, 6) });
      if (p.goal === 'idle' || p.tx == null) banditGoal(p);
      return;
    }
    if (p.type === 'raider') {
      p.morale = clamp(p.morale + 0.5, 0, 100);
      if (p.goal === 'idle' || p.tx == null) raiderGoal(p);
      return;
    }
    if (p.type === 'caravan') return;
    if (!lord) return;
    const cap = lordPartyCap(lord);
    const cnt = stackCount(p.troops);
    if (p.goal === 'garrison' && p.targetId) {
      const s = S.settlements[p.targetId];
      if (s && s.faction === p.faction) {
        let want = Math.min(cap - cnt, 30 * S.opts.recruitRate);
        if (want > 0) {
          const pools = [s].concat(S.order.settlements.map(i => S.settlements[i])
            .filter(v => v.type === 'village' && v.parentId === s.id && v.faction === s.faction));
          let took = 0;
          for (const src of pools) {
            if (want <= 0) break;
            const take = Math.min(Math.floor(src.recruits), want);
            if (take > 0) { src.recruits -= take; want -= take; took += take; }
          }
          if (took > 0) {
            stackMerge(p.troops, makeStack(S.factions[p.faction].culture, took, 0.12));
            lord.gold -= took * 10;
          }
        }
        p.morale = clamp(p.morale + 3.5, 0, 100);
        if (stackCount(p.prisoners) > 0) { stackMerge(s.prisoners, p.prisoners); p.prisoners = {}; }
        if (S.day > (p.restUntil || 0) && (cnt >= cap * 0.9 || S.day > (p.restUntil || 0) + 4)) { p.goal = 'idle'; p.tx = null; }
      } else { p.goal = 'idle'; p.tx = null; }
    } else {
      p.morale = clamp(p.morale + (p.besieging ? -0.8 : 0.6), 0, 100);
    }
    for (let u = 0; u < 3; u++) if (rnd() < 0.55 * S.opts.recruitRate) upgradeStack(p.troops, lord);
    lord.gold += Math.round(lord.fiefs.reduce((a, f) => {
      const s = S.settlements[f]; if (!s || s.faction !== lord.faction) return a;
      const mult = s.raidedUntil > S.day ? 0.2 : 1;
      return a + (s.type === 'town' ? 200 : s.type === 'castle' ? 70 : 40) * (s.prosperity / 70) * mult;
    }, 0));
    lord.gold -= Math.round(stackWage(p.troops) * 0.3);
    if (lord.gold > 6000 && S.factions[lord.faction]) {
      const tax = Math.round((lord.gold - 6000) * 0.12);
      lord.gold -= tax; S.factions[lord.faction].treasury += tax;
    }
    if (lord.gold < 0) { lord.gold = 0; if (rnd() < 0.3) stackRemove(p.troops, Math.max(1, cnt * 0.03)); }
    if (p.goal === 'idle' || (p.tx == null && !p.besieging && p.goal !== 'garrison')) decideGoal(p);
  });

  S.order.lords.forEach(id => {
    const l = S.lords[id];
    if (l.state === 'prisoner') {
      /* krallığı fidye ödeyip kurtarabilir */
      const own = S.factions[l.faction], captor = S.factions[l.prisonerOf];
      const ransom = Math.round(600 + l.renown * 4 + l.fiefs.length * 900);
      if (own && own.alive && own.treasury > ransom * 3 && rnd() < 0.06) {
        own.treasury -= ransom;
        if (captor) captor.treasury += ransom;
        releaseLord(l);
        addLog(`💰 ${facName(l.faction)}, ${l.title} ${lordFullName(l)} için ${fmt(ransom)} dinar fidye ödedi.`, 'peace', 1);
      } else if (S.day >= l.freeAt) releaseLord(l);
    }
    else if (l.state === 'regroup' && S.day >= l.freeAt) {
      if (ownSettlements(l.faction).length) { l.state = 'active'; spawnLordParty(l); }
      else l.freeAt = S.day + 5;
    }
    if (l.state === 'exile' && rnd() < 0.02) tryExileJoin(l);
  });

  /* --- v3 sistemleri --- */
  agingTick(day);
  capitalTick();
  seaRaidTick();
  houseTick(day);
  electionTick(day);
  marriageTick(day);
  courtTick(day);
  bannerTick();
  chronicleTick(day);
  tradeTick(day);
  buildTick();
  historyTick(day);
  if (day % 4 === 0) warPlanTick();
  if (day % 7 === 0) relationsTick();
  if (day % 12 === 0) pactTick();
  if (day % 15 === 0) { rebellionTick(); collapseTinyRebels(); }
  if (day % 20 === 0) feastTick();
  if (day % 90 === 0 && S.opts.autoSnapshot) takeSnapshot();
  randomEventTick();
  if (day % 6 === 0) diplomacyTick();
  if (S.opts.banditSpawn && rnd() < 0.35 * S.opts.banditRate) {
    const bandits = S.order.parties.filter(i => S.parties[i] && S.parties[i].type === 'bandit').length;
    if (bandits < 26 * S.opts.banditRate) spawnBandit();
  }
  if (S.opts.lordDefection && day % 10 === 0) defectionTick();
}

function upgradeStack(st, lord) {
  const keys = Object.keys(st).filter(k => TROOPS[k] && TROOPS[k].up.length && st[k] > 0);
  if (!keys.length) return;
  const k = pick(keys);
  const t = TROOPS[k];
  const n = Math.max(1, Math.round(st[k] * rf(0.05, 0.16)));
  const cost = n * (t.tier * 22);
  if (lord && lord.gold < cost) return;
  if (lord) lord.gold -= cost;
  const to = pick(t.up);
  st[k] -= n; if (st[k] <= 0) delete st[k];
  st[to] = (st[to] || 0) + n;
}

function factionStrength(f) {
  let pw = 0;
  S.order.parties.forEach(i => { const p = S.parties[i]; if (p && p.faction === f) pw += stackPower(p.troops); });
  ownSettlements(f).forEach(s => { pw += stackPower(s.garrison) * 0.6; });
  return pw;
}
function factionTroops(f) {
  let n = 0;
  S.order.parties.forEach(i => { const p = S.parties[i]; if (p && p.faction === f) n += stackCount(p.troops); });
  return n;
}

function diplomacyTick() {
  const live = Object.values(S.factions).filter(f => !f.isBandit && f.alive);
  live.forEach(fac => {
    const wars = live.filter(o => o.id !== fac.id && atWar(fac.id, o.id));
    if (S.opts.autoPeace && wars.length) {
      wars.forEach(o => {
        const k = warKey(fac.id, o.id);
        const dur = S.day - (S.wars[k] ? S.wars[k].since : S.day);
        const my = factionStrength(fac.id), his = factionStrength(o.id);
        const desperate = my < his * 0.5 || ownSettlements(fac.id).filter(s => s.type === 'town').length <= 1;
        const losing = my < his * 0.75;
        const chance = clamp((dur - 30) / 350 + (losing ? 0.12 : 0) + (desperate ? 0.35 : 0) + (wars.length > 1 ? 0.1 : 0), 0, 0.75);
        if (dur > 15 && rnd() < chance) makePeace(fac.id, o.id);
      });
    }
    if (wars.length < 2 && rnd() < 0.16 * fac.aggr * S.opts.aggression) {
      const cands = live.filter(o => o.id !== fac.id && !atWar(fac.id, o.id));
      if (cands.length) {
        const my = factionStrength(fac.id);
        cands.sort((a, b) => (factionStrength(a.id) + (fac.rel[a.id] || 0) * 30) - (factionStrength(b.id) + (fac.rel[b.id] || 0) * 30));
        const t = cands[0];
        const theirWars = live.filter(o => o.id !== t.id && atWar(t.id, o.id)).length;
        const blocked = hasPact(fac.id, t.id);
        if (!blocked && theirWars < 2 && factionStrength(t.id) < my * 1.25 && (fac.rel[t.id] || 0) < 25) declareWar(fac.id, t.id);
      }
    }
    const en = enemyFactions(fac.id);
    if (en.length) {
      const t = pickCampaignTarget(fac.id, en);
      fac.target = t ? t.id : null;
      /* mareşal seç: kral sahadaysa kral, değilse en şöhretli lord */
      const cands = S.order.lords.map(i => S.lords[i])
        .filter(l => l.faction === fac.id && l.state === 'active' && l.partyId);
      if (cands.length) {
        cands.sort((a, b) => (b.isKing ? 500 : 0) + b.renown - ((a.isKing ? 500 : 0) + a.renown));
        if (fac.marshalId !== cands[0].id) {
          fac.marshalId = cands[0].id;
          if (rnd() < 0.5) addLog(`${cands[0].title} ${cands[0].name}, ${fac.name} ordularının mareşali oldu.`, '', 1);
        }
      } else fac.marshalId = null;
    } else { fac.target = null; fac.marshalId = null; }
  });
  uiDirty.kra = true;
}

function defectionTick() {
  S.order.lords.forEach(id => {
    const l = S.lords[id];
    if (l.isKing || l.state === 'dead' || l.state === 'exile') return;
    const pers = PERSONALITIES.find(p => p.id === l.personality) || PERSONALITIES[0];
    l.relKing += (l.fiefs.length ? 1.2 : -1.4) * pers.loyal * 0.6 + rf(-1.5, 1.5);
    l.relKing = clamp(l.relKing, -100, 100);
    const fac = S.factions[l.faction];
    const brewing = fac && fac.pretenderId && fac.pretenderId !== l.id;
    if (l.relKing < -45 && rnd() < (brewing ? 0.03 : 0.1)) {
      const others = Object.values(S.factions).filter(f => !f.isBandit && f.alive && f.id !== l.faction && !atWar(f.id, l.faction));
      if (others.length) defect(l, pick(others).id);
    }
  });
  uiDirty.kra = true;
}

function defect(l, toFaction) {
  const from = l.faction;
  const fiefs = l.fiefs.slice();
  l.faction = toFaction; l.relKing = ri(-5, 25);
  l.title = S.factions[toFaction].lordTitle;
  if (l.partyId && S.parties[l.partyId]) S.parties[l.partyId].faction = toFaction;
  fiefs.forEach(f => { const s = S.settlements[f]; if (s) s.faction = toFaction; });
  addLog(`🕊 ${l.title} ${l.name}, ${factionName(from)} krallığından ayrılıp ${factionName(toFaction)} saflarına geçti (${fiefs.length} tımarıyla).`, 'peace', 2);
  territoryDirty = true; checkFactionAlive(from);
  uiDirty.kra = true;
}

function tryExileJoin(l) {
  const others = Object.values(S.factions).filter(f => !f.isBandit && f.alive);
  if (!others.length) return;
  const to = pick(others);
  l.faction = to.id; l.state = 'regroup'; l.freeAt = S.day + 2; l.relKing = ri(0, 20);
  l.title = to.lordTitle; l.fiefs = [];
  addLog(`${l.title} ${l.name} sürgünden dönüp ${to.name} hizmetine girdi.`, '', 1);
}
/* =====================================================================
   Bölüm 4b: Siyaset, hanedan, diplomasi, stratejik yapay zekâ,
             inşaat, ticaret, olaylar ve tarih kaydı
   ===================================================================== */

/* =====================  HANEDAN VE ÖLÜM  ===================== */
function lordDies(l, cause) {
  if (!l || l.state === 'dead') return;
  const wasKing = l.isKing;
  const fac = S.factions[l.faction];
  const fiefs = l.fiefs.slice();
  if (l.partyId) removeParty(l.partyId);
  l.partyId = null; l.state = 'dead'; l.deathDay = S.day; l.deathCause = cause || 'ecel';
  S.stats.deaths++;

  /* varis: yetişkin çocuk */
  const heirs = (l.children || []).filter(c => c.age >= 16).sort((a, b) => (b.male ? 1 : 0) - (a.male ? 1 : 0) || b.age - a.age);
  let heir = null;
  if (heirs.length && fac && fac.alive) {
    const c = heirs[0];
    heir = createLord(l.faction, {
      name: c.name, house: l.house, age: c.age,
      renown: Math.round(l.renown * 0.45 + 40),
      tactics: clamp(l.skillTactics + ri(-2, 1), 1, 10),
      lead: clamp(l.skillLeadership + ri(-2, 1), 1, 10),
      personality: rnd() < 0.4 ? l.personality : pick(PERSONALITIES).id
    });
    heir.relKing = 30;
    heir.gold = Math.round(l.gold * 0.6);
    fiefs.forEach(f => { const s = S.settlements[f]; if (s && s.faction === l.faction) grantFief(s, heir); });
    giveChildren(heir);
    if (!heir.partyId) spawnLordParty(heir);
  } else {
    fiefs.forEach(f => { const s = S.settlements[f]; if (s) { s.lordId = null; } });
    l.fiefs = [];
  }
  l.fiefs = [];

  addLog(`⚰ ${l.title} ${lordFullName(l)} öldü (${l.age} yaşında, ${l.deathCause}).` +
    (heir ? ` Varisi ${heir.title} ${lordFullName(heir)} tımarlarını devraldı.` : ' Tımarları krala kaldı.'), 'war', 2);

  refreshHouses();
  /* aynı hanedandan biri savaşta öldüyse öfke diğer hanedanlara yönelir */
  if (l.houseId && (cause === 'yaralarından' || cause === 'suikast')) {
    const h = S.houses[l.houseId];
    if (h) houseMembers(h.id).forEach(m => { m.relKing = clamp(m.relKing - ri(2, 8), -100, 100); });
  }
  if (wasKing) { l.isKing = false; if (fac) fac.kingId = null; succession(l.faction, l); }
  uiDirty.kra = uiDirty.sel = true; territoryDirty = true;
}

/* =====================  VERASET VE SEÇİM  ===================== */
function succession(factionId, deadKing) {
  const fac = S.factions[factionId]; if (!fac) return;
  const cands = S.order.lords.map(i => S.lords[i])
    .filter(l => l.faction === factionId && l.state !== 'dead' && l.state !== 'exile');
  if (!cands.length) { fac.kingId = null; checkFactionAlive(factionId); return; }

  if (fac.succession === 'elective') {
    const el = startElection(factionId, 'throne', { deadKing: deadKing ? deadKing.id : null });
    if (el) { fac.interregnum = true; return el; }
    return holdElection(fac, cands, deadKing);
  }

  /* veraset: ölen kralın hanesinden en güçlü aday, yoksa en şöhretli lord */
  const house = deadKing ? deadKing.house : null;
  const sameHouse = house ? cands.filter(l => l.house === house) : [];
  const pool = sameHouse.length ? sameHouse : cands;
  pool.sort((a, b) => (b.renown + b.fiefs.length * 70) - (a.renown + a.fiefs.length * 70));
  const king = pool[0];
  makeKing(king, true);
  applyRulingHouseColor(fac);
  if (!(deadKing && (deadKing.children || []).some(c => c.age >= 16))) foreignClaimCheck(factionId, deadKing);
  addLog(`👑 ${king.title} ${lordFullName(king)}, ${fac.name} tahtına oturdu (veraset yoluyla).`, 'peace', 2);
  /* rakipler küser */
  cands.forEach(l => { if (l !== king && l.renown > king.renown * 0.85) l.relKing -= ri(10, 30); });
  checkPretender(fac);
}

function holdElection(fac, cands, deadKing) {
  const runners = cands.filter(l => l.fiefs.length > 0 || l.renown > 250);
  const pool = runners.length ? runners : cands;
  const votes = {};
  pool.forEach(c => { votes[c.id] = 0; });
  cands.forEach(voter => {
    const weight = 1 + voter.fiefs.length * 0.6 + voter.renown / 350;
    let best = null, bestScore = -1e9;
    pool.forEach(c => {
      let sc = c.renown / 180 + c.fiefs.length * 0.8 + lordRel(voter, c) / 22 + rf(-1.2, 1.2);
      if (c.id === voter.id) sc += 3.2;
      if (deadKing && c.house === deadKing.house) sc += 1.1;
      if (c.house === voter.house) sc += 1.6;
      if (sc > bestScore) { bestScore = sc; best = c; }
    });
    if (best) votes[best.id] += weight;
  });
  const rank = Object.entries(votes).sort((a, b) => b[1] - a[1]);
  const winner = S.lords[rank[0][0]];
  const runnerUp = rank[1] ? S.lords[rank[1][0]] : null;
  const total = rank.reduce((a, r) => a + r[1], 0) || 1;
  const share = Math.round(rank[0][1] / total * 100);
  S.stats.elections++;
  makeKing(winner, true);
  addLog(`🗳 ${fac.name} kurultayı toplandı: ${winner.title} ${lordFullName(winner)} oyların %${share}'ini alarak seçildi` +
    (runnerUp ? `, ${lordFullName(runnerUp)} ikinci kaldı.` : '.'), 'peace', 2);
  /* kaybedenler küser, yakın çıkanlar daha çok */
  rank.slice(1).forEach(([id, v]) => {
    const l = S.lords[id]; if (!l) return;
    l.relKing -= Math.round(8 + (v / total) * 60);
  });
  checkPretender(fac);
  return winner;
}

/* taht iddiacısı: kralla arası çok bozuk, şöhretli lord */
function checkPretender(fac) {
  if (!fac || !fac.kingId) return;
  const rivals = S.order.lords.map(i => S.lords[i])
    .filter(l => l.faction === fac.id && !l.isKing && l.state === 'active' && l.relKing < -35 && l.renown > 320);
  fac.pretenderId = rivals.length ? rivals.sort((a, b) => b.renown - a.renown)[0].id : null;
}

/* =====================  TIMAR DAĞITIMI (SİYASET)  ===================== */
function fiefClaimScore(l, s, capturer) {
  let sc = l.renown / 100;
  sc += l.relKing / 12;
  if (capturer && l.id === capturer.id) sc += 6;
  if (l.isKing) sc -= 3;                       // kral kendine az alır
  sc -= l.fiefs.length * 1.7;                  // topraksızlar öncelikli
  const near = l.fiefs.map(f => S.settlements[f]).filter(Boolean)
    .reduce((m, o) => Math.min(m, dist2(o.x, o.y, s.x, s.y)), 1e9);
  if (near < 220) sc += 2.2;                   // komşu tımar avantajı
  if (!l.fiefs.length) sc += 2.5;
  return sc;
}
function grantConquest(s, capturer) {
  const fac = S.factions[s.faction]; if (!fac) return;
  const cands = S.order.lords.map(i => S.lords[i])
    .filter(l => l.faction === s.faction && l.state !== 'dead' && l.state !== 'exile');
  if (!cands.length) return;
  const scored = cands.map(l => ({ l, sc: fiefClaimScore(l, s, capturer) })).sort((a, b) => b.sc - a.sc);
  const top = scored.slice(0, 4);
  if (S.opts.askFief) {
    S.decisions.unshift({
      id: uid('d'), kind: 'fief', day: S.day, settlementId: s.id, faction: s.faction,
      options: top.map(o => ({ lordId: o.l.id, score: Math.round(o.sc * 10) / 10 }))
    });
    uiDirty.kra = uiDirty.sel = true;
    if (S.opts.pauseOnDecision) setSpeed(0);
    addLog(`📜 ${s.name} kime verilecek? Karar bekliyor.`, 'siege', 2);
    return;
  }
  applyFiefGrant(s, top[0].l, top.slice(1).map(o => o.l));
}
function applyFiefGrant(s, lord, rivals) {
  if (!s || !lord) return;
  grantFief(s, lord);
  lord.relKing = clamp(lord.relKing + 12, -100, 100);
  (rivals || []).forEach(r => {
    if (!r || r.id === lord.id) return;
    r.relKing = clamp(r.relKing - ri(5, 14), -100, 100);
    addLordRel(r, lord, -ri(4, 12));
  });
  addLog(`📜 ${s.name}, ${lord.title} ${lordFullName(lord)} adlı lorda tımar olarak verildi.`, 'siege', 1);
  const fac = S.factions[s.faction];
  if (fac) checkPretender(fac);
  uiDirty.kra = uiDirty.sel = true;
}

/* =====================  İSYAN / İÇ SAVAŞ  ===================== */
function rebellionTick() {
  Object.values(S.factions).forEach(fac => {
    if (fac.isBandit || !fac.alive || !fac.kingId) return;
    checkPretender(fac);
    if (!fac.pretenderId) return;
    const pretender = S.lords[fac.pretenderId];
    if (!pretender || pretender.state !== 'active') return;
    const backers = S.order.lords.map(i => S.lords[i])
      .filter(l => l.faction === fac.id && !l.isKing && l.state === 'active' &&
        (l.id === pretender.id || (l.relKing < -18 && lordRel(l, pretender) > -12)));
    const strengthShare = backers.reduce((a, l) => a + 1 + l.fiefs.length, 0) /
      Math.max(1, S.order.lords.map(i => S.lords[i]).filter(l => l.faction === fac.id && l.state === 'active').length);
    if (backers.length < 4 || strengthShare < 0.3) return;
    if (S.day - (fac.lastRebellion || -999) < 900) return;
    if (rnd() > 0.09 * S.opts.aggression) return;
    fac.lastRebellion = S.day;
    startCivilWar(fac, pretender, backers);
  });
}
function startCivilWar(fac, pretender, backers) {
  const id = uid('f');
  const col = shiftColor(fac.color);
  const nf = {
    id, name: `${pretender.house} Hanedanı`,
    short: (pretender.house.replace(/^ibn\s+/i, '').split(' ')[0] || pretender.house).slice(0, 10),
    color: col, culture: fac.culture, rulerTitle: fac.rulerTitle, lordTitle: fac.lordTitle,
    capital: null, aggr: clamp(fac.aggr + 0.15, 0.2, 1.5), kingId: null,
    treasury: Math.round(fac.treasury * 0.3), rel: {}, warWeariness: {}, target: null, marshalId: null,
    alive: true, isBandit: false, succession: fac.succession, prestige: 30, warPlan: null,
    stance: 'defend', buildId: null, founded: calendar(S.day).year, rebelOf: fac.id
  };
  S.factions[id] = nf;
  fac.treasury = Math.round(fac.treasury * 0.7);
  Object.keys(S.factions).forEach(o => {
    if (o === id) return;
    nf.rel[o] = o === fac.id ? -80 : (S.factions[o].rel[fac.id] || 0) * 0.3;
    S.factions[o].rel[id] = o === fac.id ? -80 : 0;
  });
  backers.forEach(l => {
    l.faction = id; l.relKing = 60;
    if (l.partyId && S.parties[l.partyId]) S.parties[l.partyId].faction = id;
    l.fiefs.slice().forEach(f => {
      const s = S.settlements[f];
      if (s) { s.faction = id; if (s.type !== 'village') S.order.settlements.forEach(i => { const v = S.settlements[i]; if (v.parentId === s.id) v.faction = id; }); }
    });
  });
  const cap = pretender.fiefs.map(f => S.settlements[f]).find(s => s && s.type !== 'village');
  nf.capital = cap ? cap.id : null;
  makeKing(pretender, true);
  declareWar(id, fac.id, true);
  addLog(`🔥 İÇ SAVAŞ! ${pretender.title} ${lordFullName(pretender)} taht iddiasıyla ayaklandı; ${backers.length} lord peşinden gitti. ${nf.name} kuruldu.`, 'war', 2);
  fac.pretenderId = null;
  territoryDirty = true; checkFactionAlive(fac.id);
  uiDirty.kra = true;
}
/* bir yıldan uzun süre tek yerleşimle kalan isyancı devlet çöker */
function collapseTinyRebels() {
  Object.values(S.factions).forEach(f => {
    if (f.isBandit || !f.alive || !f.rebelOf) return;
    const own = ownSettlements(f.id);
    if (own.length > 1) { f.tinySince = null; return; }
    if (!f.tinySince) { f.tinySince = S.day; return; }
    if (S.day - f.tinySince < 360) return;
    const parent = S.factions[f.rebelOf];
    const to = parent && parent.alive ? parent.id : (Object.values(S.factions).find(x => !x.isBandit && x.alive && x.id !== f.id) || {}).id;
    if (!to) return;
    own.forEach(s => changeOwner(s, to, null));
    S.order.lords.map(i => S.lords[i]).filter(l => l.faction === f.id).forEach(l => transferLord(l, to));
    checkFactionAlive(f.id);
    addLog(`🏳 ${f.name} tutunamadı; toprakları ${facName(to)} krallığına katıldı.`, 'war', 2);
  });
}
function shiftColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const mix = (c, t) => Math.round(clamp(c * 0.55 + t * 0.45, 0, 255));
  return `#${[mix(r, 220), mix(g, 60), mix(b, 90)].map(v => v.toString(16).padStart(2, '0')).join('')}`;
}

/* =====================  BAŞKENT  ===================== */
function capitalOf(f) {
  const fac = S.factions[f]; if (!fac) return null;
  let cap = fac.capital ? S.settlements[fac.capital] : null;
  if (!cap || cap.faction !== f) {
    const own = ownSettlements(f).filter(s => s.type === 'town');
    cap = own.sort((a, b) => b.prosperity - a.prosperity)[0]
      || ownSettlements(f).filter(s => s.type === 'castle')[0] || null;
    fac.capital = cap ? cap.id : null;
  }
  return cap;
}
function capitalTick() {
  Object.values(S.factions).forEach(fac => {
    if (fac.isBandit || !fac.alive) return;
    const cap = capitalOf(fac.id);
    if (!cap) return;
    if (cap.besiegedBy) {
      /* başkent kuşatması: prestij ve moral çöker, lordlar savunmaya koşar */
      fac.prestige = clamp(fac.prestige - 0.8, 0, 100);
      S.order.parties.forEach(i => {
        const p = S.parties[i];
        if (p && p.faction === fac.id && !p.besieging && rnd() < 0.25) {
          if (dist2(p.x, p.y, cap.x, cap.y) < 520) setGoal(p, 'defend', cap);
        }
      });
      ownSettlements(fac.id).forEach(s => { s.unrest = clamp(s.unrest + 0.5, 0, 100); });
    } else {
      fac.prestige = clamp(fac.prestige + 0.06, 0, 100);
    }
  });
}
function capitalLost(s, oldFaction) {
  const fac = S.factions[oldFaction];
  if (!fac || fac.capital !== s.id) return;
  fac.prestige = clamp(fac.prestige - 25, 0, 100);
  const next = capitalOf(oldFaction);
  S.order.lords.map(i => S.lords[i]).filter(l => l.faction === oldFaction).forEach(l => { l.relKing -= ri(4, 12); });
  ownSettlements(oldFaction).forEach(x => { x.unrest = clamp(x.unrest + 18, 0, 100); });
  if (next) addLog(`🏛 ${fac.name} başkentini kaybetti! Yeni başkent ${next.name}.`, 'war', 2);
  else addLog(`🏛 ${fac.name} başkentini kaybetti ve elinde şehir kalmadı!`, 'war', 2);
}

/* =====================  DİPLOMASİ: PAKTLAR  ===================== */
function pactTick() {
  const live = Object.values(S.factions).filter(f => !f.isBandit && f.alive);
  if (live.length < 2) return;
  const strength = {};
  live.forEach(f => { strength[f.id] = factionStrength(f.id); });
  const strongest = live.slice().sort((a, b) => strength[b.id] - strength[a.id])[0];

  live.forEach(fac => {
    const king = fac.kingId ? S.lords[fac.kingId] : null;
    const pers = king ? (PERSONALITIES.find(p => p.id === king.personality) || PERSONALITIES[0]) : PERSONALITIES[0];
    const wisdom = (king ? king.skillStrategy || 4 : 4) / 10 * S.opts.aiSkill;

    /* ittifak arayışı: güçlü komşuya karşı denge kur (en fazla 2 pakt) */
    const myPacts = Object.keys(S.pacts).filter(k => k.split('|').includes(fac.id)).length;
    if (myPacts < 2) {
      live.forEach(other => {
        if (other.id === fac.id) return;
        if (atWar(fac.id, other.id) || hasPact(fac.id, other.id)) return;
        const rel = fac.rel[other.id] || 0;
        if (rel < -5) return;
        const threat = strongest.id !== fac.id && strongest.id !== other.id;
        const bothVsStrong = threat && (atWar(strongest.id, fac.id) || atWar(strongest.id, other.id));
        /* güçlü ve saldırgan krallık kimseye bağlanmak istemez */
        const proud = strength[fac.id] > strength[other.id] * 1.35 && fac.aggr > 0.55;
        let want = 0.012 + rel / 2200 + wisdom * 0.012;
        if (bothVsStrong) want += 0.10;
        if (strength[other.id] > strength[fac.id] * 1.5) want += 0.03;
        if (proud) want *= 0.25;
        if (rnd() > want) return;
        const type = bothVsStrong && rel > 15 ? 'offensive' : (rel > 20 ? 'defensive' : 'nap');
        const accept = (other.rel[fac.id] || 0) > -10 && rnd() < 0.4 + (other.rel[fac.id] || 0) / 220;
        if (accept) makePact(fac.id, other.id, type);
      });
    }
    /* süresi dolan saldırmazlık paktları sessizce sona erer */
    Object.keys(S.pacts).forEach(k => {
      if (!k.split('|').includes(fac.id)) return;
      const p = S.pacts[k];
      if (p.type !== 'nap') return;
      if (S.day - p.since > ri(420, 900)) {
        const other = k.split('|').find(x => x !== fac.id);
        delete S.pacts[k];
        addLog(`📜 ${facName(fac.id)} ile ${facName(other)} arasındaki saldırmazlık paktının süresi doldu.`, '', 1);
      }
    });

    /* pakt bozma: kavgacı/sefih krallar ve fırsatçılık */
    Object.keys(S.pacts).forEach(k => {
      if (!k.split('|').includes(fac.id)) return;
      const other = k.split('|').find(x => x !== fac.id);
      const p = S.pacts[k];
      if (S.day - p.since < 60) return;
      const rel = fac.rel[other] || 0;
      const greedy = pers.loyal < 0.9 && strength[other] < strength[fac.id] * 0.65;
      if (rel < -25 || (greedy && rnd() < 0.05 * S.opts.aggression)) breakPact(fac.id, other);
    });
  });
}
/* müttefikler savaşa katılır */
function callAllies(attacker, defender) {
  alliesOf(defender).forEach(a => {
    if (a === attacker || atWar(a, attacker)) return;
    const p = pactOf(a, defender);
    if (!p || p.type === 'nap') return;
    const fa = S.factions[a];
    const loyal = fa && fa.kingId && S.lords[fa.kingId]
      ? (PERSONALITIES.find(x => x.id === S.lords[fa.kingId].personality) || PERSONALITIES[0]).loyal : 1;
    if (rnd() < 0.55 * loyal) {
      declareWar(a, attacker, true);
      addLog(`🛡 ${facName(a)}, ittifak gereği ${facName(defender)} yanında ${facName(attacker)} krallığına savaş açtı.`, 'war', 2);
    } else {
      breakPact(a, defender);
    }
  });
  alliesOf(attacker).forEach(a => {
    if (a === defender || atWar(a, defender)) return;
    const p = pactOf(a, attacker);
    if (!p || p.type !== 'offensive') return;
    if (rnd() < 0.6) {
      declareWar(a, defender, true);
      addLog(`⚔ ${facName(a)}, saldırı ittifakı gereği ${facName(defender)} krallığına savaş açtı.`, 'war', 2);
    }
  });
}

/* =====================  STRATEJİK YAPAY ZEKÂ  ===================== */
function frontierSettlements(f, enemies) {
  return ownSettlements(f).filter(s => s.type !== 'village').map(s => {
    let near = 1e9;
    enemies.forEach(e => ownSettlements(e).forEach(o => { const d = dist2(o.x, o.y, s.x, s.y); if (d < near) near = d; }));
    return { s, near };
  }).sort((a, b) => a.near - b.near);
}
function threatAt(s, faction) {
  let t = 0;
  S.order.parties.forEach(i => {
    const p = S.parties[i];
    if (!p || p.faction === faction || p.type === 'bandit') return;
    if (!atWar(p.faction, faction)) return;
    const d = dist2(p.x, p.y, s.x, s.y);
    if (d < 200) t += partyPower(p) * (1 - d / 200);
  });
  return t;
}
function warPlanTick() {
  const live = Object.values(S.factions).filter(f => !f.isBandit && f.alive);
  live.forEach(fac => {
    const enemies = enemyFactions(fac.id);
    if (!enemies.length) { fac.warPlan = null; fac.stance = 'peace'; fac.target = null; return; }
    const king = fac.kingId ? S.lords[fac.kingId] : null;
    const skill = ((king ? king.skillStrategy || 4 : 4) / 10) * S.opts.aiSkill;
    const my = factionStrength(fac.id);
    const foe = enemies.reduce((a, e) => a + factionStrength(e), 0);

    /* tehdit altındaki kendi yerleşimleri */
    const mine = ownSettlements(fac.id).filter(s => s.type !== 'village');
    const threatened = mine.map(s => ({ s, t: threatAt(s, fac.id) + (s.besiegedBy ? 9999 : 0) }))
      .filter(o => o.t > 0).sort((a, b) => b.t - a.t);
    const cap = capitalOf(fac.id);

    /* savunma mı saldırı mı? */
    let stance = 'attack';
    if (threatened.length && (threatened[0].t > my * 0.22 || threatened[0].s.besiegedBy)) stance = 'defend';
    if (my < foe * (0.62 + skill * 0.12)) stance = 'defend';
    if (cap && cap.besiegedBy) stance = 'defend';
    fac.stance = stance;

    if (stance === 'defend' && threatened.length) {
      fac.warPlan = { kind: 'defend', settlementId: threatened[0].s.id, since: S.day };
      fac.target = null;
      return;
    }
    /* saldırı hedefi: zayıf, yakın, değerli */
    const cands = [];
    enemies.forEach(e => ownSettlements(e).forEach(s => {
      if (s.type === 'village') return;
      const dHome = mine.reduce((m, o) => Math.min(m, dist2(o.x, o.y, s.x, s.y)), 1e9);
      if (dHome > 430) return;
      const def = settlementDefPower(s);
      const value = (s.type === 'town' ? 190 : 100) + s.prosperity * (s.type === 'town' ? 1.5 : 0.7);
      const isCap = S.factions[s.faction] && S.factions[s.faction].capital === s.id;
      const score = value + (isCap ? 60 : 0) - def / (14 - skill * 6) - dHome * (1.05 - skill * 0.35)
        - (s.walls * (1.1 - skill * 0.4)) + (s.food < 40 ? 40 : 0);
      cands.push({ s, score });
    }));
    if (!cands.length) { fac.warPlan = null; fac.target = null; return; }
    cands.sort((a, b) => b.score - a.score);
    /* akıllı kral aynı hedefte ısrar eder, beceriksiz sık sık fikir değiştirir */
    const keep = fac.warPlan && fac.warPlan.kind === 'attack' && S.settlements[fac.warPlan.settlementId] &&
      enemies.includes(S.settlements[fac.warPlan.settlementId].faction) &&
      S.day - fac.warPlan.since < 30 + skill * 60;
    const target = keep ? S.settlements[fac.warPlan.settlementId] : cands[0].s;
    fac.warPlan = { kind: 'attack', settlementId: target.id, since: keep ? fac.warPlan.since : S.day };
    fac.target = target.id;
  });
}

/* =====================  İNŞAAT  ===================== */
function buildTick() {
  /* süren inşaatlar */
  for (let i = S.builds.length - 1; i >= 0; i--) {
    const b = S.builds[i];
    const fac = S.factions[b.faction];
    if (!fac || !fac.alive) { S.builds.splice(i, 1); continue; }
    /* düşman yakınsa inşaat durur */
    const danger = S.order.parties.some(id => {
      const p = S.parties[id];
      return p && p.faction !== b.faction && (p.type === 'bandit' || atWar(p.faction, b.faction)) && dist2(p.x, p.y, b.x, b.y) < 40;
    });
    if (danger) { b.stalled = true; continue; }
    b.stalled = false;
    b.progress += 1;
    if (b.progress >= b.days) {
      const def = BUILD_DEFS[b.type];
      const s = createSettlement({
        name: b.name, type: b.type, faction: b.faction,
        prosperity: def.prosperity, walls: def.walls || 0,
        garrison: b.type === 'village' ? 0 : Math.round(garrisonTargetFor(b.type) * 0.7)
      }, b.x, b.y, true);
      s.founded = calendar(S.day).year;
      S.builds.splice(i, 1);
      S.stats.built++;
      addLog(`🏗 ${facName(b.faction)} yeni bir ${def.name.toLocaleLowerCase('tr')} kurdu: ${s.name}.`, 'peace', 2);
    }
  }
  /* yeni inşaat kararı */
  Object.values(S.factions).forEach(fac => {
    if (fac.isBandit || !fac.alive) return;
    if (S.builds.filter(b => b.faction === fac.id).length >= 1) return;
    if (rnd() > 0.02 * S.opts.buildRate) return;
    const own = ownSettlements(fac.id);
    if (!own.length) return;
    const enemies = enemyFactions(fac.id);
    const villages = own.filter(s => s.type === 'village').length;
    const forts = own.filter(s => s.type !== 'village').length;
    /* savaş sırasında inşaat neredeyse durur */
    if (enemies.length && rnd() < 0.75) return;
    /* ne inşa etsin? */
    let type = null;
    if (villages < forts * 3.4) type = 'village';
    if (!type && fac.treasury > BUILD_DEFS.castle.cost * 2.2 && rnd() < 0.5) type = 'castle';
    if (!type && fac.treasury > BUILD_DEFS.town.cost * 2.5 && forts > 8 && rnd() < 0.25) type = 'town';
    if (!type) return;
    const def = BUILD_DEFS[type];
    if (fac.treasury < def.cost * 1.6) return;
    const spot = findBuildSpot(fac.id, type, enemies);
    if (!spot) return;
    fac.treasury -= def.cost;
    const name = freshSettlementName();
    S.builds.push({
      id: uid('bd'), faction: fac.id, type, x: spot.x, y: spot.y, name,
      days: Math.round(def.days * (0.8 + rnd() * 0.4)), progress: 0, start: S.day, stalled: false
    });
    addLog(`🧱 ${facName(fac.id)}, ${name} adıyla yeni bir ${def.name.toLocaleLowerCase('tr')} inşasına başladı.`, '', 1);
  });
}
function garrisonTargetFor(type) { return type === 'town' ? 130 : type === 'castle' ? 70 : 0; }
function freshSettlementName() {
  const used = new Set(S.order.settlements.map(i => S.settlements[i].name));
  const free = VILLAGE_NAMES.filter(n => !used.has(n));
  if (free.length) return pick(free);
  return pick(VILLAGE_NAMES) + ' ' + ri(2, 9);
}
function findBuildSpot(f, type, enemies) {
  const def = BUILD_DEFS[type];
  const own = ownSettlements(f);
  if (!own.length) return null;
  let best = null, bestScore = -1e9;
  for (let i = 0; i < 260; i++) {
    const anchor = pick(own);
    const ang = rnd() * Math.PI * 2, r = rf(def.minGap, def.minGap + 95);
    const x = anchor.x + Math.cos(ang) * r, y = anchor.y + Math.sin(ang) * r;
    if (x < 45 || x > MAP_W - 45 || y < 40 || y > MAP_H - 40) continue;
    if (!isLand(x, y)) continue;
    let ok = true, nearOwn = 1e9, nearFoe = 1e9;
    for (const id of S.order.settlements) {
      const s = S.settlements[id];
      const d = dist2(s.x, s.y, x, y);
      if (d < def.minGap) { ok = false; break; }
      if (s.faction === f) nearOwn = Math.min(nearOwn, d);
      else if (enemies.includes(s.faction)) nearFoe = Math.min(nearFoe, d);
    }
    if (!ok) continue;
    if (S.builds.some(b => dist2(b.x, b.y, x, y) < def.minGap)) continue;
    if (nearOwn > 210) continue;
    const bi = biomeAt(x, y);
    let sc = -nearOwn * 0.5;
    if (type === 'village') sc += (bi === 'plain' || bi === 'forest' ? 45 : 0) + (nearFoe > 200 ? 30 : -20);
    else sc += (nearFoe < 260 ? 55 : 0) + (bi === 'hills' || bi === 'snow' ? 30 : 0);
    sc += rf(-12, 12);
    if (sc > bestScore) { bestScore = sc; best = { x, y }; }
  }
  return best;
}

/* =====================  TİCARET / KERVANLAR  ===================== */
function tradeTick(day) {
  if (day % 3 === 0) updatePrices();
  const towns = S.order.settlements.map(i => S.settlements[i])
    .filter(s => s.type === 'town' && !s.besiegedBy && s.prosperity > 32);
  const caravans = S.order.parties.filter(i => S.parties[i] && S.parties[i].type === 'caravan').length;
  const cap = Math.round(14 * S.opts.tradeRate);
  if (caravans >= cap || !towns.length) return;
  if (rnd() > 0.55 * S.opts.tradeRate) return;
  const from = pick(towns);
  const route = bestTradeRoute(from);
  if (!route || route.profit < 8) return;
  const fac = S.factions[from.faction];
  const qty = ri(12, 40);
  const p = {
    id: uid('p'), type: 'caravan', lordId: null, faction: from.faction,
    name: `${from.name} kervanı`, x: from.x + rf(-6, 6), y: from.y + rf(-6, 6),
    tx: route.to.x, ty: route.to.y, goal: 'trade', targetId: route.to.id,
    troops: makeStack(fac ? fac.culture : 'sw', ri(12, 26), 0.35), prisoners: {},
    morale: 70, speed: 1, besieging: null, cooldown: 0,
    cargo: { good: route.good, qty }, fromId: from.id, value: Math.round((from.prices[route.good] || 50) * qty)
  };
  S.parties[p.id] = p; S.order.parties.push(p.id);
}
function caravanArrive(p) {
  const to = S.settlements[p.targetId];
  const fac = S.factions[p.faction];
  if (to && fac && p.cargo) {
    const sell = (to.prices[p.cargo.good] || 60) * p.cargo.qty;
    const profit = Math.round(sell - p.value);
    fac.treasury += Math.max(0, Math.round(sell * 0.35));
    to.prosperity = clamp(to.prosperity + 0.9, 0, 100);
    const from = S.settlements[p.fromId];
    if (from) from.prosperity = clamp(from.prosperity + 0.6, 0, 100);
    if (to.prices[p.cargo.good]) to.prices[p.cargo.good] = Math.round(to.prices[p.cargo.good] * 0.94);
    if (profit > 400) addLog(`🐫 ${p.name} ${to.name} şehrine vardı — ${fmt(profit)} dinar kâr.`, '', 0);
  }
  removeParty(p.id);
}

/* =====================  OLAYLAR  ===================== */
function fireEvent(kind, targetId) {
  const def = EVENT_DEFS.find(e => e.id === kind);
  if (!def) return false;
  const S_ = S;
  if (def.scope === 'settlement') {
    const s = S_.settlements[targetId] || pick(S_.order.settlements.map(i => S_.settlements[i]));
    if (!s) return false;
    if (kind === 'plague') {
      s.prosperity = clamp(s.prosperity - rf(25, 45), 3, 100);
      s.unrest = clamp(s.unrest + 30, 0, 100);
      stackRemove(s.garrison, stackCount(s.garrison) * rf(0.2, 0.4));
      s.recruits = 0;
      addLog(`☠ ${s.name} şehrinde veba! Refah çöktü, garnizon eridi.`, 'war', 2);
    } else if (kind === 'goldmine') {
      const gain = ri(20000, 60000);
      if (S_.factions[s.faction]) S_.factions[s.faction].treasury += gain;
      s.prosperity = clamp(s.prosperity + 12, 0, 100);
      addLog(`💰 ${s.name} yakınlarında altın damarı bulundu — ${facName(s.faction)} hazinesine ${fmt(gain)} dinar.`, 'peace', 2);
    } else if (kind === 'fire') {
      s.prosperity = clamp(s.prosperity - rf(12, 25), 3, 100);
      s.walls = clamp(s.walls - rf(10, 25), 0, 100);
      s.food = clamp(s.food - 40, 0, 100);
      addLog(`🔥 ${s.name} büyük bir yangınla harap oldu.`, 'war', 2);
    } else if (kind === 'revolt') {
      s.unrest = 100;
      s.prosperity = clamp(s.prosperity - 15, 3, 100);
      for (let i = 0; i < 2; i++) { const b = spawnBandit(s.x + rf(-25, 25), s.y + rf(-25, 25)); if (b) b.name = `${s.name} asileri`; }
      addLog(`⚒ ${s.name} halkı ayaklandı! Asi çeteler kırlara döküldü.`, 'war', 2);
    }
    uiDirty.sel = true; return true;
  }
  if (def.scope === 'faction') {
    const f = S_.factions[targetId] || pick(Object.values(S_.factions).filter(x => !x.isBandit && x.alive));
    if (!f) return false;
    if (kind === 'famine') {
      ownSettlements(f.id).forEach(s => { s.prosperity = clamp(s.prosperity - rf(10, 22), 3, 100); s.recruits *= 0.4; s.food = clamp(s.food - 30, 0, 100); });
      addLog(`🌾 ${f.name} topraklarında kıtlık başladı.`, 'war', 2);
    } else if (kind === 'harvest') {
