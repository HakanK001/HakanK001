function troopEditor(kind, id) {
  const target = kind === 'party' ? S.parties[id] : S.settlements[id];
  if (!target) return;
  const stack = kind === 'party' ? target.troops : target.garrison;
  const culture = S.factions[target.faction] ? S.factions[target.faction].culture : 'sw';
  const render = () => {
    const rows = Object.entries(stack).filter(e => e[1] > 0)
      .sort((a, b) => (TROOPS[b[0]] ? TROOPS[b[0]].tier : 0) - (TROOPS[a[0]] ? TROOPS[a[0]].tier : 0))
      .map(([k, v]) => `<tr><td>${esc(TROOPS[k] ? TROOPS[k].name : k)}</td><td class="small muted">T${TROOPS[k] ? TROOPS[k].tier : '?'}</td>
        <td class="n"><input type="number" value="${v}" min="0" max="99999" data-troop="${k}" style="width:88px;text-align:right"></td></tr>`).join('');
    const opts = Object.values(TROOPS).sort((a, b) => a.culture.localeCompare(b.culture) || a.tier - b.tier)
      .map(t => `<option value="${t.id}">${esc(t.name)} (T${t.tier})</option>`).join('');
    $('#dlgBody').innerHTML = `
      <div class="small muted" style="margin-bottom:8px">${esc(kind === 'party' ? partyLabel(target) : target.name)} — toplam <b>${fmt(stackCount(stack))}</b> asker, güç ${fmt(stackPower(stack))}</div>
      <table class="tbl">${rows || '<tr><td class="small muted">Boş</td></tr>'}</table>
      <div class="row" style="gap:6px;margin-top:10px">
        <select id="teType" class="grow">${opts}</select>
        <input type="number" id="teN" value="20" min="1" max="9999" style="width:90px">
        <button class="btn sm" id="teAdd">Ekle</button>
      </div>
      <div class="btnrow" style="margin-top:8px">
        <button class="btn sm" id="teFill">Kültür ordusu (+100)</button>
        <button class="btn sm" id="teUp">Hepsini terfi ettir</button>
        <button class="btn sm danger" id="teClear">Boşalt</button>
      </div>`;
    $$('#dlgBody input[data-troop]').forEach(inp => {
      inp.onchange = e => {
        const k = e.target.dataset.troop, v = Math.max(0, Math.round(+e.target.value || 0));
        if (v === 0) delete stack[k]; else stack[k] = v;
        uiDirty.sel = true; render(); requestDraw();
      };
    });
    $('#teAdd').onclick = () => { const k = $('#teType').value, n = Math.max(1, +$('#teN').value || 1);
      stack[k] = (stack[k] || 0) + n; render(); uiDirty.sel = true; requestDraw(); };
    $('#teFill').onclick = () => { stackMerge(stack, makeStack(culture, 100, 0.55)); render(); uiDirty.sel = true; requestDraw(); };
    $('#teUp').onclick = () => { for (let i = 0; i < 12; i++) upgradeStack(stack, null); render(); uiDirty.sel = true; requestDraw(); };
    $('#teClear').onclick = () => { Object.keys(stack).forEach(k => delete stack[k]); render(); uiDirty.sel = true; requestDraw(); };
  };
  openDlg(kind === 'party' ? 'Askerleri düzenle' : 'Garnizonu düzenle', '', [{ t: 'Tamam', cls: 'primary', fn: () => { dlg.close(); renderUI(true); } }]);
  render();
}

function createSettlement(opt, x, y, silent) {
  const id = uid('s');
  const s = {
    id, name: opt.name, type: opt.type, x: Math.round(x), y: Math.round(y),
    faction: opt.faction, origFaction: opt.faction, lordId: null, parentId: null,
    prosperity: opt.prosperity, food: 100, walls: opt.type === 'village' ? 0 : opt.walls,
    garrison: {}, prisoners: {}, besiegedBy: null, siegeProgress: 0,
    raidedUntil: 0, recruits: 20, unrest: 0, lastOwnerChange: S.day,
    produce: null, prices: {}, build: null, founded: calendar(S.day).year
  };
  if (s.type === 'village') {
    const b = biomeAt(s.x, s.y);
    const cands = GOODS.filter(g => g.biome.includes(b));
    s.produce = (cands.length ? pick(cands) : pick(GOODS)).id;
  } else {
    GOODS.forEach(g => { s.prices[g.id] = Math.round(g.base * rf(0.85, 1.15)); });
  }
  if (opt.type === 'village') {
    let best = null, bd = 1e9;
    S.order.settlements.forEach(i => {
      const o = S.settlements[i];
      if (o.type === 'village' || o.faction !== s.faction) return;
      const d = dist2(o.x, o.y, s.x, s.y);
      if (d < bd) { bd = d; best = o; }
    });
    if (best) s.parentId = best.id;
  } else if (opt.garrison > 0) {
    s.garrison = makeStack(S.factions[s.faction].culture, opt.garrison, 0.45);
  }
  S.settlements[id] = s; S.order.settlements.push(id);
  const cands = S.order.lords.map(i => S.lords[i]).filter(l => l.faction === s.faction && l.state !== 'dead');
  if (cands.length) {
    cands.sort((a, b) => a.fiefs.length - b.fiefs.length);
    grantFief(s, cands[0]);
  }
  if (!silent) addLog(`🏗 ${s.name} kuruldu — ${facName(s.faction)} (${TYPE_TR[s.type]}).`, '', 2);
  if (s.type !== 'village') buildRoads();
  territoryDirty = true; rebuildSettlementNodes(); requestDraw();
  uiDirty.kra = uiDirty.sel = true;
  return s;
}

function deleteSettlement(id) {
  const s = S.settlements[id]; if (!s) return;
  const kids = S.order.settlements.map(i => S.settlements[i]).filter(v => v.parentId === id);
  kids.forEach(v => { v.parentId = null; });
  if (s.lordId && S.lords[s.lordId]) S.lords[s.lordId].fiefs = S.lords[s.lordId].fiefs.filter(f => f !== id);
  S.order.parties.forEach(i => {
    const p = S.parties[i];
    if (p && (p.targetId === id || p.besieging === id)) { p.besieging = null; p.goal = 'idle'; p.tx = null; p.targetId = null; }
  });
  const f = s.faction;
  delete S.settlements[id];
  S.order.settlements = S.order.settlements.filter(x => x !== id);
  Object.values(S.factions).forEach(f => { if (f.capital === id) f.capital = null; });
  S.roads = S.roads.filter(r => r[0] !== id && r[1] !== id);
  if (s.type !== 'village') buildRoads();
  if (S.sel && S.sel.type === 'settlement' && S.sel.id === id) S.sel = null;
  addLog(`🏚 ${s.name} haritadan silindi.`, '', 2);
  checkFactionAlive(f);
  territoryDirty = true; rebuildSettlementNodes(); requestDraw();
  uiDirty.sel = uiDirty.kra = uiDirty.box = true;
}

function fillFactionArmies(f) {
  S.order.lords.map(i => S.lords[i]).filter(l => l.faction === f && l.state !== 'dead').forEach(l => {
    if (l.state === 'prisoner' || l.state === 'exile') l.state = 'active';
    const p = l.partyId && S.parties[l.partyId] ? S.parties[l.partyId] : spawnLordParty(l);
    const cap = lordPartyCap(l), cnt = stackCount(p.troops);
    if (cnt < cap) stackMerge(p.troops, makeStack(S.factions[f].culture, cap - cnt, 0.55));
    p.morale = 95;
  });
  toast('Ordular tamamlandı'); renderUI(true); requestDraw();
}

function createLord(faction, opt) {
  opt = opt || {};
  const fac = S.factions[faction];
  const pool = LORD_NAMES[faction] || LORD_NAMES.swadia;
  const used = new Set(S.order.lords.map(i => S.lords[i].name));
  const nm = opt.name || pool.find(n => !used.has(n)) || (pick(pool) + ' ' + ri(2, 9));
  const id = uid('l');
  S.lords[id] = {
    id, name: nm, faction, title: fac.lordTitle, isKing: false,
    personality: opt.personality || pick(PERSONALITIES).id,
    renown: opt.renown != null ? opt.renown : ri(100, 400),
    relKing: ri(0, 40), gold: ri(1500, 5000),
    skillTactics: opt.tactics != null ? opt.tactics : ri(2, 6),
    skillLeadership: opt.lead != null ? opt.lead : ri(3, 8),
    skillStrategy: opt.strategy != null ? opt.strategy : ri(1, 7),
    fiefs: [], partyId: null, state: 'active', prisonerOf: null, freeAt: 0,
    wounded: 0, kills: 0, battlesWon: 0, battlesLost: 0,
    age: opt.age != null ? opt.age : ri(22, 50),
    house: opt.house || pick(HOUSES[faction] || HOUSES.swadia),
    houseId: null,
    spouse: opt.spouse !== undefined ? opt.spouse : (rnd() < 0.6 ? pick(FEMALE_NAMES[faction] || FEMALE_NAMES.swadia) : null),
    children: [], rel: {}, health: 100, tactic: 'balanced', sick: 0
  };
  S.order.lords.push(id);
  const hs = ensureHouse(faction, S.lords[id].house);
  S.lords[id].houseId = hs.id; S.lords[id].house = hs.name;
  refreshHouses();
  uiDirty.kra = true;
  return S.lords[id];
}

function makeKing(l, silent) {
  const fac = S.factions[l.faction]; if (!fac) return;
  const old = fac.kingId ? S.lords[fac.kingId] : null;
  if (old && old !== l) { old.isKing = false; old.title = fac.lordTitle; old.relKing = -30; }
  l.isKing = true; l.title = fac.rulerTitle; l.relKing = 100;
  fac.kingId = l.id;
  fac.interregnum = false;
  if (l.houseId) fac.rulingHouseId = l.houseId;
  if (typeof applyRulingHouseColor === 'function') applyRulingHouseColor(fac);
  if (!silent) addLog(`👑 ${l.title} ${lordFullName(l)}, ${fac.name} tahtına oturdu.`, 'peace', 2);
  uiDirty.kra = true; uiDirty.sel = true;
}
function skipDays(n) {
  const steps = 4;
  for (let i = 0; i < n * steps; i++) stepWorld(1 / steps);
  Object.keys(uiDirty).forEach(k => uiDirty[k] = true);
  territoryDirty = true;
  renderUI(true); requestDraw();
  toast(`${n} gün ilerlendi`);
}

/* ---------- düzenleme uygulaması ---------- */
function applyEdit(kind, id, key, raw, type) {
  const obj = getEnt(kind, id); if (!obj) return;
  let v = raw;
  if (type === 'num') { v = +raw; if (isNaN(v)) return; }

  if (kind === 'lord' && key === 'faction' && v !== obj.faction) { transferLord(obj, v); renderUI(true); requestDraw(); return; }
  if (kind === 'lord' && key === 'state') {
    obj.state = v;
    if (v === 'dead' || v === 'prisoner' || v === 'exile') { if (obj.partyId) removeParty(obj.partyId); obj.partyId = null; }
    if (v === 'active' && !obj.partyId) spawnLordParty(obj);
    if (v === 'regroup') obj.freeAt = S.day + 2;
    renderUI(true); requestDraw(); return;
  }
  if (kind === 'settlement' && key === 'faction' && v !== obj.faction) {
    changeOwner(obj, v, null); territoryDirty = true; renderUI(true); requestDraw(); return;
  }
  if (kind === 'settlement' && key === 'lordId') {
    const l = v ? S.lords[v] : null;
    if (l) grantFief(obj, l);
    else { if (obj.lordId && S.lords[obj.lordId]) S.lords[obj.lordId].fiefs = S.lords[obj.lordId].fiefs.filter(f => f !== obj.id); obj.lordId = null; }
    renderUI(true); return;
  }
  if (kind === 'settlement' && key === 'type') {
    obj.type = v;
    if (v === 'village') { obj.walls = 0; obj.garrison = {}; }
    territoryDirty = true; rebuildSettlementNodes(); requestDraw(); renderUI(true); return;
  }
  if (kind === 'house') {
    if (key.startsWith('arms.')) { obj.arms = obj.arms || {}; obj.arms[key.slice(5)] = v; }
    else if (key === 'color') { obj.color = v; const fc = S.factions[obj.faction]; if (fc && fc.rulingHouseId === obj.id) applyRulingHouseColor(fc); territoryDirty = true; }
    else obj[key] = v;
    if (key === 'name') houseMembers(obj.id).forEach(m => { m.house = v; });
    uiDirty.sel = uiDirty.kra = true; requestDraw(); return;
  }
  if (kind === 'faction' && key === 'succession') { obj.succession = v; uiDirty.sel = true; return; }
  if (kind === 'faction' && key === 'kingId') { const l = S.lords[v]; if (l) makeKing(l); renderUI(true); return; }
  if (kind === 'faction' && key === 'color') { obj.color = v; territoryDirty = true; requestDraw(); renderLegend(); return; }

  obj[key] = v;
  uiDirty.sel = true; uiDirty.kra = true;
  requestDraw();
}

function transferLord(l, toFaction) {
  const from = l.faction;
  l.faction = toFaction;
  l.title = l.isKing ? S.factions[toFaction].rulerTitle : S.factions[toFaction].lordTitle;
  if (l.partyId && S.parties[l.partyId]) S.parties[l.partyId].faction = toFaction;
  l.fiefs.slice().forEach(f => {
    const s = S.settlements[f];
    if (s) {
      s.faction = toFaction;
      if (s.type !== 'village') S.order.settlements.forEach(i => { const v = S.settlements[i]; if (v.parentId === s.id) v.faction = toFaction; });
    }
  });
  if (l.isKing) {
    const oldFac = S.factions[from];
    if (oldFac && oldFac.kingId === l.id) { l.isKing = false; l.title = S.factions[toFaction].lordTitle; succession(from); }
  }
  addLog(`${l.title} ${l.name} artık ${facName(toFaction)} hizmetinde.`, '', 2);
  territoryDirty = true; checkFactionAlive(from);
  uiDirty.kra = true;
}

  },
  snapNow: () => { takeSnapshot('Elle: ' + dateStr(S.day)); toast('Kayıt noktası alındı'); uiDirty.box = true; renderUI(true); },
  rewind: el2 => {

    openDlg('Zamanı geri sar', `<div><b>${esc(sn.label)}</b> anına dönülecek. O tarihten sonrası silinir.</div>`,
      [{ t: 'Geri sar', cls: 'danger', fn: () => { dlg.close(); rewindTo(i); } }, { t: 'Vazgeç', fn: () => dlg.close() }]);
  },
  bulkApply: () => {
    const f = $('#blkFac').value, ty = $('#blkType').value, field = $('#blkField').value, v = +$('#blkVal').value || 0;

    S.order.settlements.forEach(i => {

    });
    toast(`${n} yerleşim güncellendi`); renderUI(true); requestDraw();

function troopTreeEditor() {

    $('#dlgBody').innerHTML = `
      <label class="f"><span>Kültür</span><select id="ttCul">${cultures.map(c => `<option value="${c[0]}" ${c[0] === cur ? 'selected' : ''}>${c[1]}</option>`).join('')}</select></label>

      ${list.map(t => `<tr>
        <td><input type="text" value="${esc(t.name)}" data-tt="${t.id}|name" style="width:100%"></td>

        <td><select data-tt="${t.id}|cls" style="width:92px">
          <option value="inf" ${t.cls === 'inf' ? 'selected' : ''}>Piyade</option>
          <option value="arch" ${t.cls === 'arch' ? 'selected' : ''}>Okçu</option>
          <option value="cav" ${t.cls === 'cav' ? 'selected' : ''}>Süvari</option></select></td></tr>`).join('')}
      </table>
      <div class="row" style="gap:6px;margin-top:10px">
        <input type="text" id="ttNew" placeholder="Yeni birlik adı" class="grow">
        <input type="number" id="ttNewPw" value="40" min="1" max="400" style="width:80px">
        <button class="btn sm" id="ttAdd">Ekle</button>
      </div>
      <div class="small muted" style="margin-top:6px">Güç değişimi tüm savaş hesaplarına anında yansır.</div>`;
    $('#ttCul').onchange = e => { cur = e.target.value; render(); };

      inp.onchange = e => {
        const [id, key] = e.target.dataset.tt.split('|');

      T(id, nm, cur, clamp(Math.round(pw / 16), 1, 8), 'inf', pw, []);
      render();
    };
  };
  openDlg('Birlik ağacı düzenleyici', '', [{ t: 'Tamam', cls: 'primary', fn: () => { dlg.close(); renderUI(true); } }]);

ACTIONS.preset = el2 => {
  const id = el2.dataset.id;
  const live = Object.values(S.factions).filter(f => !f.isBandit && f.alive);
  if (id === 'war') {
    live.forEach(a => live.forEach(b => { if (a.id < b.id) { breakPact(a.id, b.id, true); declareWar(a.id, b.id, true); } }));
    live.forEach(f => fillFactionArmies(f.id));
    addLog('⚔ Bütün Kalradya savaşa tutuştu!', 'war', 2);
  } else if (id === 'peace') {
    Object.keys(S.wars).forEach(k => { const [a, b] = k.split('|'); makePeace(a, b, true); });
    S.opts.aggression = 0.3;
    S.order.settlements.forEach(i => { const s = S.settlements[i]; s.prosperity = 95; s.food = 100; s.raidedUntil = 0; });
    addLog('🕊 Kalradya\'da uzun barış çağı başladı.', 'peace', 2);
  } else if (id === 'empire') {
    const win = S.factions.swadia && S.factions.swadia.alive ? S.factions.swadia : live[0];
    live.forEach(f => { if (f.id !== win.id) ownSettlements(f.id).forEach(s => changeOwner(s, win.id, null)); });
    live.forEach(f => { if (f.id !== win.id) checkFactionAlive(f.id); });
    S.order.lords.map(i => S.lords[i]).filter(l => l.faction === win.id).forEach(l => { l.relKing = ri(-70, 20); });
    addLog(`👑 ${win.name} bütün Kalradya'yı hâkimiyeti altına aldı.`, 'war', 2);
  } else if (id === 'dark') {
    S.opts.banditRate = 3; S.opts.eventRate = 3; S.opts.mortality = 2.5;
    for (let i = 0; i < 25; i++) spawnBandit();
    live.forEach(f => { fireEvent('famine', f.id); f.treasury = Math.round(f.treasury * 0.3); });
    for (let i = 0; i < 4; i++) fireEvent('plague');
    addLog('🏴 Karanlık çağ çöktü: haydutlar, veba ve kıtlık.', 'war', 2);
  } else if (id === 'succession') {
    live.forEach(f => { if (f.kingId && S.lords[f.kingId]) lordDies(S.lords[f.kingId], 'ecel'); });
    addLog('🗳 Bütün krallar öldü; Kalradya veraset krizine girdi.', 'war', 2);
  }
  dlg.close(); territoryDirty = true; renderUI(true); requestDraw();
};

function forceMarriage(a, b) {
  a.allies = a.allies || {}; b.allies = b.allies || {};
  a.allies[b.id] = S.day; b.allies[a.id] = S.day;
  delete S.feuds[feudKey(a.id, b.id)];
  houseMembers(a.id).forEach(m => houseMembers(b.id).forEach(n => addLordRel(m, n, ri(8, 18))));
  const ha = houseHead(a.id), hb = houseHead(b.id);
  if (ha && hb) talk('marriage', { a: ha, b: hb, x: (capitalOf(a.faction) || {}).name || 'saray', force: true });
  if (a.faction !== b.faction) {
    a.claims = a.claims || {}; a.claims[b.faction] = S.day;
    b.claims = b.claims || {}; b.claims[a.faction] = S.day;
    const fa = S.factions[a.faction], fb = S.factions[b.faction];
    if (fa && fb) { fa.rel[b.faction] = clamp((fa.rel[b.faction] || 0) + 25, -100, 100); fb.rel[a.faction] = clamp((fb.rel[a.faction] || 0) + 25, -100, 100); }
  }
  addLog(`💍 ${a.name} ile ${b.name} hanedanları evlilikle birleşti.`, 'peace', 2);
  uiDirty.kra = uiDirty.sel = true;
}

const SAVE_KEY = 'kalradya_save_v1';
const DAY_PER_SEC = 0.26;   // 1× hızda bir gün ≈ 4 saniye

function snapshot() {
  return JSON.stringify({
    v: 3, uidn: UIDN,
    day: S.day, factions: S.factions, settlements: S.settlements, lords: S.lords,
    parties: S.parties, order: S.order, wars: S.wars, log: S.log, battles: S.battles,
    opts: S.opts, stats: S.stats,
    pacts: S.pacts, roads: S.roads, history: S.history, decisions: S.decisions, builds: S.builds,
    houses: S.houses, elections: S.elections, dialogues: S.dialogues, feuds: S.feuds, chronicle: S.chronicle
  });
}
function restore(json) {
  const d = typeof json === 'string' ? JSON.parse(json) : json;
  if (!d || !d.settlements) throw new Error('Geçersiz kayıt');
  S.day = d.day; S.factions = d.factions; S.settlements = d.settlements; S.lords = d.lords;
  S.parties = d.parties; S.order = d.order; S.wars = d.wars || {}; S.log = d.log || [];
  S.battles = d.battles || [];
  S.pacts = d.pacts || {}; S.roads = d.roads || []; S.history = d.history || [];
  S.decisions = d.decisions || []; S.builds = d.builds || [];
  S.houses = d.houses || {}; S.elections = d.elections || []; S.dialogues = d.dialogues || []; S.feuds = d.feuds || {};
  S.chronicle = d.chronicle || [];
  if (!S.order.houses) S.order.houses = Object.keys(S.houses);
  if (!Object.keys(S.houses).length) buildHouses();
  S.opts = Object.assign(S.opts, d.opts || {});
  S.stats = Object.assign({ battles: 0, sieges: 0, days: 0, built: 0, deaths: 0, elections: 0 }, d.stats || {});
  if (!S.roads.length) buildRoads();
  S.sel = null; S.alert = null;
  const nums = [].concat(S.order.parties, S.order.lords, S.order.settlements)
    .map(x => +String(x).replace(/\D/g, '') || 0);
  UIDN = Math.max(d.uidn || 0, ...nums, 0);
  territoryDirty = true; logDirty = true;
  Object.keys(uiDirty).forEach(k => uiDirty[k] = true);
  initSvg(); requestDraw(); renderUI(true);
}
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, snapshot()); toast('Oyun kaydedildi'); }
  catch (e) { toast('Kayıt başarısız: ' + e.message); }
}
function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) { toast('Kayıt bulunamadı'); return; }
  try { restore(raw); toast('Kayıt yüklendi'); } catch (e) { toast('Yükleme hatası: ' + e.message); }
}
function exportGame() {
  const blob = new Blob([snapshot()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kalradya-${shortDate(S.day).replace(/\./g, '-')}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importGame() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { restore(r.result); toast('Dosya yüklendi'); } catch (e) { toast('Hatalı dosya: ' + e.message); } };
    r.readAsText(f);
  };
  inp.click();
}
function newWorld(seed) {
  buildWorld(seed);
  S.day = 150; S.sel = null; S.hidden = {};
  territoryDirty = true; logDirty = true;
  Object.keys(uiDirty).forEach(k => uiDirty[k] = true);
  initSvg(); fitView(); requestDraw(); renderUI(true);
  toast('Yeni Kalradya kuruldu');
}

/* ---------------- olaylar ---------------- */
$('#spdCtl').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setSpeed(+b.dataset.spd);
});
$('#btnTheme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? '' : 'light';
  if (cur) document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('kalradya_theme', cur); } catch (e) {}
  $('#btnTheme').textContent = cur ? '☀' : '☾';
};
$('#btnSearch').onclick = () => searchDialog();
$('#btnSheet').onclick = () => $('#side').classList.toggle('open');
$('#btnFit').onclick = () => { fitView(); requestDraw(); };
$('#btnParchment').onclick = () => {
  S.opts.mapStyle = S.opts.mapStyle === 'parchment' ? 'natural' : 'parchment';
  $('#btnParchment').classList.toggle('on', S.opts.mapStyle === 'parchment');
  svg.classList.toggle('parchment', S.opts.mapStyle === 'parchment');
  buildTerrain(); requestDraw();
};
$('#logHead').onclick = () => $('#chronicle').classList.toggle('open');
$('#placeCancel').onclick = () => cancelPlace();
$('#alertClose').onclick = () => { S.alert = null; alertDirty = true; renderAlert(); };
$('#alertWatch').onclick = () => { if (S.alert) openBattle(S.alert.id); S.alert = null; alertDirty = true; renderAlert(); };

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const side = $('#side');
  if (window.innerWidth <= 900 && ui.tab === b.dataset.tab && side.classList.contains('open')) {
    side.classList.remove('open'); return;
  }
  setTab(b.dataset.tab);
});
$$('.mapctl .chip[data-layer]').forEach(b => {
  b.onclick = () => {
    const l = b.dataset.layer;
    S.layers[l] = !S.layers[l];
    b.classList.toggle('on', S.layers[l]);
    if (l === 'borders') territoryDirty = true;
    requestDraw();
  };
});

/* komut ve düzenleme delegasyonu */
document.addEventListener('click', e => {
  const sm = e.target.closest('.sect > summary');
  if (sm) { const d = sm.parentElement.dataset.sect; ui.open[d] = !sm.parentElement.open; }
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const fn = ACTIONS[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t); }
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-edit]');
  if (!t) return;
  const [kind, id, key, type] = t.dataset.edit.split('|');
  applyEdit(kind, id, key, t.value, type);
});

/* harita gezinme */
svg.addEventListener('pointerdown', onPointerDown);
svg.addEventListener('pointermove', onPointerMove);
svg.addEventListener('pointerup', onPointerUp);
svg.addEventListener('pointerleave', () => hideTip());
svg.addEventListener('pointercancel', () => { dragging = false; });
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.14 : 1 / 1.14);
}, { passive: false });

const touches = new Map();
svg.addEventListener('pointerdown', e => touches.set(e.pointerId, e));
svg.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, e);
  if (touches.size === 2) {
    dragging = false;
    const [a, b] = Array.from(touches.values());
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const rect = svg.getBoundingClientRect();
    const mx = (a.clientX + b.clientX) / 2 - rect.left, my = (a.clientY + b.clientY) / 2 - rect.top;
    if (pinchDist) zoomAt(mx, my, d / pinchDist);
    pinchDist = d;
  }
});
const endTouch = e => { touches.delete(e.pointerId); if (touches.size < 2) pinchDist = 0; };
svg.addEventListener('pointerup', endTouch);
svg.addEventListener('pointercancel', endTouch);

window.addEventListener('resize', () => { resizeCanvas(); clampView(); requestDraw(); });

document.addEventListener('keydown', e => {
  if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space') { e.preventDefault(); setSpeed(S.speed > 0 ? 0 : 1); }
  else if (e.key === '1') setSpeed(1);
  else if (e.key === '`') setSpeed(0.5);
  else if (e.key === '2') setSpeed(2);
  else if (e.key === '3') setSpeed(4);
  else if (e.key === '4') setSpeed(10);
  else if (k === 'h') setTab('his');
  else if (e.key === '0') setSpeed(0);
  else if (k === 'f') { fitView(); requestDraw(); }
  else if (k === 'a') { e.preventDefault(); searchDialog(); }
  else if (k === 's') { e.preventDefault(); saveGame(); }
  else if (e.key === 'Escape') { if (placeMode) cancelPlace(); }
});

/* ---------------- ana döngü ---------------- */
let lastFrame = performance.now();
function frame(now) {
  const dtReal = Math.min(0.25, (now - lastFrame) / 1000);
  lastFrame = now;
  if (S.speed > 0) {
    let days = dtReal * S.speed * DAY_PER_SEC;
    let guard = 0;
    while (days > 0 && guard++ < 200) {
      const st = Math.min(0.1, days);
      stepWorld(st);
      days -= st;
    }
  }
  if (followId) {
    const fp = S.parties[followId];
    if (fp) { const w = cv.clientWidth, h = cv.clientHeight; view.x = w / 2 - fp.x * view.k; view.y = h / 2 - fp.y * view.k; clampView(); }
    else followId = null;
  }
  drawCanvas(); updateSvg(); renderUI();
  requestAnimationFrame(frame);
}

/* ---------------- açılış ---------------- */
function boot() {
  try {
    const th = localStorage.getItem('kalradya_theme');
    if (th === 'light') { document.documentElement.setAttribute('data-theme', 'light'); $('#btnTheme').textContent = '☀'; }
  } catch (e) {}
  resizeCanvas();
  buildWorld(20250810);
  buildTerrain();
  territoryDirty = true;
  initSvg();
  fitView();
  setSpeed(1);
  setTab('sel');
  renderUI(true);
  requestDraw();
  requestAnimationFrame(frame);
  booted = true;
  if (localStorage.getItem(SAVE_KEY)) addLog('Kayıtlı bir oyun bulundu — Sandbox sekmesinden yükleyebilirsin.', '', 1);
}
boot();

/* çevrimdışı önbellek */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('warband-sw.js').catch(function () {});
}
